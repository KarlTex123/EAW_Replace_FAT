 FAT_army_chief3:0 "小亚历山大·克梅斯凯"
 FAT_army_chief3_desc:0 "小亚历山大·克梅斯凯出生的时候，他的父亲亚历山大·克梅斯凯还是骑士、是芬宁的贵族，更是帝国军队的元帅。\n\n在他4岁时，他的父亲发动了一场可能改变世界历史走向的战争。他自己则在狮鹫海姆被母亲保护着。而他的父亲惧怕失去妻儿，为他们安排了一艘最近缴获的弗羽西亚船只北上前往局势稳定的韦迪纳王国。在父亲革命失败来到漫云之后，他让他的儿子过来找他，在981年他们再次见面，那时小克梅斯凯只有7岁。\n\n像他的父亲一样，小克梅斯凯在18岁时就加入了共和国军，有尊严地服役。他的军衔也逐步提高，成为了一名将军，正如他父亲曾经那样。"
 FAT_army_chief4:0 "喀戎·暴风羽"
 FAT_political_11:0 "喀戎·暴风羽"
 FAT_army_chief4_desc:0 "喀戎·暴风羽，外号是“曜尾的小小鸟”，是一个同极端民族主义者有可疑接触的共和国将领。不光如此，他还和那个拒绝共和国指挥，走上军阀之路的曜尾有着密切联系。而喀戎自己却否认这些指控，称曜尾是个诚实的好狮鹫。这让很多狮鹫怀疑喀戎正在为他的军阀事业效劳。\n\n他出生于狮鹫岩，在13岁时他违背了父母的意愿参与了革命。他加入了曜尾的部队，并参与了克罗纳围城战。他很快升为曜尾的副手，同曜尾一同执行所有任务，曜尾也教会了他作战兵法与复仇。\n\n现在他效忠的对象存疑……他究竟支持共和国还是那个流窜的军阀曜尾？"
