 FAT_demand_faction_leadership:0 "索取阵营领导权"
 FAT_demand_faction_leadership_desc:0 "我们当二把手”已经太久了，是时候让我们的共和国获取阵营领导者的正当地位了。"
 FAT_create_faction:0 "成立共和国公约"
 FAT_rename_cloudbury:0 "将芬宁改名为克梅斯凯施塔特"
 FAT_rename_cloudbury_desc:0 "为了纪念伟大的总统元帅，我们应当把芬宁，在共和革命摧垮帝国前克梅斯凯的家乡改名。"
 FAT_demand_griffenheim:0 "向[From.GetName]索取狮鹫海姆"
 FAT_demand_griffenheim_desc:0 "狮鹫海姆，狮鹫尼亚的首都被[From.GetName]占领了。很显然它是属于我们的。我们将向其发布和平移交城市的外交请求。"
 FAT_eulogy_for_grover_v:0 "发表演说：对格罗弗五世的“悼文”"
 FAT_eulogy_for_grover_v_desc:0 "格罗弗五世，狮鹫们的皇帝去世了。我们应当利用这一时机向民众们强调他和独裁统治的失败。"
 FAT_react_to_the_aquileian_revolution:0 "发表演说：阿奎莱亚共和国"
 FAT_react_to_the_aquileian_revolution_desc:0 "泰奥多尔·韦朗尼在阿奎莱亚再次引发了一场共和革命。我们应对这一行为表示赞扬，并且宣布我们和全世界的共和主义党派们同心同德，共同进退。"
 FAT_react_to_the_skyfall_revolution:0 "发表演说：天落城的民主化"
 FAT_react_to_the_skyfall_revolution_desc:0 "吉纳维芙·激翼终结了天落的寡头系统，建立了一个民选领导者统治的真正的、进步主义的民主政权。我们应当祝贺她。"
 FAT_condemn_beakolini:0 "发表演说：南方的法西斯主义者"
 FAT_condemn_beakolini_desc:0 "首相喙索里尼已经控制了翼巴第，证明了君主制将会在其受到威胁时向法西斯主义转变。对这个南方全新的法西斯君主制国家，克梅斯凯当然有很多话要说。"
 FAT_condemn_sickleclaw_dictatorship:0 "发表演说：社会主义必然的后果"
 FAT_condemn_sickleclaw_dictatorship_desc:0 "阿斯皮尔·镰爪根本不想让天际纳维亚返回到民主社会主义的状态。为什么呢？权力令鹫腐化，绝对的权力令其绝对腐化。社会主义亵渎了狮鹫的天性，这便是证明。"
 FAT_all_weapons_against_the_lord_protector:0 "发表演说：护国公的崛起"
 FAT_all_weapons_against_the_lord_protector_desc:0 "狮鹫尼亚帝国再次陷入混乱。暴戾的将军斐迪南·曦爪掌控了首都并处死了幼小的皇帝。这令所有帝国附庸脱离。在这国际形势的转折点，克梅斯凯要向全国强调此事。"
 FAT_war_has_come:0 "发表演说：第二次革命开始了"
 FAT_war_has_come_desc:0 "第二次革命已经在我们爪中开始了！是时候去消灭那些专制的君主们，并恢复狮鹫海姆合理合法的共和制政府了！这显然是个重要的话题，克梅斯凯当然要向全国发表演讲强调这一大事。"
 FAT_i_changed_my_mind:0 "显示历史类决议"
 FAT_i_quite_dislike_history:0 "隐藏历史类决议"
 FAT_faction_pga:0 "共和国公约"
 form_griffon_empire_DANISH:0 "成立漫云-赫兹兰王国"
 FAT_pardon_danior:0 "宽恕丹尼尔·赤喙"
 FAT_pardon_danior_desc:0 "丹尼尔·赤喙在几十年前因醉酒时侮辱总统元帅而逃离共和国，为了躲避他认为必定发生的军事法庭审判。目前我国武装力量战斗力不足，而高丘军政府已经在新狮鹫尼亚建立，我们必须原谅赤喙，鼓励他带着自己的军事技能回到共和国，他的家乡与他曾服役的土地。"
