 griffonRepublic_history.15.t:0 "返乡"
 griffonRepublic_history.15.d:0 "亲爱的日记，\n\n我退出了冒险，我的生命多次受到了威胁。因此，回到安全的坎特洛特感觉很好。当然，我并不完全安全，因为我拒绝帮助山羊取回铃铛，这激怒了山羊。我尽力向他们保证，我这样做不是出于恶意，而是因为我得出了一个可怕的结论。铃铛被如此严密地保护和隐藏是有原因的。无论阿齐尔的坟墓里有什么，它都可能非常危险，因为它已经被彻底封存了。我试图向六羊解释这一点，但他们不听，我只得逃跑。我身上有几处瘀伤，但在锈桶的帮助下，我从山羊们的追赶中安全地逃了出来。\n\n即使不再需要水晶球，我仍然留着它。我决定不再试图解开坟墓的谜团，所以现在我可以向公众展示这件物品了，他们仅会把它当作宝藏来欣赏。然而，我还是会觉得水晶球在注视着我。也许最好把它毁掉，这样永远不会有谁能找到铃铛了。"
 griffonRepublic_history.15.a:0 "有些秘密，最好还是被永久埋藏。"
 FST_the_riverpony_debate_firmscow:0 "姐妹共和国"
 FST_the_riverpony_debate_firmscow_desc:0 "有意思的是，河间地居然也被一个和我们差不多的民族共和国统一起来了！我们必须立刻邀请他们加入修订后的共和国公约中，团结一致地维护民安、民族、民生！"
 FST_the_riverpony_debate_nofirmscow:0 "关闭边界"
 FST_the_riverpony_debate_nofirmscow_desc:0 "河间地在打着“保护难民”和“政治避难”的旗号掩护民族共和国的敌鹫。我们必须关闭与河间小马的边界，并主动地追击那些想要逃避正义的鹫。"
 griffonRepublic.290.t:0 "惊天交易"
 griffonRepublic.290.d:0 "我们收到了狮鹫们的一个惊人提议。狮鹫尼亚民族共和国总统兼元帅曜尾高度赞扬了我们对共和主义与民族主义的坚定信念，并提议将我们双方阵营合并为一个统一的鹫王河公约，以便共同对抗盘踞在大陆之外那些腐朽的社会主义和君主制政权。尽管一些温和派人士称他为暴君或屠夫，但我们伟大的河间地共和国中也有许多人认为他是一位有远见卓识的领袖。\n\n而且，如果真到了迫不得已的地步，与曜尾为友总比与之为敌要好得多。"
 griffonRepublic.290.a:0 "好好好，我们合作吧！"
 griffonRepublic.290.b:0 "礼貌回绝。"
 FST_endgame_faction:0 "鹫王河公约"
 FAT_spymaster:0 "多尔特·戴妮斯达特"
 FAT_spymaster_desc:0 "多尔特·戴妮斯达特是一位漫云籍狮鹫，是共和国最北端省份一个历史悠久的商贾、战士和地方豪强家族中的一员。她在过去两年半期间担任军事情报局主管——这个职位在共和国内可是很不稳定。她的北方出身让她得了个“主管”的外号。她是个强硬的无政治倾向者，她只对亚历山大·克梅斯凯——将她从远北边境请到共和国核心的总统元帅效忠。我们只能希望这位“主管”在料理曜尾瑰翼之乱时，能比前任做的更好吧。"
