 FAT_iris:0 "伊丽丝·银爪"
 FAT_iris_desc:0 "伊丽丝·银爪是狮鹫尼亚帝国最受信任的顾问之一，也是罗马坞学院的院长，同时也是年轻国王的摄政委员会的成员。罗马坞学院是狮鹫尼亚帝国历史上最负盛名的大学之一，后来在第二次革命战争中被共和军摧毁。银爪已经向总统海因里希·金羽提供了服务，后者曾签署一项赦免帝国寡头的法令。银爪的才能无疑将在未来几年对技术和社会进步起到至关重要的作用。"
