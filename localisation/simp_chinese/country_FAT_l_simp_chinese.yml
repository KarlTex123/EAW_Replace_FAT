 chadskai_desc:0 "亚历山大·克梅斯凯在芬宁出生，是阿德斯男爵的第三个孩子。他在继承顺位中排序过后，影响力低到不能成为一名贵族，他便从事了不少奇怪的工作——例如在芬宁乐队吹奏短号，参与小镇中的各种事件——后来便加入了帝国军队，并升任炮兵军官。克梅斯凯元帅本应在帝国军中前途光明。但是命运给这块大陆开了个天大的玩笑。\n\n978年之后那动荡的时代令他对皇帝的忠诚幻灭。他无法忍受那堕落的贵族充当鹫民的寄生虫，也无法接受那些屈服于贵族的平民们糟糕的生活条件。因此，他开始和志同道合的军官一起利用农民的起义策划政变。随着摄政议会粗鲁地滥用公权力，愤怒的鹫民们已经受够了，他们冲进了皇宫。在随后的混乱中，他成为了新成立的狮鹫尼亚共和国的领袖。\n\n但是这成功并没有持续太久。尽管他广受欢迎，但他可控制不了所有鹫，统治着这个已经被战火削弱的国度也显得不可能了。没过多久，一场反动派暴乱就把他们从帝国的中心逐出。随后他们开始向崩溃帝国的北部长征，并且从试图独立的当地贵族手中夺取了这块领地的控制权。\n\n距离这些事情已经很久了，但是元帅对共和事业的热情没有减退。尽管他现在还要应对那不忠的下属，他依旧能掌控全局。同时他也是个高产的作家，他很多作品都激发了整块大陆的共和运动，并跟随着他的事业。"
 suntail_desc:0 "莱因哈特·曜尾在帝国中部的克罗纳出生。他的家庭十分贫穷，靠残羹剩饭过日子。而他自己希望逃离克罗纳无聊的田野，于是就在15岁时加入了帝国军，前往了狮鹫海姆。在那里，他被分配到著名炮兵军官、格罗弗最器重的将领之一——亚历山大·克梅斯凯下辖的部队。\n\n之后他加入了克梅斯凯推翻帝国的计划，他认为帝国君主制度是堕落、寡头的，是狮鹫民族最为败坏的品质——对权利的贪欲——的集中体现。他参与了皇宫之战，并且逐渐获得了一个共和国营的指挥权。他就利用这支部队回到了克罗纳的老家，在那里大肆烧杀抢掠，后世称之为“克罗纳大屠杀”。\n\n当革命军向北长征时，曜尾开始怀疑克梅斯凯信奉的谐律理念，转而加入了一个新的党派——狮鹫尼亚民族革命阵线，它是一个极端民族主义组织，专注于民粹共和主义，同时极度追求建立一个民族国家。尽管克梅斯凯不信任曜尾，但是他还是勉强使曜尾成为了共和国内的二把手，以及他最顶尖的将军。\n\n在狮鹫民族革命阵线因1003年漫云的一次恐怖袭击被取缔时，曜尾把他的军队送往北部，开始抢夺袭击共和国与外国的要塞以获取武器与其他战利品。他成为了一个残暴的强盗军阀，以其对谐律与君主制的极端排斥而闻名。"
 rosewing_desc:0 "克劳斯·瑰翼，是克梅斯凯在抗击反动派革命中最信任的朋友之一，于941年出生于安江的荡鹫城。\n\n在他24岁时，他参加了帝国军，很快就成为不久之后就加入军队的克梅斯凯的导师与战友。他们都是格罗弗四世和他新政的支持者——但是他们也都信奉更加激进的共和主义与民主精神。瑰翼一直是个务实主义者，相信在一个像四世这样的贤君统治的国度，革命是不必要的——鹫民们只应该在君主变得腐朽、压迫时才应该革命。但是当五世继位时，他也成为了革命的支持者，参与了鹫民向皇宫进军时帝国军的兵变。随后他参与了共和国军在安江和卡特琳的行动，在978年末被任命为克梅斯凯的副总统。\n\n后来他与克梅斯凯一同北逃，但是之后，两鹫之间在共和党的言论和理想方面存在许多分歧。在995年，他副总统和国防部长的职位被撤除，坚定的共和党鹫翔日接任了副总统职位，国防部长由极右翼但是也很能干的曜尾接任。\n\n瑰翼和他的部队被送到北方以进行维护和平的使命。但是瑰翼没有去维护它，而是去破坏它。他的军阀部队很快与漫云本土狮鹫和君主派勾结在一起，他也开始参与袭击劫掠共和国的军队与物资。但是瑰翼也没有完全地反政府，他确保部队不会进攻城镇，任何这样做的士兵都会被处死。就这样，瑰翼在北方进行“维和”十余年，并且还在继续。"
 oskar_desc:0 "从没有鹫想过奥斯卡·翎坛会成为漫云公爵。奥斯卡是奥托王储（后来的公爵）的弟弟奥古斯特·翎坛的孩子，出生于ALB956年。当克梅斯凯的革命传播到北方，他的叔叔奥托二世被处死时，其余的合法继承者也被俘获并最终被处刑。\n\n虽然这阻止了君主制的再起，但翎坛家族的成员仍有存活。975年8月，奥古斯特于革命爆发前夕去世，迫使奥斯卡与共和党政府谈判，以挽救自己的家系。奥斯卡的妹妹和外甥都被共和党政府宽恕了—究竟是作为宣传工具，又或者确实出于仁慈，这没有鹫能确定。虽然共和党允许奥斯卡的妹妹和外甥留在共和国内，但奥斯卡本身却被流放到北方部落。\n\n在宁静的部落里，他成了一个安静寡言、彬彬有礼的狮鹫，直到现在，他对爵位宣称仍然兴趣寥寥。奥斯卡更喜欢在北方部落过着平静的生活，与当地的小马发展友谊，并成为正式的双语者。在1004年他还得了个女儿奥菲莉亚，血脉得以延续。\n\n然而，就在此时，奥斯卡被军阀克劳斯·瑰翼推上了君主之位，并宣布他为漫云公国的奥斯卡一世。翎坛家族的统治将得以继续，漫云再次是一个君主国了！"
 hafslund_desc:0 "乔纳斯·哈夫斯伦德于973年出生于漫云公国，但当共和党徒向北进军，攻占公国时，他的父母都改换阵营，向着穿过荒芜之峰的共和党军队欢呼。哈夫斯伦德也紧随其后，18岁时，他立即加入了共和军——就像许多新兵一样，他被总统元帅的激情演讲所吸引，也被里卡德·艾斯特勒等新生的，年轻的激进分子所吸引。哈夫斯伦德发现自己支持社会主义理想，并在担任军官时加入了许多社会民主和民主社会主义组织。\n\n在998年，25岁的哈夫斯伦德，再次被提升了军衔，这是出于许多议员的要求，因为他们相信即使发生大规模叛乱，哈夫斯伦德仍会忠于共和党的事业。哈夫斯伦德和年轻的战略家奥托·格雷默森一起，成为青年军官运动的关键角色之一，他忠于社会民主政策和革命思想，与曾经盘踞在狮鹫尼亚帝国军队中的守旧派形成鲜明对比。\n\n虽然哈夫斯伦德相对来说仍是一位才能平庸的将军，但他无疑已经成为共和国新运动的前驱之一——这使他与许多他的将军同僚产生了矛盾……"
 emerich_desc:0 "沃尔特·埃默里克出生在施塔莓冬铃的一个商鹫家庭，他本来将会在鹫王河继承家族的生意，但他对自己的命运却有着不同的计划。16岁那年，他告别了父母，乘汽船沿鹫王河前往狮鹫海姆。\n\n然而，城市生活却不如埃默里克幻想一般，他很快就怀起了思乡之情。而当受爱戴的格罗弗四世驾崩时候，首都的贫困与冲突则使埃默里克放弃了一切幻想，开始活跃于地下的共和党圈子。\n\n当978年的革命爆发时，埃默里克欢欣鼓舞，和成千上万的平民们一起攻入了皇宫。尽管他们基本没什么军事经验，他攻克宫殿的英勇行为还是使他被总统任命为了军官。尽管，大多数历史学家认为他被克梅斯凯任命不过是为了确保狂热共和派——那些把克梅斯凯当做机会主义者的共和党鹫的支持。\n\n埃默里克学得很快，他很快就在第一次和第二次间河战役证明了自己——却又在第二次芬宁战役中被埃里希·玄翼击败。\n\n埃默里克后来参加了长征，以及革命后的政治活动，并被克梅斯凯任命为布伦纳的临时参议员，这一职位他至今还保留着——尽管现在他是一名狂热地效忠于赋予他新生命的元帅爪下的军事长官。"
 rosewing_general_desc:0 "克劳斯·瑰翼，是克梅斯凯在抗击反动派革命中最信任的朋友之一，于941年出生于安江的荡鹫城。\n\n在他24岁时，他参加了帝国军，很快就成为不久之后就加入军队的克梅斯凯的导师与战友。他们都是格罗弗四世和他新政的支持者——但是他们也都信奉更加激进的共和主义与民主精神。瑰翼一直是个务实主义者，相信在一个像四世这样的贤君统治的国度，革命是不必要的——鹫民们只应该在君主变得腐朽、压迫时才应该革命。但是当五世继位时，他也成为了革命的支持者，参与了鹫民向皇宫进军时帝国军的兵变。随后他参与了共和国军在安江和卡特琳的行动，在978年末被任命为克梅斯凯的副总统。\n\n后来他与克梅斯凯一同北逃，但是之后，两鹫之间在共和党的言论和理想方面存在许多分歧。在995年，他副总统和国防部长的职位被撤除，坚定的共和党鹫翔日接任了副总统职位，国防部长由极右翼但是也很能干的曜尾接任。\n\n瑰翼和他的部队被送到北方以进行维护和平的使命。但是瑰翼没有去维护它，而是去破坏它。他的军阀部队很快与漫云本土狮鹫和君主派勾结在一起，他也开始参与袭击劫掠共和国的军队与物资。但是瑰翼也没有完全地反政府，他确保部队不会进攻城镇，任何这样做的士兵都会被处死。就这样，瑰翼在北方进行“维和”十余年，并且还在继续。"
 schnabel_desc:0 "施纳贝尔·翔日尽管丢了一只眼睛，但是他的眼神依旧雪亮，不会容忍共和国落入软弱的保守派、同情天际纳维亚的民主社会主义者和邪恶的军阀手中。他在995-1003年是共和国副总统，1003年之后担任军队总指挥，978年革命之后他一直是亚历山大·克梅斯凯和他们所许诺的民主价值观的最坚定的支持者之一。\n\n作为一名理想主义者，翔日自975年加入国民共和党以来，一直为鹫民的权利而奋斗，并在青年时代成为共和党的非正式领袖。从那时起，他在978年革命中掌权，与克梅斯凯元帅共同合作，他们与克劳斯·瑰翼将军和莱因哈德·曜尾将军一起宣布成立狮鹫尼亚共和国。在克罗纳战役中，翔日与曜尾一同进行了战斗，但在战斗中被击中眼睛。在医护的帮助下，翔日奇迹般地活了下来，但却发现克罗纳已经成了一片废墟——曜尾为了报复帝国的罪行和他认为的翔日的死，把这个城市夷为平地。\n\n尽管他从未从丢失一只眼睛的伤痛中完全恢复，他还是继续作战，同时对曜尾也心生不满。在他于克梅斯凯向北长征时，他的狂怒是任何眼睛正常的狮鹫都比不了的。你可能会被独眼的假象所蒙蔽，翔日在共和党军队服役期间一直是一位久经沙场的战术家和令鹫生畏的将军。\n\n现在，翔日处于权力的首要位置，并准备不惜一切代价保护共和国的梦想。"
 FAT_saskia_desc:0 "§Y出生§!：964年10月16日，于狮鹫海姆\n\n§Y传记§!：萨斯基亚·梅克勒出生在狮鹫海姆中部的一个中产阶级家庭。梅克尔从小就接触到这个城市的肮脏和贫穷，他对改善穷鹫的生活条件和促进平等充满了热情。在大学期间，她被社会主义意识形态所吸引，尽管她回避了一些同龄鹫更为激进的立场。\n\n毕业后，她搬到了安江，远离了帝国的目光。她极具吸引力的个性很快为她赢得了受鹫尊敬、和蔼可亲的哲学家和理论家的声誉。作为对无政府主义联盟的严厉批评，她选择在男爵倒台后加入当地的社会民主党，最终在海拉·艾希贝格失势后的混乱中成为该党的领袖。\n\n她在安江与当地NRP内部的温和派系关系密切。这些关系使她成为共和国中最著名的自由化倡导者之一。她公开赞扬NRP的“三民主义”，并声称尽管该党被先前被克梅斯凯和布鲁姆的影响所腐化，但共和党的初心是值得肯定的。\n\n梅克尔对社会的愿景是建立一个符合真正的三民主义，且自由公正的泛狮鹫尼亚共和国。\n\n§Y肖像绘者§!：Cofido"
