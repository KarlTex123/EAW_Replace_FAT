 F08_change_democratic:0 "共和国公务员"######
 F08_change:0 "共和国公务员"######
 #FAT_republicanism_desc:0 "国民共和党右翼的出现是共和国历史上一个有趣的变化。曾经作为社民主义革命运动的共和国执政党现在却支持更加务实的政策，保守的经济体系以及将漫云地区本土狮鹫在国民共和党中获得应有的代表权。该党右翼采取防御性的外交政策，以团结与妥协为基础的国内政策以及建立在稳定与安全基础上的经济政策，他们所倡导的原则同978年革命者们所倡导的原则大相径庭，但这无疑是共和国“正确”的右倾选择。" #修改#覆盖
 #FAT_liberalism_desc:0 "国民共和党的中间派（谐律派）主要由978年那些革命的坚定分子组成，将共和主义的原则恪守于心。泛狮鹫尼亚理想主义、经济上的社会民主政策和福利项目，以及军国主义和反君主制是国民共和党谐律派的特征。它的领导者主要由像施纳贝尔·翔日和沃尔特·埃默里克这样的将领组成，坚信着共和国的三民主义——民权、民主、民生！"
 #FAT_democratic_socialism_desc:0 "国民共和党的左翼在近几年才脱颖而出。它主要由更加年轻、理想化的狮鹫们领导，并坚信978年的革命应当继续，并且要进入到一个崭新阶段。该派宣称，与其追求社民主义以及像国外那样反共，我们应当寻求工鹫的自主管理，还有与天际纳维亚的和解。这一党派激烈地反对共和国的守旧派，并寻求对克梅斯凯个鹫崇拜的完全、彻底终止。这是一个年轻而激进的运动，很多鹫因它的“独裁主义”与“蔑视自由派”而批判它。"
 fatass_the_task_ahead_focus:0 "进攻性对外国策树"
 fatass_the_griffons_tutelage_focus:0 "防御性性对外国策树"
 fatass_dictator_focus:0 "铁爪统治国策树"
 fatass_democratic_focus:0 "后克梅斯凯时代国策树"
 FAT_aiding_the_generals:0 "密谋反对克梅斯凯"
 FAT_aiding_the_generals_desc:0 "过去三十年间，亚历山大·克梅斯凯除了在总统府里发表演讲，坐视国家陷入混乱之外没有做出任何贡献。阻止克梅斯凯，拯救共和国的唯一方法就是支持北方的军阀发动政变推翻那失败的政府。"
 FAT_chaos_in_the_countryside:0 "支持总统元帅"
 FAT_chaos_in_the_countryside_desc:0 "军阀们在乡下横行霸道，忠于我们的指挥官无力阻止。看来如果我们不小心切除这祸害我们国家的肿瘤，共和国之梦很快就将终结。"
 FAT_support_from_the_natives:0 "本土狮鹫的支持"
 FAT_support_from_the_natives_desc:0 "我们应该从那些自克梅斯凯夺权以来处境恶劣的本土狮鹫那里寻求支持。他们自己的公国被推翻了，而这些本土狮鹫在新的，以赫兹兰鹫为核心的共和国政府里几乎没有代表权。将领们可能也是赫兹兰鹫，但至少我们关心漫云本土狮鹫！"
 FAT_support_from_fascists:0 "同法西斯派的协定"
 FAT_support_from_fascists_desc:0 "狮鹫尼亚民族革命阵线曾经是克梅斯凯反帝国革命时的盟友。而现在共和国政府也日益腐朽与寡头化，这是法西斯派不乐意见到的。通过利用曜尾与他们的联系，他们就能在接下来我们的行动中帮助我们。"
 FAT_sway_the_old_guard:0 "说服守旧派"
 FAT_sway_the_old_guard_desc:0 "那些守旧派也对克梅斯凯无法实现革命而耿耿于怀。所以他们便向和平和保守主义转化。在我们反抗漫云政府的斗争中我们也要依靠这些不满克梅斯凯的鹫们，并煽动这些保守鹫加入曜尾的极端民族主义者或者瑰翼的君主派中。"
 FAT_bring_in_the_monarchists:0 "邀请君主制支持者"
 FAT_bring_in_the_monarchists_desc:0 "还有不少狮鹫仍然支持旧漫云公国对这片土地的统治。或许我们当中有很多鹫不同意，但是我们要向这些鹫做出模糊的重建公国的许诺，以获取翎坛复辟者的支持。"
 FAT_secure_lostgate:0 "进入失落之门"
 FAT_secure_lostgate_desc:0 "很快，那些共和国的家伙们将被驱逐出共和国最北端，漫云本土狮鹫统治的堡垒——失落之门。借助我们和流亡君主派与本土狮鹫的联系，我们可以确保控制此地。"
 FAT_secure_windford:0 "控制风福特"
 FAT_secure_windford_desc:0 "风福特可能是在北方最有利于我们的位置之一了。但是这里还是有不少支持共和党统治的鹫。只需一次突袭，我们就能灭掉这些阻碍，夺取当地政府。"
 FAT_move_south:0 "向南进发"
 FAT_move_south_desc:0 "现在克梅斯凯在北方的狗腿子已经被我们剔除，可以专注于向南进发。我们的部队将摧垮任何沿途的地方政府势力。让他们知道，漫云城就是我们的下个目标。"
 FAT_crack_open_the_armories:0 "夺取北方军械库"
 FAT_crack_open_the_armories_desc:0 "我们的政变或许有足够的鹫力支持，但是克梅斯凯的武器与战略位置更好。现在我们控制了北方，我们应当夺取这里的军械库。"
 FAT_some_choice_assassinations:0 "双重暗杀"
 FAT_some_choice_assassinations_desc:0 "许多新上任的指挥官还忠于克梅斯凯，我们无法容忍！要尽快以任何方式消灭这些舔狗，确保瑰翼与曜尾的控制。"
 FAT_the_battle_for_cloudbury:0 "漫云城争夺战"
 FAT_the_battle_for_cloudbury_desc:0 "我们牢牢掌控了北方，到了反抗克梅斯凯腐朽政权，恢复共和国秩序的时候了。利用瑰翼与君主派运动和曜尾与地下民族主义组织间的联系，是时候公开叛乱反抗克梅斯凯了。"
 FAT_victory_in_the_civil_war:0 "共和派的胜利"
 FAT_victory_in_the_civil_war_desc:0 "我们在反军阀的斗争中取得了胜利，接下来就是真正改革我们的共和国，无论是民主派掌权还是左翼掌权。同时也该进行重建与复苏了。"
 FAT_take_action:0 "采取行动"
 FAT_take_action_desc:0 "共和国之梦还没有被遗忘！我们必须坚守我们的原则，尽一切努力令国家改革。为了共和国！"
 FAT_reform_the_military:0 "军事改革"
 FAT_reform_the_military_desc:0 "很长时间以来，我们的军队控制了过多的地方力量，而这种情况不能再继续下去了！一项改造和重建我们军事鹫员的努力应该可以中止这些行为，并避免未来事态升级。"
 FAT_republican_military_academy:0 "共和国军校"
 FAT_republican_military_academy_desc:0 "军队重建的第一步应当是建设我们自己的军校。尽管这耗时耗资巨大，但前景极好。"
 FAT_Republican_Military_Academy_idea:0 "漫云军校"
 FAT_foreign_instructors:0 "外国专家"
 FAT_foreign_instructors_desc:0 "我们并不是这块大陆上唯一想要反对君主制与独裁的国家。通过邀请外国导师与专家，我们可以学习很多关于建设现代化军队的知识。"
 FAT_set_standards:0 "必要的陆军改革"
 FAT_set_standards_desc:0 "我们的士兵是要保护所有民众的，因此我们必须确保只有那些适合它的狮鹫加入军队。更高的入伍标准将确保军队中的狮鹫都是体格健全的，哪怕他们的数目少点。"
 FAT_first_cadets:0 "新共和国军官"
 FAT_first_cadets_desc:0 "军校的首批学员即将毕业并担任职务。那些保守派不再占据主导，新一代鹫将接过火炬。"
 FAT_solidify_support:0 "确保支持"
 FAT_solidify_support_desc:0 "统帅部有很多守旧派认为我们的改革是对他们的背叛。我们必须在他们散布对军队的不信任前解决这些阴谋论分子。"
 FAT_presidents_speech:0 "乡间巡视"
 FAT_presidents_speech_desc:0 "总统元帅是优秀的演讲者，他将指引国家重燃民众心中的共和国精神，尤其是在北方受到恶毒的、不关心鹫民利益的军阀们蛊惑的平民们，更需要提醒他们共和国事业的意义！"
 FAT_sack_the_commanders:0 "消灭军阀"
 FAT_sack_the_commanders_desc:0 "是时候解决那些顽固派里最老的家伙们了。那些腐败、不忠的狮鹫将被开除，这样他们永远不能再威胁漫云城的共和国了。"
 FAT_sack_the_commanders_tt:0 "指挥官§Y克劳斯·瑰翼§!和§Y莱因哈特·曜尾§!将被开除，§R但是并不会被完全压制下去§!。"
 FAT_sack_the_commanders_tt2:0 "将会暗中处理掉指挥官§Y乔纳斯·哈夫斯伦德§!和§Y奥托·格雷默森§!。"
 FAT_sack_the_commanders_tt_suntail:0 "指挥官§Y克劳斯·瑰翼§!和§Y麦克斯·白羽§!将不可用。"
 FAT_sack_the_commanders_tt_rosewing:0 "指挥官§Y莱茵哈特·曜尾§!和§Y喀绒·暴风羽§!将不可用。"
 FAT_a_new_army:0 "共和国新军"
 FAT_a_new_army_desc:0 "我们胜利完成了改革运动，成功解决了国内危机。眼下依旧有很多问题亟待解决，但共和国将会永存。"
 FAT_reform_the_chain_of_command:0 "全新的指挥系统"
 FAT_reform_the_chain_of_command_desc:0 "尽管有新的将领，但是旧的军事官僚机构和指挥系统有把他们再次腐化的风险。我们不能允许这样，必须尽快改组他们。"
 FAT_Democratic_Army:0 "为了保卫共和国"
 FAT_Socialist_Army:0 "为了保卫共和国"
 FAT_regain_trust:0 "重获信任"
 FAT_regain_trust_desc:0 "斗争结束，尘埃落定。尽管我们确保了总参谋部的信任与忠诚，但是普通士兵依旧对政府充满怀疑。我们要尽快恢复他们的忠诚与信任。"
 FAT_loyality_to_the_republic:0 "忠于革命"
 FAT_loyality_to_the_republic_desc:0 "革命之火燃烧在所有鹫的心中，共和国之梦也充斥着他们的脑海。或许一只鹫的想法会变，但是梦想不会。为了共和国！"
 FAT_loyality_to_the_president:0 "忠于总统"
 FAT_loyality_to_the_president_desc:0 "是元帅英勇地带我们在摆脱帝国束缚的道路上前进了这么多，我们伟大的总统元帅将万众瞩目！"
 FAT_plactate_the_generals:0 "安抚将领"
 FAT_plactate_the_generals_desc:0 "改造我们不忠的军队系统不现实。考虑到目前的状况，最好去用贿赂来取悦他们，来确保他们暂时能忠诚。至于他们不忠的态度，我们之后再处理吧。"
 FAT_first_general:0 "安抚曜尾"
 FAT_first_general_desc:0 "曜尾将军和他爪下的强盗土匪军队是在1003年我们解雇他之后才开始闹事的。如果我们给他一点让步以换取他的忠诚，那么他肯定是共和国重要的盟友——正如在革命爆发和长征时一样。"
 FAT_offer_favors:0 "一点合适的贿赂"
 FAT_offer_favors_desc:0 "曜尾总是能最大程度地利用混乱的现状，尽管我们所掌控的军力更强，他依旧在要求更多让步。他正在要求政府的贡金来换取他的继续服役，并补偿他在北方战役中的损失。虽然很不情愿，但为了和平，我们还是接受吧。"
 FAT_second_general:0 "安抚瑰翼"
 FAT_second_general_desc:0 "瑰翼将军饱受欢迎，和曜尾不同的是，他在北方已经有很长时间了。他的军队里有很多漫云本土狮鹫和君主派支持者，以及不满克梅斯凯的守旧派，这让他的军力与支持令鹫生畏。我们必须解决这一问题。"
 FAT_Removing_Troublesome_Soldiers:0 "铲除麻烦的士兵"
 FAT_removing_troublesome_soldiers:0 "铲除麻烦的士兵"
 FAT_the_worst_is_over:0 "阴霾散去"
 FAT_the_worst_is_over_desc:0 "曜尾和瑰翼现在重新服从共和国，他们的部队离开了北方乡间，回到了漫云城。安抚这些鹫之后，我们就能继续向更伟大的事业前行。"
 FAT_Liberty_Or_Death_idea:0 "不自由毋宁死！"
 FAT_Gearing_For_War_idea:0 "大规模战争宣传运动"
 FAT_gear_for_war:0 "扩大军工生产"
 FAT_war_propaganda:0 "战争宣传运动"
 FAT_liberty_or_death:0 "一切为了梦想"
 FAT_bring_natives_into_the_party:0 "让漫云本土狮鹫入党"
 FAT_bring_natives_into_the_party_desc:0 "共和党一直以来以“君主制倾向”为由对漫云本土狮鹫和他们的组织不友好。这些指控其实是没有根据的，所以我们要鼓励漫云狮鹫入党，终结党内赫兹兰鹫占主体的情况。"
 FAT_demand_their_oaths:0 "要求服从"
 FAT_demand_their_oaths_desc:0 "我们已经向曜尾、瑰翼做出了巨大的妥协，所以也该他们服从总统元帅，向三色旗发誓不再参与野蛮的土匪行为了。"
 FAT_remove_troublesome_soldiers:0 "处理君主主义者"
 FAT_remove_troublesome_soldiers_desc:0 "瑰翼爪下最糟糕的那批士兵就是君主制的老顽固，只忠于那个失败的翎坛王朝。这些家伙应当被清理掉以保证他的军队能够团结与忠诚。之后我们可以把目光转向剩下的真正士兵，他们有不少都在革命中为共和国流汗流血。必须提醒他们真正的奋斗目标。"
 FAT_concessions_to_nationalist_groups:0 "解除民族革命阵线的禁令"
 FAT_concessions_to_nationalist_groups_desc:0 "民族革命阵线在1003年由于一场发生在漫云的恐怖袭击而被取缔。它已经同我们保守派的将领们勾连并对政府形成威胁。如果恢复其合法性并做适当的让步，那么他们就不会再威胁我们伟大的国家了。"
 FAT_pardon_the_raiders:0 "赦免匪兵"
 FAT_pardon_the_raiders_desc:0 "曜尾最后的要求是赦免他爪下所有匪兵。除了其中那些最差的家伙们，我们应当全部同意。曜尾保证将会亲自处理最烂的家伙。"
 FAT_remind_them_of_the_cause:0 "共和国战争宣传"
 FAT_remind_them_of_the_cause_desc:0 "必须提醒瑰翼和他的士兵奋斗的目标。我们自帝国的枷锁解放，并且要保证帝国再也不能侵犯我们的土地。为了共和国！"
 FAT_crisis_averted:0 "避免危机"
 FAT_crisis_averted_desc:0 "机器开始运转，曜尾和瑰翼的军队也再度受我们控制。这是伟大的一天，而现在我们将展望明天。未来等待着我们。"
 FAT_gear_for_war_desc:0 "如果我们要完成革命、夺回狮鹫海姆，那么我们必须强化军工，而民用领域根本不重要。"
 FAT_war_propaganda_desc:0 "“你希望漫云城化作废墟，那些肮脏的君主制叛徒烧毁城市、屠戮平民、洗脑幼童吗？如果你不想看到，并珍惜对给予我们民主和自由的共和国的忠诚的话，那么今天就去您最近的征兵站报名吧！”"
 FAT_radicalize_the_party:0 "鼓动共和党左派"
 FAT_radicalize_the_party_desc:0 "数十年以前，在克梅斯凯中止宪政之前，社会主义鹫民党曾经同共和党一起奋斗追求一个更伟大的狮鹫尼亚。他们是对的，若想达成真正的谐律，我们必须建立一个社会主义的民主政府，给予劳工们和平、土地与面包。"
 FAT_takeadvantageofthechaos:0 "社会主义鹫民党的遗产"
 FAT_takeadvantageofthechaos_desc:0 "社会主义鹫民党在共和国建立时发挥了重要作用，他们同克梅斯凯一道反抗南方的君主主义者。尽管有些成员伴随着镰爪逃到了天际纳维亚，但是国内绝大多数的社会主义者们还是留在了这里，我们可以说服他们加入我们的事业。"
 FAT_appeasethenatives:0 "安抚漫云本土狮鹫"
 FAT_appeasethenatives_desc:0 "漫云本土鹫无论在宗教、文化还是意识形态上都和发动了革命的赫兹兰鹫有很大差异，但是他们仍然占据了国家的绝大部分。他们在权力殿堂中得不到代表是不能容忍的，漫云本土狮鹫领袖的地位应当与赫兹兰鹫平等。至少我们要向他们如此承诺以换取政治支持。"
 FAT_liberty_or_death_desc:0 "对共和国而言，最大的奉献即为加入军队、保护国家、消灭君主制！所有适合参军的狮鹫们都要为自由而战，不自由毋宁死！"
 FAT_Defend_The_Nation_idea:0 "为了守卫梦想"
 FAT_defend_the_nation:0 "防御性外交政策"
 FAT_focus_on_the_civilian_sphere:0 "专注于民用工业"
 FAT_Cut_Spending_idea:0 "削减政府开支"
 FAT_revive_the_nrp_welfare_programs:0 "扩展福利项目"
 FAT_revive_the_nrp_welfare_programs_desc:0 "克梅斯凯的福利项目尽管在978年革命期间起到了很大作用，但是它未能适应现今的形势。翔日内阁已经提出了对政府开销的关键性整改，其中当然也包括更加注重提升共和国鹫民与伟大士兵们的薪水。"
 FAT_Welfare_idea:0 "翔日的福利改革"
 FAT_cut_spending:0 "终止福利项目"
 FAT_focus_on_the_civilian_sphere_desc:0 "政府必须向民用领域投入资源，多多建设民用工厂与基础设施，而不是去扩展军工。"
 FAT_cut_spending_desc:0 "政府同时在福利与军事方面花费过多的预算。如果政府举债但入侵狮鹫海姆的行动却失败了，那是极其愚蠢的事情。"
 FAT_defend_the_nation_desc:0 "防御是最好的攻击。为了保护我们的梦想，我们不能向狮鹫海姆莽撞地进攻，而是加固我们的边境并组建多国间的同盟，以抵抗君主制的威胁。"
 FST_free_the_prisoners:0 "释放囚犯"
 FST_free_the_prisoners_desc:0 "在克梅斯凯的政权下许多鹫都因微小的罪名被关押——违背命令、打家劫舍等。我们要释放这些囚徒加入我方军队。如果他们搞那些背德的行动怎么办？我们需要所有能得到的兵力来源。"
 FST_consolidatemilitaryrule:0 "强化军事管控"
 FST_consolidatemilitaryrule_desc:0 "我们做到了！克梅斯凯死了，我们消灭了谐律官僚制，确立了一个能给共和国带来秩序与安全的军政府。军政府万岁！曜尾与瑰翼万岁！"
 FST_loot_the_homes:0 "空房再利用"
 FST_loot_the_homes_desc:0 "我们发现了许多前往南方的难民所抛弃的空房、工厂与学校。我们应该利用这些建筑作为民用工业生产的基地。"
 FST_thepowerstruggle:0 "权力斗争"
 FST_thepowerstruggle_desc:0 "两名将领怎么可能团结一致组建稳定的军政府呢？战争刚刚结束，曜尾和瑰翼就已经彼此疏远，残酷的权力斗争迫在眉睫。"
 FST_victory_for_suntail:0 "新元帅"
 FST_victory_for_suntail_desc:0 "共和国在瑰翼的君主立宪阴谋下幸存下来了！瑰翼和他的同伙们竟敢相信，格罗弗可以解决狮鹫尼亚的问题，他们就像70年代第一批叛徒保守派那样对四世抱有不切实际的幻想。他们和叛徒亚历山大·克梅斯凯终于被除掉了，现在，我们可以推行真正的民族共和国议程了。"
 FST_rally_the_old_revolutionaries:0 "召集978的同道"
 FST_rally_the_old_revolutionaries_desc:0 "保守派、自由派、保皇派，乃至反动派。大家在978年联合起来，促成了克梅斯凯总统的诞生，大家也将再次联合起来，在狮鹫尼亚恢复真正的皇权。我们没有忘记自由的理想，也不应该忘记！瑰翼元帅不是一个叛徒，而是一个解放者，一个与过去愿景共鸣的鹫。"
 FST_the_perfect_scapegoat:0 "粉碎共和邪教"
 FST_the_perfect_scapegoat_desc:0 "共和主义。它已经成为一个肮脏的词，而且是理所当然的。克梅斯凯和在978年接管共和国的实用主义者摧毁了漫云，让它枯萎和凋零，直到它被威权主义的瘟疫笼罩，变成了一个独裁的军政府。我们的漫云必须面向未来，抛弃978年的腐朽目标。"
 FST_purge_the_traitors:0 "清理叛徒"
 FST_purge_the_traitors_desc:0 "国内还有不少支持克梅斯凯腐败政权的狮鹫们。要在他们起势之前就解决他们，一个不留。"
 FST_new_dawn_for_the_republic:0 "共和国的新黎明"
 FST_new_dawn_for_the_republic_desc:0 "守旧派马上就会被解决，接下来就是执行那些挽救这个垂死共和国的改革了！消灭那些腐败的寡头与资本家们！全体爱国的狮鹫都将忠于曜尾！我们要席卷狮鹫尼亚，为和平而革命！"
 FST_seizethefarmland:0 "夺取农田"
 FST_seizethefarmland_desc:0 "农场和种植园主们一直以来不知道自己在做什么。他们的农场缺乏管理，生产的食物供应链混乱。政府控制这些农场，有序地划分耕地即可解决这样的问题。"
 FST_restoreorder:0 "恢复乡间秩序"
 FST_restoreorder_desc:0 "克梅斯凯的政府让强盗和天际纳维亚流氓肆虐乡间。幸好我们的政府能有力解决这一关键问题。我们不会像虚弱的共和党那样逃避，而是直接派兵解决。这些恐怖分子不值得同情！"
 FST_mass_conscription:0 "大规模征兵"
 FST_mass_conscription_desc:0 "所有狮鹫必须支持我们反抗帝国的伟大斗争。因此将执行强制征兵，让大家都上战场，为我们的今天与明天而战。"
 FST_the_promise_of_prosperity:0 "许诺民生"
 FST_the_promise_of_prosperity_desc:0 "我们必须把我们民族共和国的原则和南方那些法西斯主义、极端民族主义政权的原则区分开来！民族共和国标志着狮鹫心灵的光荣重生，而克梅斯凯的福利计划在这些狮鹫中得到了绝大多数的欢迎，倘若不被官僚系统玷污的话。我们的工作就是继承他的民粹主义议程！"
 FST_work_for_the_republic:0 "为共和国工作"
 FST_work_for_the_republic_desc:0 "在一个被贪婪、腐败和残酷所玷污的民族中，福利只能标志着自满。相反，共和国的目标必须是通过劳动来救赎。我们伟大的鹫民可以通过工作来为国家和理想服务。等到狮鹫尼亚属于我们的时候，工作的好处就会来了！"
 FST_cult_of_the_two_marshals:0 "双鹫崇拜"
 FST_cult_of_the_two_marshals_desc:0 "亚历山大·克梅斯凯是狮鹫尼亚历史上最伟大的将领——直到他被叛国的瑰翼和他那些复辟者们砍下头颅。曜尾虽然和他有私鹫关系与政治上的不和，但我们必须崇敬这位让我们走向共和之路的总统。让那个叛徒瑰翼在地狱永远受苦受难罢！"
 FST_a_false_marshal:0 "清理克梅斯凯的痕迹"
 FST_a_false_marshal_desc:0 "叛徒亚历山大·克梅斯凯永远不会被翻案。他从根基上摧垮了我们的共和国，拖了整整三十年，没有重夺应属于我们的赫兹兰。他就是一个废物，军事上夸大其才的家伙，还是一个更糟的总统。在我们于历史书中歌唱胜利的时，不会有克梅斯凯的位置。"
 FST_nationalization_program:0 "开始国有化"
 FST_nationalization_program_desc:0 "私有企业、寡头、跨国集团，它们在国内的影响力太大了。我们要对军工与民用企业国有化，让国家更有效率地管理。"
 FST_no_mercy:0 "送他们见北风神"
 FST_no_mercy_desc:0 "强盗命如草芥，所有士兵们都应知晓。我们的军队有句格言“全部杀光，送他们见北风神罢！”我们要解决强盗的威胁，乡下的狮鹫将再次见证安宁。"
 FST_mass_mobilization:0 "工业动员"
 FST_mass_mobilization_desc:0 "要打败狮鹫海姆腐朽的君主，我们必须现在就开始总动员。在击败南方威胁之前，狮鹫们要么在战场上打仗，要么在工厂里工作。"
 FST_sole_legal_party:0 "强化民族革命阵线"
 FST_sole_legal_party_desc:0 "狮鹫尼亚民族革命阵线在国内依旧缺乏合法性，无数狮鹫还在支持共和党的宪政或者瑰翼的“君主立宪制”。因此要加强我们政府的宣传。同时，举办新的选举（哪怕取缔了绝大多数党派）也能增加我们在国内的合法性与支持。"
 FST_purge_monarkiddies:0 "清理君主主义者"
 FST_purge_monarkiddies_desc:0 "帝国与漫云公国的君主主义者不可能是我们的朋友。尽管他们可能在内战中支持我们，但是他们是帝国主义、寡头主义与腐朽的狗，不应存在于我们的社会中。"
 FST_revive_the_republican_struggle:0 "复苏共和国的抗争"
 FST_revive_the_republican_struggle_desc:0 "军政府夺权之后，国内许多鹫开始怀疑曾经的共和国理想，转而支持孤立主义和本土主义。他们没能理解狮鹫尼亚共和国真正的含义，一个要为全体狮鹫建立的强大民族主义国家。我们应当再度激发公民们对共和国抗争的信念。"
 FST_unwavering_patriotism:0 "坚定的爱国主义"
 FST_unwavering_patriotism_desc:0 "共和国是我们所生存的基本。所有生活在其中的狮鹫都必须保护她的价值观：民安、民族、民生。"
 FST_a_new_dawn:0 "共和国万岁！"
 FST_a_new_dawn_desc:0 "我们解决了共和国国内的问题，应该扩展眼界，向腐朽的、囚禁了我们的鹫民许久的帝国进攻。很快他们就无法再以君主制压迫我们的鹫民了！"
 FST_the_task_ahead:0 "前方的任务"
 FST_the_task_ahead_desc:0 "我们前进的道路黑暗且满是荆棘。有那些被君主制宣传蒙蔽的民众，愿意为奴隶主而非我们作战的农奴，还有刻意守旧的君主们。但无论面对什么挑战，我们都将坚持下去，为曜尾、为共和国而战！"
 FST_pan_griffonian_cause:0 "同共和国们结盟"
 FST_pan_griffonian_cause_desc:0 "要与大陆上其他的共和国相互结盟以推翻腐朽的君主们。我们现在要建立外交纽带，至于夺取狮鹫海姆之后做什么，留到那时再说。当然，其中很可能包括背弃盟约。"
 FST_a_republican_coalition:0 "国际联盟"
 FST_a_republican_coalition_desc:0 "要和其他极端民族主义者与共和国们建立同盟关系。这是唯一一种摧垮腐朽的君主制与谐律主义的方法。"
 FST_question_vedina:0 "深入韦迪纳的森林"
 FST_question_vedina_desc:0 "韦迪纳在帝国统治下维持了数百年的自治，是时候终结它们并让其接受[Root.GetName]统治了。"
 FST_retake_north:0 "踏入天际纳维亚的苔原"
 FST_retake_north_desc:0 "数年前天际纳维亚从我国独立。到了武力整合的时候了。"
 FST_attack_sunstriker:0 "翻越雁之喙的群山"
 FST_attack_sunstriker_desc:0 "为了袭击施塔莓与铜岭，我们必须东进。雁之喙的击日者作为前帝国附庸，一定能成为不错的垫爪石。"
 FST_core_VED:0 "属于我们的森林"
 FST_core_VED_desc:0 "我们的光辉将照耀韦迪纳森林中的狮鹫们。"
 FST_core_SRS:0 "属于我们的苔原"
 FST_core_SRS_desc:0 "必须摧垮天际纳维亚社会主义暴政的残迹，在这极北荒地带来真正的道德与价值观。"
 FST_core_MNC:0 "属于我们的群山"
 FST_core_MNC_desc:0 "击日者部落必须立刻现代化、整合进我们伟大的国家。"
 FST_finish_revolution:0 "终结腐朽的帝国"
 FST_finish_revolution_desc:0 "时间到了。民族革命阵线的部队已经集结，工业体系已经建成，所有的工鹫们也在工厂里努力工作。不但如此，我们的民众已经军事化，准备前去战斗。所有鹫都有一把枪，准备好抵抗君主制的威胁，哪怕它已深入共和国的核心。这将是最终级的战争——前进吧！勇敢的共和国国民们！"
 FST_tricolor_over_griffenheim:0 "意志的胜利"
 FST_tricolor_over_griffenheim_desc:0 "我们做到了！君主主义者已经被消灭，帝都现在在总统莱茵哈特·曜尾爪中。接下来将把改革向前帝国领土扩展，将赫兹兰彻底整合进共和国中。这是我们鹫民光荣的一天！赞美曜尾！"
 FST_retribution:0 "众神的正义"
 FST_retribution_desc:0 "狮鹫尼亚共和国在反革命行动中被摧毁，但是我们的总统曜尾已经将她重建。回想起那时我们被狡诈的神官厄洛斯七世和他的傀儡皇帝毁灭的日子，复仇和清算的时刻来临了。"
 FST_a_warlord_in_griffenheim:0 "掌控帝都的军阀"
 FST_a_warlord_in_griffenheim_desc:0 "莱茵哈特·曜尾，风福特令鹫恐惧的军阀，从亚历山大·克梅斯凯爪中夺过了虚弱的共和国政权。而今，他已经达成了那些漫云耗子们永远无法企及的成就。狮鹫海姆在真正的共和主义者爪中，让那些君主派、神棍和社会主义渣滓全去见北风神罢！"
 FST_the_three_principles_of_the_griffons:0 "民族共和国的新三民原则"
 FST_the_three_principles_of_the_griffons_desc:0 "克梅斯凯的三民主义已经过时了。民主与民权在这样一个被无数外敌与内奸环顾的共和国没有什么作用，所谓的民主统治在那些政治家极端腐败、无法为鹫民服务时也毫无意义。我们的新原则：民安、民族、民生。"
 FST_security:0 "民安原则"
 FST_security_desc:0 "第一原则——民安原则。即我国境内所有狮鹫都能免于内外之威胁。情报部门的设立、对颠覆者与反曜尾党派的清洗，以及与赫兹兰极右势力的联合将解决迫在眉睫的问题并保证民生。"
 FST_drag_out_the_monarchists:0 "移除君主主义者"
 FST_drag_out_the_monarchists_desc:0 "君主与贵族依赖欺骗、背叛与腐败而活，农奴与鹫民在其爪下不可聊生。这些残余的贵族必须被连根拔起，确保那陈腐的价值观不会腐化那些易受影响的狮鹫们的心智。"
 FST_strike_at_the_socialists:0 "向社会主义者进攻"
 FST_strike_at_the_socialists_desc:0 "啊。社会主义者。或许他们的经济目标与我们相同，他们的政治诉求是确保所谓的正义，但事实是，暴力革命与镇压平民，在任何政治环境下都过于危险。这些叛徒将被净化，这样鹫民就能享受安宁。"
 FST_local_allies:0 "在赫兹兰寻找盟友"
 FST_local_allies_desc:0 "在目前的情况并不那么适合民族共和国时，总统元帅曜尾举办了一次与无数极右翼组织的会面。其中包括弗羽西亚的戈弗雷·赫伦与格赖芬马尔申的迪特里希·马赫。后者将作为忠诚的盟友被褒奖，而我们不希望前者活着。"
 FST_expand_intelligence_ministries_desc:0 "叛徒在民族共和国无处不在。克梅斯凯或许能容忍这些叛徒活着并接着叛国，我们可和他们不一样。他们将被毁灭。"
 FST_expand_intelligence_ministries:0 "民族共和国情报调查统计局"
 FST_archon_sucks_suntail_rules:0 "削弱神官领"
 FST_archon_sucks_suntail_rules_desc:0 "神官领已经僭越了其作为信仰仲裁者的权力。他们一次又一次地支持君主制，同时未能遵从神明真正的指示。或许我们要向新的神官们提醒他们这个组织应该有什么权力，不该有什么。"
 FST_the_perfect_dictatorship:0 "仁慈的独裁者"
 FST_the_perfect_dictatorship_desc:0 "“完美的独裁”已经形成，所有的狮鹫将在一个仁慈的领袖爪下享受安宁与富饶的生活。曜尾的一系列举动将把共和国国民从腐败的民主中解放，进入一个全新的荣耀纪元。"
 FST_nationalism:0 "民族原则"
 FST_nationalism_desc:0 "第二原则——民族原则。即我国境内所有狮鹫都能以其祖国与民族而自豪，爪牵爪共同抵抗威胁。必须防范那些钻石狗，玛尔那群狡诈的野兽、皇帝清剿共和党鹫时的走狗们的威胁。也必须从外国势力影响下保护国民！"
 FST_griffonia_for_the_griffons:0 "狮鹫尼亚属于狮鹫"
 FST_griffonia_for_the_griffons_desc:0 "尽管这句话通常被认为是一句反小马口号，曜尾依旧尊敬小马，以及他们在魔法与科技上的造诣。但是，那些钻石狗，舔着格罗弗王朝靴子的魔鬼，为其主子屠戮了无数共和党鹫的渣滓，必须从伟大的狮鹫民族中隔绝出去。"
 FAT_reign_in_the_dogs:0 "约束恶犬"
 FAT_reign_in_the_dogs_desc:0 "铜岭伯爵和他的钻石狗一直以来都是旧帝国皇帝最忠实的鹰犬。复仇的时候来了，那些支持皇帝统治的恶犬将被赶回钻石山！我们将在那些钻石狗贵族身上执行正义审判，而那些钻石狗平民则允许留下来——在狮鹫的监管之下。"
 FST_prosperity:0 "民生原则"
 FST_prosperity_desc:0 "第三原则——民生原则。即我国境内所有狮鹫，如果忠于总统元帅的意志，则能获得奖赏。他们将摆脱贫困，生活水平远高于任何传统的君主国。我国公民福利政策将以夺取并重新分配前贵族之土地财产为主要特征。"
 FST_shatter_the_oligarchs:0 "粉碎寡头们"
 FST_shatter_the_oligarchs_desc:0 "应当解散寡头、摧垮贵族。鹫民与国家将掌控劳动果实，而非脑子里只有剥削的那群懒散资本家和堕落贵族。"
 FST_land_for_the_people:0 "民众的土地"
 FST_land_for_the_people_desc:0 "民族共和国已经掌控了腐朽贵族的土地，下一件必要的事情就是以此来奖赏在第二次革命与摧垮克梅斯凯期间为我国出生入死的共和国忠诚鹫民。到了实现我们的承诺，在全狮鹫尼亚实施土地改革的时候了！"
 FST_the_march_of_industry:0 "前进的工业步伐"
 FST_the_march_of_industry_desc:0 "要将赫兹兰与漫云北方工业化。狮鹫尼亚每个角落都将有本地的工厂。过时的农耕模式也会被现代化的经济所取代，所有狮鹫都能真正地为这个伟大的社会作出贡献。"
 FST_no_stone_unturned:0 "无石不查"
 FST_no_stone_unturned_desc:0 "狮鹫尼亚广阔的山脉与平原，海洋与谷地还隐藏着许多不为鹫所知的资源。这些资源在民族共和国和她的鹫民爪中将十分有用。我们要像那些古老的先驱者一样，为了民族共和国和狮鹫尼亚探索并征服这些资源。"
 FST_towards_unification:0 "新时代的来临"
 FST_towards_unification_desc:0 "我们掌控了赫兹兰，清理了钻石狗，摧毁了旧帝国的残余，是时候把眼光向外看了。很快，整个大陆都将在曜尾的伟大政权下挺立！"
 FST_the_lake:0 "向中部进发"
 FST_the_lake_desc:0 "狮鹫岩是狮鹫种族的心脏。尽管她已经不如古时那样美丽繁华，影响深远，自狮鹫的诞生地的君主制爪中解放鹫民依旧是政府必须做的。共和主义将向南推进！"
 FST_sack_what_remains:0 "摧毁狮鹫岩"
 FST_sack_what_remains_desc:0 "狮鹫岩是狮鹫尼亚腐朽旧文化和君主制系统的标志。这里是正在衰败的废墟，北风神之像也已经丢失，君主制也陷入混乱，也许最好的办法是将这座城市从痛苦中解脱出来，再重建一座新的狮鹫岩，一座不再崇拜旧格罗弗王朝与文化糟粕的新城。"
 FST_the_heart_of_griffonkind:0 "沿湖工业化"
 FST_the_heart_of_griffonkind_desc:0 "沿湖地区也要实行狮鹫尼亚现代的工业标准，封建君主制的维雷尼亚将被终结。工业化、资源采集和福利项目将会让沿湖的狮鹫们得以飞升。"
 FST_core_lakes:0 "在湖心竖起三色旗"
 FST_core_lakes_desc:0 "狮鹫尼亚中部已经从落后且有害，让鹫民们遭受分裂压迫许久的传统糟粕中解放。这些狮鹫将在共和国中找到一席之地，并接纳认同他们的新国家。"
 FST_the_west:0 "向阿奎莱亚进发"
 FST_the_west_desc:0 "西方的狮鹫一直以来都在反抗下贱的君主们，但是其胜利果实未能留存。所以轮到我们去砸断他们身上的锁链了。"
 FST_the_trade_cities:0 "贸易公司国有化"
 FST_the_trade_cities_desc:0 "天落和他们的贸易城市已经沦为堕落者的巢穴，大量的黄金流入了不配占有它们的寡头口袋中。从现在开始，这些财富将被用于国家的利益。"
 FST_greifwald_oil_fields:0 "格赖夫瓦尔德的黑金"
 FST_greifwald_oil_fields_desc:0 "格赖夫瓦尔德油田是极其有用的资源，但是现在这里的设备已经过时，开采量能大幅度提升。开发这些资源对战争极为关键。"
 FST_core_west:0 "在西方竖起三色旗"
 FST_core_west_desc:0 "阿奎莱亚鹫一直都有很强的共和信念。由它们带领，西方的狮鹫也接纳了我们的大一统。我们将一同奔向光明的未来！"
 FST_the_south:0 "向南方进发"
 FST_the_south_desc:0 "南方兄弟们长期以来一直怀疑泛狮鹫尼亚的事业，而是选择自相残害。现在我们能够用武力让他们接受，那就出击罢！"
 FST_destroy_neutrality:0 "碾碎君主主义者"
 FST_destroy_neutrality_desc:0 "这些土地已经被期望复辟那小小君主的阿谀奉承者与其他各种各样的渣滓玷污。我们的职责就是打垮这样的压迫体系，解放狮鹫们。没有国王，只有狮鹫！"
 FST_destroy_false_fascists:0 "喙索里尼的叛徒"
 FST_destroy_false_fascists_desc:0 "喙索里尼和他那眼光狭窄的追随者们显然没有认清更大的局势。他们紧抓着自己的一亩三分地不放，拒绝接受作为更大的狮鹫尼亚国家一部分的样子真是可笑。"
 FST_core_south:0 "在南方竖起三色旗"
 FST_core_south_desc:0 "我们已经净化了南方那懦弱的君主支持者和目光短浅的本土主义者。南方的不和已经消弭，现在他们同我们一道前往光明的未来！"
 FST_the_frontier:0 "向东陲进发"
 FST_the_frontier_desc:0 "东方的土地不光野蛮而且危险，但是民族的统一需要我们微笑着面对这些挑战，并从压迫者爪中解放狮鹫们。共和国万岁！"
 FST_the_gryphus_port:0 "发展格里富斯港口"
 FST_the_gryphus_port_desc:0 "格里富斯的港口已经归我们掌控，这是一个让我们与东南贸易网联络的关键港口。一旦我们扩展此地的码头，这里对我们的海军也将意义非凡。"
 FST_the_new_breadbasket:0 "狮鹫粮仓的工业化"
 FST_the_new_breadbasket_desc:0 "维护我们国家的安全将需要建立一个全新的工业经济。现代技术要求更高的效率以充分利用我们的土地和资源，即使在农村地区也是如此。进步在继续，我们承担不起落后的责任。"
 FST_core_frontier:0 "在边陲竖起三色旗"
 FST_core_frontier_desc:0 "东方的狮鹫们已经获得了自由，它们也将在自己真正的祖国中找到一席之地。团结一致，我们将步入自豪与繁荣的新时代。"
 FST_justice:0 "克梅斯凯做不到的成就"
 FST_justice_desc:0 "共和国终于完全统一了。整个大陆所有角落的狮鹫们都将团结一致地站在一起，正义与自由战胜了贪欲和暴政。这是克梅斯凯的愿景，但是他有弱点，不肯迈出关键的一步。所以，我们向狮鹫尼亚最伟大的解放者莱茵哈特·曜尾三呼万岁！"
 FST_the_clock_is_ticking:0 "时间紧迫"
 FST_the_clock_is_ticking_desc:0 "曜尾的健康危机已经让这位总统元帅睁开了眼睛，意识到了他周遭之政权的现状究竟是什么样的。他的顾问不过是为了继承他而不断争吵的家伙们，他的国民有很多都在为自己的陨落欢呼。\n\n这次，曜尾不会再无视他自己的缺陷了。"
 FST_possibilities_decreasing:0 "退却的可能……"
 FST_possibilities_decreasing_desc:0 "曜尾意识到自己被秃鹫和叛徒们环绕，这不是第一次了。他曾经相信的狮鹫原来是投机取巧者，他本以为早就打败的敌鹫再次昂起了头。但是曜尾没什么选择，他有着战胜那些卑微狮鹫的意志，此刻他不会失败。"
 FST_regrets_mounting:0 "……增长的悔恨"
 FST_regrets_mounting_desc:0 "距离死亡如此之近，这给了总统元帅全新的视角。过去的记忆萦绕在他的身边，他回想起自己犯下的错误，在统一狮鹫尼亚的道路旁所埋葬的朋友们。在他决定要做什么之前，曜尾必须理清他的一生，反思他的错误。"
 FST_the_president_marshal_speaks:0 "向狮鹫尼亚的鹫民演讲"
 FST_the_president_marshal_speaks_desc:0 "显然，曜尾从来都不是什么演讲者，但是非常时期就需要非常的措施。总统元帅将举办一场决定脆弱的民族共和国命运的公开演讲，将在国内每一台收音机中播放，在每一份报纸上刊登。"
 FST_an_eternal_president_marshal:0 "永远的总统元帅"
 FST_an_eternal_president_marshal_desc:0 "曜尾选择无限期维持权力，并决定指定自己的继任者，而不是交由民众来选择。"
 FST_silence_the_naysayers:0 "让反对者闭嘴"
 FST_silence_the_naysayers_desc:0 "“法西斯、暴君、屠夫、罪犯”——民族共和国的敌鹫们在听到总统元帅曜尾的声音时这样咒骂着，他们以为曜尾听不见。是时候提醒这些叛徒们，叛国的代价了。"
 FST_name_a_successor:0 "指定继任者"
 FST_name_a_successor_desc:0 "曜尾终将让位，当他做出这个选择的时候，我们可不能再生出一个混乱时期。是时候选择一个继任者了。一旦总统元帅逝世、卧病或者退休，他的位置就会被他最信任的下属接替。"
 FST_the_thousand_year_republic:0 "千年共和国"
 FST_the_thousand_year_republic_desc:0 "民族共和国已经稳定下来了，我们的国家比以往更为强大。是时候让曜尾坐在一边，欣赏他的遗产了。"
 FST_crush_regionalism:0 "终结地方主义"
 FST_crush_regionalism_desc:0 "民族主义原则的含义，一直是，必须是泛狮鹫尼亚民族主义。分离主义、地方主义和它们的派生思想是民族共和国最大的敌人。任何鼓吹地方主义的出版物都将被查禁。地方主义的鼓动将作为煽动罪被起诉。"
 FST_the_riverpony_debate:0 "[GetFSTRiverponyDebateName]"
 FST_the_riverpony_debate_desc:0 "[GetFSTRiverponyDebateDesc]"
 FST_continue_the_anti_clerical_campaign:0 "延续反神庙运动"
 FST_continue_the_anti_clerical_campaign_desc:0 "信仰本身不是罪过，但有组织、中心化的宗教总是会对民族共和国产生威胁。它意味着某种与忠于国家相异的忠诚，也是与国家脱离的主要权力中心。我们将继续执行反神庙政策，并通过新的法律来根除地下宗教运动。"
 FST_new_archons_for_a_new_republic:0 "新共和国的新神官"
 FST_new_archons_for_a_new_republic_desc:0 "虽然神官领在历史上一直支持着卑鄙和腐朽的君主制，但这不一定是事实。如果我们任命忠于民族共和国的神官，就可以把宗教的力量与民族主义原则结合起来。"
 FST_a_portrait_in_every_home:0 "家家有肖像"
 FST_a_portrait_in_every_home_desc:0 "总统—曜尾，您是民族的救星，您是世界的伟鹫。\n总统—曜尾，您是民生的灯塔，您是民安的长城。\n曜尾！曜尾！您不朽的精神，永远领导我们；\n灭君主必胜，泛鹫陆必成，灭君主必胜，泛鹫陆必成！\n（译者注：原歌曲为《蒋公纪念歌》）"
 FST_end_the_reorganisation_process:0 "完成重组进程"
 FST_end_the_reorganisation_process_desc:0 "是时候完成民族共和国的重组了。总统元帅不能再在没有鹫民认可的情况下领导了。我们将建立立法机构，组建一个保证有序选举的委员会，最后，曜尾将下台，由民选的继任者来接替。"
 FST_call_a_pan_griffonian_congress:0 "举办泛狮鹫尼亚代表大会"
 FST_call_a_pan_griffonian_congress_desc:0 "根据曜尾之前的思想家的想法，立法与行政的分离是共和国政府的核心。虽然曜尾肯定了行政部门的首要地位，但现在狮鹫尼亚已经统一，我们应该召集一个由爱国的狮鹫组成的国会来帮助我们制定法律，并给民族共和国更多的民众支持。"
 FST_national_electoral_commission:0 "组建国家选举委员会"
 FST_national_electoral_commission_desc:0 "为了管理曜尾继任者的选举，我们将任命一个由坚定不移地奉行三民原则的狮鹫专家组成的委员会来评估和审查每个候选鹫，以确保曜尾总统的继任者不会破坏民族共和国的理想。"
 FST_national_republican_elections:0 "民族共和国的首次选举"
 FST_national_republican_elections_desc:0 "是时候了。候选者们已经被登记，规则也已明确，选举官员已被派往每个城市和城镇。现在我们只需要开始这个过程，并静候结果。"
 FST_the_national_republic_lives_on:0 "永远的民族共和国"
 FST_the_national_republic_lives_on_desc:0 "曜尾不光让狮鹫尼亚的民众摆脱了君主制的罪恶，并且也再造了他们的心灵、思想与灵魂，驱使他们走向更伟大的目标——对民族、民生、民安原则的追逐。现在，他终于可以看着自己面前的狮鹫尼亚地图，宣告退休了。那曾经肆意生长的抵抗势力，也已消失殆尽。"
 FST_victory_for_rosewing:0 "曾经的革命者"
 FST_victory_for_rosewing_desc:0 "曜尾的法西斯分子已经被铲除，现在，瑰翼的守旧派已经完全巩固了对民族共和军的控制。作为一个彻头彻尾的老保守主义者，瑰翼的保皇主义在共和国中引起了很大的争议，他们把他贬低为理想主义者，或反动派。然而，这种理想主义，很快就会拯救漫云。"
 FST_the_unthinkable_option:0 "意料不到的道路"
 FST_the_unthinkable_option_desc:0 "为了避免克梅斯凯的错误重演，我们要恢复此地的旧政府，即漫云公国。奥斯卡身为奥托二世的侄子，即使并非直系，他依旧是翎坛家族的一员，也是漫云正当的公爵。奥斯卡一世将坐回到他的宝座，漫云将再次见证和平与团结。"
 FST_an_army_with_a_state:0 "一支拥有国家的军队"
 FST_an_army_with_a_state_desc:0 "这个国策也被取消了。"
 FST_monarchy_with_republican_characteristics:0 "安抚残存的共和派"
 FST_monarchy_with_republican_characteristics_desc:0 "如果我们不愿意我们王室的头再次被刺穿，那就应该和谐律派和民主派一同合作，建立一个君主立宪制国家。或许，随着时间推移，国民共和党甚至会支持我们从克梅斯凯这个独裁者爪中解放漫云。"
 FAT_prime_minister_in_charge:0 "§Y首相§!将成为新的§Y国家元首§!。\n"
 FAT_duke_oskar_idea:0 "奥斯卡一世"
 FST_restoring_mountain_industry:0 "砸开群山"
 FST_restoring_mountain_industry_desc:0 "许多鹫居住在北部山区。对我们大多数公民来说，山区是我们的家，是一种生活方式。在动荡的内战给该地区造成沉重打击之后，我们必须恢复那里的矿业和民用工业。"
 FST_placate_the_fascists:0 "安抚极右翼将领"
 FST_placate_the_fascists_desc:0 "击败共和党鹫威胁、恢复漫云公国旧时荣耀的唯一办法就是和那些帮忙恢复我们神赐的君主国的将军们结盟。克劳斯·瑰翼将成为漫云公国的首相，我们的国家将从头开始重建。"
 FST_deal_with_the_republicans:0 "清洗共和派"
 FST_deal_with_the_republicans_desc:0 "流亡的共和党鹫被我们的复辟激怒了，有些特务们甚至预言他们在天际纳维亚或者韦迪纳境内策划对我们的政变！必须在他们的阴谋壮大到成为威胁之前摧毁！"
 FST_amnesty_for_the_kemerskai_government:0 "给予赦免"
 FST_amnesty_for_the_kemerskai_government_desc:0 "很多前共和国将领和议员逃到了邻国。为了确保鹫民的支持，以及向议会君主制迈进，我们将向他们提供赦免，也能阻止他们反抗我们的任何可能威胁。"
 FST_increase_northern_policing:0 "加大北方巡查力度"
 FST_increase_northern_policing_desc:0 "自从对天际纳维亚起义的担忧减少以来，北部的警察就没预算了。但是，这也导致了北方的强盗和军阀蔓延。恢复该地区警察的巡视对我们至关重要。"
 FST_roads_in_the_north:0 "北方工业优先化"
 FST_roads_in_the_north_desc:0 "北部需要更多的道路！必须鼓励建造北部和南部之间的基础设施，这样我们国家的鸿沟就能被治愈。"
 FAT_Noble_Economics_idea:0 "传统的经济结构"
 FST_keep_rosewing:0 "保留瑰翼"
 FST_keep_rosewing_desc:0 "瑰翼带领我们的新公国穿越了风暴，他与残留的共和派合作，并建立了一个团结一致的新漫云。他让我们的国度安全稳定，所以没有理由质疑他接着当漫云公国的首相。"
 FST_prime_minister_sivenhof:0 "自由派的首相"
 FST_prime_minister_sivenhof_desc:0 "托比亚斯·谢芬霍夫是个受欢迎的漫云本土狮鹫。毫无疑问他支持君主立宪制，所以我们将任命他为新的首相。他的团结与自由价值观正是在我们公国建立民主所需的，而不是那个守旧派瑰翼。"
 FST_look_to_the_nobility:0 "贵族派的首相"
 FST_look_to_the_nobility_desc:0 "奥托·萨克哈根-翎坛是奥斯卡一世的侄子，或许很多自由派会说我们任鹫唯亲，但是很显然，最关心我们国家的首相肯定来自贵族。前漫云贵族对公爵很忠诚，而奥托·萨克哈根-翎坛既是贵族，也是公爵的亲戚。"
 FST_traditional_economics:0 "等级制经济"
 FST_traditional_economics_desc:0 "克梅斯凯的福利政策走错了方向，仅仅造成了攀升的通胀率，鹫民们依旧受苦。如果我们要真正地改革我们的国家，那么我们的经济结构必须回到指引着漫云公国走向富强的传统模式。"
 FST_traditional_hierarchies:0 "确保贵族特权"
 FST_traditional_hierarchies_desc:0 "很多贵族们害怕议会系统将会摧毁他们的权力，让他们统治的领地化作废墟。不过我们理解贵族的困境，我们要确保他们被给予旧时的特权，这样他们就能接着支持我们伟大的公国。"
 FST_support_the_natives:0 "帮助漫云本土狮鹫"
 FST_support_the_natives_desc:0 "漫云公国一直以来都是被本土狮鹫所统治的，他们有自己独特的语言文化。但是当共和国征服我们的祖国时，越来越多的赫兹兰鹫成为了显要的政治家，漫云鹫则陷入了绝望，这我们可不能忍！"
 FST_continue_kemerskai_welfare:0 "深化克梅斯凯经济计划"
 FST_continue_kemerskai_welfare_desc:0 "共和国第一任也是最后一任总统亚历山大·克梅斯凯，他可能是个能力不足的独裁者，但是他确实引入了关键的福利项目，为鹫民带来了好处。我们要重启这些项目，改善所有狮鹫们的民生。"
 FST_new_nobility:0 "压制贵族权威"
 FST_new_nobility_desc:0 "不能相信漫云的老贵族们，毕竟他们是导致公国终结，被共和国军夺取的罪魁祸首。我们将给予平民们更多权利，而不是那些腐败愚蠢的旧贵族。"
 FST_curtail_military_power:0 "削弱军队影响力"
 FST_curtail_military_power_desc:0 "尽管曜尾已经死了，军队大多数都完全忠于公国，他们依旧有恼鹫的高影响力，可以轻易地发起政变或者干预政策。为了防止军队变得太强大，要求我们的妥协，我们应该确保军队是完全忠诚的，并且恢复民政府统治。"
 FST_military_primacy:0 "温和的监护者"
 FST_military_primacy_desc:0 "漫云鹫还没有准备好接受完全的民主，他们需要一个“温和的监护者”，也就是漫云的军队。在他们明智的眼睛与温柔的爪子治下，我们要阻止任何试图从根基搞垮我们新公国的鹫们，尽管这意味着伤害我们鹫民的权利。共和主义将和我们伟大的国家彻底说再见！"
 FST_the_dream_is_not_dead:0 "梦想尚在"
 FST_the_dream_is_not_dead_desc:0 "显然我们不能直接使用共和国的象征，但是我们依旧可以吸引自由派与共和派的国民们。我们要把共和国之梦以所有公民都能自由生活在公爵治下的君主立宪国之梦的形式复活。民权、民生，加君主，你看这新理念写得行不行？"
 FST_cloudbury_as_it_was_meant_to_be:0 "正如旧漫云公国一般"
 FST_cloudbury_as_it_was_meant_to_be_desc:0 "我们恢复了漫云公国的秩序、荣耀与高贵。一个议会系统将确保鹫民获得属于他们的自由，而传统的世袭制将会让我们免受共和主义或者社会主义威胁。漫云万岁！"
 FST_freedom_in_the_north:0 "一个自由的漫云"
 FST_freedom_in_the_north_desc:0 "漫云的本土狮鹫托比亚斯·谢芬霍夫，已经把共和国改革为一个真正的君主立宪制国家，可以说他的首相执政生涯是漫云历史上最伟大的一段时间。他把空前的权利，自由和宪政带给了公国鹫民。漫云万岁！"
 FST_looking_out:0 "世界舞台上的漫云"
 FST_looking_out_desc:0 "我们并非独存于北方。尽管我们与帝国稍微和解了一些，他们依旧是可以随时击碎我们梦想的敌鹫。北方的社会主义者依旧等待着，等待着摧毁我们的国家，南方的帝国或许也会索取远多于我们认同的事物——我们国家本身。"
 FST_bending_the_knee:0 "屈膝臣服"
 FST_bending_the_knee_desc:0 "三百年以来，狮鹫尼亚帝国一直都是我们仁慈的宗主。现在他们正重新获得赫兹兰的控制权，我们要延长我们古代缔结的公约，再次支持格罗弗王朝。"
 FST_kingly_ambitions:0 "更大的野心"
 FST_kingly_ambitions_desc:0 "我们现在是北狮鹫尼亚最强的君主国。让我们投射我们的影响力，让北方各处享有真正的民生。一个团结统一的北方才是反抗帝国的唯一力量。"
 FST_alliance_of_northern_monarchs:0 "同北方君主制结盟"
 FST_alliance_of_northern_monarchs_desc:0 "北方部落尽管落后，但是他们尊重他们的公主。韦迪纳王国作为一个和平的君主国存在也有很久了。我们要和这些古代的君主国们结盟，共同挺立——不只是一个国家，而是许多。"
 FST_finalize_the_partition:0 "瓜分天际纳维亚"
 FST_finalize_the_partition_desc:0 "天际纳维亚已经被击败，是时候在忠诚的盟友之间划分这些领土了。北方部落将获得他们应有的领土，我们的国家将同他们一道反抗北方的任何威胁。"
 FST_ally_vedina:0 "与公主的协定"
 FST_ally_vedina_desc:0 "韦迪纳作为一个富饶的、侠义的谐律君主国已经有上百年历史了。与他们建立同盟是明智的选择。"
 FST_ally_northern_tribes:0 "同部落交流"
 FST_ally_northern_tribes_desc:0 "北方部落的菲安娜二世是一个谐律小马集体的公主，如果我们保障他们的自由与富足那他们会很高兴与我们结盟。"
 FST_ally_the_sane_sunstriker:0 "同击日者的疯子沟通"
 FST_ally_the_sane_sunstriker_desc:0 "艾瑞维尔·击日者，击日者氏族的前任强盗王据说已经恢复了理智，不再去劫掠其他的国家了。这位狮鹫的性格已经改善了许多，他将会更可能加入我们的同盟。"
 FST_strike_at_skynavia:0 "征服天际纳维亚"
 FST_strike_at_skynavia_desc:0 "天际纳维亚，社会主义的失败者们，就在我们的门口。他们的土地被北方部落与我国所宣称。由于他们已经被我们包围，扫荡并摧毁这些社会主义者应该是很简单的事情。"
 FST_restore_monarchies:0 "复辟被推翻的君主"
 FST_restore_monarchies_desc:0 "我们试图接触的一些君主制国家被社会主义者、法西斯主义者或推翻了自己神圣政府的独裁者所控制。鉴于本地区有如此多的敌对政府，有必要让漫云政府恢复这些国家的合法统治者。"
 restore_monarchies_tt:0 "我们会获得针对所有§Y已被推翻的北方君主国§!的§R战争目标§!。"
 FST_self_sufficiency:0 "农业自给自足"
 FST_self_sufficiency_desc:0 "自从懦弱者弗雷德里克统治之后，我们的公国就日渐依赖帝国货物。或许这也是我们输给共和国军的原因之一。我们要建立自给自足的经济，不再依赖他国生产的关键产品。"
 FST_root_out_the_bandits:0 "根除土匪"
 FST_root_out_the_bandits_desc:0 "在我们起兵反对共和国时，北方的土匪们多数与我们结盟。但是在我们赢了之后，他们中许多鹫，尤其是那个死掉的曜尾爪下的继续反叛新政府。我们要彻底清除他们。"
 FST_send_in_the_troops:0 "北方贵族再安排"
 FST_send_in_the_troops_desc:0 "解决盗匪问题的另一个可能的办法是通过政治变革来恢复秩序。允许流亡贵族回到漫云，恢复他们的头衔，将为我们赢得忠诚的盟友，并将通过务实的治理来稳定北方。"
 FST_increase_military_influence:0 "增加军事影响"
 FST_increase_military_influence_desc:0 "漫云公国的军队应该在这个国家有更高的影响力！毕竟，是他们让奥斯卡·翎坛公爵重登王位的。如果我们的君主国想要让军队满意，我们必须允许他们做任何他们想做的事情——例如，资助建造工厂和训练新军队。"
 FST_a_dynasty_to_last:0 "万世王朝"
 FST_a_dynasty_to_last_desc:0 "漫云再也不会倒向共和主义。我们的公国将屹立不倒，在这片充满垂死的帝国和腐朽的共和国的土地上，它将是希望的灯塔。我们记得我们的老领袖的命运，他们向狮鹫尼亚帝国屈膝，被自己的鹫民屠杀。奥斯卡公爵要比这更强大，他将和将军们一起建造一个更伟大的漫云。"
 FST_a_parliament_of_generals:0 "将领的国会"
 FST_a_parliament_of_generals_desc:0 "政治家不能代表鹫民的信仰。克梅斯凯和他的亲信们的失败证明了这一点。相反，公爵应该听取将军们的建议，他们总是把鹫民和国家的利益放在心上。"
 FST_restore_religion:0 "指定一个漫云教士"
 FST_restore_religion_desc:0 "克梅斯凯的政府并不支持神官，尤其是考虑到他们在镇压革命中所起的作用。因此，狮鹫尼亚共和国拒绝帝国为该地区指定教士的任何企图，而是依靠本地宗教领袖，并拒绝寺庙等级制度。漫云公国必须恢复一位教士的职务，同时也要恢复诸神的恩宠！"
 FST_replace_the_duke:0 "限制公爵权力"
 FST_replace_the_duke_desc:0 "奥斯卡·翎坛一直是民主制的同情者，即使在军方的影响下，他仍然否决了我们的一些更专制的提议。他的权力令鹫担忧，为了军队以及他们对漫云的美好愿景，他的行政权力必须被削减。"
 FST_power_to_the_duke:0 "一切权力归公爵"
 FST_power_to_the_duke_desc:0 "依靠渴望权力的军阀的一时兴起来限制奥斯卡一世公爵的权力是愚蠢的。我们将拥有一个在一位光荣而至高无上的君主温柔的爪下强大而有力的漫云！"
 FAT_rosewing_triumphant:0 "二元君主国的胜利"
 FAT_rosewing_triumphant_desc:0 "现在，[Root.GetLeader]胜利地站在一个全新的、独特的狮鹫尼亚君主国领袖的位置上，这个国家已经搁置了赫兹兰鹫和漫云鹫之间的分歧，建立了一个更伟大的整体。然而，我们首先必须任命一位首相，为我们的国王出谋划策，领导这个国家。"
 FAT_eagleclaw_ascendant:0 "任命鹰爪：\n一个神圣的君主国！"
 FAT_eagleclaw_ascendant_desc:0 "尤利乌斯·鹰爪教士，是施塔莓的女公爵嘉比蕾拉·鹰爪的亲戚，是一位虔诚而苛刻的狮鹫，不像那些自由派甚至社会主义的首相，他能够把二元君主国引向稳定与强大。必须支持安全与稳定，而尤利乌斯·鹰爪就是最好鹫选。"
 FAT_support_the_archonate:0 "神官里的朋友"
 FAT_support_the_archonate_desc:0 "鹰爪作为主教的地位使他与北风神官领，乃至整个狮鹫尼亚的宗教组织有很多联系。他的朋友，神官普罗透斯三世，被邀请直接为我们的政府服务，并就政治和神学问题为尤利乌斯提供建议。他的军事和政治才华将是我们国家的宝贵财富。"
 FAT_wrangle_the_legislature:0 "夺取立法机关"
 FAT_wrangle_the_legislature_desc:0 "自由派的立法机关，大多是奥斯卡·翎坛的亲信，必须被压制，这样它的理想主义政客们就不能干预鹰爪政府的目标。必须采取措施限制国会的权力，加强国王和首相的权力，这样才能避免漫云无能议员们的缺点。"
 FAT_mandatory_military_service:0 "强制兵役"
 FAT_mandatory_military_service_desc:0 "全心全意为国家服务是每个狮鹫的责任。以这一原则的名义强制服兵役，并让狮鹫们与国王共同宣誓。"
 FAT_corporatism:0 "法团经济"
 FAT_corporatism_desc:0 "有许多公司不仅愿意为古老的帝国服务，而且明智地看到了光明的前景，并选择与赫兹兰和漫云的真正统治者合作。事实上，来自这些公司的代表们提出了比以前更紧密的合作。这可能会被证明是有用的。"
 FAT_the_monarchist_band:0 "任命铜尾：\n为了皇冠！"
 FAT_the_monarchist_band_desc:0 "事实证明，铜岭伯爵伊格纳蒂乌斯是格罗弗六世忠实、尽职的仆犬。确实，在我们努力统一两个君主国的过程中，他也许是最可靠的掌舵者。他可能是那个需要达成必要约定，以确保一切按计划进行的狗。"
 FAT_power_to_the_kings:0 "国王的权威"
 FAT_power_to_the_kings_desc:0 "二元君主国的王生来就是要统治的。他们自己和他们的血脉被神所选中，王冠的重担压在他们头上，以公平公正的方式进行统治。我们将像曾经那样恢复他们的权力，我们将确保他们以自己的权力，而不是武力来统治。"
 FAT_autonomous_politics:0 "属国的自治"
 FAT_autonomous_politics_desc:0 "无数年以来，帝国的不少属国都拥有很高的自治。例如弗羽西亚议会、罗马坞元老院和耶鲁学区。他们都将得到仍有在境内按自己意愿行事的自主权的保证，但他们仍将受到国王、首相和立法机关的制约。"
 FAT_keep_the_priveleges:0 "贵族们的特权"
 FAT_keep_the_priveleges_desc:0 "贵族，虽然他们在统治中不像国王那样被祝福，而是要向国王效忠，仍将在新的二元君主国中发挥作用。他们将成为平民和国王之间的纽带，为他们的声音提供便利，为当地的国王和鹫民服务。毕竟，即使是国王也不可能无处不在。作为回报，他们将被授予一些符合他们职位的特权。"
 FAT_employment_for_all:0 "不让一只狮鹫掉队"
 FAT_employment_for_all_desc:0 "所以，我们来看看最后一块拼图。国王发誓要保护和养育他的鹫民，而我们就是在这里参与的。在格罗弗和奥斯卡的领导下，我们将大力促进就业，确保任何狮鹫不会被甩在后面，共同奔向一个光明的新未来。这对经济和我们自己来说都是一件好事。"
 FAT_the_wedding:0 "统合两家族"
 FAT_the_wedding_desc:0 "奥斯卡，漫云的国王，他的智慧和力量不能，也不愿抚养任何孩子。婚姻是避免漫云王国陷入继承危机，并进一步将两个王国联系在一起的解决办法。等到年龄合适的时候，赫兹兰的国王格罗弗六世和漫云女王储奥菲利亚，将在狮鹫海姆举行盛大的婚礼。"
 FAT_reassure_the_cloudburians:0 "让漫云鹫安心"
 FAT_reassure_the_cloudburians_desc:0 "漫云的狮鹫担心一旦奥斯卡和他的近亲灭绝，漫云将成为并入赫兹兰的另一块土地，并被视为被联统国，这或许是可以理解的，但是这种恶毒的想法是不能被接受的。我们将向漫云狮鹫保证，他们将被视为与赫兹兰狮鹫平等的伙伴，他们将保留他们现在所拥有的一切。"
 FAT_placate_the_imperials:0 "安抚帝国鹫"
 FAT_placate_the_imperials_desc:0 "许多帝国鹫对漫云平等的伙伴关系产生了怀疑。我们不会允许这种事情发生，我们可以而且将会用闪亮的小玩意、承诺和头衔来转移他们的注意力。毕竟，如果哪位首相不具备交易的眼光和技巧，就不可能坐上首相的位置。很快，随着他们的新想法和新朋友的出现，他们会忘记漫云鹫其他的方面，只会记得他们是平等的合作伙伴。"
 FAT_the_triumph_of_the_confederation:0 "国王万岁！"
 FAT_the_triumph_of_the_confederation_desc:0 "这些折痕已经在握爪之后达成协议之后被抚平了。现在，所有鹫都团结起来支持二元君主国，因为反对者已经学会了什么时候闭嘴。为国王们欢呼三声，愿他们永远活着。\n万岁！万岁！万岁！"
 FAT_rosewing_redeemed:0 "任命瑰翼：\n一个正义的国度！"
 FAT_rosewing_redeemed_desc:0 "赫兹兰和漫云合并的背后策划者瑰翼，无疑是最适合这项工作的狮鹫。他与王国里的各方都有联系，包括共和党鹫、君主主义者、漫云鹫以及赫兹兰鹫，他可以驾驭这些狮鹫们多年来编织的、遍布两国的错综复杂的网络。"
 FAT_one_nation_united:0 "一个统一的国家"
 FAT_one_nation_united_desc:0 "他们可以谈论二元君主的统治，但事实是国家只有一个。这就是漫云-赫兹兰二元联合王国。一个可以由两个国家组成的，但却始终如一的国家。我们的沟通和宣传将从各个方面反映这一点，以确保当我们20年后，鹫民们谈论的是一个国家，而不是两个。"
 FAT_the_cloudbury_herzlander_identity:0 "我们自己的身份认同"
 FAT_the_cloudbury_herzlander_identity_desc:0 "将不会再有“漫云鹫”、“赫兹兰鹫”这样的定义，它们会随着鹫王河的河水慢慢被冲刷干净。相反，一个新的身份将超越过去的标签，创造更伟大的事物。一个新的身份将从旧的废墟中升起，象征着新的二元君主国。"
 FAT_subsidies_for_business:0 "企业补贴"
 FAT_subsidies_for_business_desc:0 "现在衡量一个国家的标准是经济。在这里，我们必须把重点放在推动经济增长的财富引擎上。无论是漫云还是赫兹兰，许多企业和公司都一直在祈求获得启动资金，让经济尽快恢复运转。事实上，那些曾经与旧共和国和旧帝国合作过的企业，现在已经向我们敞开了大门，以换取经济刺激计划的提振。"
 FAT_lower_the_taxes:0 "降低税率"
 FAT_lower_the_taxes_desc:0 "作为更大规模经济刺激计划的一部分，我们还将全面削减漫云和赫兹兰所有狮鹫的税收。狮鹫们有权享受自己的血汗，而不必把它们装在银盘里，送给那些在没有任何鹫同意的情况下就从其他狮鹫的工作中致富的肥猫们。"
 FAT_sivenhofs_victory:0 "任命谢芬霍夫：为了自由和国家！"
 FAT_sivenhofs_victory_desc:0 "谢芬霍夫是这项工作的最佳鹫选。作为一个对国王和王后陛下毫无疑问的忠诚，同时与共和党鹫——其中一些鹫仍在试图颠覆我们——密切合作的狮鹫，他也许可以和共和党鹫们进行交流，以避免另一场革命的发生。革命当然再次被击败，但上一次革命发生时，阿奎莱亚和其他很多国家脱离了，那我们可不愿意见到。"
 FAT_expand_welfare_programs:0 "扩展福利工程"
 FAT_expand_welfare_programs_desc:0 "有句老话叫“面包和马戏”。如果公众和潜在的共和党支持者们能得到饱腹和欢乐，他们就不会产生反对合法的政府，甚至拿起武器的冲动想法。如果我们把“面包”这部分付诸行动，我们或许还能避免另一次革命危机，并获得更强大的经济。"
 FAT_agrarian_democracy:0 "农业民主"
 FAT_agrarian_democracy_desc:0 "民主始于平民和小鹫物们。我们必须从农民和小型农村社区开始。正是他们拥有通过以投票进行地方治理的强大传统，也正是他们作为真正民主的先驱来管理事物。因此，我们将把重点补贴和资金放在最重要的地方。"
 FAT_curtail_noble_priveleges:0 "限制贵族特权"
 FAT_curtail_noble_priveleges_desc:0 "过去的革命并不是凭空产生的。正是那些狮鹫们看到贵族们坐着勾心斗角，喝得酩酊大醉，用他们挣来的钱来养肥自己。而他们无休止地工作，却只得到很少的报酬，得不到任何感恩。我们必须承认，虽然他们的方法是错误的、他们自己也是极端的危险分子，但我们必须通过控制贵族来安抚他们之中不那么激进的支持者。"
 FAT_remember_kemerskai:0 "为克梅斯凯平反"
 FAT_remember_kemerskai_desc:0 "亚历山大·克梅斯凯元帅，一个试图控制帝国境内立宪制改革派情绪煽动的悲剧角色，被他身边极端主义的下属拖入了越来越极端的立场，他不停地挣扎，直到瑰翼帮他解脱。他和他的心在正确的地方，也是真正关心平民的……至少这是我们打算说出口、写进历史书上的内容。"
 FAT_the_greenback_accords:0 "绿钞协定"
 FAT_the_greenback_accords_desc:0 "在各方都让步，全体鹫民都在和平与和谐之下相处的情况下，我们终于可以迈出最后一步。我们将到达绿钞敲定一份最终协议，以确保来自漫云与赫兹兰两个领域的狮鹫们能够为了大家的共同利益而合作。"
 FAT_Taking_Advantage_Of_Chaos:0 "革命活动"
 FAT_reactionary_general_revolt:0 "§R保守派的将领们将不会喜欢这场剧烈的政局变动！§!\n"
 FAT_peasant_batallion:0 "§R我们将会招募4支未经训练的农民部队。§!\n"
 FAT_SRS_appoint_astler:0 "将会安排§C社群派的§!里卡德·艾斯特勒执政。\n"
 FAT_SRS_appoint_sparrowsbane:0 "将会安排§R国际派§!的默·燕祸执政。\n"
 FAT_SRS_appoint_whoever:0 "漫云的无产者们§Y将会自主选择其领袖§!。\n"
 FAT_spawn_prisoners:0 "§R将会释放4支较弱的囚犯部队来为我们战斗。§!\n"
 rosewing_and_suntail_like:0 "§R瑰翼和曜尾的密谋将会继续……§!\n"
 hold_back_rosewing_and_suntail:0 "§G瑰翼和曜尾的密谋将会受阻。§!\n"
 FAT_total_economic_mobilisation:0 "§G我们将会被切换到§!§Y总动员§!§G和§!§Y按需服兵役§!，但是§R此征兵与经济法案将会在我们征服整个大陆所有主要城市之前处于锁定状态。§!\n"
 FAT_equalrightsforponies:0 "国家双语化"
 FAT_equalrightsforponies_desc:0 "从现在开始，所有重要政府文件都将使用漫云语和狮鹫标准语写成，还有翼巴第语和阿奎莱亚语的额外选项。当这一规定发挥效力的时候，我国那分裂的鹫民将逐渐统一，让占少数的赫兹兰鹫统治者与占多数的漫云鹫们达成真正的沟通。"
 FAT_Pony_Rights_idea:0 "劳动大军中的小马"
 FAT_twomarshalsonerepublic:0 "不信任投票"
 FAT_twomarshalsonerepublic_desc:0 "尽管亚历山大·克梅斯凯是革命先驱和共和国创始者，但他已经不再适合坐在总统府里了。宪政危机期间他制订的那些糟糕政策让这个国家几乎毁灭，并且摧毁了一个社会主义共和国的任何希望。他将被允许退休，住到海边一个风景美丽的海景房，而新的总统将会上任。"
 FAT_Bring_The_Revolution_idea:0 "带来革命"
 FAT_Bring_The_Revolution_idea2:0 "带来革命"
 FAT_bring_the_revolution:0 "为和平而革命"
 FAT_bring_the_revolution_desc:0 "我们要向邪恶的君主制和反动派进攻，向狮鹫尼亚帝国独裁的土地带来革命！为了共和国！为了社会主义！为了艾斯特勒！"
 FAT_widespreadlandreform:0 "大规模土改"
 FAT_widespreadlandreform_desc:0 "消灭我国严重饥荒风险的唯一办法是将农场与土地还给鹫民，消灭资本主义剥削。通过土地与食物的再分配，饥荒会迅速消弭。"
 FAT_restoreorder:0 "党内与国内的秩序"
 FAT_restoreorder_desc:0 "弹劾克梅斯凯的政治动荡让我国与我党陷入混乱。我们要进行补救并恢复社会主义政府建立之后土匪与军阀肆虐的北方的秩序。同时也要决定那不忠右派的命运。"
 FAT_rehabilitatethecriminals:0 "尝试改造强盗"
 FAT_rehabilitatethecriminals_desc:0 "乡下的强盗在资本主义丛林法则下苟延残喘。把他们灭掉显得过于鲁莽，我们可以在北方增加补助、满足其基本需求，让土匪威胁不再发生。"
 FAT_justiceaboveall:0 "正义胜于一切"
 FAT_justiceaboveall_desc:0 "那些以为强盗值得改造的想法太好笑了。难道打家劫舍、劫财害命的不是那些家伙们吗？可怜之鹫必有可恨之处。它们过去遭受的困难并不能成为犯罪的借口。派出军队解决这个威胁。"
 FAT_cooperatewithharmonists:0 "与翔日联合"
 FAT_cooperatewithharmonists_desc:0 "翔日和他的谐律派在弹劾克梅斯凯之后并没有公开指责左翼，我们与他们也都支持同样的三民主义：民主、民权、民生。我们很欢迎谐律派加入政府，团结在一起共同应对来袭的风暴。"
 FAT_end_the_personality_cult:0 "终结个鹫崇拜"
 FAT_end_the_personality_cult_desc:0 "克梅斯凯个鹫崇拜必须终止。在他以独裁手段把共和国拖入绝境后，这个国父就没什么值得尊敬的了。"
 FAT_strengthenworkerscouncils:0 "巩固工鹫委员会"
 FAT_strengthenworkerscouncils_desc:0 "工鹫委员会是社会主义社会的基石之一。应该鼓励工鹫团体、合作社与集体企业的建立，工鹫们的组织在政府中也要有一席之地。而且，这些忠实组织们的支持也不会在政治上妨碍我们……"
 FAT_Peasant_Council_idea:0 "劳工委员会"
 FAT_Peasant_Council_idea1:0 "强化的劳工委员会"
 FAT_Peasant_Council_idea2:0 "大规模的劳工委员会"
 FAT_Bread_And_Roses_idea:0 "面包和玫瑰"
 FST_loot_the_armories:0 "洗劫军需"
 FST_loot_the_armories_desc:0 "北方的军械库还储存着大量作战用的武器。去抢吧！"
 FST_the_war_against_kemerskai:0 "反抗克梅斯凯之战"
 FST_the_war_against_kemerskai_desc:0 "克梅斯凯又弱小还没有效率，他的政府腐朽，没有前途。将领们将会建立一个新的共和国，以安全和秩序为根基的共和国。"
 FST_pacify_the_military:0 "压制部队"
 FST_pacify_the_military_desc:0 "我们的部队以袭击劫掠城镇与工厂，抗拒命令而臭名昭著。在克梅斯凯治下这样还好，但是现在他们应该知道反抗曜尾和瑰翼的代价。我们将会挨个枪决他们，向大家展示叛徒的下场。"
 FAT_marketsocialism:0 "混合经济"
 FAT_marketsocialism_desc:0 "社会主义可以与市场经济以及民主兼容。我们给工鹫们自主管理工厂的权力，允许他们在一个市场经济体系内竞争，也让他们在一个合作社体系里享受自己的劳动成果。工鹫的自主管理将带来资本主义体系下财富的平等分配。"
 FAT_workwithindemocracy:0 "共和国集权化"
 FAT_workwithindemocracy_desc:0 "共和国因其分权化饱受困扰，尤其是在北方地区。现在应该进行一些向漫云城集权的行动，为了国家团结也将减少地方自治。在过去的南北分权导致了土匪问题，要确保未来不会发生类似的问题……"
 FAT_encouragelocalelections:0 "强化地方自治"
 FAT_encouragelocalelections_desc:0 "我们的政府集中于漫云周边，这让来自农村的声音很难被听见。所以我们应该设立地方议会以及对国会进行分权化，以更好满足农村狮鹫的需要与目标。"
 FAT_a_working_government:0 "民选政府"
 FAT_a_working_government_desc:0 "不能把共和国之梦扔到一边。一个合法的、正常运作的政府是我们的唯一出路。为鹫民服务！"
 FAT_in_the_defence_of_harmony:0 "为了坚守谐律"
 FAT_in_the_defence_of_harmony_desc:0 "我搜了文件，这个国策被注释掉了"
 FAT_establishlocalcouncils:0 "工鹫委员会的支持"
 FAT_establishlocalcouncils_desc:0 "我们的社会主义运动需要支持，而最好的支持源自工农阶级，他们是第二次狮鹫尼亚革命的主力军。"
 FAT_proper_police_force:0 "正规的警察机构"
 FAT_proper_police_force_desc:0 "强盗小偷在控制并威胁乡下已经很久了。但不再是这样了！全新的、正规的警察部队将快速解决这些罪犯。"
 FAT_secure_the_countryside:0 "保护乡下"
 FAT_secure_the_countryside_desc:0 "或许在某些鹫看来有点极端，仅靠警察可能不足以解决土匪问题。军队预备队将协助他们平定并保卫这块土地。"
 FAT_appoint_civilian_ministers:0 "委任民官"
 FAT_appoint_civilian_ministers_desc:0 "我们是有军队的国家，而非有国家的军队。因此官员必须从平民中选出，军事鹫员就该呆在军队，而非政府！"
 FAT_an_idealistic_cabinet:0 "组建翔日内阁"
 FAT_an_idealistic_cabinet_desc:0 "施纳贝尔·翔日曾在995年到1003年之间担任副总统，尽管近几年海因里希·金羽做的不错，我们国家更需要翔日。共和国将把我们组建横跨全球的泛狮鹫尼亚之国的梦想与抱负作为最神圣、最远大的目标，而其他的都要退居二线。共和国永远屹立不倒！"
 FAT_feed_the_hungry:0 "喂养饥鹫"
 FAT_feed_the_hungry_desc:0 "如果街上还有饥鹫的话，我们就不可能称自己为鹫民的政府。目前的危机必须迅速解决。为民众分发食物！"
 FAT_a_pragmatic_cabinet:0 "维持金羽内阁"
 FAT_a_pragmatic_cabinet_desc:0 "这段时间里副总统海因里希·金羽做的不错。其他的部长们可以调换，但金羽将保留他的职位。务实主义将支配我们的政府，共和国之梦则要排在后面。"
 FAT_regional_elections:0 "国会选举"
 FAT_regional_elections_desc:0 "是时候举行地区选举，让狮鹫们决定谁来领导地区行政事务了。鹫民们将再次统治自己，而986年宪法的暂停将予以纠正。"
 FAT_restore_the_constitution:0 "恢复宪政"
 FAT_restore_the_constitution_desc:0 "在最黑暗的时刻，我们暂停了宪政，现在是时候恢复它了。这样鹫民们将见证我们政府的合法性。共和国永不倒！"
 FAT_enforce_martial_law:0 "强制戒严"
 FAT_enforce_martial_law_desc:0 "尽管现在形势安定下来了，我国距离稳定和安全还有很长一段距离。因此总统元帅将宣布戒严法案，以在国内反对势力面前保护共和国的原则。"
 FAT_pacify_the_countryside:0 "平定匪患"
 FAT_pacify_the_countryside_desc:0 "土匪们嚣张太久了。军队将会介入并平定乡下。如果需要的话，可以动用致命力量。"
 FAT_anti_banditry_tactics:0 "反匪战术"
 FAT_anti_banditry_tactics_desc:0 "军队的行动深受某些规定和诉求限制。我们必须让军队不惜一切代价去消灭这些恐怖分子！"
 FAT_military_courts:0 "审讯叛徒"
 FAT_military_courts_desc:0 "那些邪恶肮脏的叛徒们必将绳之以法。设立军事法院可确保这些罪犯能够被迅速解决。他们再也不会伤害我们的百姓了！"
 FAT_deal_with_communist_agitators:0 "紧盯左派"
 FAT_deal_with_communist_agitators_desc:0 "另一场类似986年的事变或者动乱虽然现在看起来不太可能，但是总会发生。或许左翼现在不是个大的威胁，但是很明显他们不爱我们的共和国之梦。这些家伙们必须被严格监视，不用管是不是违法。防范赤党再度崛起远远比那些叛徒的隐私来的重要。"
 FAT_protect_trade_routes:0 "保卫贸易线"
 FAT_protect_trade_routes_desc:0 "我们身处南北之间的贸易中心，因此我们必须确保贸易路线的安全，让财富自由地进出我国。"
 FAT_conscript_peasants:0 "征召农民"
 FAT_conscript_peasants_desc:0 "我想知道什么会阻止农民捍卫我们的共和国？他们只是缺一支步枪。我们必须要从我们境内的广大农民中招募新兵。"
 FAT_military_roads:0 "军用公路项目"
 FAT_military_roads_desc:0 "必须确保我们的军队安全快速地在国内行进。所以要修建额外的道路，以方便军队和补给运输。"
 FAT_distribute_food:0 "食物配给"
 FAT_distribute_food_desc:0 "食物是关键资源。吃饱的农民会开心，而开心的农民不会惹麻烦。必须给公众额外的食物配给。"
 FAT_industrialization:0 "画龙点睛"
 FAT_industrialization_desc:0 "我们的工业水平依旧落后于其他国家，这不利于我们去实现雄心壮志。我们必须采取最终爪段，让国家跨进入真正的现代化，达到与其他国家相同的水准。"
 FAT_industrialization_requirements:0 "已经解决了§Y土匪§!问题。"
 FAT_banking_reform:0 "金融改革"
 FAT_banking_reform_desc:0 "为了挽救崩溃的财政系统，我们即将开始一次伟大的金融改革。这会确保国家与国民更加富裕。"
 FAT_balance_the_books:0 "自给自足的经济"
 FAT_balance_the_books_desc:0 "我们的公民们不应该再受旧漫云公国导致的贫困折磨了！我们在农业、矿业、工业上必须自给自足，而不要像旧公国那样依赖帝都供给。"
 FAT_improve_roads:0 "改进道路"
 FAT_improve_roads_desc:0 "我们必须具备跨国运输补给和兵力的能力。所以应当开始修建大型的高速公路系统，整块大陆上的首例！"
 FAT_infranstructure_effort_1:0 "连接凹穴"
 FAT_infranstructure_effort_1_desc:0 "凹穴地区必须和我们的高速公路系统连接，以确保军队和物资的快速运输。"
 FAT_infranstructure_effort_2:0 "连接失落之门"
 FAT_infranstructure_effort_2_desc:0 "失落之门地区是高速公路网的重要部分。联通此地会确保区域运输便捷无阻。"
 FAT_port_facilities:0 "翼哈根港口建设"
 FAT_port_facilities_desc:0 "新的高速公路项目完成令我们可以在陆地上快速旅行。是时候扩展海军设施以确保我们在海洋上的存在了。"
 FAT_dockyards:0 "扩展翼哈根港口"
 FAT_dockyards_desc:0 "为了确保舰队能稳定增长，必须继续投资扩展翼哈根港口。"
 FAT_literacy_campaign:0 "漫云教育倡议"
 FAT_literacy_campaign_desc:0 "CEI，即漫云教育倡议，是一个经由总统和他最亲信的顾问完善的全新计划。这一计划将会在北部地区进行扫盲，尤其是在漫云本土狮鹫占大多数的地方。"
 FAT_new_schools:0 "扩展北方学校"
 FAT_new_schools_desc:0 "作为教育倡议的一部分，我们将开办更多学校以提升我国的识字率和教育水平。尤其适合在北方开设这些学校，毕竟很多北方鹫受到军阀肆虐，以及赫兹兰少数族裔主导的影响无法读书识字。"
 FAT_engineering_expertise:0 "消灭文盲"
 FAT_engineering_expertise_desc:0 "教育倡议几乎完成了它的任务，很快国内所有狮鹫都将拥有读书写字与简单的算数能力。我们在全国各地所设立的新学校会教授关于历史、科技与战争相关的内容，我们伟大的国家将如灯塔一般矗立在这日渐黑暗的世界。"
 FAT_cement_factories:0 "斯卡克工业中心"
 FAT_cement_factories_desc:0 "过去一年斯卡克市见证了快速的工业化。有了更多的政府注资，我们能加速这一进程，建立真正的工业中心。"
 FAT_heavy_industry:0 "发展重工业"
 FAT_heavy_industry_desc:0 "为了提高我国的建设能力，我们需要强大的重工业基础。这将是目前我们的关注点。"
 FAT_cloudbury_arsenal:0 "漫云城兵工厂"
 FAT_cloudbury_arsenal_desc:0 "开设新的国营兵工厂将提供更集中的武器生产与供给链条。"
 FAT_military_industry:0 "发展军工"
 FAT_military_industry_desc:0 "我们的军队需要更多武器来运作，必须确保武器供应充分，以免冒失败的风险。"
 FAT_agriculture_mechanization:0 "农业机械化"
 FAT_agriculture_mechanization_desc:0 "通过在农业生产中引入现代机械化方法，我们可以大幅增加农民的生产效率，提高粮食收获量并确保食物供给充分。"
 FAT_connect_north_and_south:0 "连通南北"
 FAT_connect_north_and_south_desc:0 "最可能导致军阀问题的原因可能是我们无法很好管控地区的团结，一些行为让漫云本土狮鹫和政府疏远，让反政府情绪滋生。修建一条连通南北的铁路能预防悲剧重演。"
 FAT_winghagen_development:0 "复苏翼哈根"
 FAT_winghagen_development_desc:0 "翼哈根的港口和工厂在公国时期和共和国早期曾经是军工中心。根据我们目前的条件，要更多地复苏这里，以适应我们现代的发展程度。翼哈根将再度成为漫云地区的明珠！"
 FAT_natural_riches:0 "自然资源"
 FAT_natural_riches_desc:0 "在北方，我们有很多才刚开始利用的矿产资源。可以向这些矿井投资并扩大我们采矿机械化的尝试。"
 FAT_appease_the_testing_team:0 "大规模军工化"
 FAT_appease_the_testing_team_desc:0 "现在军阀已经从乡下销声匿迹，应该再次开始军工发展了。在帝国开始大规模的军事化动员时，我们也要做出相同的举动，以安抚国内的军国倾向，并且为最终的斗争做好准备。"
 FAT_resource_stuff:0 "北方资源"
 FAT_resource_stuff_desc:0 "现政府与前公国都严重忽视了漫云地区北部的开发。我们应当发掘北部的钢铁与铬资源，以免发生资源短缺带来的严重危机。"
 FAT_live_long_and_prosper:0 "生生不息，繁荣昌盛"
 FAT_live_long_and_prosper_desc:0 "通过无数项改革，我们成功应对了国内的危机。我们的民众不必忍饥挨饿或者沿街乞讨。伴随着零失业率和增长的工业，我国将比以往更为强大。鹫民健康长寿，繁荣昌盛！"
 FAT_risen_from_ruins:0 "自废墟中重生"
 FAT_risen_from_ruins_desc:0 "我们在这寒冷的异乡经历了无数的艰难险阻，能做好经济重建与社会的现代化，成为与世界看齐的先进国家几乎如魔法一般。而今我们已经从政治与经济的废墟中重生，接下来将是真正的奇迹！"
 FAT_republican_college:0 "斯卡克科技大学"
 FAT_republican_college_desc:0 "目前看来，教育倡议是个巨大的成功！整个国家的文盲率都在下降。本着这种精神，我们在工业中心斯卡克开设了我们自己的科技大学。很多鹫已经申请进入。我们已经成就了许多。"
 FAT_institute_of_applied_science:0 "应用科学研究所"
 FAT_institute_of_applied_science_desc:0 "随着教育项目开花结果，我们认为是时候在漫云城开设另一处学院，应用科学研究所。这将是我们全新的研究开发中心，并大幅提高我们的科研能力。"
 FAT_finest_mathematicians:0 "支持工程学院"
 FAT_finest_mathematicians_desc:0 "我们要让大陆上最好的数学家与工程学家成为我们新生代的老师！我们肯定能好好利用这些伟大的头脑们，毫无疑问这对我们的国家和下一代都有好处。"
 FAT_artillery_designs:0 "火炮设计"
 FAT_artillery_designs_desc:0 "我们的工程师和数学家一直在共同努力，创造能够发射高能爆炸弹的新机制。新的、先进的火炮系统是他们辛勤工作的成果。"
 FAT_aeronautics:0 "航空进展"
 FAT_aeronautics_desc:0 "新的航空技术很厉害，你看不到这个国策"
 FAT_department_of_electronics:0 "新计算机技术"
 FAT_department_of_electronics_desc:0 "电子产业部研究所在工程方面收获了良好的成果。进一步资助能让他们真正地协助我们进行研究。"
 FAT_heavy_machinery:0 "重型机械"
 FAT_heavy_machinery_desc:0 "国家的中心是工业，现在共和国有一套新的工业国策。"
 FAT_putting_armor_on_tractors:0 "在拖拉机上加装甲？"
 FAT_putting_armor_on_tractors_desc:0 "根据我们的一些研究工作者的说法，听起来很傻的事情可能会造成严重的军事威胁。如果我们进一步朝这个方向投资，我们就可以开发用于战场的独立装甲车辆。"
 FAT_the_presidential_prize:0 "总统科研奖"
 FAT_the_presidential_prize_desc:0 "每年一度，由总统亲自颁发的总统科研奖将被奖励给共和国大学最为杰出的一个项目。这将激励那些科学家们努力工作以获取这一荣誉奖项。"
 FAT_a_new_dawn:0 "全新黎明"
 FAT_a_new_dawn_desc:0 "“我，共和国总统元帅，宣布我们正跨入新时代，新黎明，新生活！为共和国三呼万岁！”"
 FAT_the_griffons_tutelage:0 "狮鹫们的训导者"
 FAT_the_griffons_tutelage_desc:0 "为了巩固我们共和国的新曙光，我们必须首先确保我们的政府和国民的安全。如果我们过度扩张，那就无能为力了。我们必须做好准备。因此，我们将在必要时保持警惕，在元帅总统的监督下。"
 FAT_consolidate_gains:0 "巩固革命果实"
 FAT_consolidate_gains_desc:0 "我们现在所拥有的成果远远比当时革命结束时的要多。必须捍卫革命果实，不要松爪。"
 FAT_the_task_ahead:0 "前方的任务"
 FAT_the_task_ahead_desc:0 "在那些恶徒横行于土地、压迫鹫民并剥夺平等自由之时，共和国当然不能干坐着。我们要准备好终级目标：回到狮鹫海姆的家！"
 FAT_pan_griffonian_cause:0 "共和国公约"
 FAT_pan_griffonian_cause_desc:0 "全大陆的狮鹫和我们一样都想清除君主制。他们是我们的盟友。我们应努力交好他们，让他们同我们一道参与这伟大的事业。"
 FAT_reach_out_to_equestria:0 "公主们的承认"
 FAT_reach_out_to_equestria_desc:0 "塞拉斯蒂娅公主和小马利亚很久以来都是自由的支持者。随着我们政治系统开始运作，或许他们能直接支持我们。"
 FAT_a_republican_coalition:0 "国际共和主义"
 FAT_a_republican_coalition_desc:0 "我们必须同这片大陆上所有的共和国们接触，并将他们作为在这场伟大斗争中共同进退的兄弟与同志，无论意识形态如何。这样，我们就不会被帝国主义与残酷的独裁者们击败！"
 FAT_approach_aquilea:0 "接触阿奎莱亚"
 FAT_approach_aquilea_desc:0 "阿奎莱亚最近爆发了自己的革命并推翻了腐败的国王。我们应当邀请他们以强化我们的关系并保护我们的价值观不受侵犯。"
 FAT_approach_federation:0 "接触贸易联邦"
 FAT_approach_federation_desc:0 "天落虽然不是一个真正意义的共和国，但是也是由市民运行管理的，并且很适合加入我们的公约。他们的自由贸易也不能被君主制压迫所妨碍！"
 FAT_approach_minors:0 "接触他国"
 FAT_approach_minors_desc:0 "整块大陆上还有很多更小的共和国，我们可以接触他们，做朋友并加入我们的联盟。所有鹫我们都欢迎！"
 FAT_reconcile_with_north:0 "与北方和解"
 FAT_reconcile_with_north_desc:0 "我们北方的社会主义者，虽然不是真正的民主，但也是共和运动的一部分。是时候抛弃过去的分歧，一起面对真正的敌鹫了。"
 FAT_retake_north:0 "重夺北方"
 FAT_retake_north_desc:0 "北边的共党是我们边界的威胁。他们是讲不了理的，而对北方的迅速进攻则可以保障我们的侧翼。"
 FAT_core_skynavia:0 "清理共党残余"
 FAT_core_skynavia_desc:0 "统治天际纳维亚的共党没有给予鹫民任何真正的自由，而我们将向他们展示它。为了共和国！"
 FAT_question_vedina:0 "终结韦迪纳"
 FAT_question_vedina_desc:0 "我们西边的君主国，尽管它声称自己是“谐律”的，但依旧是个贵族统治、平民没有权利与自由的独裁国家。为了共和国，我们必须解放那里的鹫民！"
 FAT_attack_sunstriker:0 "远征白尾"
 FAT_attack_sunstriker_desc:0 "东边的白尾地区存在着激烈的共和派运动，希冀着从[MNC.GetLeader]的魔爪中解脱并加入我们。轮到我们去解放这些狮鹫了！"
 FAT_core_sunstriker:0 "整合白尾"
 FAT_core_sunstriker_desc:0 "白尾已经解放并被我们的军队控制，我们应当将当地的共和运动改组为地方政府，整合进我们的共和国。"
 FAT_core_swedes:0 "整合韦迪纳"
 FAT_core_swedes_desc:0 "尽管韦迪纳鹫说着一种口齿不清的语言，并且还继续珍视自己的君主制和反动的价值观，但我们必须将他们融入共和国，不管这中间会有什么麻烦。"
 FAT_wait_out_the_inevitable:0 "守卫梦想"
 FAT_wait_out_the_inevitable_desc:0 "狮鹫海姆的暴君随时都会进攻。我们必须防卫我们的国家，向前来的帝国军反攻。接下来我们必须向帝国的核心进军，为全体狮鹫带来光明的未来。"
 FAT_finish_revolution:0 "完成革命"
 FAT_finish_revolution_desc:0 "同志们，是时候了！今日，在我们开始向狮鹫海姆进军之时，我们的共和国之梦将会实现。前进吧，各位！为了和平与繁荣！"
 FAT_tricolor_over_griffenheim:0 "狮鹫海姆的三色旗"
 FAT_tricolor_over_griffenheim_desc:0 "一切完成了！狮鹫海姆是我们的，那个独裁压迫的帝国已经灭亡了！为我们成功的革命与解放三呼万岁！"
 FAT_fate_of_grover:0 "末代皇帝的命运"
 FAT_fate_of_grover_desc:0 "末代皇帝格罗弗六世只是个孩子，但是不能开脱他的家族、摄政议会以及帝国所犯下的罪行。尽管排除了执行死刑这个选项，他也不能舒舒服服呆在狮鹫海姆里享有过去的头衔与权力。我们可以将他改造成共和国的自由公民，或者将其流放。我听说小马利亚每年这时候景色都很好……"
 FAT_and_the_family:0 "……以及克梅斯凯家族"
 FAT_and_the_family_desc:0 "克梅斯凯家族还活着，应该同其他贵族分开审判。克梅斯凯总统将探访他的侄子男爵奥古斯都，决定克梅斯凯家族的命运。"
 FAT_the_scheming_nobility:0 "狡诈贵族们的命运"
 FAT_the_scheming_nobility_desc:0 "和尚未出生的格罗弗六世不同，绝大多数贵族都参与了挫败978年革命的罪行，例如施塔莓女公爵嘉比蕾拉·鹰爪。他们的罪行可不能像小皇帝那样被轻易原谅。这些家伙将被剥夺头衔，或者剥夺生命。"
 FAT_the_corrupt_archonate:0 "……还有那腐败的神官"
 FAT_the_corrupt_archonate_desc:0 "尽管我们同狮鹫尼亚的信仰之间没有矛盾，那些神官们却愈发邪恶腐败。我们要对三神官的位置重新洗牌，确保他们不再是帝国的走狗。"
 FAT_integrate_minors:0 "整合其他国家"
 FAT_integrate_minors_desc:0 "其他国家成为你附庸的权重是1（分权化*1.5，集权化*0.75，军力优势有加成），不成是3。你可以SL。"
 FAT_integrate_aquilea:0 "承认阿奎莱亚独立"
 FAT_integrate_aquilea_desc:0 "阿奎莱亚在我们摧毁帝国的战役中立下了不少功劳。所以只要他们依旧是我方阵营的一部分，且不打算切断那指引我们共进的谐律与团结纽带，我们就将让他们保持自治。"
 FAT_integrate_federation:0 "整合贸易联邦"
 FAT_integrate_federation_desc:0 "贸易联邦处于虚假的独立自治状态已经有很长一段时间了。是时候将其完全设立为共和国境内的一个自治区域了。"
 FAT_western_developmental_aid:0 "西部重建行动"
 FAT_western_developmental_aid_desc:0 "不管阿奎莱亚为我们，还是为盟友掌控，我们显然都要在这里进行一场广泛的重建运动，尤其是在主要城市之中，以疗愈帝国的恐怖之举与二次革命给这片土地的伤痕。"
 FAT_extend_presidency:0 "扩大总统权力"
 FAT_extend_presidency_desc:0 "为了保障总统统治的稳定性，我们将让我们的总统元帅尽可能久地执政，哪怕宪政即将恢复。如果有必要的话，他将持续执政并保护我们的价值观，直到最后一息！"
 FAT_postpone_reforms:0 "延迟改革"
 FAT_postpone_reforms_desc:0 "改革破坏了政府的稳定，削弱了中央政府的权力。如果我们停止或者至少延迟它们，我们就可以确保我们能更长时间地保持权力。"
 FAT_fortify_imperial_border:0 "加固弗羽西亚边防"
 FAT_fortify_imperial_border_desc:0 "弗羽西亚是最接近我们的帝国属国。如果帝国要进攻我们，那就最好加固沿线区域。"
 FAT_militarize_the_north:0 "北方军事化"
 FAT_militarize_the_north_desc:0 "我们要关注在帝国将难以到达的北方的工业。这也有助于改善这一贫瘠的地区，保护我们至关重要的军工。"
 FAT_contingency_plan:0 "应急预案"
 FAT_contingency_plan_desc:0 "作为自由和自由的堡垒，周围还环绕着许多妄图泯灭这些价值观念的鹫们，我们必须为那不可避免的防御战，以及未来要发生的一切事物做好准备。共和国不会倒下！"
 FAT_save_what_can_be_saved:0 "必要爪段"
 FAT_save_what_can_be_saved_desc:0 "如果我们要解放赫兹兰被帝国从二世开始奴役的鹫民们，我们就要开始进入国家紧急状态。所有狮鹫，所有工厂，所有步枪都将被共和国用来抵抗帝国威胁。总统元帅将巩固他自己的权威，继续戒严，以拯救共和国。"
 FAT_father_of_republic:0 "共和国国父"
 FAT_father_of_republic_desc:0 "总统元帅是我们伟大共和国的国父。所有狮鹫必须知晓他就是带我们走向光荣与自由的鹫，他的话语就是对我们的命令。"
 FAT_the_three_principles_of_the_griffons:0 "狮鹫三民主义"
 FAT_the_three_principles_of_the_griffons_desc:0 "三民主义吾党所宗"
 FAT_liberty:0 "民权主义"
 FAT_liberty_desc:0 "民权主义，言论自由，旅行自由，立刻，马上，请。"
 FAT_guarantee_freedoms:0 "保障自由"
 FAT_guarantee_freedoms_desc:0 "国爱我，我就爱国。"
 FAT_support_the_press:0 "支持传媒"
 FAT_support_the_press_desc:0 "新闻自由？吼啊！"
 FAT_democracy_f:0 "民主主义"
 FAT_democracy_f_desc:0 "民主是三民主义第二条，应该自由选举。民有、民治、民享。"
 FAT_new_institutions:0 "新公共机构"
 FAT_new_institutions_desc:0 "扩增官僚机构，增加行政容量和效率。（环球风云并感）"
 FAT_prepare_for_elections:0 "准备普选"
 FAT_prepare_for_elections_desc:0 "要普选了！选翔日！选翔日！别选那个鹫间之屑金羽！"
 FAT_my_work_here_is_done:0 "首次选举"
 FAT_my_work_here_is_done_desc:0 "大选的时候到了，对我们而言真是个历史性的时刻。现在只需静待结果。"
 FAT_prosperity_f:0 "民生主义"
 FAT_prosperity_f_desc:0 "民生是第三条。鹫鹫平等，最低工资，所有鹫都能富足！"
 FAT_land_tax:0 "地租改革"
 FAT_land_tax_desc:0 "有钱的鹫收更多地租，防止拥有过多地，地价会便宜，我觉得还行"
 FAT_welfare_for_all:0 "全民福利"
 FAT_welfare_for_all_desc:0 "大家都有社会福利了"
 FAT_social_approach:0 "社会接触"
 FAT_social_approach_desc:0 "鼓励家庭观念，快回家造小狮鹫啊！"
 FAT_a_dream_realized:0 "终于实现的梦"
 FAT_a_dream_realized_desc:0 "共和梦，我的梦"
 FAT_new_military:0 "从军阀肆虐中恢复"
 FAT_new_military_desc:0 "为了实现我们的军事目标，我们必须进行更加紧迫的陆军学说与技术变革，以及从未有过的军事化动员。如果我们要光复狮鹫海姆，那么我们必须再次重建军工！"
 FAT_choose_doctrine:0 "选择我们的学说"
 FAT_choose_doctrine_desc:0 "我们的陆军参谋们在学说上意见不一，现在是时候选择我们该支持哪个了。"
 FAT_speak_herzlander:0 "教授狮鹫标准语"
 FAT_speak_herzlander_desc:0 "既然绝大多数官员都在说赫兹兰狮鹫标准语，那么就最好在全国所有学校推广这一语言，逐渐停止漫云语在政府中的使用，直到帝都的解放——届时漫云本地将有更高的自治权。"
 FAT_require_government_bilingualism:0 "强推国家官员双语化"
 FAT_require_government_bilingualism_desc:0 "很多官员甚至不懂漫云语，无法和国内过半狮鹫互相交流。为了纠正这一问题，需要强推国家官员、议员和公务员的双语化，没有例外。"
 FAT_reduce_banditry_tp:0 "逐渐移除§Y土匪肆虐§!的民族精神\n"
 FAT_reduce_banditry2_tp:0 "加速移除§Y土匪肆虐§!的民族精神\n"
 FAT_reduce_famine_tp:0 "逐渐移除§Y饥荒§!的民族精神\n"
 FAT_take_matters_into_our_own_hands:0 "亲爪掌控"
 FAT_take_matters_into_our_own_hands_desc:0 "共和国软弱无能。我们必须进行干预，使用紧急权力，将其从近年来席卷其间的官僚主义和动荡中解救出来。"
 FAT_state_industrial_plan:0 "干涉经济"
 FAT_state_industrial_plan_desc:0 "国家必须干涉经济并扩展工业中心。先前的政府过于虚弱，未能让北方工业化，还让北方陷入了混乱。"
 FAT_mass_mobilization:0 "军事动员"
 FAT_mass_mobilization_desc:0 "要反抗迟早北进的帝国就必须在各方面对国家进行军事化。堡垒修建、军工建设、战争宣传，这些都要同步实施以保护我国免受君主制威胁。"
 FAT_enforce_the_herzlander_dialect:0 "强行推广狮鹫标准语"
 FAT_enforce_the_herzlander_dialect_desc:0 "生活在北方的原住民，那些低级野蛮的漫云鹫死守着他们落后的传统和文化，必须进行开化，并入共和国。我们要强行推广我们的语言，这样他们就能理解我们的文化、接受我们的统治。"
 FAT_temporarily_suspend_parliament:0 "继续暂停国会"
 FAT_temporarily_suspend_parliament_desc:0 "宪政被中止了，但是国会依旧存在。其中有不少鹫甚至张口指责我们的戒严令。如果我们要削除政府的低效，那就要终止国会，亲爪掌控。"
 FAT_permanent_stability:0 "革命得以保障"
 FAT_permanent_stability_desc:0 "我们的国家撑过去了，它完成了工业化，没有了共党和土匪，在共和国的共同事业下团结。现在国内安定，可以去直面世界，展望伟大的未来了。"
 FAT_new_navy:0 "同鹿特德丹匹敌的海军"
 FAT_new_navy_desc:0 "自共和国诞生以来，我们爪下尚未控制过一艘舰艇。是时候去改变这一现状了。建立一支正规的海军能让我们拥有更大的统治北方海洋的可能。"
 FAT_battleship_focus:0 "萨克哈根-翎坛学说"
 FAT_battleship_focus_desc:0 "奥托·萨克哈根-翎坛同漫云王族有点关系。尽管他有王室血统，克梅斯凯依旧让他及其母亲活着，让他成为海军提督，以作为对君主主义者的让步。奥托是海军的强大拥护者，认为可以通过纯粹的数量，盔甲和口径挤压敌舰。"
 FAT_destroyer_focus:0 "哈森泰尔夫学说"
 FAT_destroyer_focus_desc:0 "赫尔曼·哈森泰尔夫是一位杰出的忠实共和国海军上将，在978年革命中担任海军军官，并在长征后升任海军上将。由于缺乏对战列舰和航母的接触，他已成为小型袭击舰队的专家和坚定支持者。他认为战列舰太慢了，无法进行快节奏的海战。"
 FAT_submarine_focus:0 "一击脱离战术"
 FAT_submarine_focus_desc:0 "科尼利乌斯·冥爪曾多次造访幻形灵之地，并坚信他们的海军战略重点在于所谓的“潜艇”。科尼利乌斯表示，使用这种船只，我们将能够轻而易举地突袭和伏击敌方舰队，并且之后绝不会被敌军所追踪到。"
 FAT_navy_investment:0 "扩大翼哈根港口"
 FAT_navy_investment_desc:0 "港口城市翼哈根是共和国最大城市之一，更不用说这里的码头与船坞在北方也属于前列。但问题是这里的设备都太过老旧了。如果我们投入一些资金并对齐国有化，我们能轻而易举地让它变成北方第一。"
 FAT_navy_doctrine:0 "完善我们的海军学说"
 FAT_navy_doctrine_desc:0 "我们的新提督们已经在争论中迷失了相当长的时间，无法决定如何进行海军专业化。现在是时候给他们一个明确的，指引我们前进的海军学说的方向。"
 FAT_new_battleships:0 "研发战列舰"
 FAT_new_battleships_desc:0 "战列舰毫无疑问将成为海战的统治者。我们很清楚，他们将决定所有的海战。因此，我们应该努力争取去建造一些，使用我们在翼哈根的新造船厂建造新的战舰。我们有两个有前途的项目可以进行探索，无畏级和Atreus级。"
 FAT_new_destroyers:0 "研发驱逐舰"
 FAT_new_destroyers_desc:0 "驱逐舰是世界上每支海军的骨干力量，而且这种状况不会很快改变。它们已有许多服役的类型，其中许多都比我们所能建造的更为先进。因此，我们应该在条件不太好的情况下购买其中一些，将它们拆开，从中学习一切，然后使用这些知识来建立我们自己的项目。"
 FAT_new_submarines:0 "实验性潜艇模型"
 FAT_new_submarines_desc:0 "“潜艇”是一种相对较新的舰船原型，它甚至可以在水下和鱼雷艇下航行而不会被认出！我们的海军部应研究诸如小马利亚等国的外国型号，并最终为我们自己建造一些潜艇。"
 FAT_more_navy_investment:0 "天际湾的第二港口"
 FAT_more_navy_investment_desc:0 "我们在天际湾的唯一港口就是翼哈根。如果此处被敌军或者自然灾害摧毁，我们就没有港口停船了。一个靠近弗羽西亚边界的港口将更好威慑帝国，也是翼哈根之南的一个全新港口。"
 FAT_perfect_the_saxhagen_plumenjar_doctrine:0 "完善萨克哈根-翎坛学说"
 FAT_perfect_the_saxhagen_plumenjar_doctrine_desc:0 "随着新战列舰设计的研究，我们海军部现在可以完善萨克哈根-翎坛的学说。由无畏舰和战列舰组成的海军将使弗羽西亚舰队和任何其他可能在海上对抗我们的敌鹫相形见绌。"
 FAT_perfect_the_hassentelf_doctrine:0 "完善哈森泰尔夫学说"
 FAT_perfect_the_hassentelf_doctrine_desc:0 "赫尔曼·哈森泰尔夫完善了他的驱逐舰和巡洋舰学说。它们已经在我们的造船厂和海军基地大量生产。随着时间的推移，我们的舰队将通过天际湾，以绝对的数量和火力击溃帝国的主力舰。"
 FAT_perfect_the_marines:0 "最后一步"
 FAT_perfect_the_marines_desc:0 "共和海军大改革的最后一步应该是正式成立共和海军陆战队，这样我们的军队就可以大胆地进入海洋，以海军方式入侵豪克兰，甚至在情况危急的时候，对西边的小马利亚造成威胁。"
 FAT_new_airforce:0 "修复我们的空军"
 FAT_new_airforce_desc:0 "狮鹫尼亚大陆上只有几个最强大的国家拥有空军，我们应该尽力加入其中。拥有一支高效率的大型空军来对抗天空并帮助我们向下方推进将极大地有助于我们的战争努力。"
 FAT_fighter_focus:0 "古斯塔夫的高空战斗机"
 FAT_fighter_focus_desc:0 "空战最重要的部分是控制天空，因此，我们应该集中精力制造能够使我们做到这一点的飞机。我们的飞机应该相对较小且敏捷，同时仍要致命。"
 FAT_bomber_focus:0 "瓦尔德玛的全天候轰炸机"
 FAT_bomber_focus_desc:0 "新时代空战的最大前提是摧毁我们想要的尽可能多的敌对工业和基础设施。我们应该集中精力制造能够携带尽可能多炸弹的飞机，同时让它们深入敌方领土。"
 FAT_get_air_doctrine:0 "完善我们的空军学说"
 FAT_get_air_doctrine_desc:0 "鉴于我国如此缺乏专业的飞行员，我们应该把注意力放到和其他国家的退伍老兵建立联系上面。如果我们向这些飞行员提供足够的资金，他们很可能会热切地与我们一同工作，我们就能让他们分享空军战术与战略上的经验。"
 FAT_new_bombers:0 "获取新型轰炸机蓝图"
 FAT_new_bombers_desc:0 "来自其他国家的外国飞行员有时带给他们除了知识以外的其他东西。如果我们将所有内容拼接在一起，则可能能够重新创建有效的蓝图。"
 FAT_new_fighters:0 "组建战斗机群"
 FAT_new_fighters_desc:0 "我们的新飞行员要求我们委托一套新的战斗机。经过几番会谈和后台交易，飞行员们帮助我们的科学家开发了新的战斗机模型供自己使用。"
 FAT_industry_for_air:0 "恢复我们的空军生产"
 FAT_industry_for_air_desc:0 "我们的空军基地和为军队生产飞机和其他装备的军事工厂已经破旧不堪。如果我们要真正建立一个现代的共和空军，我们必须恢复我们的航空工业。"
 FAT_hire_the_red_berets:0 "雇佣赤色贝雷帽"
 FAT_hire_the_red_berets_desc:0 "赤色贝雷帽，是革命期间一个独立的共和国特遣部队，也是迈耶撤退到豪克兰期间他唯一的劲敌。他们的领袖维尔玛·卡特曼以粉碎任何胆敢攻击共和国的迈耶部队而闻名——如果他们完全融入共和国，或许她的服务会更有用。"
 FAT_industrialist_support:0 "里夫斯塔尔家族投资"
 FAT_industrialist_support_desc:0 "尽管古斯塔夫·里夫斯塔尔本身就是一名极具天赋的战斗机飞行员，但他也属于漫云一个势力强大的家族，在共和国政府中有许多关系。幸运的是，里夫斯塔尔家族非常高兴我们能够支持古斯塔夫在航空领域的想法——现在，我们可以通过直接与他的家族结盟得到更多的好处。"
 FAT_expand_rivstal_doctrine:0 "扩展里夫斯塔尔学说"
 FAT_expand_rivstal_doctrine_desc:0 "就像从天空飞来的鹰，我们的战斗机将俯冲下来，以速度和精确摧毁任何敌军。然而，正如里夫斯塔尔指出的，我们也必须再进攻敌军时保护我们的飞机——特别是因为里夫斯塔尔家族的飞机并不便宜。"
 FAT_expand_deshrecht_doctrine:0 "扩展德施雷希特学说"
 FAT_expand_deshrecht_doctrine_desc:0 "“轰炸他们，让他们屈服！”这是瓦尔德马·德施雷希特的方针，这一方针在孱弱的共和国军队中极度缺乏。有时候，狮鹫只需要学会如何破坏一些东西，这是一个被许多鹫都悲伤地遗忘的原则。"
 FAT_glorious_fat_air_force:0 "飞得比迈耶更高"
 FAT_glorious_fat_air_force_desc:0 "迈耶也许偷走了我们的空军，但他肯定没有偷走我们的骄傲！随着我们新的空中之翼的展开，以及我们的研究的完结，我们终于可以满怀诚意地说，我们已经从漫云赶走了祸根，迈耶的背叛也终于得到了治愈。"
 FAT_grand_1:0 "瑰翼元帅的智慧"
 FAT_grand_1_desc:0 "我们需要为每次进攻与防守，每次前进与撤退做好规划。我们要让军队如发条一般，让所有的行动遵循时间与计划安排。"
 FAT_grand_2:0 "强化工兵队伍"
 FAT_grand_2_desc:0 "为了让我们的部队遵循我们精细的指令，我们需要其坚守阵地。因此我们要向军队中引入加固军队驻地的专业性部队。"
 FAT_grand_3:0 "改组总参谋部"
 FAT_grand_3_desc:0 "我们近期在军事方面上的改革主要涉及顶级的指挥官与部队，但是在总参谋部与那些次要的指挥官身上还没有什么变化。现在我们则要改变这一状况，确保所有鹫都能遵从我们的决战计划学说。"
 FAT_grand_4:0 "西卡梅翁防御战术"
 FAT_grand_4_desc:0 "分权化的西卡梅翁共和国抵抗了帝国数个世纪以来的攻击。当格罗弗一世在773年入侵时，该国团结一心抵抗了进攻。我们要从他们的历史中学习到这些策略，组建一支专注防御的陆军，让那些敢于入侵我们的家伙们陷入地狱！"
 FAT_superior_1:0 "克梅斯凯元帅的智慧"
 FAT_superior_1_desc:0 "既然可以用成百上千的炮弹弹壳淹没敌方，为什么还要浪费鹫民们的生命与指挥官的头脑呢？"
 FAT_superior_2:0 "组建宪兵"
 FAT_superior_2_desc:0 "我们的军队并不是最守纪律的那一批。这会让指挥官们在发动炮兵进攻时产生一些担忧，因为那些不服从的家伙们只会想着为自己争取荣誉。因此要设立宪兵队以确保士兵的纪律与服从。"
 FAT_superior_3:0 "专业化炮兵"
 FAT_superior_3_desc:0 "现在拥有了专注进攻的炮兵部队，我们就能更有效地让炮火掩护与部队的前进相互协调，进一步减少对友军的误伤和对敌方的精准打击。"
 FAT_superior_5:0 "发展火箭炮"
 FAT_superior_5_desc:0 "帝国和大陆上其他国家似乎对“Nebelwefer”和火箭炮有着特殊的嗜好。作为克梅斯凯炮兵专长的一种新形式，我们将接纳这项新科技，并立刻在工厂里开始生产。"
 FAT_superior_4:0 "火炮之力"
 FAT_superior_4_desc:0 "现在，借助我们高密度的炮火，我们能够利用所谓的“弹幕”战术，该战术可以用来在部队前进之前就将敌军从他们的藏身处吓退。"
 FAT_mass_1:0 "曜尾元帅的智慧"
 FAT_mass_1_desc:0 "生产成百上千的炮弹，与列出一个宏伟的作战计划听起来很不错，但是这也无比耗时耗力。作为替代方案，我们要征召所有适役的鹫民，给他一条枪，送他去前线。这样我们就不会再缺乏鹫力，几乎是坚不可摧的。"
 FAT_mass_2:0 "说服民兵加入"
 FAT_mass_2_desc:0 "还有许多或多或少忠于我们的地方民兵部队在国内四处游荡。如果我们能联系其领导者，以财富、特赦或者能够上场杀敌的诺言拉拢他们，或许就能让这些民兵部队加入军队，成为新建部队的关键部分。"
 FAT_mass_3:0 "大赦计划"
 FAT_mass_3_desc:0 "不光要赦免造反者的领袖，我们还要赦免所有造反者们。这会极大地扩充我们的部队规模。"
 FAT_mass_4:0 "牺牲即救赎"
 FAT_mass_4_desc:0 "特赦计划还能进一步扩展到任何的囚徒、战俘、国内那些危险的罪犯或者普通的盗贼。我们将给予他们一个机会，无论他们犯过什么罪，只要为我们作战，就能得以救赎。"
 FAT_an_academy_in_the_north:0 "失落之门军事学院"
 FAT_an_academy_in_the_north_desc:0 "漫云有很多军校，但是北方却缺乏这样教授作战策略的学校。为了纠正这一状况，[Root.GetName]创立了“失落之门军校”，将向北方的将领与研究者们提供训练作战策略与战术的机会。"
 FAT_marshal_rifle:0 "重夺枪支库存"
 FAT_marshal_rifle_desc:0 "如果我们国内有什么很充足的话，绝对是枪了。从最近所有的冲突，到军事化的加强，找到一堆无鹫把守的枪支已经不是那么困难了。通过获取对这些囤积枪支的控制权，我们可以用它们来武装并扩展军队。"
 FAT_marshal_rifle_quality:0 "注重质量"
 FAT_marshal_rifle_quality_desc:0 "收集完这么多的枪支之后，士兵们意识到，如果枪支本身是落后的、缺损的，那么它们再多都没用。相反，我们将利用我们的专业知识来制造更好，更高质量的武器。"
 FAT_marshal_rifle_quantity:0 "全员军工生产"
 FAT_marshal_rifle_quantity_desc:0 "反抗邪恶用的就是枪。一支不够那就两支。"
 FAT_arty:0 "现代化火炮"
 FAT_arty_desc:0 "现在我们的士兵们已经装备了足够的步枪，该把目光转向大口径火炮了。结合我们在改造步枪上已经获得的经验，我们也能极大改进火炮的设计。"
 FAT_sup:0 "重组支援队"
 FAT_sup_desc:0 "前线部队的确是最主要的战斗英雄，但是我们也不能忘记支援连的存在。他们确保军中所有鹫都能有足够的弹药与补给。所以我们要重组支援连，让他们更有效率。"
 FAT_magic_equip:0 "水晶应用"
 FAT_magic_equip_desc:0 "通过魔法水晶的应用，我们能制造一种全新的枪械，它发射的是魔法能量而非子弹。这样的枪械可能给战争带来极大的革新。我们的土地埋藏着无数这样的水晶，最好不要浪费了。"
 FAT_radar:0 "小马利亚雷达科技"
 FAT_radar_desc:0 "小马利亚的科学家研发了雷达科技，它可以提前预知敌军的方位。随着我们的工业机构开始利用魔法水晶与小马利亚工程技术进行生产，或许我们应当进一步学习他们的战术，发展雷达科技。"
 FAT_winter_training:0 "忍受北方之寒"
 FAT_winter_training_desc:0 "漫云地区的冬天相当严酷，尽管我们在这里已经30年了，许多部队还是没有适应好。所以我们应该开始真正的冬训，以此来防御南方毫无准备的帝国势力。就像那时的旧漫云公国防御我们进攻那样。"
 FAT_mountain_training:0 "跨越北方峰峦"
 FAT_mountain_training_desc:0 "应当从漫云本土狮鹫那里学习山地作战方法，并以此在漫云山、北施塔莓与白尾山地训练我们的军队。为了打败帝国，我们需要学习在这些战略位置处进行攻防。"
 FAT_heavy_tanks:0 "重型坦克"
 FAT_heavy_tanks_desc:0 "既然我们已经开始进行坦克研究，是时候研究更重型的坦克设计了，这将使我们真正挑战帝国在坦克生产上的统治地位及其激烈的机动作战学说。"
 FAT_motorized_equip:0 "军队机械化"
 FAT_motorized_equip_desc:0 "卡车是用于运送部队和物资的极其宝贵和有效的工具，但很明显，卡车很容易遭受任何形式的火力攻击。工程师们建议我们改用装甲运输车，这样也可以将我们的部队运送到更靠近前线的地方。"
 FAT_tanks:0 "装甲先锋"
 FAT_tanks_desc:0 "坦克已经成为现代战争中最重要和最强大的武器之一。和我们一样，我们的许多邻国在最长的时间里一直忽略并忽略了这一事实。是时候结束我国没有坦克的历史了！我们将尽快开始研究和生产这种新型车辆！"
 FAT_pure_infantry_tactics:0 "纯步兵战术"
 FAT_pure_infantry_tactics_desc:0 "支援装备和炮火掩护都是多余的。大家都知道最好的策略就是不停地向前线送兵，直到他们投降！"
 FAT_republican_volunteer_corps:0 "共和国志愿军"
 FAT_republican_volunteer_corps_desc:0 "世界上还有其他国家愿意加入我们的共和革命。如果某个君主国爆发革命，我们要尽力帮助他们。"
 FAT_Republican_Volunteer_Corps_idea:0 "共和国志愿军"
 FAT_propaganda_on_every_corner:0 "大规模战争宣传"
 FAT_propaganda_on_every_corner_desc:0 "国内还有很多狮鹫希望我国烂在北边，败给侵略。要劝劝他们。"
 FAT_declare_national_emergency:0 "宣布进入国家紧急状态"
 FAT_declare_national_emergency_desc:0 "共和国现在的状态太不稳定了。我们要实施紧急措施，让我们混乱的国家能在帝国威胁敲门前生存。"
 FAT_the_iron_marshal:0 "铁爪元帅"
 FAT_the_iron_marshal_desc:0 "伟大的总统元帅亚历山大·克梅斯凯先前宣布实施戒严以稳定我们垂死的国家，并表示已经放弃了他反攻赫兹兰的想法。现在我国已经稳定，可以专注于社会改革，建设一个北方自由与独立的秩序堡垒。不过，第一件事是处理一些“谐律”叛徒。"
 FAT_purge_the_socialists:0 "清党"
 FAT_purge_the_socialists_desc:0 "社会主义者芒刺在背许久了。他们总是自称支持民主，但是在政府实现民主时却百般阻挠。他们不配叫自己共和党鹫。"
 FAT_crackdown_on_the_unions:0 "取缔工会"
 FAT_crackdown_on_the_unions_desc:0 "工会一直支持社会主义和天际纳维亚理念。是时候一劳永逸地摧毁他们和他们所支持的邪恶理念了。工作条件依旧会改善，但是不会在社会主义者爪中。"
 FAT_anti_skynavian_propaganda:0 "揭露赤匪之罪"
 FAT_anti_skynavian_propaganda_desc:0 "很多社会主义者忘记了正是天际纳维亚自己在986年离开了我们伟大的共和国，让我国陷入土匪祸乱之中。或许他们需要一点提醒？"
 FAT_no_more_skynavian_sympathizers:0 "三色而非镰锤"
 FAT_no_more_skynavian_sympathizers_desc:0 "让我们向北进发，摧毁燕祸的叛国试验。我们将毫不留情地碾碎天际纳维亚的暴徒，以及其腐朽的意识形态。"
 FAT_pacify_the_cities:0 "城市清场"
 FAT_pacify_the_cities_desc:0 "城市中依旧有大量反对军政的游行示威，无视其为我国带来稳定秩序的事实。这些示威应被清场，并重新教导参与者们何为共和国价值观。"
 FAT_raid_radical_organizations:0 "围剿行动"
 FAT_raid_radical_organizations_desc:0 "法西斯主义者、革命者和社会主义者的巢穴全国都是。要对这些藏身处实施围剿，销毁任何武器与土制炸弹，或者其他的用以颠覆共和国的物品。"
 FAT_continue_promising_democracy:0 "继续承诺民主"
 FAT_continue_promising_democracy_desc:0 "民权与民主依旧是我们三民主义的一部分。在这个混乱的时代，我们不能让鹫民们觉得这些原则已经远去。要重燃共和国的精神，否则我们的政府就无以为继。"
 FAT_a_loyal_cabinet:0 "橡皮图章"
 FAT_a_loyal_cabinet_desc:0 "鹫民们需要一个国会，这样他们就能民主地投票啦！当然，国内只会有一个合法的党派，所以他们也就不能民主地投票。不过至少在我们真正恢复国会之前，他们对于自由民主有了信念。"
 FAT_police_on_the_streets:0 "警察上街"
 FAT_police_on_the_streets_desc:0 "如果我们在街道上安排更多警力，那些家伙就不会受鼓动拿起武器反对共和国，反对我们的合法政府了。问题就是这么简单。"
 FAT_end_the_winghagen_republic:0 "清剿反政府武装"
 FAT_end_the_winghagen_republic_desc:0 "尽管我们尽力在城中平乱，那个疯子科尼利乌斯·温克和几乎和他一样疯的支持者依旧在武装反对政府。该让我们的政府军前往荒芜之峰，消灭他那小小的革命了。"
 FAT_reverse_986:0 "为986年之背叛复仇"
 FAT_reverse_986_desc:0 "天际纳维亚的渣滓在986年抛弃了我们，这才让克梅斯凯中止了宪政以确保共和国的原则与民主。他们在北边建立自己的“乌托邦”时，我们却陷入了动荡不安。是时候提醒他们共和国不会原谅他们的恶行了。"
 FAT_the_marshals_last_days:0 "元帅的最后时刻"
 FAT_the_marshals_last_days_desc:0 "意想不到的事情发生了。我们的总统元帅在击败天际纳维亚后得了重病，在临终时刻，他召来了他最亲近的顾问，他的儿子，以及继承者小亚历山大·克梅斯凯，向他说出了临终之语。共和国的命运悬于一线。"
 FAT_the_marshal_knows_best:0 "继续进行独裁"
 FAT_the_marshal_knows_best_desc:0 "小亚历山大·克梅斯凯决定继续在这危险暗藏的时候实施戒严，理由是存在持续性的共和国反对者与君主制的骚扰。看起来共和国的未来并不包括民主，至少是在他的执政期间。"
 FAT_an_end_to_vedina:0 "终结韦迪纳"
 FAT_an_end_to_vedina_desc:0 "韦迪纳必须被共和国武力统一。它作为大陆上最后的谐律国家之一的状态并不能为他们残暴的君主制开脱。"
 FAT_i_dislike_sunstriker:0 "剿除匪帮"
 FAT_i_dislike_sunstriker_desc:0 "白尾的领头鹫必须要伏诛。无论他们自称是共产主义，君主国还是共和国，他们都拒绝加入我国，必须击败。"
 FAT_resist_the_imperialists:0 "反抗帝国主义者"
 FAT_resist_the_imperialists_desc:0 "我们最大和最紧迫的问题是驱逐帝国的帝国主义者，以免其损害共和国之梦与国民共和党。只要漫云城还飘扬着三色旗，我们就要挺立，反抗君主制的威胁。"
 FAT_suppress_the_natives:0 "压制漫云本土狮鹫"
 FAT_suppress_the_natives_desc:0 "托比亚斯·谢芬霍夫领导的漫云狮鹫权利组织不仅违宪而且极其危险，威胁着我们共和国与共和党统治的心脏。我们要旗帜鲜明地反对一小股本土狮鹫动乱，全面深化对农村秩序的恢复。"
 FAT_everything_for_the_defense_of_the_republic:0 "一切为了防卫！"
 FAT_everything_for_the_defense_of_the_republic_desc:0 "从军队到政府，我们的整个国家都是为防御帝国鹫而建立。防御才是我国最好的选项，而不是鲁莽的理想主义。我们要在北方的风暴中坚守，勇敢抗击帝国威胁！"
 FAT_military_supremacy:0 "先军"
 FAT_military_supremacy_desc:0 "军队已经知晓何为利国利民之举，我们要强化他们的权力与影响，毕竟他们才是共和革命真正的防御者，而不是曾经统治国家的两面派政治家们。我们要做为专业、荣耀与责任的捍卫者而挺立，我们的军队将成为共和国王冠上的珍宝。让我们用枪保卫维宁血统。"
 FAT_a_hereditary_dictatorship:0 "维宁革命血统"
 FAT_a_hereditary_dictatorship_desc:0 "到目前为止，维宁革命血统向共和国指引了民主、民权与民生。我国继承者的决定要早早进行，正如克梅斯凯家族那永恒的智慧一样，是我国作为一个合法而强大政权的关键。应将我们党和革命的血脉——维宁革命血统永远延续下去，并坚决保持其绝对的纯洁性。"
 FAT_continue_national_emergency:0 "找寻合适的顾问"
 FAT_continue_national_emergency_desc:0 "我们要寻找新的顾问来填补我们大清洗造成的空缺。维克托·金羽，海因里希的兄弟，一个富有的律师与资本家，还有一位能安抚我们易怒平民的新宣传部长都很合适，也有利于共和国的事业。"
 FAT_keep_them_happy:0 "军民团结一家亲"
 FAT_keep_them_happy_desc:0 "就连老元帅也认识到，是军队成就了今天的共和国，而非我们那些意志薄弱的文官和漫云的政客们。我们必须回到那个在军民结合的政权下巩固政治控制的时代。普通公民不再受那些从没有为梦想奋斗过的腐败政客或贵族的控制。"
 FAT_reshape_the_dream:0 "扩展986年法案适用范围"
 FAT_reshape_the_dream_desc:0 "986年的《共和国动员戡乱法案》应该被修订、扩展以适应目前的情况。这样我们就能确保击败国内外的颠覆者们。也不再需要虚假的民主了。"
 FAT_perpetual_political_tutelage:0 "永久性训政"
 FAT_perpetual_political_tutelage_desc:0 "在克梅斯凯提出的“革命的三个阶段”中，他描绘了狮鹫尼亚共和国革命的不同时期。尽管第一时期，军政时期已经结束了，但训政时期将继续下去。这期间由一个实用主义的临时政府领导狮鹫尼亚的鹫民。我们还没有到理想主义的宪政的时期。"
 FAT_prosperity_under_kemerskai:0 "保障民生"
 FAT_prosperity_under_kemerskai_desc:0 "在我们的主义与政府中引入了更多独裁元素的同时，民生依旧不能被忽略。无论政治状态与国际环境如何，鹫民们都应享有福利、和平与富足。"
 FAT_nationalism_prosperity_security:0 "没有民主的共和国"
 FAT_nationalism_prosperity_security_desc:0 "我们以武力与权威恢复了政府中的三民主义，现在我们要向前展望，应对帝国与整个狮鹫尼亚上君主制的威胁。伟大的克梅斯凯家族将永远指引我们反抗狮鹫尼亚的暴行！"
 FAT_restore_democracy:0 "信守诺言"
 FAT_restore_democracy_desc:0 "民权、民主和民生是共和国的基石。我们不应该采取任何其他方式，更不能再次走上独裁与戒严的老路。"
 FAT_restore_the_unions:0 "恢复工会"
 FAT_restore_the_unions_desc:0 "工会是民主和繁荣社会的基石，只要它们不受社会主义影响即可。应当允许工鹫对政府和公司的政策发表意见，以建立自己更加美好的世界，而无需政府或外界力量的必要干预。"
 FAT_continue_anti_communism:0 "继续反共政策"
 FAT_continue_anti_communism_desc:0 "如果克梅斯凯希望我们从他无数次的清洗中学到一件事的话，那就是——社会主义者是极其危险的，是任何真正民主的威胁。虽然老元帅在某些方面做得过头了，但是考虑到社会主义者对三民主义的反对，在严禁他们参与我们的自由主义民主这一点上是绝对正确的。"
 FAT_rebuild_skynavia:0 "重建天际纳维亚"
 FAT_rebuild_skynavia_desc:0 "在克梅斯凯的战争破坏天际纳维亚的城市和乡镇之后，当地的工农业生产就陷入混乱。冰雹之森应当如其他地区一样军事化，新天际纳维亚城的工厂也要进行维修，还要修建基础设施以方便共和国与天际纳维亚的交流。"
 FAT_a_true_parliament:0 "重开国会"
 FAT_a_true_parliament_desc:0 "国会在戒严期间被中止，训政期间则开设了一个橡皮图章国会。现在我们要继续前进，开启议会民主制，以及重启宪政。再也不会背叛民主与民权的原则了！"
 FAT_a_free_press:0 "恢复新闻自由"
 FAT_a_free_press_desc:0 "新闻自由也要被恢复，共和国内所有公民都能用自己的声音表达他们对政府、部长与政策的态度，哪怕是负面的。我们将不再压制公民们的异见了。"
 FAT_restore_opposition_parties:0 "恢复反对党"
 FAT_restore_opposition_parties_desc:0 "国内还有许多国民共和党没有代表的政治派系，在老元帅的清洗后这一点更加明显。自由派、社民派、甚至还有些保守派们连一个代表他们观点的党派都没有，这怎么能行？"
 FAT_fresh_elections:0 "全新的选举"
 FAT_fresh_elections_desc:0 "克梅斯凯的时代即将结束，共和国将会新的民主纪元。我们将举行全新的选举，不同的党派将可以自由竞争。在三民主义真正恢复的时候，我们也将从独裁的阴影中解脱。"
 FAT_the_dream_is_not_dead:0 "同理想主义者的盟约"
 FAT_the_dream_is_not_dead_desc:0 "施纳贝尔·翔日这些年一直在为克梅斯凯工作，哪怕在克梅斯凯被指控违背了他所守护的原则时依旧在支持着国民共和党的政府。尽管克梅斯凯和翔日之间在荒芜之峰围城战后有了点嫌隙，我们还是要为他平反，再度邀请这位共和国忠诚的士兵回到政府中去。"
 FAT_rally_kingfeathers_band:0 "与金羽会面"
 FAT_rally_kingfeathers_band_desc:0 "尽管海因里希·金羽现在依旧在司法委员会的调查之中，他也是老克梅斯凯政府的要员。我们要支持他团体的举动，把他们邀入我们的伟大同盟中去。"
 FAT_investigate_the_loyalists:0 "调查“忠诚派”"
 FAT_investigate_the_loyalists_desc:0 "瑰翼。曜尾。白羽。这些将军们在镇压抵抗与天际纳维亚战争期间犯下了严重的罪行，哪怕在那时是合乎情理的。我们要对他们可能的违法行为表明立场，像真正的民主国家那样审判他们。"
 FAT_a_true_tricolor_over_griffenheim:0 "狮鹫海姆真正的三色旗"
 FAT_erode_the_personality_cult:0 "限制行政权力"
 FAT_the_republican_dream:0 "铭记元帅"
 FAT_the_republican_dream_desc:0 "亚历山大·克梅斯凯虽然有缺陷，但他给共和国带来了希望、民生和民权。我们永远不会忘记那个带领我们北上的勇士，他把我们的梦想从帝国的魔爪下拯救了出来。我们永远不会忘记您，共和国的父亲。"
 FAT_new_dawn_over_cloudbury:0 "巩固统社革的统治"
 FAT_new_dawn_over_cloudbury_desc:0 "天际纳维亚社会主义共和国的势力已经控制了狮鹫尼亚共和国。他们解放了我们的鹫民、农户、无产者们。我们要巩固我们的新政权，爪牵爪同天际纳维亚鹫一起建设更伟大的漫云。"
 FAT_dealing_with_the_republicans:0 "共和党鹫的命运"
 FAT_dealing_with_the_republicans_desc:0 "出于某种原因，共和派、自由派、保守派们对我们的社会主义政府很是不满。必须在事情失控之前处理他们的抵抗。"
 FAT_communalist_policies:0 "与共和主义者和解"
 FAT_communalist_policies_desc:0 "共和党的狮鹫们一直都很接纳社会主义理想——在宪政终止之前，他们甚至还和镰爪的统社革共同执政。在我们给予特赦、归还他们的政治权力之后，绝大多数的共和党鹫都能适合在社会主义政府里工作。"
 FAT_internationalist_policies:0 "对抗叛贼"
 FAT_internationalist_policies_desc:0 "共和党鹫的抵抗行动就是想破坏我们所建设好的一切！无产者在政治和工业上的统治令他们厌恶，因为他们就是邪恶的寡头，只是想着回到他们爪中还有权力的时刻。我们要粉碎他们的抵抗，让鹫民免于任何共和党鹫的压迫。"
 FAT_reconstruction:0 "全新的身份认同"
 FAT_reconstruction_desc:0 "从现在开始，漫云社会主义共和国的鹫民们将不再认同那个旧的共和国。他们将与天际纳维亚的同志们一起自由而平等地站立，漫云的本土狮鹫们也将给予应有的权利。"
 FAT_collectivization:0 "北方农场集体化"
 FAT_collectivization_desc:0 "尽管旧共和国政府声称是一个支持无产者反对寡头与贵族的政府，但是他们没能做到，放任北方的军阀控制大量的农田。我们掌控这块土地之后应该重新分配土地并集体化。"
 FAT_workers_councils:0 "支持工鹫委员会"
 FAT_workers_councils_desc:0 "劳工们应该组织起来，共同应对资本主义和反动派观念的侵蚀。将组建工鹫委员会以允许无产者们直接参与政治。"
 FAT_go_with_sparrowsbane:0 "燕祸主席"
 FAT_go_with_sparrowsbane_desc:0 "默·燕祸是个坚定的国际派与天际纳维亚效忠者，是反共和国起义的主心骨。他专注于集体化、社会主义化和无产阶级的利益，但是很多鹫因他的独裁爪段和随意清洗异见者而感到反感。"
 FAT_go_with_astler:0 "艾斯特勒主席"
 FAT_go_with_astler_desc:0 "他是一个民主社会主义者，曾经也是共和国的坚定拥护者，很多鹫相信艾斯特勒主席上任将缓解共和党鹫的抵抗，以及增进同旧共和国狮鹫们的合作。但是也有不少鹫声称艾斯特勒不是一个真正的社会主义者，他将会容忍漫云残余的资本主义和反动势力。"
 FAT_revise_the_principles:0 "修订三民主义"
 FAT_revise_the_principles_desc:0 "共和国的三民主义包括民权、民主、民生，但是克梅斯凯从未践行这些原则。我们要以社会主义之光重塑更伟大的三民主义！"
 FAT_socialist_prosperity:0 "社会主义的民生"
 FAT_socialist_prosperity_desc:0 "三民主义第一条是民生。很不幸的是，共和国没有能给予鹫民们真正的民生改善，只是做做样子给点福利。我们不会给工鹫们无用的福利与社会公益，我们要赐予他们更伟大的事物——生产资料本身！"
 FAT_socialist_liberty:0 "社会主义的民权"
 FAT_socialist_liberty_desc:0 "三民主义第二条是民权。根据共和国的规定，它的民众拥有“言论自由”与“结社自由”的权利，但是政府还是对共产主义组织进行了大规模的镇压。我们则将给予共和国工鹫们基于社会主义的真正民权！"
 FAT_socialist_democracy:0 "社会主义的民主"
 FAT_socialist_democracy_desc:0 "三民主义第三条是民主。这可能是共和国最不切实际的宣称了，他们从未有过真正的民主。克梅斯凯在长征后不久就终止了宪政，废除了总统的自由选举。他们的政府从未给予工鹫任何民主，也禁止工厂的自主管理，这两者是一个真正属于鹫民的社会所必须的。"
 FAT_state_military_industry:0 "鼓励军工"
 FAT_state_military_industry_desc:0 "如果我们要协助天际纳维亚的解放者们继续向帝国发起伟大爱国战争，我们就要强化军事力量并生产更多武器。帝国就在我们的边境，当然还有弗羽西亚，他们都在等着摧毁我们的社会主义梦，我们要反抗他们！"
 FAT_expand_industrial_unions:0 "扩大集体化工业"
 FAT_expand_industrial_unions_desc:0 "工鹫有权享有劳动成果！我们必须扩大和建立更多的工业集体，使工鹫能够在我们公正的社会主义社会中真正感到平等和自由。"
 FAT_cloudbury_reborn:0 "在天际之翼下重生"
 FAT_cloudbury_reborn_desc:0 "克梅斯凯和旧共和国的失败将不再困扰我们。漫云已经建立了社会主义，老的三民主义在社会主义之光下得以重生。漫云的无产者们已经团结一心，反抗各种形式的资本主义与反动思想！为漫云社会主义共和国与天际纳维亚三呼万岁！"
 FAT_president_kingfeather:0 "金羽总统"
 FAT_president_kingfeather_desc:0 "务实主义的保守派候选者金羽赢得了选举。在他建立一个自由市场与自由社会的同时，他的政府将是反抗极端主义、社会主义和君主制的坚定堡垒。"
 kingfeather_desc:0 "如果你问一位共和国公民，共和国第二把手的海因里希·金羽在过去4年里做了什么，他们会无话可言，尽管金羽的议程安排很满。\n\n海因里希·金羽于949年出生于耶鲁的格林盖特。年轻的金羽受过法律和经济方面的训练，看起来根本不像是革命领袖的合适鹫选，但他进步的法律先例使他成为共和主义最坚定的捍卫者之一。他首先是律师和政治家，其次才是革命者，金羽在国际层面上主张共和主义，尝试去达成大量与小马利亚和河间同盟的协议——但两者都很大程度上否认了他的进步。他在克梅斯凯任期内的法律和政治行动缓解了公众的不稳定和对共和党鹫的愤怒，但却无法在军事上拯救革命。\n\n他没有参加长征，而是逃到了天落，后来又逃到了新独立的城市菲兹拉，最后在漫云的控制权得到巩固后，在欢呼的鹫群中抵达共和国。虽然他在长征中没能支持共和党是许多鹫不赞成的一点，但他继续在漫云的新位置上代表共和国鹫民。\n\n1003年，金羽成为克梅斯凯的二把手，他专注于国内事务，取代了野心勃勃的军事家翔日。自那以后，金羽的工作基本上都是在幕后进行的。面对不服管教的军队和农村的土匪，金羽开始制定一项和翔日那用暴力解决异见者之想法相反的政策。他与数百名漫云本土狮鹫领袖会面，帮助修复了瑰翼最初的骚动之后农村的完全混乱，这些行动使他成为全国范围内最支持代议制的领袖之一。实用主义是金羽的主要目标，但是随着国家政治和种族的两极分化，这个目标变得越来越艰难。\n\n他会成功吗？或者他会像他的敌鹫所说的那样，死的时候爪里拿着所有的牌，却没有勇气使用它们？"
 FAT_safeguarding_the_constitution:0 "我们的使命"
 FAT_safeguarding_the_constitution_desc:0 "宪政目前还有很多威胁——社会主义者、君主派、独裁者。我们要时刻警戒，以一切代价维护我们的共和国和她的原则。"
 FAT_the_free_market:0 "自由市场经济"
 FAT_the_free_market_desc:0 "社民主义的经济理论将会不可避免地失败，共和国将再次陷入经济萧条。为了避免这一点，我们要清除这些政策，开始资本主义经济的建设。"
 FAT_free_trade_focus:0 "开放贸易"
 FAT_free_trade_focus_desc:0 "国家之间的自由贸易是资本主义最主要的原则之一。我们要允许贸易流在国内外不受阻拦地流动，并利用我们丰富的资源与其他国家交易。"
 FAT_support_small_business:0 "支援小型企业"
 FAT_support_small_business_desc:0 "与其支持大型垄断企业，我们要转而支持赫兹兰的新企业们，他们在帝国统治期间受寡头政策受到了很大的压制。一定要让鹫民们能够从零开始创业，依靠高明的创新精神与资本主义制度从奴隶变成国王。"
 FAT_privatize_resource_industries:0 "矿业开采私有化"
 FAT_privatize_resource_industries_desc:0 "无论是在漫云还是在狮鹫海姆，矿业开采一直都是被联邦政府所控制的。我们要卖出这些产业，把他们交给自主管理的企业，这样他们能更有效率地开采。"
 FAT_ward_off_extremism:0 "防范极端主义"
 FAT_ward_off_extremism_desc:0 "我们党内的社会主义势力有点太强势了，是时候解决这种新运动，为了维护党派的稳定与团结把社会主义者们开除了。"
 FAT_crush_fascist_organizations:0 "摧毁法西斯组织"
 FAT_crush_fascist_organizations_desc:0 "狮鹫尼亚民族革命阵线和其他被取缔的组织势力活动有所增长，尤其是在克梅斯凯为了保全军队而向将领妥协之后更是如此。这些组织不仅过于军国主义，而且违宪。他们和社会主义者还不一样，我们甚至不能允许他们还占据一席之地，哪怕是在反对党里。"
 FAT_centralize_the_republic:0 "团结计划"
 FAT_centralize_the_republic_desc:0 "我们不能利用我们全新的地位来割裂我们与存在数个世纪之久帝国的联系，这只会促使一次反对我们统治的反革命政变。相反，我们要强化我们之间的纽带——我们都是要建立一个更伟大的狮鹫尼亚。在极端派要求血债血偿，叛徒们嘲笑我们的努力之时，只有团结才能促成共和国内的和平。"
 FAT_reconcile_with_the_church:0 "与神官领协商"
 FAT_reconcile_with_the_church_desc:0 "神官厄洛斯七世已经死去，从最低的祭司到最高的主教们，这些虔诚的狮鹫们都认为我们的新政权是渎神、毫无信仰的。在金羽意识到设置一名傀儡神官无济于事后，他宣布政府将尽一切努力寻求与神官与神明自身的和解。"
 FAT_necessary_bargaining:0 "给予赦免"
 FAT_necessary_bargaining_desc:0 "我们必须尊重帝国政治家在革命战争中支持敌鹫的罪行。现在，最重要的是将过去摆在一边。他们了解这些土地，而我们却不了解，因此，务实的政策就是让他们成为这些共和国新土地的管理者。"
 FAT_Cooperation_With_Imperials_idea:0 "共赴胜利"
 FAT_together_for_victory:0 "无空复仇"
 FAT_together_for_victory_desc:0 "那些叫嚷着血债血偿的极端主义者必须住口，和平与理性将在共和国内发扬！不过我们也不会处决或关押这些叛徒们，他们将被再教育，在未来的某一天，我们和他们将共同建设更伟大的狮鹫尼亚。"
 FAT_in_the_defense_of_griffonia:0 "守卫狮鹫尼亚"
 FAT_in_the_defense_of_griffonia_desc:0 "必须要从君主制的威胁中守卫狮鹫尼亚！但是我们也不能莽撞地进攻那些残余的君主国，尤其是我们刚击败了帝国。我们总有一天会解决他们，但是我们必须一直注重国内社会的发展。"
 FAT_president_sunglider:0 "翔日总统"
 FAT_president_sunglider_desc:0 "施纳贝尔·翔日在选举中胜利了，毫无疑问克梅斯凯的遗产将继续被保留。民权、民主和民生将指引他一步步地建立一个泛狮鹫尼亚而屹立不倒的国家。"
 FAT_nationalize_imperial_monopolies:0 "帝国寡头国有化"
 FAT_nationalize_imperial_monopolies_desc:0 "帝国的寡头们爪中拥有大量的财富、上千亩的农田与数以百计的工厂。我们要将它们归于国家管控，这样我们就能更有效率地管理它们。"
 FAT_harmony_with_republican_characteristics:0 "共和特色的谐律主义"
 FAT_harmony_with_republican_characteristics_desc:0 "现代谐律主义理念基于小马利亚的独裁君主制。尽管小马利亚保障了马民的权利，但是他们没有一个真正民主的国家政府系统，只有地方统治者参与选举。国民共和党的三民主义是与“现代谐律”不相容的，所以我们将建立一个全新、更伟大的谐律系统，一个有民权、民主、民生特色的谐律系统。"
 FAT_welfare_for_the_griffons:0 "狮鹫们的福利"
 FAT_welfare_for_the_griffons_desc:0 "福利、民权与谐律将被赋予大陆上所有的狮鹫们！所有狮鹫们都能享有民生，所有鹫都有房子住，都有食物吃，都有钱用！"
 FAT_united_under_democracy:0 "统一共和党"
 FAT_united_under_democracy_desc:0 "共产主义者、民主社会主义者、自由主义者和保守主义者在国民共和党内曾团结一致。随着赫兹兰的统一，我们的党派面临分裂。我们中间派要在我们的政治联盟陷入混乱前再次统一分裂的政党系统。"
 FAT_militarized_harmony:0 "传播革命"
 FAT_militarized_harmony_desc:0 "有太多的谐律国家还在安静地坐着，试图在国内和平地改革，但是现实却击碎了他们的梦想。法西斯和独裁者们前进的部队或许能踩碎多数谐律政权，但是不会踩碎我们的！所有狮鹫都要拿起枪守卫民主，并且冲进反抗我们统治的独裁者的土地！"
 FAT_sungliders_new_deal:0 "翔日的新政"
 FAT_sungliders_new_deal_desc:0 "翔日已经提出了一项创新性的计划以创造劳动岗位并改善基建。将设立很多政府项目以雇佣狮鹫们，它们将创建公共服务与基础设施。这将同时改善我们的民用工业与失业率。这是个双赢！"
 FAT_formalize_the_welfare_state:0 "福利国家"
 FAT_formalize_the_welfare_state_desc:0 "我们的经济是狮鹫尼亚从未见证过的——一个社会民主的资本主义经济，它鼓励了自由市场竞争，同时也保护狮鹫免受不受规制的资本主义所带来的最为糟糕的不平等现象威胁。毫无疑问这全新的社会工程与政府干预将带来狮鹫尼亚的新春。"
 FAT_legalize_extremism:0 "全民言论自由"
 FAT_legalize_extremism_desc:0 "法西斯主义者和激进社会主义者经常被我们的共和国所排挤，像是狮鹫尼亚民族革命阵线和统一社会主义革命阵线这样的党派甚至被我们取缔过！我们要纠正这个克梅斯凯的错误，将言论自由完全地合法化，并使所有政治组织，甚至是反民主组织的言论自由和结社自由也充分合法化。"
 FAT_revitalize_the_arms_industry:0 "复苏军工工业"
 FAT_revitalize_the_arms_industry_desc:0 "我们的抗争还没有完全结束，还有不少狮鹫国家处于君主制的控制之下。工业必须与时俱进并开始军事动员以确保我们能在抵抗自由的威胁中胜利。所有的组织都会允许加入我们的民主——当然，需要提前证明它们不支持君主制。"
 FAT_reinstate_war_propaganda:0 "继续进行战争宣传"
 FAT_reinstate_war_propaganda_desc:0 "在战胜帝国之后，战争宣传的海报就从街道上被撤除了。但是我看了看，狮鹫尼亚还是有遵循君主制的国家。把这些海报再粘起来，永远警惕君主制的威胁！"
 FAT_totaler_krieg:0 "持续性战时经济"
 FAT_totaler_krieg_desc:0 "我们必须实施全面战争法案。让所有的狮鹫入伍直到最后一位，让所有的工鹫为谐律与共和国生产武器直到最后一刻，在整个狮鹫尼亚都被我们谐律共和的民主制度所照耀之前，我们不会休息！"
 FAT_once_more_into_the_breach:0 "准备向南进发"
 FAT_once_more_into_the_breach_desc:0 "狮鹫尼亚的奴役终于要面临终结了！我们要为全体鹫民带来一个更好的世界！以北风神之名，以民权之名，以民主之名，我们将拼死在这项庇护整个狮鹫尼亚的神圣任务中获得伟大的胜利！"
 FAT_once_more_into_the_breach_2:0 "游戏的终点"
 FAT_once_more_into_the_breach_2_desc:0 "狮鹫尼亚的奴役终于要面临终结了！我们要为全体鹫民带来一个更好的世界！以北风神之名，以民权之名，以民主之名，我们将拼死在这项庇护整个狮鹫尼亚的神圣任务中获得伟大的胜利！"
 FAT_president_astler:0 "艾斯特勒总统"
 FAT_president_astler_desc:0 "事件转折如此之快，年轻的社会主义者里卡德·艾斯特勒在首次共和国选举中获胜。他的亲劳工政策将把共和国引入全新的繁荣时代。毫无疑问的是，他将在接下来的数年中保护共和国自由，不受侵犯。"
 FAT_rebuild_the_heartlands:0 "治愈二次革命的伤痕"
 FAT_rebuild_the_heartlands_desc:0 "赫兹兰的工鹫们在我们行军穿过他们的城市与推翻他们的统治者时遭受了巨大的创伤。要治愈这些伤口，将我们的改革带给这片在腐朽帝国治下受难的土地。"
 FAT_seize_noble_land:0 "土地革命"
 FAT_seize_noble_land_desc:0 "那些被贵族控制的土地必须还给鹫民！他们将不再能囤积他们所奴役的鹫民们所生产的财富了！"
 FAT_expand_the_unions:0 "大规模工会化"
 FAT_expand_the_unions_desc:0 "当工会的激励流淌在工鹫们的血液中，\n太阳下没有其他力量能比它更强大，\n一个鹫的力量在这世间还实在太过弱小，\n但工会使我们强大。"
 FAT_industrial_democracy:0 "工业民主制"
 FAT_industrial_democracy_desc:0 "工业民主化也要拓展到赫兹兰，每个工鹫都必须有自己的劳动权！贪婪的资本家将不再统治赫兹兰——统治者有且只有工鹫们！"
 FAT_cooperate_with_local_socialists:0 "同本地社会主义者联合"
 FAT_cooperate_with_local_socialists_desc:0 "狮鹫尼亚境内也有不少愿意和我们政府结盟的社会主义者们。社会主义、工团主义，甚至安那其们都会希望协助我们全新的民主社会主义国度的。"
 FAT_against_the_oligarchy:0 "革命精神永不朽"
 FAT_against_the_oligarchy_desc:0 "狮鹫海姆与赫兹兰的贵族犯下了太多罪行。像我们在978年的革命一样，必须将帝国宫廷中各种级别的朝臣和大小贵族都放倒——让他们知道共和国已经回归。"
 FAT_remove_war_propaganda:0 "削减战争宣传"
 FAT_remove_war_propaganda_desc:0 "为了打败帝国，我们的战争宣传机器疯狂开动以鼓励狮鹫参军。现在我们已经夺取了狮鹫海姆，还在进行这么强的宣传就没有必要了。"
 FAT_bread_and_roses:0 "面包和玫瑰"
 FAT_bread_and_roses_desc:0 "鹫民需要和平，土地和面包，这样他们才能生活在没有资本主义和寡头压迫的新社会主义社会中。"
 FAT_expand_workers_industry:0 "扩展工鹫合作社"
 FAT_expand_workers_industry_desc:0 "狮鹫尼亚大陆上还有一些地方尚未工业化，工鹫合作社也没有崛起。我们要把工业民主化带到我们国家所有的角落。"
 FAT_expel_nrp_right:0 "驱逐共和党右派"
 FAT_expel_nrp_right_desc:0 "右派依旧在党内潜伏着，试图颠覆我们的社会主义统治，并终结以左派统治为特色的共和梦。我们要赶走这些保守派和资本家，为狮鹫尼亚带来更伟大的时光！"
 FAT_pan_griffonian_spirit:0 "泛狮鹫尼亚精神"
 FAT_pan_griffonian_spirit_desc:0 "革命尚未成功，同志仍需努力！行进罢！勇敢的鹫们！我们要把社会主义带给狮鹫尼亚的每个角落，尽管我们减少了战争宣传，我们国内依旧有成千上万的狮鹫们时刻准备着，为我们解放那破碎的土地。"
 FAT_the_liberation_of_griffonia:0 "为了全体狮鹫的自由"
 FAT_the_liberation_of_griffonia_desc:0 "翼巴第。普里文。还有许多大国没有被共和国之爪所驯服。让我们开启一场更大的革命战争，以共和之光统一狮鹫尼亚！"
 FAT_towards_unification:0 "反抗君主制"
 FAT_towards_unification_desc:0 "我们必须消灭大陆上君主制的残迹，让正义、和平与谐律照耀全狮鹫尼亚！从阿奎莱亚到凯辅，三色旗将迎风飘扬！"
 FAT_the_lake:0 "解放湖心"
 FAT_the_lake_desc:0 "狮鹫岩王国以及飞鹰、鹰巢与雁巢家族作为君主国已经很久了。他们应当被共和之光所照耀。"
 FAT_the_heart_of_griffonkind:0 "狮鹫之心的工业化"
 FAT_the_heart_of_griffonkind_desc:0 "在一个统一的狮鹫尼亚帝国还只是个遥不可及的梦想时，狮鹫岩和维雷尼亚大公国就已经是大陆上数一数二的强权了。我们有必要让这些土地再度焕发生机，带领他们实现工农业现代化。"
 FAT_repair_griffonstone:0 "全新的狮鹫岩"
 FAT_repair_griffonstone_desc:0 "狮鹫岩在格罗弗一世使用北风神像统一时曾是帝国的首都。这里同样也是君主派的心脏。所以显而易见我们将重建这里，让它作为共和国的模范省份。"
 FAT_core_lakes:0 "在湖心竖起三色旗"
 FAT_core_lakes_desc:0 "环湖地区将成为我们的核心领土。我们将设立地方政府并彻底解放当地居民。"
 FAT_the_west:0 "解放阿奎莱亚"
 FAT_the_west_desc:0 "西方的狮鹫们一直在为自由而战，反抗那些毫不称职而贪恋权力的君主们。这些狮鹫应得到我们的保护，最终获得自由、战胜专制。"
 FAT_the_trade_cities:0 "为黑哈尔德的背叛复仇"
 FAT_the_trade_cities_desc:0 "尽管天落与菲兹拉作为贸易城市十分富有，但它们也成为了腐败与犯罪的滋生地，意料之中地背叛了那象征着自由与安全的共和国之梦。在我们的正面干预之下，天落城将成为共和国的模范城市。"
 FAT_greifwald_oil_fields:0 "格赖夫瓦尔德油田"
 FAT_greifwald_oil_fields_desc:0 "格赖夫瓦尔德的油田是重要的资源，但是目前油井年久失修，需要大规模重建。这里作为战略资源产地对我们的重要性再强调都不为过。"
 FAT_core_west:0 "在西方竖起三色旗"
 FAT_core_west_desc:0 "由于共和主义思想已在西部广泛存在，这里的狮鹫们热情欢迎我们的来临。从阿奎莱亚到天落，三色旗将在对未来充满希望的公民头顶自由飘扬。"
 FAT_IM_the_lake:0 "解放湖心"
 FAT_IM_the_lake_desc:0 "狮鹫岩王国以及飞鹰、鹰巢与雁巢家族作为君主国已经很久了。他们应当被共和之光所照耀。"
 FAT_IM_the_heart_of_griffonkind:0 "狮鹫之心的工业化"
 FAT_IM_the_heart_of_griffonkind_desc:0 "在一个统一的狮鹫尼亚帝国还只是个遥不可及的梦想时，狮鹫岩和维雷尼亚大公国就已经是大陆上数一数二的强权了。我们有必要让这些土地再度焕发生机，带领他们实现工农业现代化。"
 FAT_IM_repair_griffonstone:0 "全新的狮鹫岩"
 FAT_IM_repair_griffonstone_desc:0 "狮鹫岩在格罗弗一世使用北风神像统一时曾是帝国的首都。这里同样也是君主派的心脏。所以显而易见我们将重建这里，让它作为共和国的模范省份。"
 FAT_IM_core_lakes:0 "在湖心竖起三色旗"
 FAT_IM_core_lakes_desc:0 "环湖地区将成为我们的核心领土。我们将设立地方政府并彻底解放当地居民。"
 FAT_IM_the_west:0 "解放阿奎莱亚"
 FAT_IM_the_west_desc:0 "西方的狮鹫们一直在为自由而战，反抗那些毫不称职而贪恋权力的君主们。这些狮鹫应得到我们的保护，最终获得自由、战胜专制。"
 FAT_IM_the_trade_cities:0 "重建天落城"
 FAT_IM_the_trade_cities_desc:0 "尽管天落与菲兹拉作为贸易城市十分富有，但它们也成为了腐败与犯罪的滋生地。我们将不允许它们继续下去。随着我们的正面干预，天落城将成为共和国的模范城市。"
 FAT_IM_greifwald_oil_fields:0 "格赖夫瓦尔德油田"
 FAT_IM_greifwald_oil_fields_desc:0 "格赖夫瓦尔德的油田是重要的资源，但是目前油井年久失修，需要大规模重建。这里作为战略资源产地对我们的重要性再强调都不为过。"
 FAT_IM_core_west:0 "在西方竖起三色旗"
 FAT_IM_core_west_desc:0 "由于共和主义思想已在西部广泛存在，这里的狮鹫们热情欢迎我们的来临。从阿奎莱亚到天落，三色旗将在对未来充满希望的公民头顶自由飘扬。"
 FAT_the_south:0 "解放南方"
 FAT_the_south_desc:0 "南方狮鹫的独立精神众所周知。但是如果我们希望自由与正义战胜压迫，那么所有狮鹫就必须站在一起。这是个艰难而正义的任务。"
 FAT_pact_with_liberals:0 "同德·加斯贝翼会面"
 FAT_pact_with_liberals_desc:0 "乔瓦尼·德·加斯贝翼是个很明智的狮鹫，目标也与我们相当一致。同他公开会面应该能让我们达成互利互惠的协定，也会迎合共和国内支持他理念的鹫们。"
 FAT_destroy_fascists:0 "法西斯者无处藏"
 FAT_destroy_fascists_desc:0 "翼巴第是法西斯主义的诞生地：一种危险的意识形态。显而易见，这些法西斯分子永远不会接受与共和国统一。我们必须摧毁他们的组织，向大家揭露这一反自由运动的真实面目。"
 FAT_core_south:0 "在南方竖起三色旗"
 FAT_core_south_desc:0 "尽管有些鹫在我们解放南方的行动刚开始时怀疑过我们，但这一行动最后达成了完全的胜利。南方的不和已经消弭，现在他们同我们一道前往光明的未来！"
 FAT_the_frontier:0 "解放东陲"
 FAT_the_frontier_desc:0 "东部边疆充满野性的土地不会被进步的步伐抛在后面。这些狮鹫将获得作为共和国公民的合法地位。"
 FAT_leave_it_to_them:0 "不干涉南方事务"
 FAT_leave_it_to_them_desc:0 "从蓝百合与牛头怪之间的冲突，到四处干涉的卡廷公约，南方已经经历了无数血腥暴力。我们的共和国已经面临着自身的动荡，或许不干涉南方、让他们追寻自己的民主与民生才是更好的选择。"
 FAT_the_gryphus_port:0 "南方的码头"
 FAT_the_gryphus_port_desc:0 "灯塔山是一个让我们与东南贸易网联络的关键港口。一旦我们扩展此地的码头，这里对我们的海军也将意义非凡。"
 FAT_the_new_breadbasket:0 "鹫民的面包篮子"
 FAT_the_new_breadbasket_desc:0 "布罗德费尔德与凯辅富饶的土地可以大规模生产大麦、小麦与燕麦。我们将利用这里极高的农业产出确保鹫民们营养充足。"
 FAT_core_frontier:0 "在边陲竖起三色旗"
 FAT_core_frontier_desc:0 "东陲的狮鹫们已经经历了无数磨难与动荡，现在我们可以让局面改观，给东方带来和平与繁荣。"
 FAT_the_first_griffonian_elections:0 "首次泛狮鹫尼亚选举"
 FAT_the_first_griffonian_elections_desc:0 "现在我们对狮鹫尼亚的征服已经结束，下一件迫切的事情就是宣布进行第二次共和国境内的选举，从天际纳维亚到狮鹫岩的竞选者们都能参与这次竞争。社会主义者、社民主义者、谐律派、自由派、保守派都推荐了自己的候选鹫。有史以来第一次，过半狮鹫都能在一次自由选举中进行投票。"
 FAT_president_guildedwing:0 "激翼总统"
 FAT_president_guildedwing_desc:0 "结果出乎意料，天落充满热情的吉纳维芙·激翼赢得了选举。她保证将改善平民的生活条件，并且要处理国民共和党一党独大的问题，她当然将完成这些工作。"
 FAT_share_our_wealth:0 "财富共享"
 FAT_share_our_wealth_desc:0 "如果一个政府容忍在食物、衣物与住所有多余，而无数公民依旧受遭受贫困这种现象的出现，那么这政府就是没有道德的。我们应该向所有的公民们提供体面的生活标准。"
 FAT_tax_the_oligarchs:0 "向寡头加税"
 FAT_tax_the_oligarchs_desc:0 "关于贫困问题；一个事实是，这个国家的富裕的狮鹫们不允许我们解决它，因为如果拯救我们的所有受贫困祸患的鹫，就会导致他们巨额财富的缩减。相反，我们就要这样做，让所有鹫共享分散的财富！"
 FAT_every_griffon_an_emperor:0 "鹫鹫皆皇帝！"
 FAT_every_griffon_an_emperor_desc:0 "鹫鹫皆皇帝！这样就不会有哪个鹫得不到生活必需品了。所有狮鹫都能在有食物时进餐，也能在有衣物时穿着。"
 FAT_a_new_constitution:0 "废除紧急措施"
 FAT_a_new_constitution_desc:0 "完全废止986年动员戡乱法案的时机已经到来。尽管它在后来为了恢复宪政与国会，得到一定修订，但是其中依旧有大量不民主的赋予总统的措施与权力。我们要彻底解决掉这个独裁制度的残余。"
 FAT_end_nrp_dominance:0 "终结一党独大"
 FAT_end_nrp_dominance_desc:0 "严格意义上共和国不是一党制的国家，但是国民共和党依旧把持着大量的权力，许多狮鹫会感觉到如果他们不是党员的话，作为公务员就几乎不可能晋升了。现在是时候减少NRP的影响了。"
 FAT_open_up_the_political_system:0 "开放政治系统"
 FAT_open_up_the_political_system_desc:0 "尽管共和国先前的领袖们声称其尊重自由，但是某一种自由令他们一直感到不适，那就是思想自由。那些异见者的喙不会被强行闭上，某些特定的党派也不会被限制组建。让所有的声音都能被听见！"
 FAT_a_second_sunglider_term:0 "翔日连任"
 FAT_a_second_sunglider_term_desc:0 "施纳贝尔·翔日勇敢的管理指导着共和国在自由的进军中获得了胜利。但是他的工作还没有结束。又一个任期，鹫民们的一切都将安稳到位。民权、民主、民生万岁！"
 FAT_president_verany:0 "韦朗尼总统"
 FAT_president_verany_desc:0 "泰奥多尔·韦朗尼——阿奎莱亚革命英雄——他的愿景鼓舞鹫心，是建立更公平，更公正的民主制，从而声名鹊起。虽然他帮助穷鹫的诺言使他获得了胜利，但要兑现这些诺言将是一项艰巨的任务。"
 FAT_helping_the_little_griffons:0 "资助穷鹫"
 FAT_helping_the_little_griffons_desc:0 "保证公民生活，为其提供医疗、食物和住房保障是国家的职责。社会保障措施能够保证所有狮鹫，无论社会地位如何，都能够得到基本的需求。"
 FAT_free_education:0 "免费教育"
 FAT_free_education_desc:0 "每一只狮鹫，无论富裕还是贫穷，都拥有接受平等完整教育的权利。既然我们现在有能力提供教育，因此我们在道义上有必要对教育向大众进行推广。这将把我们带入全新的启蒙时代。"
 FAT_broad_land_reform:0 "土地再分配"
 FAT_broad_land_reform_desc:0 "在君主制的重压之下，贫民的土地被剥夺，赏赐与那些持有大片土地的忠诚于王室的贵族。我们必须遏止这样的恶行，收回过于集中的土地，将这些土地交还给丧失了土地的贫民。修正后的产权法将会让平民免于地主的剥削，建立一个公平正义的社会。"
 FAT_republican_identity:0 "泛狮鹫尼亚身份认同"
 FAT_republican_identity_desc:0 "我们反对那些企图以地方文化为基础把我们彼此分开的阴险活动，相反，我们是团结一致、爱国团结的。对民权和民主理想的热爱使我们大家团结起来！"
 FAT_the_republican_guard:0 "守卫梦想"
 FAT_the_republican_guard_desc:0 "自由的代价是永远保持警惕。我们这些希望从自由中获益的鹫必须做好保卫自由的准备，并确保子孙后代也能自由地飞翔。"
 FAT_hunt_down_remaining_monarchists:0 "莫忘敌鹫"
 FAT_hunt_down_remaining_monarchists_desc:0 "我们决不能忘记旧君主制造成的不公正现象：它们不胜枚举。众所周知，君主制以及所有其他威权主义意识形态与共和国的使命不符。"
 FAT_president_ventriglio:0 "德·加斯贝翼总统"
 FAT_president_ventriglio_desc:0 "翼巴第的乔瓦尼·德·加斯贝翼获得了胜利，并承诺将维护狮鹫个体权利和自由放在他的议程的最前列。他崇尚小马利亚风格的谐律，因此他的这个任期有望迎来一个共和国所急需的稳定时期。"
 FAT_president_kingfeather_again:0 "金羽连任"
 FAT_president_kingfeather_again_desc:0 "海因里希·金羽的务实主义和中间路线指引我们前行了如此之远，我们的鹫民们也奖励他一个新的任期。现在是时候让身经百战，见多识广的鹫来领导，而不是摸着石头过河，冒着无数未知的风险。"
 FAT_free_market_capitalism:0 "自由市场资本主义"
 FAT_free_market_capitalism_desc:0 "自由是一种自然的秩序，在这种秩序中，狮鹫个体追逐自己的利益，同时也为整体利益作出贡献：在我们的经济中也应该是这种情况。为了释放我们的全部经济潜力，我们必须终结繁重的税收，关税和规制。"
 FAT_support_business:0 "工业支援行动"
 FAT_support_business_desc:0 "政府和私鹫利益不应相互敌视，而应携手合作。对新技术和生产能力的联合投资将促进创新，并使我们的行业达到效率的新高度。"
 FAT_subsidize_mining_companies:0 "矿业公司私有化"
 FAT_subsidize_mining_companies_desc:0 "众所周知的事实是，国有控股机构本质上效率低下，易发生管理不善的情况。矿业公司的私有化将确保所有者有动力来好好管理自己的资源，从而使我们能够充分开发利用自己的土地。"
 FAT_normalize_equestrian_relations:0 "小马利亚关系正常化"
 FAT_normalize_equestrian_relations_desc:0 "小马利亚是一个强大而稳定的国家，一个我们要在各方面尝试学习模仿的国家。他们是我们争取民主自由的天然盟友，在我们之间深化合作将极大地有利于我们两国。"
 FAT_encourage_immigration:0 "鼓励小马移民"
 FAT_encourage_immigration_desc:0 "随着我们逐步与小马利亚传统观念日渐接近，我们就可以从中获得大量专业小马移民迁入的益处。我们要传达出共和国是一片对所有生物都能友善对待的乐土，我们欢迎所有移民！"
 FAT_put_the_ponies_to_work:0 "让小马们工作"
 FAT_put_the_ponies_to_work_desc:0 "从天马航空精英到独角兽法师，还有陆马农业专家，小马们拥有独特且重要的技能，对我们的经济很有帮助。我们要继续吸引高技术马才来到我们国家，确保他们的专长能得以丰厚回报。"
 FAT_president_kogchel:0 "科赫尔总统"
 FAT_president_kogchel_desc:0 "赫尔本·科赫尔是弗羽西亚劳工党的前领导，他是一个温和的狮鹫，在不同的国家国家许多鹫都钦佩他。他承诺将致力于为所有鹫建立社会服务，并使共和国成为更健康的民主国家。"
 FAT_president_astler_again:0 "艾斯特勒连任"
 FAT_president_astler_again_desc:0 "是艾斯特勒在过去数年勇敢地带领共和国穿越无数危险的考验，将为我们带来一个全新的社会主义社会，没有资本主义压迫的也是艾斯特勒。为了鹫民的狮鹫尼亚！"
 FAT_direct_democracy:0 "保卫民主"
 FAT_direct_democracy_desc:0 "我们决不能放弃民主，因为民主已为我们指明了通往繁荣的道路。通过公民的请愿和投票，我们将把更多的权力放在鹫民的爪中。"
 FAT_socialism_in_griffonia:0 "真正伟大的经济计划"
 FAT_socialism_in_griffonia_desc:0 "所有蹂躏狮鹫尼亚的战争所造成的破坏是如此之大，很多鹫比以往更为贫穷。为了保持低失业率和经济增长，我们将启动伟大的公共工程来改善我们的共和国。大自然本身也会屈服于我们的利爪，因为我们把它塑造得更有益于狮鹫种群。"
 FAT_socialized_healthcare:0 "社会化医疗"
 FAT_socialized_healthcare_desc:0 "我们忽视病鹫已经很久了。既然有这个能力，我们就必须为所有居民提供尽可能好的医疗保健。病鹫和伤鹫将得到最好的治疗，因为生命是无价的。此外，我们将把免费医疗视为任何生命的权利，向世界展示我们的社会主义繁荣。"
 FAT_guarantee_a_job:0 "确保就业率"
 FAT_guarantee_a_job_desc:0 "资本主义生产方式的本质就是让一些工鹫过度工作，而让其余的鹫成为失业穷鹫的后备大军。然而，如果我们集中财富并团结一致，任何鹫都可以根据自己的能力来贡献产出，根据自己的需要来获得劳动成果。"
 FAT_industrial_unionism:0 "支持产业工会"
 FAT_industrial_unionism_desc:0 "不论技能或行业如何，同一产业的所有工鹫都应组织成同一个工会，以确保他们在商讨条件或罢工的情况下具有最大的杠杆效力。我们不关注分工如何，或是在每件产品的细小事务上进行纠缠，而是强调熟练者和生疏者的相互依赖。"
 FAT_industry_for_the_workers:0 "城市的支持"
 FAT_industry_for_the_workers_desc:0 "狮鹫将不再被贪婪和狡诈的雇主利用。新的劳工法将赋予工鹫保护自己的权力，最终结束工厂里折磨鹫的奴隶制度。合理的轮班和加班法、安全规程和带薪病假将改善狮鹫的日常生活。"
 FAT_president_kemerskai_jr:0 "总统小克梅斯凯"
 FAT_president_kemerskai_jr_desc:0 "小克梅斯凯拥有一大波鹫民的支持，获得了胜利。他的政治纲领着重于建立一个更为集权的中央政府，以及成为一个愿意采取大胆的行动以保护共和国和她的鹫民的，更为强大的总统。"
 FAT_continue_industrialization:0 "继续农村的工业化"
 FAT_continue_industrialization_desc:0 "维护我们国家的安全将需要建立一个全新的工业经济。现代技术要求更高的效率以充分利用我们的土地和资源。进步在继续，我们承担不起落后的责任。"
 FAT_redistribute_noble_wealth:0 "贵族财富再分配"
 FAT_redistribute_noble_wealth_desc:0 "太久以来，狮鹫尼亚的财富和权力一直被其腐败的贵族所垄断。尽管他们对社会的政治束缚已被打破，但这些贵族尚未为他们的不公正待遇付出适当的代价。他们的财富现在被没收了，在鹫民中间分配。"
 FAT_guarantee_prosperity:0 "不让一只狮鹫掉队"
 FAT_guarantee_prosperity_desc:0 "共和国的土地广阔而富饶，我们的公民是贤良而勤奋的。一个拥有如此丰富资源的国家不把它们提供给鹫民将是不可原谅的：保证每个公民的民生是我们的责任。"
 FAT_antagonize_equestria:0 "同小马利亚对立"
 FAT_antagonize_equestria_desc:0 "小马利亚自称信仰平等自由，但是同时也在崇拜那些“神明”公主。尽管他们在历史上经常动嘴皮子称为自由而战，他们的伪善也是众所周知的了。从现在开始，我们将毫不忌讳地讲出它的真相。"
 FAT_reach_out_to_nova_griffonia:0 "接触新狮鹫尼亚"
 FAT_reach_out_to_nova_griffonia_desc:0 "我们隔海相望的兄弟们和我们同样都在与专制和君主制斗争，向他们提出结盟建议是明智的。这样的联盟将使我们确保共和国在马奎斯大陆上有一个落爪点。"
 FAT_bolster_the_military:0 "壮大我们的部队"
 FAT_bolster_the_military_desc:0 "共和国拥有一支强大的军事力量，能够在全世界范围内投射我们的力量并捍卫我们的价值观是至关重要的。无论未来有什么挑战在等待着我们，我们都必须准备以自由的名义面对这些挑战！"
 griffonRepublic.2.t:0 "狮鹫尼亚共和国邀请我们加入共和国公约。"
 griffonRepublic.2.d:0 "我们收到了狮鹫尼亚共和国邀请加入共和国公约的提议，这是一个要联合整块大陆上的共和国们反抗敌国侵略的政治经济军事同盟。如果我们被入侵，那么他们将伸出援爪，同样的，如果他们受到攻击，我们也必须帮助他们。"
 griffonRepublic.2.a:0 "是的，我们将会加入共和国的抗争。"
 griffonRepublic.2.b:0 "我们无法加入他们，但是我们很感激他们的帮助。"
 griffonRepublic.2.b.tt:0 "我们无法同意全面结盟，但是我们同意相互保障。\n"
 griffonRepublic.2.c:0 "我们自己单干更好。"
 griffonRepublic.3.t:0 "共和国的斗争"
 griffonRepublic.3.d:0 "自我们受[From.GetLeader]领导离开共和派运动已经很多年了。这段时间里，我们的社会主义与平等事业陷入僵局，而南方的狮鹫尼亚共和国正在走上新时代的复兴道路。或许是时候重新考虑我们的立场了？"
 griffonRepublic.3.a:0 "我们作为伙伴将协助共和国。"
 griffonRepublic.3.b:0 "我们必须重新接触共和国政权，并尽我们所能帮助他们。"
 griffonRepublic.3.c:0 "不，[FAT.GetLeader]和我们在978年宣誓抗争的暴君是一路鹫！"
 griffonRepublic.33.t:0 "#代表团抵达"
 griffonRepublic.33.d:0 ""
 griffonRepublic.33.a:0 "#接受协定"
 griffonRepublic.33.b:0 "#我们有别的计划。"
 griffonRepublic.333.t:0 "#北方的使节团"
 griffonRepublic.333.d:0 ""
 griffonRepublic.333.a:0 "#互不侵犯条约"
 griffonRepublic.333.b:0 "#干"
 griffonRepublic.4.t:0 "#谈判成功！"
 griffonRepublic.4.d:0 ""
 griffonRepublic.4.a:0 ""
 griffonRepublic.444.t:0 "#谈判成功"
 griffonRepublic.444.d:0 ""
 griffonRepublic.444.a:0 ""
 griffonRepublic.5.t:0 ""
 griffonRepublic.5.d:0 ""
 griffonRepublic.5.a:0 ""
 griffonRepublic.555.t:0 ""
 griffonRepublic.555.d:0 ""
 griffonRepublic.555.a:0 ""
 griffonRepublic.6.t:0 "[From.GetName]加入了我们的阵营！"
 griffonRepublic.6.d:0 "我们刚刚收到确认书称[From.GetName]官方同意加入我们的阵营！"
 griffonRepublic.6.a:0 "太棒了！"
 griffonRepublic.66.t:0 "相互保障"
 griffonRepublic.66.d:0 "尽管他们不愿意完全加入，[From.GetName]称其认为加入我们的条约符合他们的最大利益。因此我们达成了一个反帝国公约。"
 griffonRepublic.66.a:0 "没问题。"
 griffonRepublic.666.t:0 "#该准备战争"
 griffonRepublic.666.d:0 ""
 griffonRepublic.666.a:0 ""
 griffonRepublic.7.t:0 "[From.GetName]拒绝了！"
 griffonRepublic.7.d:0 "我们刚刚收到[From.GetName]的声明称其不希望参与我们的斗争，显然他们拒绝加入我们。"
 griffonRepublic.7.a:0 "真遗憾。"
 griffonRepublic.8.t:0 "[SRS.GetName]同意了！"
 griffonRepublic.8.d:0 "我们在[SRS.GetName]的同志已经同意为了自由平等的事业加入我们的阵营。这标志着两国在国民共和党大分裂后第一次达成了外交协定。"
 griffonRepublic.8.a:0 "旧时的积怨已经被忘记了！"
 griffonRepublic.88.t:0 "[SRS.GetName]归顺了！"
 griffonRepublic.88.d:0 "一件没有料到的事，[SRS.GetName]向我们发出了愿意尽力帮助我们在大陆上建立一个对所有生灵而言更好的国家的声明，并交出了他们的独立权以共同实现这一目标。"
 griffonRepublic.88.a:0 "我们欢迎我们的狮鹫兄弟！"
 griffonRepublic.9.t:0 "[SRS.GetName]拒绝了！"
 griffonRepublic.9.d:0 "我们仅仅收到潦草的声明称我们并不比大陆上其他独裁者和军阀好到哪里去。"
 griffonRepublic.9.a:0 "社会主义者从来都不太明智，对吧……"
 griffonRepublic.10.t:0 "瑰翼和曜尾密谋推翻克梅斯凯"
 griffonRepublic.10.d:0 "莱因哈特·曜尾，一个魅力甚高，但又无比残暴的老军官，一直在乡下训练他自己的部队，并参与土匪劫掠。以及克劳斯·瑰翼，革命期间克梅斯凯的首要指挥官，在革命失败后便迫切想篡夺他的位置。这两鹫已经勾结起来，试图推翻我们的政府。我们尚不清楚他们具体计划如何，但是政府专员认为他们将要反对任何形式的军事改革，并且要谋划一场防止他们土匪行径与秘密军事训练被发现制止的政变。曜尾已经与狮鹫尼亚民族革命阵线同流合污，该组织是一个地下民族主义派系，同时反对着民主制与君主制，认为只有一个强有力的领导才能让共和国走向黎明。如果我们想要鼓动这种行为，或许无为而治是更好的选择……"
 griffonRepublic.10.a:0 "我们不能伤害自己的公民。"
 griffonRepublic.10.b:0 "派军队镇压他们，制止他们的计划！"
 griffonRepublic.11.t:0 "士兵们逃向瑰翼和曜尾的部队"
 griffonRepublic.11.d:0 "士兵们开始拒绝服从克梅斯凯的命令，甚至逃向军阀瑰翼和曜尾的部队。这其中很多士兵都受够了由中央政府混乱所致的低军饷，并被可以肆意劫掠的承诺所吸引。这很明显是中央政府要面对的一个大问题，如果瑰翼和曜尾要发动政变的话，那么他们爪中将会有很多曾经服从于我们的部队。"
 griffonRepublic.11.a:0 "他们就是想多点军饷。让他们接着闹。"
 griffonRepublic.11.b:0 "派出忠于我们的军队来处理这些叛徒！"
 griffonRepublic.12.t:0 "深渊的边缘"
 griffonRepublic.12.d:0 "我们在崩溃的边缘。军队哗变继续扩散，政府官员也开始不忠，无视我们的指令。见证了这一切的平民们开始武装自己，街道上已经开始有民兵和不忠的士兵冲突。这是我们粉碎叛乱的最后时机，如果失败，整个国家就完了。"
 griffonRepublic.12.a:0 "太好了。这场政变很快就会开始，我们将推翻这腐朽的政府。"
 griffonRepublic.12.b:0 "召集忠于我们的军队去摧毁他们，一劳永逸！"
 griffonRepublic.13.t:0 "国家陷入战火"
 griffonRepublic.13.d:0 "太迟了。那些叛乱者、抗议者和逃兵已在守旧派将领爪下聚集起来。他们提出了很多要求，更重要的是他们厌恶我们的共和国政权和领袖。我们的政府只控制了漫云城与周边的城市区域，但我们不会畏缩！我们不会输给那些叛徒的！我们要么保住共和国，要么牺牲。情况本不应该至此的……不过是时候再次为自由而战了！"
 griffonRepublic.13.a:0 "为了共和国！"
 griffonRepublic.13.b:0 "为了真三民主义！"
 griffonRepublic.18.t:0 "同瑰翼会面"
 griffonRepublic.18.d:0 "瑰翼将军是国内最主要的军阀之一。尽管他的部队得到了政府方面的支持，他似乎每天只会于最高指挥之外独自行动，他的势力甚至会对忠于我们部队的营地进行袭击。今天，共和国军队派代表同他会面。会面上他声称自己同那些劫掠没有关系，他的部队里对劫掠的惩罚相当重，所以他的控制范围里不会有这种事件。他指责这些全是曜尾那些不服管教的士兵们干的，他一直忠于共和国，不会干出这种事。"
 griffonRepublic.18.a:0 "一番有趣的对话。"
 griffonRepublic.19.t:0 "同曜尾会面"
 griffonRepublic.19.d:0 "曜尾是一个颇有争议的公众形象。他在17岁时加入共和国军队，参与终结君主制的革命。但是随着时间的推移，他变得越来越极端化，对共和国之梦失去了信心。同这样一位全狮鹫尼亚最危险的狮鹫会面不是个小事情。最后他提出了三大要求：一，将因1003年恐怖袭击被取缔的极端民族主义组织，狮鹫民族革命阵线合法化。二，赦免所有的匪兵，除了其中最极端的那些，他声称“自行处理”。三，向他提供数百万北风币作为“部队补给”。"
 griffonRepublic.19.a:0 "我们真的没有选择。"
 griffonRepublic.199.t:0 "将领们归顺了"
 griffonRepublic.199.d:0 "瑰翼和曜尾以及他们身边最重要的军官在克梅斯凯元帅的直接命令下来到了漫云城。会面的细节对公众完全保密，但是记者认为这是一次试图终结乡下土匪问题的会谈。漫云时报的记者称其看到“瑰翼与克梅斯凯走出总统府，激动地谈话、互相握爪。”看起来两位军阀最终发表了服从共和国的誓言，不再指使土匪了。"
 griffonRepublic.199.a:0 "为共和国三呼万岁！"
 griffonRepublic.20.t:0 "土匪问题"
 griffonRepublic.20.d:0 "自[Root.GetNameDef]成立以来，强盗、劫匪与其他罪犯就是大城市外所有鹫必须面对的大问题。许多年过去了，这些家伙们依旧极度反对政府。但这一情况近期有所改观，我们正在集中精力击败他们。目前，我们已经能保证主要的道路与沟通渠道不受其威胁。但是，还有无数大大小小的村庄，还有无数更小的道路受到其影响。所以说，不要停下来啊！"
 griffonRepublic.20.a:0 "集中一切力量确保共和国的每一条道路，每一座城市都是安全的。"
 griffonRepublic.21.t:0 "土匪问题基本解决"
 griffonRepublic.21.d:0 "今天是关键的一天，我国所有城市与道路都摆脱了匪徒们的控制。我们的清理行动无比艰辛，也十分血腥，但是一切付出都有回报。绝大多数公民晚上都能安心睡觉，因为我们已经让曾经规模庞大的匪帮被迫隐藏。我们依旧不能止步于此，尽管现在他们藏在森林或者城市中的角落，不采取进一步措施的话他们依旧可能再度袭击。"
 griffonRepublic.21.a:0 "确保军队侦查每一片森林或每一处乡村里土匪藏身的洞穴。"
 griffonRepublic.22.t:0 "罪犯被彻底清理"
 griffonRepublic.22.d:0 "刚刚接到了报告，我们的武装部队已经找到了“祭司兄弟会”最后的藏身窝点，并向其中的土匪们送达了迟到的正义。这个行动的句号也是颇为有趣，毕竟“祭司兄弟会”可是我国国内首个犯罪组织。随着他们的终结，我国历史一个全新的时代开始了。曾经的无法之地现在有了秩序，曾经所有鹫都害怕夜行，现在你能看到许多鹫们一起出来庆祝或者享乐。曾经需要武装护卫才能安心行进的道路，也能看到母亲带着孩子们一起散步。而他们与我们一样，对未来充满信心。"
 griffonRepublic.22.a:0 "这会让我们所有的公民更加安全。"
 griffonRepublic.42.t:0 "乡下的状况"
 griffonRepublic.42.d:0 "今天一些非常可怕的报告送到了我们的首都。看起来某些小村子和城市正报告称他们缺乏足够的食物供给。这不算那么令鹫吃惊，毕竟我们的乡下很乱。不过要是我们无法去解决这些问题 未来情况会更加糟糕。"
 griffonRepublic.42.a:0 "确保这些报告是真实的而非他们的过度反应。"
 griffonRepublic.43.t:0 "乡下的状况"
 griffonRepublic.43.d:0 "乡下的情况令鹫胆寒，看起来上一份报告没有夸大描述，而是事实。更糟的是目前绝大多数农民生产食物要么是为了自己吃，要么是以极高价格私自出售。任何运输食物的尝试都是极其危险的，要么被贪婪的土匪抢劫，要么就是被无数饥鹫夺去。如果我们不希望共和国爆发灾难，我们必须行动。"
 griffonRepublic.43.a:0 "派出武装警卫和运输车，调查每一处磨坊与农场以寻找可能存在的食物补给。"
 griffonRepublic.44.t:0 "从饥荒中恢复"
 griffonRepublic.44.d:0 "自我们减轻饥荒威胁，并最终制止饥荒的行动开始以来，我们已经帮助了许多狮鹫，让他们远离死亡。尽管现在情况算不上完美，无数农场与磨坊的产量已经恢复正常。但是我们目前还不能放爪，毕竟有些地方的饥荒还是很严重。"
 griffonRepublic.44.a:0 "专注于让一切恢复正常。"
 griffonRepublic.45.t:0 "饥荒结束了"
 griffonRepublic.45.d:0 "今天标志着饥荒的终结，我们的食物供应从未这么好过。这不是个简单的任务，牺牲的鹫数以千计。这也为我们敲响了警钟，我们不能再让乡下混乱下去了。因此，我们的士兵护送和检查补给的政策将继续执行下去。"
 griffonRepublic.45.a:0 "施加一些强制性措施是保持所有鹫吃饱的一点代价。"
 griffonRepublic.50.t:0 "韦迪纳问题"
 griffonRepublic.50.d:0 "韦迪纳是一个君主国，也属于我们在978年想要推翻的那类国家。不过他们或许是整块大陆上惟一一个关爱所有子民的君主国。国王作为国家的管理者，对所有狮鹫一视同仁，哪怕他们只是低贱的平民……\n\n当然，这是金羽那帮鹫想要让你去相信的。共和国内更多的声音则对他们所谓的缺乏真正自由的“谐律系统”产生了怀疑，称其和旧漫云公国或者狮鹫尼亚帝国没有什么两样，必须被毁灭。"
 griffonRepublic.50.a:0 "或许我们可以达成某种约定……"
 griffonRepublic.50.b:0 "很可惜，但我们必须消灭他们。"
 griffonRepublic.51.t:0 "[FAT.GetName]邀请我们加入阵营"
 griffonRepublic.51.d:0 "今天我们接到了来自[FAT.GetName]的邀请，希望我们加入他们的阵营。他们是一个从帝国分离出来的共和国，如果我们拒绝了，可能会招致他们的怒火。同意的话会对我们的平民有利，但我们就会被拉入同其他国家，尤其是狮鹫尼亚帝国的战争。"
 griffonRepublic.51.a:0 "即使我们要打一仗，这依旧值得。"
 griffonRepublic.51.b:0 "我们不能和共和国这样的疯子结盟。"
 griffonRepublic.52.t:0 "韦迪纳同意了！"
 griffonRepublic.52.d:0 "韦迪纳智慧的国王同意与我们结盟，称我们可以共同为两国平民百姓做出善事。"
 griffonRepublic.52.a:0 "一个开明、支持自由的国王？让我们庆祝一番。"
 griffonRepublic.53.t:0 "韦迪纳拒绝了"
 griffonRepublic.53.d:0 "不出所料，韦迪纳不同意加入我们的阵营，称我们是战争贩子。并指责我们，仅仅是为了政治利益，就造成成千上万的死亡。一如既往，这些都是典型的君主制谎言。令我们有点失望的是，被认为是如此明智和关心国王居然不同意加入我们。最终，所有的君主制都是一样的，这只能进一步证明这一点。"
 griffonRepublic.53.a:0 "国王还是国王。很快我们将解放韦迪纳的鹫民。"
 griffonRepublic.54.t:0 "丧钟为我们而鸣"
 griffonRepublic.54.d:0 "随着[FAT.GetName]击败了狮鹫尼亚帝国，他们现在正要求大陆各国加入共和国。如果我们同意了，那我们就丧失了独立权。但如果我们拒绝，可能就会导致同共和国非常血腥、危险的战争。"
 griffonRepublic.54.a:0 "我们别无选择，只能同意。"
 griffonRepublic.54.b:0 "我们不会把我们的独立拱手让给一些愚蠢的共和党骗子。"
 griffonRepublic.55.t:0 "篡位国同意整合"
 griffonRepublic.55.d:0 "其中一个在帝国混乱时爆出的篡位国同意以共和国成员国加入我们。我们给予他们有限的自治权和他们自主选出领袖的权力，但是他们作为我们的盟国，在外交、军事、科研和经济事务上必须和我们站在一起。"
 griffonRepublic.55.a:0 "非常好，又少了一个潜在的独裁国家。"
 griffonRepublic.56.t:0 "篡位国拒绝整合"
 griffonRepublic.56.d:0 "其中一个曾经和我们共同作战的篡位国拒绝屈膝于我们。如果我们希望保持列强的威望，以及地区强国的优势，我们绝对不会轻饶他们。"
 griffonRepublic.56.a:0 "抛弃共和国之梦的这天，他们必将无比懊恼！"
 griffonRepublic.60.t:0 "盲文的发明"
 griffonRepublic.60.d:0 "一项能改变无数鹫命运的发明在我国首都一处破败郊区出现。一名天真的学生想到了以全新印刷方式记录狮鹫标准语的方法，而且预计漫云语很快也能用这种方法记录。这种方法包括在纸上用新型打印机压出重复的符号，而非使用墨水。\n\n这有什么用呢？很显然，直到现在那些盲鹫都不能阅读，而同为盲鹫的发明者宣布这一新发明可以让他们阅读。教育部门已经迅速采纳了这一发明，并在刚刚首都开设了两所盲鹫学校。"
 griffonRepublic.60.a:0 "盲鹫也能阅读了，真是太好了！"
 griffonRepublic.61.t:0 "血染湖岸"
 griffonRepublic.61.d:0 "斯卡克附近的格罗斯滕湖传来了奇怪的目击报告。一批当地青年在湖边开派对时发现了一具钻石狗的尸体，有撕咬和爪子、匕首与子弹留下的伤口。目击者们认定他是Cadworth，一名街头音乐家与表演艺术家，住在一个隐居的钻石狗社区。当他们向本地警察汇报后，全城的调查就开始了，最终找到了罪犯们——一批同“消灭君主暴政协会”有关联的狮鹫们。该协会称其屠杀他的理由为“君主制的秘密支持者，并且密谋令格罗弗六世登上漫云王座”。随后这一协会成员就被逮捕。作为律师与政治家的海因里希·金羽称应对其实施私刑的行为处以严厉的判决，而军工领袖埃里希·克里格则相信这次袭击“是有道理的，因为在我们的正义社会中绝不能容忍君主制的祸害”。\n\nCadworth的死引发了媒体的大规模注意。尽管大多数政客都正式谴责了此事，但杀戮仍然伤害了国内的反君主制氛围。"
 griffonRepublic.61.a:0 "街上也不再安全了。"
 griffonRepublic.62.t:0 "波尔森的风流韵事"
 griffonRepublic.62.d:0 "当今日新闻开始报导有关漫云城左翼议员雅库布·波尔森同妓女风流韵事的传闻时，整个国家都震惊了。更不用说，那个自丑闻发生以来保持着匿名身份的妓女，实际是一个已知的天际纳维亚共党的间谍，事后不久就带着我国机密越过了国境线。对波尔森与天际纳维亚政府之间勾结的恐惧导致政府内部普遍的担忧，共和党右翼领导海因里希·金羽已经要求该议员辞职，理由是“对伟大的共和国之梦的忠诚不清不楚”。\n\n尽管共和党左翼领导里卡德·艾斯特勒在此事上基本上保持沉默，但与社会主义结盟的将军默·燕祸发表了一项声明，宣称卖淫行为“是不道德的，与社会主义和解放的价值观不相容”——尽管他完全无视与天际纳维亚机密有关的问题。有趣的是，尽管雅库布·波尔森在各方面都受到了质疑，却否认自己有过任何不良行为，但无论如何都辞职了。\n\n共和党右翼领袖因波尔森的不忠和卑鄙行为而受到鼓舞，声称必须对共和党左翼的行动进行全面的国家调查，确定它是否受到天际纳维亚方面的干预。"
 griffonRepublic.62.a:0 "真是尴尬！"
 griffonRepublic.63.t:0 "克梅斯凯回忆录出版"
 griffonRepublic.63.d:0 "今天，克梅斯凯在漫云城总统府发表了一条官方公告。他的回忆录，《自由的胜利》已经在共和国境内和整块大陆——前提是那些君主派的书店愿意买进——公开出版发售。这本自传以他的早年为起点，详细讲述了他的经历。从他作为阿德斯·克梅斯凯男爵的第三个孩子出生开始，到他和兄弟一起参军，再到共和国革命，直至今日。\n\n这本书在共和国境内受到评论家一致好评，国民共和党中间派领导鹫施纳贝尔·翔日称其为“一本描述狮鹫尼亚最伟大统治者的必读书籍”，作家科尼利乌斯·温克也称其“几乎和我的作品一样好”。克梅斯凯作品因其风格，手法和所传达的核心信息而广受赞誉，许多狮鹫称这些作品“和他的演讲才能一样好”。"
 griffonRepublic.63.d_com:0 "今天，克梅斯凯在他翼哈根的住宅发表了一条官方公告。他的回忆录，《自由的胜利》已经在共和国境内和整块大陆——前提是那些君主派的书店愿意买进——公开出版发售。这本自传以他的早年为起点，详细讲述了他的经历。从他作为阿德斯·克梅斯凯男爵的第三个孩子出生开始，到他和兄弟一起参军，再到共和国革命，直至今日。\n\n这本书在共和国境内受到评论家一致好评，国民共和党中间派领导鹫施纳贝尔·翔日称其为“一本描述狮鹫尼亚最伟大统治者的必读书籍”，作家科尼利乌斯·温克也称其“几乎和我的作品一样好”。克梅斯凯作品因其风格，手法和所传达的核心信息而广受赞誉，许多狮鹫称这些作品“和他的演讲才能一样好”。"
 griffonRepublic.63.a:0 "一个充满得与失的美丽故事。"
 griffonRepublic.64.t:0 "GRS命令号"
 griffonRepublic.64.d:0 "昨天，我们最新的驱逐舰模型之一在演习中未能返航，之后失踪了。在意识到驱逐舰丢失之后，我们的海军小组争先恐后地搜寻了这艘船。经过整整十二个小时的毫无结果的搜索后，驱逐舰再次出现，当时它正在浓雾中滑行。最初，我们以为那份报告是伪造的，因为驱逐舰的位置远远超出了当时它可能曾行进过的区域，但它确实在那里。更奇怪的是，事后发现驱逐舰在抵达时完全无鹫驾驶。据报道，全体船员失踪，而船已被隔离以进行进一步的科学和魔法分析。"
 griffonRepublic.64.a:0 "你说这是艘幽灵船？"
 griffonRepublic.65.t:0 "共和国智慧女士协会"
 griffonRepublic.65.d:0 "数百名位于荒芜之峰地区的虔诚宗教信徒回想起他们作为韦迪纳王国曾经的盟友与臣民的历史，宣布建立“共和国智慧女士协会”，呼吁与韦迪纳王国共享传统，并重新确立共和国的宗教宗旨。尽管他们的组织极其松散，甚至在荒芜之峰的狂信徒中都处于边缘地位，许多鹫还是认为秘密君主派组织想要用它作为一个发泄口。\n\n这一协会已经得到[VED.GetLeader]和韦迪纳政府公开支持，而克梅斯凯官方也严禁其参与荒芜之峰地区的选举，哪怕他们的支持率最高只到达2%。\n\n很多鹫相信这一行为是对共和国的反神官政策的回应。在共和国强烈谴责神官厄洛斯七世和厄里翁十二世后，它的公民在很大程度上被排斥在宗教生活之外。"
 griffonRepublic.65.a:0 "滚出去，韦迪纳鹫！"
 griffonRepublic.67.t:0 "重返狮鹫海姆"
 griffonRepublic.67.d:0 "胜利啦！我们的流亡结束了，我们也回到了共和国的诞生地——狮鹫海姆。现在这座城市是我们的，叛乱也被压制了，我们必须决定我们的共和国未来会变成什么样子。我们应该追求更多的集权化，或者分权化？我们要改革行政机构吗？有很多问题亟待解决。"
 griffonRepublic.67.a:0 "分权只会把我们引向崩溃。"
 griffonRepublic.67.b:0 "我们依旧坚持在978年指引我们的理念。"
 griffonRepublic.67.c:0 "各大狮鹫国家间的联盟！"
 griffonRepublic.68.t:0 "共和国三民主义"
 griffonRepublic.68.d:0 "无数年过去了，现在共和国终于能够实践她的革命原则，民权、民主、民生。总统元帅在演讲中宣告共和国已经走过了漫漫征程，现在我国终于能实现三民主义了。过去的动荡不安已经远去，我们将在三色旗下永远团结！"
 griffonRepublic.68.a:0 "属于全民的民权、民主和民生！"
 griffonRepublic.207.t:0 "民族共和国的新三民原则"
 griffonRepublic.207.d:0 "我们夺取了狮鹫海姆，共和国终于能够完全接纳她的三民主义了。民安、民族与民生原则。曜尾向国民宣告了我们的国家终于能继续前行，拥抱建立时的革命原则。但是，曜尾的三民原则与克梅斯凯的三民主义有所不同——曜尾把民权主义替换成了民安原则，意味着国家必须被从内、外两个方面保护起来，鹫民们要为国家的利益牺牲他们的自由。第二点的民主主义被换成了民族原则，即一种必须要把革命带给全体狮鹫的信念，因此共和国将是爱国与极端民族主义运动的代表。鹫群依旧为曜尾的改革而欢呼，但他们是为整合原先的三个主义欢呼的。曜尾称旧三民主义“对现代的政权而言已经过时了”，它们“在几十年前革命失败时就已经死了”。"
 griffonRepublic.207.a:0 "我不记得这些属于三民主义……"
 griffonRepublic.69.t:0 "选举！"
 griffonRepublic.69.d_harmonic:0 "我们伟大的总统元帅已宣告共和国为她的第一次普选做好了准备。随着他的离职，不少政治家们磨爪擦腿，试图赢得鹫民们的支持。三个最受欢迎的政治家包括海因里希·金羽、施纳贝尔·翔日和里卡德·艾斯特勒，他是一个广受欢迎的民主社会主义参选鹫，在底层鹫民中获得了大量支持。\n\n海因里希是政治中立派的坚信者，相信如果我们的国家决定不参与外交事务，将进一步促进我们的经济财富的增长和政治上的稳定。他还支持削减军事和福利预算以确保经济平衡，尽管这导致他从谐律派那里收获了不少批判，他们认为他通过计划削减福利而背叛了“民生”原则。\n\n另一方面，施纳贝尔是一位年轻的革命者，坚信共和国革命时的信念。他认为，中立的外交立场意味着将导致其他国家爪无寸铁的狮鹫无法支配自己的命运，只能遭到君主、独裁者等的压迫。翔日坚信革命的社民主义理想，并支持混合型经济和大量福利支出，以改善穷鹫的民生。共产主义者声称他走得不够远，而保守派则声称国家永远无法为他的雄心勃勃的计划付出代价。\n\n里卡德·艾斯特勒，激进派，在外交政策方面和金羽接近，但是经济方面和金羽截然相反。尽管许多鹫将他视为边缘候选鹫，但他得到了著名社会主义者的支持，例如弗羽西亚的科赫尔和著名的共和国艺术家奥拉夫·雷岑。他主张建立工鹫的自我管理，产业合作社和经济上的非军事化。他的政策反映了他作为和平主义者和民粹主义者这两点。他对强调建立一个满足社会主义和地方民主价值观的孤立主义共和国感到满足。谐律派谴责他，因为他们认为这是一种软弱的和平主义政策以及他的边缘社会主义理想。\n\n这是一场激烈而短暂的选举活动，结果是……"
 griffonRepublic.69.d_socialist:0 "我们伟大的总统元帅已宣告共和国为她的第一次普选做好了准备。随着他的离职，不少政治家们磨爪擦腿，试图赢得鹫民们的支持。两个最受欢迎的政治家是谐律派的施纳贝尔·翔日和社会主义者里卡德·艾斯特勒。\n\n施纳贝尔是一位年轻的革命者，坚信共和国革命时的信念。他认为，中立的外交立场意味着将导致其他国家爪无寸铁的狮鹫无法支配自己的命运，只能遭到君主、独裁者等的压迫。翔日坚信革命的社民主义理想，并支持混合型经济和大量福利支出，以改善穷鹫的民生。但是共产主义者声称他走得不够远。\n\n里卡德·艾斯特勒，激进派，在外交政策方面和金羽接近，但是经济方面和金羽截然相反。他主张建立工鹫的自我管理，产业合作社和经济上的非军事化。他的政策反映了他作为和平主义者和民粹主义者这两点。他对强调建立一个满足社会主义和地方民主价值观的孤立主义共和国感到满足。谐律派谴责他，因为他们认为这是一种软弱的和平主义政策以及他的边缘社会主义理想。\n\n这是一场激烈而短暂的选举活动，结果是……"
 griffonRepublic.69.d_neutral:0 "我们伟大的总统元帅已宣告共和国为她的第一次普选做好了准备。随着他的离职，不少政治家们磨爪擦腿，试图赢得鹫民们的支持。两个最受欢迎的政治家是海因里希·金羽和施纳贝尔·翔日。\n\n海因里希是政治中立派的坚信者，相信如果我们的国家决定不参与外交事务，将进一步促进我们的经济财富的增长和政治上的稳定。他还支持削减军事和福利预算以确保经济平衡，尽管这导致他从谐律派那里收获了不少批判，他们认为他通过计划削减福利而背叛了“民生”原则。\n\n另一方面，施纳贝尔是一位年轻的革命者，坚信共和国革命时的信念。他认为，中立的外交立场意味着将导致其他国家爪无寸铁的狮鹫无法支配自己的命运，只能遭到君主、独裁者等的压迫。翔日坚信革命的社民主义理想，并支持混合型经济和大量福利支出，以改善穷鹫的民生。保守派则声称国家永远无法为他的雄心勃勃的计划付出代价。\n\n这是一场激烈而短暂的选举活动，结果是……"
 griffonRepublic.69.a:0 "海因里希·金羽获胜！"
 griffonRepublic.69.b:0 "施纳贝尔·翔日成为总统！"
 griffonRepublic.69.c:0 "里卡德·艾斯特勒获得胜利！"
 griffonRepublic.691.t:0 "施纳贝尔·翔日的就职典礼"
 griffonRepublic.691.d:0 "“克梅斯凯的遗产将被保存。作为狮鹫尼亚共和国第二任总统，我将延续他对民权、民主和民生的誓言。这三民主义是他所建立的，也是我们永远不会放弃的。民权——追寻自由的权利；民主——公平、自由投票的权利；民生——能够有食物、工薪与住所的权利。没有狮鹫会再受到饥饿或者贫穷折磨了！我们不会落入威权社会主义的魔爪，不会被‘民主社会主义’的塞壬所迷惑，也不会向潜伏的法西斯屈服。我们将作为民主的先锋永远挺立，解放并统一所有的鹫民！”\n\n翔日的泪流了下来。他永远没有想到自己能走到这一刻——共和国控制在狮鹫海姆的那一刻、他接任他最伟大偶像继续革命的那一刻。他的声音颤抖了，继续说道：“我发誓将保护共和国的三民主义，永远不会背叛它们。我将作为这个国家的军事总指挥。我将坚持我们的宪政，坚持共和国首任总统克梅斯凯的价值观。”在他宣誓成为总统的伟大时刻，他幸福地笑了。"
 griffonRepublic.691.a:0 "民权、民主和民生！"
 griffonRepublic.692.t:0 "海因里希·金羽的就职典礼"
 griffonRepublic.692.d:0 "“自由，应该成为狮鹫尼亚共和国的典范。它是用你自己的方式，追求自己的利益，前提是我们的社会不会试图通过专制政府措施剥夺他鹫的自由，或通过专横的法规、寡头政治阻碍他们以努力获得利益。但是，狮鹫尼亚共和国已经忘记了这个核心的原则。战争宣传散布在每一条街上，尽管我们宣称要大力支持穷鹫的福利，无数狮鹫家庭依旧生活在贫困之中，尽管我们尽了最大的努力来规范经济，但我们在漫云的土地仍然是一片死水。作为你们的总统，海因里希·金羽，我保证在市场和我们的政治中恢复鹫民的价值观和自由的价值观。我再次重复，我们应当铭记狮鹫尼亚共和国自由的核心价值——对抗社会主义暴政的自由，对抗法西斯主义喙索里尼和凶残的独裁者的自由，对抗任何寻求以独裁剥夺我们的民主政府的君主国的自由！”\n\n“我们的鹫民要求克梅斯凯回来，要求革命精神和平民主义回来，而不是艾斯特勒腐败的社会主义，也不是翔日那种缩水版的社会主义！我将给予他们这种自由！工作的自由，发展的自由，前往狮鹫尼亚共和国任何一处的自由和建设全新未来的自由！从我作为一个律师从格林盖特毕业的那天，到我与克梅斯凯一起战斗并在国际舞台上倡导共和主义的时候，再到我的内阁统治拯救了共和国免受君主制和军阀的威胁的时期，我一直都在为你们——鹫民们服务！我将继续为大家服务，直到我咽气的那天！”"
 griffonRepublic.692.a:0 "民权、民主和民生！"
 griffonRepublic.693.t:0 "里卡德·艾斯特勒的就职典礼"
 griffonRepublic.693.d:0 "“我非常熟悉工鹫阶级遭遇的苦难。我很清楚资本主义的统治几个世纪以来一直压迫狮鹫尼亚的鹫民。我发誓一切将为了工鹫，这句誓言你不会从其他候选鹫中听到，哪怕是翔日。翔日虽然是一个改革派，但是他却希望维持那个用贪欲撕裂大陆的资本主义的腐朽系统。”\n\n艾斯特勒停了一下，鹫群们爆发了激烈的欢呼。宣扬社会主义与共和思想的海报和传单处处飞扬，狮鹫们向他们的新总统挥爪敬礼。\n\n“我不会放弃狮鹫尼亚的鹫民们！”他高喊道，鹫群再次欢呼。“我不会让狮鹫尼亚的鹫民们失望！”更多的欢呼。“我永远不会在鹫民需要帮助时抛弃他们！”他清晰地说道，他的声音在狂热的鹫群中回荡。“我会终结年轻狮鹫丢掉工作回家哭泣的普遍现象！我不会让他们哭泣！（译者注：Rick Astley《Never gonna give you up》的歌词）”围绕着他的将军们开始微笑，他们坚定的眼神折射出对新总统的绝对支持。“最重要的是，我永远不会忘记我的根！我不会向他们撒关于我们的国家与政策的谎言，我更不会像那些强盗军阀那样去伤害他们！我不会让你们失望！”\n\n艾斯特勒和将领们握了握爪，也和副总统阿尔伯特·科伦尼希握爪，接下来向神灵们起誓将维护共和国的宪政。今天是共和国全新的黎明。"
 griffonRepublic.693.a:0 "民权、民主和民生！"
 griffonRepublic.694.t:0 "[GetYear]年的选举"
 griffonRepublic.694.d:0 "在我们上次选举四年之后，共和国即将迎来下一届选举，它将于今天举行。现任总统[Root.GetLeader]表达了再次竞选总统的愿望，因为目前宪法没有任期限制，而且许多公众对他们的政策也充满信心。\n\n左翼由[Root.GetCommunistParty]来代表。他们的目标是在这次选举后进行广泛和全面的福利改革，同时通过工鹫合作社和有限的市场经济社会主义来鼓励工鹫的自我管理。\n\n自由主义者和社会民主党鹫在众多自由主义政党的羽翼下联合起来，提出了许多类似共产党鹫的福利改革，但都是适度的。他们拒绝用社会主义经济理论来解释经典的爪恩斯经济学（即OTL扩大政府开支刺激经济的凯恩斯经济学）。社会民主派肯定会同时向左右两派靠拢，建立一个中间立场的共和国。\n\n以[Root.GetNeutralParty]为代表的右翼。他们提出了继续资本主义的使命，尽管他们当中那些打着军国旗号的军国主义者有更多中央经济规划的理论。右翼支持在民权、民主和民生的原则下建立一个自由共和国，提出了广泛的不干涉主义经济计划，并把重点放在共和国的中央集权上。"
 griffonRepublic.694.a:0 "选择右翼！"
 griffonRepublic.694.b:0 "选择自由派！"
 griffonRepublic.694.c:0 "选择社会主义者！"
 griffonRepublic.70.t:0 "一位英雄的离世"
 griffonRepublic.70.d:0 "从芬宁传出的消息令整个共和国陷入了震惊与悲痛当中。亚历山大·克梅斯凯，今早在他的住宅心脏病发作。尽管他的妻子紧急寻求了医生的帮助，但医生到达时，他们已经无计可施。\n\n下午十四时二十七分，在他的妻儿最后的照料之下，共和国的英雄与她的父亲亚历山大·克梅斯凯与世长辞。三十八分钟后，总统[Root.GetLeader]收到了这一消息，而国会也于今日停摆。共和国全国降半旗致哀，我们也收到来自世界各国的慰问。亚历山大·克梅斯凯一生经历无数雨雪风霜，从起义到失败，最终再度胜利。但是在生命结束前，他却从未有足够的时间与家鹫在一起过。\n\n他的妻子只是要求举办了两场葬礼。其一是作为共和国英雄与伟大总统的，其二是作为那个疏远了家庭的丈夫与父亲的。在执政生涯的终结之时，他仅仅是做出了两件事：赔罪，以及同他的家庭在一起。"
 griffonRepublic.70.a:0 "有的鹫死了，但他的梦想还活着。"
 griffonRepublic.71.t:0 "选择我们的陆军学说"
 griffonRepublic.71.d:0 "总指挥部的许多将军和军阀在吵吵我们该走哪种陆军学说，这个事件你已经用不到了，因为你只用从国策树里选就行。看到这个说明你用了控制台，不过我好奇你输这个代码干什么呢？"
 griffonRepublic.71.a:0 "我们将拥有更好的组织与计划：决战计划学说。"
 griffonRepublic.71.b:0 "我们在保证自身安全时将以弹壳淹没敌军：优势火力学说。"
 griffonRepublic.71.c:0 "我们将让所有鹫加入我们伟大的斗争：兵海突击学说。"
 FAT_grand_doctrine:0 "选择决战计划学说"
 FAT_superior_doctrine:0 "选择优势火力学说"
 FAT_mass_doctrine:0 "选择兵海突击学说"
 griffonRepublic.80.t:0 "召唤盟友"
 griffonRepublic.80.d:0 "我们刚刚收到[GRI.GetName]进攻共和国公约成员国之一的消息。作为公约的成员，我们在法理上必须对帝国宣战，加入盟友的抗争。不过，我们战胜帝国野望的机会确实是渺茫的。或许我们应该忽略这一事件并等待时机，尽管这很不光荣……"
 griffonRepublic.80.a:0 "我们将履行我们的约定。加入战争！"
 griffonRepublic.80.b:0 "我们无能为力。"
 griffonRepublic.83.t:0 "韦朗尼和他失败的革命"
 griffonRepublic.83.d:0 "阿奎莱亚的狮鹫们在历史上第二次掀起了革命，为自由与民主而战，当然也是他们在史上第二次失败。他们的努力付之西流，阿奎莱亚共和国再次被其周围的专制国家击垮，无数伟大而英雄的鹫们也因此殒命。\n\n但是，也不是所有的革命者们都在共和国被击败后销声匿迹。革命领袖泰奥多尔·韦朗尼尝试走海路逃脱躲过敌军。现在他抵达了我们的港口之一，革命烈火在他心中熊熊燃烧。他要求我们给予庇护，这样他就能接着为民主自由而战。毫无疑问的是，拥有这样一位富有经验且无比勇敢的革命者对我们很是有用，让他指挥军队就更好了。"
 griffonRepublic.83.a:0 "我们张开双爪欢迎他！"
 griffonRepublic.83.b:0 "既然他的革命失败了，那为啥我们还要搭理他？"
 griffonRepublic.85.t:0 "狮鹫尼亚共和国索取狮鹫海姆"
 griffonRepublic.85.d:0 "紧随我们同前帝国和平条约的签订，由帝国诞生的民主国家狮鹫尼亚共和国向我们送来了一条要求，其中详细阐明了狮鹫海姆是它原本的首都与革命的始源地，尽管这两者持续时间都不长。如果我们向它们移交狮鹫海姆，那么这将极大地改善我们之间的关系。但是我们希望，或者需要得到那个吗？"
 griffonRepublic.85.b:0 "明明是我们的军队浴血奋战夺取的土地，不是它们的！"
 griffonRepublic.85.a:0 "是时候让共和国回家了。"
 griffonRepublic.86.t:0 "狮鹫海姆回归了"
 griffonRepublic.86.d:0 "经过了数十年的帝国统治，我们的首都被解放了。不过不是我们，而是第三方。第三方同意了我们的外交要求，归还了狮鹫海姆。曾经那崇敬神明的礼堂再次响起了自由之声。我们感谢朋友送来这份礼物。"
 griffonRepublic.86.a:0 "共和国全体公民永远不会忘记这慷慨的举动！"
 griffonRepublic.87.t:0 "[From.GetName]拒绝归还狮鹫海姆！"
 griffonRepublic.87.d:0 "[From.GetName]胆敢拒绝归还我们正当的首都狮鹫海姆！看来只能用武力夺取了。"
 griffonRepublic.87.a:0 "那我们就要用武力夺回！"
 griffonRepublic.90.t:0 "狮鹫尼亚共和国"
 griffonRepublic.90.d:0 "在狮鹫尼亚帝国因腐败堕落而崩溃前，它是一个好战且独裁的国家，压迫着境内众多的少数民族，其中自然也包括小马。而秉持着民主、民权、民生的狮鹫尼亚共和国在其中一次起义中成立了。现在，共和国向我们提出了帮助他们抵抗一切共和主义敌鹫的请求。我们应该做什么？"
 griffonRepublic.90.a:0 "送他们一些装备，并承认他们是狮鹫尼亚合法政府。"
 griffonRepublic.90.b:0 "秘密地送他们一些枪支。"
 griffonRepublic.90.c:0 "承认他们是狮鹫尼亚合法政府。"
 griffonRepublic.90.e:0 "他们在我们的势力范围之外。"
 griffonRepublic.91.t:0 "小马利亚的帮助"
 griffonRepublic.91.d:0 "小马利亚的外交官抵达了，递给我们一张公主承认我们是狮鹫尼亚合法统治者的声明，同时为了支持我们的抗争，他们还给我们寄来了一批以枪械为主的装备。"
 griffonRepublic.91.a:0 "看来不是所有的君主制都是邪恶的。"
 griffonRepublic.92.t:0 "小马利亚的装备"
 griffonRepublic.92.d:0 "小马利亚的代理马以秘密笔记和他们送来的货物联络了我们。笔记来自公主本马，并指出为了小马利亚的声誉，这次交易必须保密。在货物中我们发现了大量小马利亚枪支。"
 griffonRepublic.92.a:0 "尽管如此，我们依旧感激他们的支持。"
 griffonRepublic.93.t:0 "小马利亚的承认"
 griffonRepublic.93.d:0 "小马利亚的外交官抵达了，递给我们一张公主承认我们是狮鹫尼亚合法统治者的声明。不幸的是，他们无法以物质手段支持我们的抗争。"
 griffonRepublic.93.a:0 "有枪的话最好，但是这依旧有用。"
 griffonRepublic.94.t:0 "小马利亚默不作声"
 griffonRepublic.94.d:0 "小马利亚在是否要支持我们这一问题上保持沉默。不但如此，小马利亚外交官也尽数撤离。这令我们自己的外交官很是恼火。"
 griffonRepublic.94.a:0 "就该知道，那些君主国都是一样！"
 griffonRepublic.95.t:0 "[From.GetName]要求阵营领导权"
 griffonRepublic.95.d:0 "一份来自[From.Capital.GetName]，由[From.GetLeader]亲自签署的公报要求[From.GetName]成为“我们同盟的指导力量”。我们该如何回应？"
 griffonRepublic.95.a:0 "他们确实更强……"
 griffonRepublic.95.b:0 "要么顺从我们，要么离开我们！"
 griffonRepublic.96.t:0 "[From.GetName]移交阵营领导权"
 griffonRepublic.96.d:0 "意料之中，[From.GetLeader]脑子足够灵光，宣布[From.GetName]将成为在[Root.GetName]领导的阵营中的次要成员。"
 griffonRepublic.96.a:0 "理应如此。"
 griffonRepublic.97.t:0 "[From.GetName]拒绝移交阵营领导权"
 griffonRepublic.97.d:0 "气死偶咧！[From.GetLeader]拒绝让我们获取我们应有的地位。我们已经离开了那个所谓的阵营。"
 griffonRepublic.97.a:0 "我们将建立自己的阵营！"
 griffonRepublic.201.t:0 "共和党右翼的命运"
 griffonRepublic.201.d:0 "在我们对克梅斯凯政府进行不信任投票的弹劾，以及亲右翼共和党将领们持续不断的小动作不断增加之后，问题就来了。我们要如何处理党内剩余的那些独裁派、右翼成员。他们基本上支持务实主义政策，主张留在漫云，而不是冒着危险向国外发动统一战争。他们由海因里希·金羽领导，金羽支持克梅斯凯对宪政的中止与独裁政策。\n\n如果我们不清理掉这些家伙，这些右翼党员可能对我们新的民主社会主义政府形成威胁，然而，与他们结盟也将是有用的，以确保国民共和党作为这个国家唯一的政党，并在这个动荡的时代团结我们的鹫民。"
 griffonRepublic.201.a:0 "清理掉这些党内的叛徒！"
 griffonRepublic.201.b:0 "我们会遵守民主进程。"
 griffonRepublic.202.t:0 "社会主义议员掌权了"
 griffonRepublic.202.d:0 "共和国内许多鹫预言克梅斯凯政府不会活得太久了。国内强盗肆虐已经二十年了，克梅斯凯在986年中止宪政造成了严重的政治动荡，反对派势力日渐积攒起力量来，尤其是社会主义者们。\n\n其中一个反对派政治家，里卡德·艾斯特勒，已经将左派团结起来，形成了共和党的一个新派别，这是一个社会主义派别，但仍支持资产阶级民主的原则，而不像天际纳维亚或者普里文的革命者提出的制度。艾斯特勒的民主社会主义理想很快就得到了支持，因为许多鹫不再相信克梅斯凯真的能把共和主义带给鹫民。\n\n社会主义议员们已经开始了一项计划，将鹫民团结在他们的旗帜下，并希望最终对克梅斯凯的政权进行不信任投票。许多鹫们认为，这将产生一位更加开放的社会主义总统元帅，如艾斯特勒，甚至还能结束讨厌的戒严令。"
 griffonRepublic.202.a:0 "有趣的变化。"
 griffonRepublic.203.t:0 "军事委员会内部分歧"
 griffonRepublic.203.d:0 "民族共和军于1008年为了反抗克梅斯凯政府成立的军事委员会已经瓦解，忠于瑰翼和曜尾的狮鹫已经开始各自建立准军事和政治组织以对抗对方的影响。在曜尾的法西斯主义者和极端民族主义者与瑰翼的漫云君主派之间经常会发生街头斗殴。\n\n瑰翼的支持者主张君主制，无论它是立宪的还是专制的。他的支持者是大多来自北方的漫云本土鹫，其声称君主制将带来共和国从未给予他们的稳定。此外，一个强大的君主领袖不会陷入国民共和党的混乱，并能迅速对北方的贫困和盗匪活动采取行动，而北方也是强盗土匪的主要活动场所。\n\n曜尾可能更危险。他的支持者，即狮鹫民族革命阵线，在几年前由于一系列的反政府恐怖袭击而被禁止，想要重建狮鹫尼亚共和国，占领狮鹫海姆，并摧毁君主制的残余。但是他们想要建立的是一个真正的民族共和国，而不是像克梅斯凯那样的民主政权。在这个民族共和国中，寡头们将会被摧毁，财富就会被分配给愿为国家与曜尾服务的鹫民。\n\n曜尾的极端民族主义、民粹主义和复仇主义意识形态开始吸引下层阶级，并可能会对瑰翼的保守主义构成威胁。但瑰翼能利用他的老练以及与北方鹫的政治关系来巩固权力吗？"
 griffonRepublic.203.a:0 "曜尾在占据多数优势时发动政变。"
 griffonRepublic.203.b:0 "瑰翼利用了君主派与漫云本土狮鹫的支持保住了自己的统治。"
 griffonRepublic.204.t:0 "曜尾夺权"
 griffonRepublic.204.d:0 "莱因哈特·曜尾，狮鹫民族革命阵线领袖与共和国将领发动了一次政变，控制了政府并处决了叛徒瑰翼，以“君主制支持者”为由清洗了政府内官员。曜尾称这些鹫应对反革命行为负责。\n\n曜尾作为一个行动派的狮鹫，一场他主导的政变早已被料到，但是政变是否会真正成功，并终结脆弱的军政府统治先前还不清楚。而瑰翼自己对完全掌权的不情不愿也令他付出了代价，这位严苛又守旧的狮鹫已经身处枪决点。在即刻处决他的一个小时后，曜尾的部队公开向军事委员会进军，要求委员会向他与他的民族革命阵线交出全部权力。委员会投降了，承认曜尾作为共和国的新总统与新元帅。\n\n曜尾的政策非常极端、危险，很多鹫认为这将是克梅斯凯失败的旧共和国体系的终结。他的极端反漫云本土狮鹫与反君主制看法，令瑰翼的支持者们担忧自己的生命，他对民族共和国投入的热情也远比克梅斯凯对三民主义的热爱要深。\n\n“同志们，朋友们，一场反抗狮鹫尼亚帝国的伟大战争即将开始，这将为共和国与狮鹫尼亚带来全新的黎明，”他在就职演说上这样说道，“我们将团结在一面光荣的旗帜下，实现那个腐朽的旧元帅永远做不到的成就，给狮鹫海姆带来真正的三民主义！”"
 griffonRepublic.204.a:0 "我们将会给狮鹫海姆带来真正的三民主义！"
 griffonRepublic.205.t:0 "瑰翼夺权"
 griffonRepublic.205.d:0 "看来狮鹫尼亚不会有新的黎明了。莱因哈特·曜尾因密谋推翻军政府而被逮捕，克劳斯·瑰翼将军担任了狮鹫尼亚民族共和国总统和共和国武装部队总司令的职务。瑰翼的政治主张与激进的曜尾不同。他是一个更为保守的狮鹫，忠于古老的君主政体，比如漫云公国，他相信这个公国过去是，将来也会是一个比克梅斯凯更好的政府。瑰翼自己同情君主立宪制，在978年的革命中战斗，对民主和自由主义也怀有忠诚。瑰翼的经济政策呢？和克梅斯凯的差不多。强大的社会民主发展将得以保持，同时有了一个强大的君主，农村的劫掠和土匪将被消灭。他还与军方的保守派有联系，他既不喜欢极端民族主义，也不喜欢社会主义，认为它们都是有害的、极端的。"
 griffonRepublic.205.a:0 "或许我们在未来将会迎来君主制的复辟"
 griffonRepublic.206.t:0 "曜尾巩固势力"
 griffonRepublic.206.d:0 "这一切如同电闪雷鸣一般。狮鹫尼亚民族共和国总统元帅莱因哈特·曜尾发出命令，处理掉成百上千的不忠士兵与军官，以及前国民共和党的政治家们。有些从家中被逮捕，扔进了漫云的旧地牢之中，最糟糕的则是直接送去枪决。那些曾经支持反抗克梅斯凯行动的将领们发觉自己现在已经被曾为之战斗的鹫关入牢房，例如那个从头到尾都在支持叛徒瑰翼的麦克斯·白羽。为了回应鹫民们的质疑，曜尾在共和国自由主义和传统主义者的所在地，翼哈根举行了一次演讲。演讲中声称这些清洗“对共和国的稳定很有必要”，并且将让他“为鹫民们带来一个属于他们自己的，而不是那些卑鄙的寡头与愚蠢的务实主义者的共和国”。"
 griffonRepublic.206.a:0 "曜尾！曜尾！曜尾！"
 griffonRepublic.208.t:0 "不服管教的军队"
 griffonRepublic.208.d:0 "自共和国建立以来，不守规矩的军队就是一个显著的问题。曜尾的部队在乡下尝试镇压匪徒的血腥行为导致了数以千计的死亡，瑰翼则被指责劫掠共和国城镇以获取补给。这些行为都无法令鹫接受，必须阻止。但是对如何阻止有两个方案。理想主义者施纳贝尔·翔日，总统最亲近的顾问之一称军队应该被重建、改革，开除那些不忠的指挥官，这样军队就能和帝国军达到同一水准。而一直都是实用主义的海因里希·金羽反对这一方案，称更快更好的方案就是安抚这些指挥官，井井有条地继续处理其他共和国事务。"
 griffonRepublic.208.a:0 "我们要进行军事改革。"
 griffonRepublic.208.b:0 "我们要安抚将领。"
 griffonRepublic.209.t:0 "瑰翼的赌博"
 griffonRepublic.209.d:0 "伴着号角齐鸣，奥斯卡·翎坛公爵骑行在漫云城的街道上，身边跟随着大批显要，其中包括总统克劳斯·瑰翼，在多年纯粹的共和党统治后，他复辟了君主制。庆祝活动的收尾是，由一支花费了大量资金从天落城租借来的专业乐队—其成员身着比公爵本尊还华丽的西装—所完成的。当公爵抵达议会大厦时，漫云城的军队为他鸣响了21响礼炮。\n\n然而，在大多数市民的家里，气氛却大不相同。共和国国民满腹疑虑。在革命扎根北方，奥托·翎坛公爵和他的妻子弗雷娅被私刑处死后多年，君主制重新复辟了。伴随着齐鸣的号角，狮鹫士兵列队横穿大街小巷，但气氛却相当诡谲，看来就连参与欢迎仪式的群众也对新君主制毫不关心。国民需要时间来适应这个新政权，这个似乎藐视共和国曾建立的一切的新政权。\n\n在一次对当地民众的演讲中，奥斯卡公爵强调需要“把君主政体的理念带回这些腐化的狮鹫心中”，并声称“共和革命是有史以来最大的灾难，使这片土地处于完全的无政府状态。这无疑是上个世纪最恶劣的事件。”流亡在韦迪纳王国的共和党领袖海因里希·金羽给奥斯卡写了一封措辞强硬的信，告诉他“在群众像对你的杂种舅舅那样对你处以私刑之前，把他那群近亲繁殖的山羊赶出这个国家”。"
 griffonRepublic.209.a:0 "公爵万岁！"
 griffonRepublic.210.t:0 "共和国的命运"
 griffonRepublic.210.d:0 "从1007年到现在，共和国已经前行了许多，那时国内还没有鹫相信共和国能再度解放帝都。通过克梅斯凯的一系列行动，我国的社会动荡已经被修复，土匪问题也被解决，士兵们对共和国之梦再度充满信心。\n\n问题来了。我们是应该继续追随我们的梦想，重夺帝都，还是说我们要做好准备，处于防御性地位等待帝国进攻，防止978年的失败重演呢？"
 griffonRepublic.210.a:0 "我们要主张进攻。"
 griffonRepublic.210.b:0 "我们必须要为帝国的进攻做好防御准备。"
 griffonRepublic.211.t:0 "克梅斯凯宣布进入国家紧急状态"
 griffonRepublic.211.d:0 "总统元帅已经宣布国家进入紧急状态，理由是目前国家的混乱状况、“帝国主义的骚动”，以及在帝国威胁被击败前，需要进行全面控制。平民活动将受到严格控制，禁止枪支销售，国会暂停。在对鹫民的广播讲话中，克梅斯凯强调，在帝国的威胁得到遏制后，国家将恢复民政府统治。但他也声称不会直接攻击帝国，称这无异于“自杀”。鉴于克梅斯凯的紧急状态将一直持续到帝国的威胁被遏制，而且他并不打算直接攻击帝国，所以紧急状态看起来几乎是无限期的。"
 griffonRepublic.211.a:0 "稳定压倒一切！"
 griffonRepublic.212.t:0 "必要的措施"
 griffonRepublic.212.d:0 "总统元帅克梅斯凯说：“我的同胞们，我确实相信共和国之梦，但是目前它是无法实现的。我们需要力量，我们需要变强，我们需要纯粹的、理性的政策。这就是为什么我们必须开始一个永久性的紧急状态。所有的国会和地方议会都将暂时关闭，共和国将处于高度戒备状态，提防我们国家的叛徒和我们大陆上的帝国主义分子。”\n\n随着克梅斯凯宣布进入国家紧急状态以保卫共和国，许多狮鹫相信他将利用这一机会进行清洗和铁血的政策，以巩固共和国的权力和荣耀。这是一个专制政权的开始吗？也许是伟大事业的开始——这是捍卫我们国家和对抗叛徒的必要紧急状态。"
 griffonRepublic.212.a:0 "共和国万岁？？"
 griffonRepublic.213.t:0 "艾斯特勒的恢复计划"
 griffonRepublic.213.d:0 "里卡德·艾斯特勒的办公室宣布了一项新的恢复计划，旨在重建帝国覆灭和狮鹫海姆沦陷后的满身疮痍的赫兹兰。轰炸、围攻和残暴的报复行动摧毁了该地区许多最伟大的城市，艾斯特勒把恢复第二次狮鹫尼亚革命造成的破坏视为自己的职责。像安江和卡特琳这样的地区已经因为他们邪恶的君主的行为而处于废墟之中，我们有必要重建这些土地，建立当地的合作社和集体农场来治愈这个国家，实施工鹫对生产资料的控制。"
 griffonRepublic.213.a:0 "从废墟中重建的赫兹兰将会民主化、社会主义化！"
 griffonRepublic.214.t:0 "反对一切寡头"
 griffonRepublic.214.d:0 "艾斯特勒一直是一个煽动者——一个彻头彻尾的民粹主义者和革命者。现在他掌权了，他的主要目标是摧毁狮鹫尼亚帝国的所有世袭制。艾斯特勒宣布，压迫鹫民的贵族、商团和工业大亨，以及旧帝国统治下的邪恶君主制度，都将被彻底摧毁。\n\n从男爵到伯爵再到王子，即使是最微不足道的贵族头衔也被取消了，现在的贵族们把他们大部分的不义之财都交给了共和国，以充分分配给鹫民。"
 griffonRepublic.214.a:0 "为鹫民伸张正义！"
 griffonRepublic.215.t:0 "新的政党联盟"
 griffonRepublic.215.d:0 "里卡德·艾斯特勒已经宣布与民主派和社会主义者都进行联合，其中包括弗羽西亚的政治家科赫尔，艾斯特勒在漫云读了他的作品后，也特别赞赏他。艾斯特勒和科赫尔一起，与安江的共和党和无政府主义反对派展开了合作，声称他已经“在历史上第一次团结了分裂的安江左派”，尽管很多鹫都怀疑将保守派和无政府主义者联合在一起的可能性。科赫尔和艾斯特勒还与埃里希·穆施贝和曲鲁斯法尔大学（一群激进但是相当空想的社会主义者）结盟。目前尚不清楚这群乌合之众——温和派、民主派、反中央集权主义者和空想家——是否会长久地站在一起以获得政治权力，但至少这是向左翼间的团结迈出的正确一步。"
 griffonRepublic.215.a:0 "团结左翼？没错，就是现在！"
 griffonRepublic.216.t:0 "和平，土地和面包！"
 griffonRepublic.216.d:0 "艾斯特勒的经济制度是建立在和平、土地和面包的基础上的。每个工鹫都有权享有和平，无论是在他的社区内还是在更广泛的国家范围内。每个工鹫都有权拥有土地，这样就不会有老板在工资奴役制度下压迫他们。每个工鹫都有权得到面包，这样他们就可以养活家庭成员，不用担心挨饿和死亡。除了民权、民主和民生的原则外，社会主义的这三项原则也将指引我们走向更伟大的未来。"
 griffonRepublic.216.a:0 "全新的、社会主义的社会。"
 griffonRepublic.217.t:0 "新时代的谐律"
 griffonRepublic.217.d:0 "在一次数百万狮鹫收听的广播中，总统施纳贝尔·翔日宣告了国家的新方针——有共和特色的谐律主义。在这演讲中，他谴责了小马利亚的独裁本性。统治了整个国家的两匹小马没有被任何的宪法所阻拦，还被普通马民当做神明敬仰。能够阻碍这两匹天角兽滥用权力的唯一事物就是她们仁慈的性格。但是，性格很容易变化，也无法保证任何王位的继承者同她们一样仁慈。接下来他把这一政治模式同狮鹫尼亚帝国使用神权信仰来确保统治合法性来进行对比。在翔日眼中，这两个君主国是完全相同的——他们都是没有宪政的帝国，利用宗教色彩说服民众支持他们。\n\n而翔日的新方针，有共和特色的谐律主义，将会用引入“真正民主”的方式来解决小马利亚谐律的弊端。宪法将会确保民众拥有自由的全国选举权，并且实施分权制度，防止了政府内部任何一方滥用权力。谐律原则也是宪法的必要部分，这将保护国内任何智慧生命的基本权利，并且禁止了任何不和谐的行为，例如歧视言论或者在群体中散播不满。作为小马利亚可以受统治者随意干预的去中心化地方民主系统的替代，共和国的现代谐律系统意味着她是一个建立在法治基础上的强大、统一的国家。"
 griffonRepublic.217.a:0 "小马利亚是个失败的国家，我们可以做到更好。"
 griffonRepublic.218.t:0 "狮鹫们的民生"
 griffonRepublic.218.d:0 "三民主义原则中位居第三，但可以说是最重要的就是民生。民生的原则规定，没有狮鹫将听天由命或在封建主子的压迫下工作。任何狮鹫有权得到一个房子，能够体面生活的工资，和不被奴役的生活。任何狮鹫都应该能够开创自己的事业，实现自己的梦想。但近年来，这一点严重缺乏，贫困只是不断加剧。为了纠正这种状况，我们必须继续对前帝国境内农民进行福利项目的推广和减税，确保他们有足够的工资维持生活，摆脱帝国强加给他们的贫困。为了支付这些雄心勃勃的新社会项目的资金，我们将提高对先前拥有土地贵族的税收，进行土地改革，甚至没收由帝国寡头控制的欠发达土地。只有这样，我们才能解放我们的鹫民，真正实现所有狮鹫的民生。"
 griffonRepublic.218.a:0 "我们的子民将不再知晓贫穷为何物。"
 griffonRepublic.219.t:0 "共和党内部分歧"
 griffonRepublic.219.d:0 "国民共和党曾经是一个统一的派别，在那时候，大多数政客的脑海中唯一的事情就是共和国的存亡。但随着共和国控制狮鹫海姆，共和党内部的分歧只会不断加强。社会主义者认为，国民共和党的民生原则与党内保守派不相容，而保守派则认为，社会主义者的反自由市场立场正在破坏民权原则。在谐律派和民主派居中的情况下，他们努力修补分歧，向双方保证共和国的价值观得到保护，但毫无效果。有时，由于经济立场上的冲突，议员们甚至会与党内的同僚发生争吵。随着政治气候日益两极化，我们面临着共和党分裂的风险，合法性也被破坏。有些狮鹫声称，为了稳定这个政党，有必要偏袒一方，而让另一方离开，但另一些鹫则认为，无论付出什么代价，我党必须团结一致。"
 griffonRepublic.219.a:0 "同社会主义者协作。"
 griffonRepublic.219.b:0 "同保守派协作。"
 griffonRepublic.219.c:0 "不惜一切代价让他们都留在党内！"
 griffonRepublic.220.t:0 "泛狮鹫尼亚之梦"
 griffonRepublic.220.d:0 "翔日对谐律政权的灭亡并不陌生——他看到了初出茅庐的共和国在狮鹫海姆死亡，并参与了向北进入漫云公国的长征。他目睹了同志们的死亡，以及“和平谐律”的谎言。“和平谐律”只是让翔日目睹君主派践踏他的同志与朋友的荣耀。不。他不会眼睁睁地看着独裁政权仍然统治着狮鹫尼亚。既然他有能力攻击这片土地上的君主国，他就会这么做，勇敢的共和国鹫民就会为追求这三民主义而前进。谐律将统治狮鹫尼亚，而克梅斯凯建立统一的、泛狮鹫尼亚国家的梦想将延续下去。狮鹫尼亚将不再受帝国统治，而是一个自由的共和国，在那里所有的狮鹫们都是生而平等的。"
 griffonRepublic.220.a:0 "我们将要解放整块大陆！"
 griffonRepublic.221.t:0 "永远的共和国"
 griffonRepublic.221.d:0 "我们的狮鹫尼亚共和国面临许多威胁，甚至来自内部的都有不少。在国际层面上，翼巴第、黑空、普里文和狮鹫岩国潜伏在南方，等待着攻击我们的共和国。南方的社会主义者和君主主义者各自密谋，结成联盟，签订了反对共和国的协议，想要把赫兹兰的巨大财富据为己有。在我国，社会主义者也对我们实行了十年之久的民主制度进行攻击，无视自由的原则。他们的信念是实行广泛的国有化，破坏我们的自由市场和资本主义制度。他们的政策无疑会摧毁我们的经济，削弱我们的民主，让他们假笑满面、魅惑鹫心的领袖玷污我们的共和国，在“恢复秩序”的虚假借口下废除共和党的统治。我们，国民共和党，明白这个共和国必须变成什么——一个宪政的共和国，远离社会主义、君主制或独裁的邪恶。"
 griffonRepublic.221.a:0 "为了宪政与自由！"
 griffonRepublic.222.t:0 "资本主义的经济原则"
 griffonRepublic.222.d:0 "狮鹫尼亚共和国的经济长期以来一直以社会民主原则为基础。克梅斯凯的主要目标之一是建立一个狮鹫尼亚上的福利国家，照顾所有狮鹫们，为他们提供住房、食物和家庭。然而，海因里希·金羽政府的保守派经济学家预测，我们的国家将会因为太多的福利支出而陷入经济崩溃，共和国货币在全国的通胀将会飙升！我们不能这样做，必须取消福利改革，而是依靠自由市场上的精英力量，这将确保所有狮鹫都会有机会获取尽可能多的财富。再也不会有针对共和国鹫民的繁重规定，也不会有迫使狮鹫们骗取政府福利过着堕落生活的福利项目。不！我们将有一个自由的市场，资本主义的经济，没有社会主义的干涉！"
 griffonRepublic.222.a:0 "所有鹫都能实现他的梦想。"
 griffonRepublic.223.t:0 "驱逐共和党左派"
 griffonRepublic.223.d:0 "今天，狮鹫尼亚共和国的保护者、国民共和党右翼成员、总统海因里希·金羽宣布将该党的社会主义派从NRP中驱逐出去。这个派别在刚发现自己被独立于整个共和国最强大的政党之后，分裂成许多不同的互相争斗的派别。而几天后，里卡德·艾斯特勒成立了狮鹫尼亚社会主义党，联合了工团主义者、民主社会主义者，甚至是暂未受影响的社会民主主义者，组成了一个大而统一的社会主义政党。随着左翼被清除出党，NRP已经转向右翼，我们实行资本主义改革将会容易得多。同时，现在有了一个合法的反对党，我们也可以开始共和国的进一步民主化。社会主义反对派的建立将是最终建立多党制的垫爪石。"
 griffonRepublic.223.a:0 "太棒了。"
 griffonRepublic.224.t:0 "必要的牺牲"
 griffonRepublic.224.d:0 "全国各地数百位曾在狮鹫尼亚帝国服役的贵族、士兵和公民被赦免了，甚至比总统元帅克梅斯凯在民主改革后赦免的数目还要多。原帝国的公务员很快被重新分配到他们曾经服务过的属国，而不是像激进分子期望的那样将他们关进地牢里度过余生。从安江到弗羽西亚，残存的贵族们获得了自由，受到了微小的惩罚，并以团结、治愈和进步的名义欢迎他们进入狮鹫尼亚共和国。\n\n作为对来自国民共和党激进左翼分子的批评的回应，金羽说“他们对复仇的盲目渴望蒙蔽了他们对建立一个更好的狮鹫尼亚的判断。”根据金羽和许多与右翼共和党有联系的政治家的说法，“统一计划”将通过与帝国政治家的系统性和解努力，以及通过与前帝国各地的贵族和实业家的接触以帮助工业发展，来恢复狮鹫尼亚社会的进步。\n\n的确，这个脆弱的共和国已经恢复了团结——理性的政策战胜了翔日和艾斯特勒的复仇主义。"
 griffonRepublic.224.a:0 "干得漂亮，金羽总统！"
 griffonRepublic.225.t:0 "首次泛狮鹫尼亚选举"
 griffonRepublic.225.d:0 "第一次泛狮鹫尼亚选举是共和国历史上竞争最激烈的一次选举——国民共和党以外的其他政党都被被允许参加，许多候选者还创建了新的政党，并为成为下一任共和国总统投下了自己的一票。\n\n最左翼的团体已经吸引了工会、劳工和失业者的大力支持。他们主张实行民主社会主义政策，进行重大的福利改革，发展合作社，实行工业民主。里卡德·艾斯特勒在还是国民共和党一员的时候，就信奉这样的价值观了，但同时还有赫尔本·科赫尔——他在弗羽西亚大公国的生活使他对民主价值观充满献身精神，尽管他在帝国摄政危机期间与无政府主义者和革命社会主义者的联系不容忽视。\n\n社会民主党以吉纳维芙·激翼为首，她是一位出生于天落的社会民主党徒和民粹主义者，也得到了劳工们的大力支持。她处理天落寡头统治下不受监管的资本主义方面的经历使她成为了一个了解普通民众困境的候选者。毫无疑问，她将建立累进税制度，并将共和国转变为福利国家，尽管如果她已经在统治天落，那么她真正就任总统职位的可能性很小。\n\n国民共和党谐律派由泰奥多尔·韦朗尼和施纳贝尔·翔日领导，他们都是和总统元帅非常相似的狮鹫。韦朗尼是一位阿奎莱亚革命者，曾多次发起革命反对腐败的迪斯克里王朝，他致力于共和主义和谐律原则，而著名的共和国将军和理想主义者施纳贝尔也许同样声名远扬。\n\n当然，中间派政党和国民共和党右派也没有缺席。翼巴第的改革主义者和乔瓦尼·德·加斯贝翼是自由放任经济、为穷鹫建立强大社会保障和与小马利亚建立友谊的主要支持者，他以一位著名的自由民主党员的身份站了出来，而右翼国民共和党的成员海因里希·金羽则坚定地支持乔瓦尼的新运动。\n\n最后一批政治家，军国主义者，由克梅斯凯的亲生儿子，坚定的共和党徒亚历山大·克梅斯凯领导。亚历山大支持共和国中央集权，加强总统地位，确保政府高效且能反映民意。反对者说他的政府将是独裁的，尽管他对这些指控一笑置之。"
 griffonRepublic.225.a:0 "社会主义者赫尔本·科赫尔！"
 griffonRepublic.225.b:0 "进步主义者吉纳维芙·激翼！"
 griffonRepublic.225.c:0 "平民主义者泰奥多尔·韦朗尼！"
 griffonRepublic.225.e:0 "中间派的乔瓦尼·德·加斯贝翼！"
 griffonRepublic.225.f:0 "小亚历山大·克梅斯凯，伟大领袖的孩子！"
 griffonRepublic.225.g:0 "身经百战的施纳贝尔·翔日！"
 griffonRepublic.225.h:0 "务实主义的海因里希·金羽！"
 griffonRepublic.225.i:0 "理想主义的里卡德·艾斯特勒！"
 FAT_we_will_reform_military:0 "§G我们将会对军队进行改革§!，§R但是这可能会触怒军阀§!。"
 FAT_we_will_placate_generals:0 "§G我们将会安抚军中局势§!，§R但是我们必须给他们巨大的让步§!。"
 griffonRepublic.226.t:0 "清剿共和派"
 griffonRepublic.226.d:0 "尽管奥斯卡一世表达了自己的真实愿望，但漫云公国的政府还是决定对国内不断恶化的共和军分子进行大规模清洗，共和军不断传播他们具有欺骗性的意识形态，并继续他们在建立自己政府的早期阶段就进行的土匪活动。\n\n在一场自986年未见的大规模的清洗中，[Root.GetLeader]定下了铲除共和党鹫持续抵抗的目标。据传抵抗是由沃尔特·埃默里克和施纳贝尔·翔日领导的，这两位强硬的前共和国将军即使在首都已经被控制、克梅斯凯可悲的政权已经驱逐之后，仍然拒绝和瑰翼一起前进。\n\n尽管我们尽了最大的努力，但直到现在翔日和埃默里克还是在没有太多阻力的情况下继续他们的行动。[Root.GetLeader]已经把根除叛国的共和党作为他的使命，即使他依旧在个体层面上认同他们……"
 griffonRepublic.226.a:0 "公国必要的措施。"
 griffonRepublic.227.t:0 "乡村的混乱激化了"
 griffonRepublic.227.d:0 "曜尾和瑰翼已经公开宣布反对政府，将其力量合二为一，归为一个共同的反克梅斯凯匪军组织。在过去的几年时间里，北方的军阀肆虐愈发严重，而今已经达到沸点。无数北方鹫已经加入了这些肆虐的土匪军队之中以换取食物和工作。而克梅斯凯政府无力向北方输送军队，甚至那些忠于他的旅团也不愿意在北方的群山中反抗曜尾和瑰翼的部队。共和国国民对我们的政府日渐失望，我们却无法扭转这一势头，现在我们甚至不能往北方派兵。曜尾和瑰翼彻底占据了上风……只能看他们如何利用这一局势了。"
 griffonRepublic.227.a:0 "天哪！"
 griffonRepublic.228.t:0 "共和派异见者获得宽恕"
 griffonRepublic.228.d:0 "令我们震惊的是，奥斯卡·翎坛赦免了许多在军政府接管并恢复漫云公国君主制后，逃离该国的共和党鹫。当奥斯卡·翎坛首次掌权时，共和党鹫正秘密策划重新控制政府，他们与农民运动甚至共产主义组织都有联系。然而，有了这一新举措，我们的将军们确信共和党鹫将不再是漫云公国的威胁。\n\n忠于克梅斯凯的将军们，如施纳贝尔·翔日，被允许安全返回漫云城，尽管他们是否继续在军队服役还有待决定。此外，国民共和党的保守派和中间派成员海因里希·金羽和托比亚斯·谢芬霍夫等国会议员也被允许自由返回共和国，他们将被允许参加即将举行的国会选举。公爵的统治目前是专制的，但随着他对共和党鹫的大赦，漫云可能会转向民主。"
 griffonRepublic.228.a:0 "这是向君主立宪制前进的一步？"
 griffonRepublic.229.t:0 "公爵权力法案"
 griffonRepublic.229.d:0 "在麦克斯·白羽和喀戎·暴风羽将军的催促下，奥斯卡·翎坛一世已经将他的大部分权力移交给了共和国的元帅，后者将承担大部分的行政职责。这些职责包括：在未经公爵批准的情况下任命内阁部长，向公爵领地内的贵族发出最后通牒和交涉，以及要求进行任何可能的选举或国会会议。\n\n奥斯卡别无选择，只能接受这些要求。因为不幸的是，如果他不同意，将军们很可能会暗杀他，用另一个对他们的目标更友好的王朝成员取而代之。随着奥斯卡在法案上签字，大部分权力现在再次移交给了建造了漫云公国的军阀们。"
 griffonRepublic.229.a:0 "我还以为这是个是绝对君主国？"
 griffonRepublic.230.t:0 "漫云的临时领导者？"
 griffonRepublic.230.d:0 "我们在革命斗争中的忠诚盟友漫云社会主义共和国派了一名外交特使，要求我们选择漫云社会主义共和国两名候选者之一担任临时领导鹫。\n\n第一个候选者是社群派的里卡德·艾斯特勒，他支持民用经济，并与漫云的共和党抵抗力量达成和解，后者仍然支持误入歧途的克梅斯凯的意识形态。艾斯特勒的政策包括发展民用工厂和基础设施，以及与还在抵抗的共和党官员会面，以解决军队和平民与漫云本土居民融合的问题。\n\n下一个候选者，是国际派的默·燕祸将军，他策划了支持天际纳维亚反抗共和国的起义，并支持社会主义者抵抗克梅斯凯的统治。当上主席后，他肯定会制定军事化和镇压共和党抵抗的政策。燕祸相信共和党鹫是反动派，因为他们废除了宪政，还疏远他们的社会主义盟友。\n\n燕祸和艾斯特勒有不同的政策，但都致力于天际纳维亚的事业和社会主义，都是我们在该地区扩展影响力的安全选择。"
 griffonRepublic.230.a:0 "安排社群派的艾斯特勒。"
 griffonRepublic.230.b:0 "安排国际派的燕祸。"
 griffonRepublic.230.c:0 "为其他国家指定领导鹫？太帝国主义了……"
 griffonRepublic.231.t:0 "天际纳维亚指定了艾斯特勒"
 griffonRepublic.231.d:0 "我们的特使已从我们忠诚的盟友和解放者天际纳维亚那里返回。他带来一份来自天际纳维亚主席的官方文件，称艾斯特勒将成为漫云社会主义共和国的临时主席，而不是国际派的燕祸，他们认为后者是一个贪图权力的将领，根本不会关心鹫民与国家的稳定。\n\n艾斯特勒是个更接近民主社会主义者的鹫，甚至比天际纳维亚的某些鹫更加自由主义。他相信有些资本家和反动派可以被改造，这将让他得心应手地解决残存的旧共和国抵抗。"
 griffonRepublic.231.a:0 "听起来是个好选择。"
 griffonRepublic.231.b:0 "我们不会允许贪恋权力的外国议会来替无产者们做决定！"
 griffonRepublic.232.t:0 "天际纳维亚指定了燕祸"
 griffonRepublic.232.d:0 "我们的特使已从我们忠诚的盟友和解放者天际纳维亚那里返回。他带来一份来自天际纳维亚主席的官方文件，称燕祸将成为漫云社会主义共和国的临时主席，而不是社群派的艾斯特勒，他们认为后者其实是个资本主义者，理由是他过于同情旧共和国的抵抗势力，以及支持社民主义的经济结构。\n\n燕祸是一个愿意为社会主义价值观献身的候选鹫。他对工业和农场的集体化，以及为所有工鹫建立工业民主没有意见，对清除旧共和国的卑劣抵抗更加没有意见。"
 griffonRepublic.232.a:0 "听起来是个好选择。"
 griffonRepublic.233.t:0 "天际纳维亚允许我们自己选择领导鹫"
 griffonRepublic.233.d:0 "我们的特使已从我们忠诚的盟友和解放者天际纳维亚那里返回。他并没有带来什么文件，而是声称天际纳维亚的委员会告诉他要允许漫云委员会自主选举领袖，他们觉得干涉他国内政太过帝国主义了。不过，他们确实入侵了我们，这个嘛……\n\n选举将在未来35天内举行，来自漫云共和国各地的工鹫委员会将被邀请参加辩论，并派代表前往首都。我们的第一次社会主义选举即将开始！"
 griffonRepublic.233.a:0 "等等，真的吗？"
 griffonRepublic.235.t:0 "曜尾的正义"
 griffonRepublic.235.d:0 "小皇帝，格罗弗六世。革命的摧毁者，神官厄洛斯七世。施塔莓女公爵，嘉比蕾拉·鹰爪。公国继承者，艾德慕·鹰爪。“高贵将军”，伊利亚斯·铜尾。帝国的走狗，铜岭伯爵伊格纳蒂乌斯。这些家伙们被召至大断头台，并被执行了正义的砍头。\n\n出乎意料的是，在正义终于降临到这些最为肮脏的，摧毁了狮鹫尼亚共和国的，复辟了那个腐朽君主制的叛徒们头上时，鹫群洋溢着赞美与欢笑。共和国的橙黄橙三色旗在狮鹫海姆各处飘扬，在它两侧的是莱因哈特·曜尾的狮鹫尼亚民族革命阵线旗帜。\n\n这是曜尾最伟大的一天。终于，他为犯在他伟大共和国上的罪行完成了复仇——推翻了亚历山大·克梅斯凯的虚弱统治，将共和国改革为一个为泛狮鹫尼亚民族事业与反君主制事业献身的民族主义国家，现在他做了克梅斯凯永远做不到的事情。反革命行为已经被粉碎，神官，小皇帝，施塔莓阴险的贵族和铜岭的恶犬们，他们对神灵和鹫民的罪行终于有了报应。革命业已成功。"
 griffonRepublic.235.a:0 "北风神至上……"
 griffonRepublic.236.t:0 "铜岭的命运"
 griffonRepublic.236.d:0 "钻石狗。叛徒。帝国的鹰犬。在第一次与第二次革命期间，他们以荒唐的“保护皇帝”为借口屠杀了成千上万的共和国士兵，是时候让他们为自己恶毒的罪行付出代价了。这些狗子对三民主义毫无忠诚可言，他们对一个自由的狮鹫尼亚共和国也毫不关心。该国由被解放的奴隶建立，但是他们又变成了奴隶——独裁专制又无比腐朽的帝国皇帝的奴隶。\n\n曜尾命令数以千计的钻石狗贵族流放到钻石山与河联，这其中也包括无数参与反共和国战争的将领。《钻石狗权利法案》在共和国国会全票通过，强制把铜岭的钻石狗划入隔离系统中，这些系统由狮鹫管控着。尽管河联与钻石山官方都发表了对共和国的谴责，曜尾依旧在进行隔离与流放计划，称“河联并不清楚这些恶犬对我们的共和国犯下了什么样的滔天大罪”。"
 griffonRepublic.236.a:0 "太棒了。"
 griffonRepublic.237.t:0 "狮鹫尼亚民族共和国流放了铜岭的贵族"
 griffonRepublic.237.d:0 "引发我们恐慌的消息从目前控制着帝都和钻石狗铜岭公国的狮鹫尼亚民族共和国传来了。民族共和国，奉行极端亲狮鹫原则，以钻石狗协助帝国，阻碍共和国在狮鹫尼亚革命中获得胜利为理由厌恶钻石狗。他们已经流放了成千的钻石狗贵族和要员，现在他们已经到达了钻石山，回到了他们当初被流放的地方。\n\n尽管这些钻石狗在多年以后重返我们这里看起来有点讽刺，但是更让我们担忧的是那些狮鹫们，他们居然敢这么对我们的同胞下爪。我们必须永远准备好同这个新的“民族共和国”作战，他们和冥翎、长剑的家伙们没有什么两样，他们都是种族屠杀的疯子，必须被制止。"
 griffonRepublic.237.a:0 "他们的罪行永远不会被宽恕。"
 griffonRepublic.238.t:0 "全新的梦想"
 griffonRepublic.238.d:0 "克劳斯·瑰翼终于做到了。978年时的革命者认为不可能实现的君主立宪制，出现在了漫云城和共和国，在瑰翼精明能干的政府管理和奥斯卡的仁慈统治下，国家繁荣昌盛。\n\n克梅斯凯总是告诉瑰翼，君主立宪制只会通向导致狮鹫尼亚帝国腐败的阶级制度，但他错了——他一直都是错的。议会制——由谢芬霍夫的漫云狮鹫权利党、瑰翼的立宪党和萨克哈根的传统党组成——比旧共和国只有国民共和党独大的一党专政更为优越。这里没有社会主义，没有曜尾和暴风羽邪恶的法西斯主义，只有民主和自由，而鹫民发自内心地热爱让他们重得三民主义的君主制。起初，他们对奥斯卡·翎坛嘘声一片，现在，每当他经过，民众都会向他敬礼，而当克劳斯·瑰翼随行时，他们欢呼雀跃。\n\n三民主义确实重返了共和国，但这次，是在国民的君主和他忠诚的国务大臣的旗帜下，而不是在用铁腕和腐化的共和主义粉碎了共和国的，魅力非凡但冷酷无情的独裁者统治之下。"
 griffonRepublic.238.a:0 "民权、民主、民生，和君主制！"
 griffonRepublic.239.t:0 "重开国会"
 griffonRepublic.239.d:0 "自986年总统元帅亚历山大·克梅斯凯暂停宪政以来，漫云城首次举行了国会选举，来自共和国各地的政治家和有影响力的狮鹫们竞选他们的地方职位，无论他们是左派、右派还是中间派。\n\n即使是非国民共和党的政党，如亲小马利亚的谐律党派自由民主党和北方漫云鹫领导的漫云狮鹫权利党，也设法获得了少量的席位，但自然还是NRP最终获得了议会的多数席位。\n\n然而，这些席位在NRP的不同派系之间严重分裂，很显然，要创造一个稳定的政治局势，就必须在党内建立联盟。由于NRP的左、右、谐律派三个派别都参加了进行联盟谈判，看来这个共和国很快就会有一个有序的执政联盟。"
 griffonRepublic.239.a:0 "自由派和社会主义者组成联合政府。"
 griffonRepublic.239.b:0 "自由派占据多数席位。"
 griffonRepublic.239.c:0 "自由派和保守派组成联合政府。"
 griffonRepublic.239.f:0 "保守派占据多数席位。"
 griffonRepublic.240.t:0 "克梅斯凯政府"
 griffonRepublic.240.d:0 "“亚历山大·克梅斯凯，国会决定从现在起免除你共和国总统的职位，以及其赋予你的一切权力。过渡期总统将是里卡德·艾斯特勒，一个年轻但是适合这个位置的狮鹫。元帅阁下，鉴于您对共和国的贡献，我们将允许您退休回到翼哈根的家，给予您一笔丰厚的养老金。”\n\n随着国民共和党左翼上台，克梅斯凯的执政生涯也终于到了尽头。他仅仅保留“国父”之号、还有一个议会中的荣誉席位，并作为新总统的特别顾问。克梅斯凯没有如他的朋友们所担心的那样公开反对政府，而是遵从了党的命令，和他的子女一起回到了翼哈根海边的家。\n\n随着里卡德·艾斯特勒的上台，共和国现在进入了社会主义阶段，并且共和党的左翼很可能会同谐律派合作。新政府宣布他们依旧坚信共和国之梦，并且不会向天际纳维亚方面屈服。艾斯特勒同天际纳维亚有勾结的怀疑也就此打住。\n\n被罢黜的前总统克梅斯凯在翼哈根的新家这么对漫云报纸评论道“这简直是个无比令鹫恶心的举动，就算这是他们自称的民主社会主义，但这是在我们共和国所象征的一切之上吐了一口浓痰！”，但是他“没有选择”，只能服从并离职。这究竟是共和国之梦的新阶段呢？还是一个共和国在社会主义统治之下的噩梦的开始呢？"
 griffonRepublic.240.a:0 "再见了，老头子。"
 griffonRepublic.241.t:0 "格罗弗六世的重生"
 griffonRepublic.241.a:0 "他也摆脱了自己的束缚。"
 griffonRepublic.241.d:0 "克梅斯凯望着面前的小狮鹫，感到自己的年龄像石头做的枷锁一样压在他身上。对方只是一个孩子，甚至还不到十五岁，却坚定地穿着他的橙色的皇袍和头上的皇冠站在那里。对方很害怕，克梅斯凯身经百战了，他的眼睛不会放过这样的细节。但六世仍然站在宝座前，凝视着自己的目光，目光里充满了恐惧、愤怒、骄傲、决心与蔑视。\n\n“嗯，革命者？”男孩说。“你是来欣赏一个皇帝的死吗？”他的声音在最后一个音节时几乎停顿了。即使他坚定地站在那里，他发出的也只是一个孩子的声音！\n\n“厄耳至上，不，”克梅斯凯叹了口气说。他走到屋里更远的地方，拿起椅子，把它拉到宝座前，坐在上面，抬头看着男孩。五分钟、十分钟过去了，小格罗弗才慢慢地坐下来。“对不起，”克梅斯凯对年轻的王储说，他的爪子紧握在一起。“你父亲去世时你才四岁，你的童年在那时也就结束了，是吗？11年对你来说是很长的一段时间。”\n\n“我知道我是什么，叛徒！”格罗弗六世怒斥道。“我是狮鹫尼亚合法的皇帝，我再也会不是别的什么了！”\n\n“完全正确。”克梅斯凯悲伤地表示同意，并阻止了格罗弗的话语。“医生格罗弗，或者是园丁格罗弗……还可能是面包师格罗弗。那些都是不可能的。你永远无法选择。你从来没有自己的生活…你从来没有生活过。”克梅斯凯停住脚步，叹了口气。“想必你也很恨我吧，我对你而言何尝不是一个老怪物呢？但或许到你长大的哪一天，你会明白的……或许你不会，你依旧讨厌我。但是至少到那个时候，你会发现你可以为自己做出选择。”"
 griffonRepublic.242.t:0 "小皇帝的命运"
 griffonRepublic.242.d:0 "在我们夺取狮鹫海姆接下来的几个星期里，赫兹兰的局势基本得以稳定，我们鼓励当地的共和运动，[Root.GetLeader]也和许多民主与共产领袖会面。但是尽管我们尽力改革我们全新的共和国，扭转978年的失败，我们所有狮鹫脑海里还是有这么一个问题。\n\n小皇帝。\n\n格罗弗六世在进攻狮鹫海姆时被共和国间谍抓获，以防止愤怒的鹫民将他处以私刑，就像978年对摄政议会的绝大多数成员一样。不过，他还是在自己的皇宫下面的地牢呆了许久。他被给予面包、饮水和一个适合的居住环境。但是，就算是他自己，也在问，“成为皇帝会意味着什么？”\n\n这个问题在共和国国会里被询问很多次了。尽管翔日一直忠于民主原则和共和国的统一，要求我们在小皇帝身上执行正义，理由是“他的父亲、他自己和他的摄政议会对狮鹫尼亚鹫民犯下了不可饶恕的罪行。”但是，克梅斯凯很快就打住了他的发言。克梅斯凯称他将不会以复仇为名让任何一个孩子血流成河。一直都很务实的海因里希则称格罗弗六世必须作为一个共和国的新公民而被解放，为了昭示“我们远远比那些腐朽邪恶的帝国主义者要好”。他的提议是移除小皇帝的头衔，这样他和他的家系对共和国就不会有什么威胁了。另一个选项也出现了，埃里希·克里格，一个共和党保守派和实业家提出我们可以简单地把格罗弗六世送到小马利亚，他们将会教他友谊与谐律之道，同时也不太可能用他作为反对我们的政治资产。\n\n克里格的流放与金羽的给予公民权这两项提议经过了火热的辩论，最后的决定是……"
 griffonRepublic.242.a:0 "让他作为共和国的新公民。"
 griffonRepublic.242.b:0 "把他流放到那个两公主统治的小马利亚。"
 griffonRepublic.243.t:0 "格罗弗六世的流放"
 griffonRepublic.243.d:0 "如何处理帝国王子成为了新生共和国棘爪的问题之一。如果剥夺他的权力，让他作为共和国公民的话，还不足以平民愤。但是共和国政府到底要对这年轻的狮鹫做什么呢？以其父亲与摄政议会的罪名而监禁迫害他吗？这种方案既不公平，也太荒谬。具有讽刺意味的是，解决之道似乎藏在某个君主国之中，或者说，那个两公主统治的国度。\n\n小马利亚在此时选择帮助我们，为这位年轻狮鹫提供庇护。他们将会给他一个全新的住所与教育，或许还能有他鹫生的新目标。对王子而言，扔到那里已经足够了。尽管小马利亚有自己的政治缺陷，但是他们的外交立场足够坚定，我们也相信小马利亚未来不会利用他来反对我们。\n\n随着年轻的格罗弗被护送到已有船只等待的码头时，我们的脑中闪过一句格言“妥协会使大家同样不快”。强硬派认为这是对共和事业的背叛，残余的君主派认为这是我们的又一桩罪行。不过，没有鹫会因此过于恼火，这将给予共和国一个证明自己的机会与时间。就算格罗弗在二十年或者更久之后返回，他回到的将是一个全新的狮鹫尼亚。"
 griffonRepublic.243.a:0 "再会了，孩子。"
 griffonRepublic.244.t:0 "巡视芬宁"
 griffonRepublic.244.d:0 "当克梅斯凯走过他曾经生活、工作和玩耍的地方，他家族的别墅时，他每一步的声音都回响在空荡荡的大厅里。这所房子年久失修，濒临死亡——克梅斯凯的父亲、伟大的阿德斯男爵的画像被撕破了，倒在一边，证明了他曾经高贵的家族的没落。革命是克梅斯凯家族即将灭亡的原因，这使他感到悲哀。他仍然记得过去的日子，那时他和格罗弗四世在狮鹫海姆巡视，并获得了荣誉勋章。那些是更为美好的日子——当时为争取更为美好的狮鹫尼亚而进行的斗争还没有把整个大陆撕裂。\n\n但他不是来这儿追忆过去的。他的侄子奥古斯都二世在革命后被软禁在这里有数周之久。克梅斯凯有责任和他最后说一次话——公正而有尊严地审判他。\n\n“叔叔。”奥古斯特带着眼中冰冷的怒火对克梅斯凯说：“你是准备像杀我父亲和小皇帝的父亲一样杀了我，还是在这里让我屈服？”\n\n“我不是来和你决斗的。”克梅斯凯坐在他侄子对面说，“但是如果你继续散布谣言说我毁了你的家庭，那我就没得选择了。”\n\n“你才是骗子！”奥古斯特尖叫着，忘记了他是在对共和国元帅总统说话，“是你的亲信在狮鹫海姆的大街上枪杀了我的父亲，是你自己下令处决了我的祖父，你自己的父亲！”\n\n克梅斯凯想要开口说话，但他的侄子尖叫着抢了他的风头。“是你诅咒了我们的家庭，令其衰竭腐坏，是你终结了我们贵族之位！现在我们是芬宁的混球，皇族的崽子！而现在你来找我，期待共和国的公正，期待我屈服于你的要求，成为你的傀儡！”\n\n他又无精打采地坐在椅子上，叹了口气，最后说了一遍话。“做你必须做的。如果我要上绞刑架，我将作为克梅斯凯家族和帝国的一名骑士面对它，而不是一个尖叫的小畜生。”"
 griffonRepublic.244.a:0 "离开吧，侄子。我不想再见到你了。"
 griffonRepublic.244.b:0 "所有鹫都能在共和国里找到合适的位置。"
 griffonRepublic.245.t:0 "贵族的命运"
 griffonRepublic.245.d:0 "贵族。在革命中击败了共和党鹫，并从那时起继续压迫狮鹫尼亚鹫民的叛国者和狭隘的罪犯们。\n\n旧狮鹫尼亚帝国的大多数公爵、伯爵和男爵都被共和军逮捕并投入监狱，尽管我们的行动没有快到把那些小贵族留到审判——许多贵族在共和国的街角与临时搭建的绞架上被暴民用私刑处死。鹫民们压抑已久的对贵族的愤怒爆发了，谐律派和社会主义者都呼吁对这些叛国者进行审判和处决。国民共和党谐律派的领袖施纳贝尔·翔日宣称，“根据民权、民主和民生的原则，必须为这些叛逆贵族的罪行执行正义。”\n\n然而，并不是所有的共和党政客都对老狮鹫尼亚帝国贵族抱有敌意。一贯保守和务实的海因里希·金羽曾宣称，对贵族的评判必须“依据他们时代时的法律和道德，而不是我们的复仇和嗜血”。虽然金羽的信仰在普通的共和国公民中并不受欢迎，但许多右翼鹫和前帝国公务员都支持金羽的想法——我们可能不得不做一些不可思议的事情来拯救共和国，例如让这些叛徒活下去。"
 griffonRepublic.245.a:0 "必须为贵族的罪行实施正义的审判。"
 griffonRepublic.245.b:0 "抹除他们的头衔就足够了。"
 griffonRepublic.246.t:0 "神官的安排"
 griffonRepublic.246.d:0 "很明显，我们不能再让厄洛斯、厄里翁和普罗透斯参加宗教活动了。所有这些鹫都被判为狮鹫尼亚共和国和公平公正信仰进程的叛徒——但新的问题是，谁将取代他们？\n\n由公务员奥拉夫·雷岑领导的一个共和党派别主张恢复一个中立的神庙体系，只任命最具神学天赋的教士和祭司来担任新神官的角色。来自弗羽西亚的北风神庙的一位杰出祭司，马特·比莫特，是雷岑派系所支持的——如果他掌权，他将被加冕为北风神的神官奥鲁姆（Aurum，黄金）六世。\n\n然而，许多狮鹫对奥鲁姆六世和他所谓的“中立”提出了质疑。施纳贝尔·翔日的心腹、著名的共和党将军沃尔特·埃默里克曾宣称，任何“中立”的祭司都是那种一得到通知就会把共和国出卖给反革命分子的家伙。相反，埃默里克主张将白尾的阿瑟·克莱普纳加冕为神官，他声称克莱普纳更忠于民主共和的事业。克莱普纳的改革主义被许多神庙里的狮鹫视为是极具破坏性的，但他是共和事业的完美神官——如果他掌权，他将成为神官瓦格拉斯（Vulgaris，拉丁语）一世，意思是一个出身普通鹫民的狮鹫神官。"
 griffonRepublic.246.a:0 "任命中立的神官们。"
 griffonRepublic.246.b:0 "任命忠于我们、忠于共和国的神官们。"
 FAT_astler_chosen:0 "里卡德·艾斯特勒被选为领袖。"
 FAT_appoint_whoever:0 "我们可以选择我们所希望的领袖。"
 FAT_sparrowsbane_chosen:0 "默·燕祸被选为领袖。"
 griffonRepublic.2251.t:0 "国民共和党党内初选"
 griffonRepublic.2251.d:0 "由于即将举行的选举将包括我们所有的新征服的狮鹫尼亚地区，以及来自数百个不同城市、省份和镇子的政治家，国民共和党必须决定它需要参加下次选举的候选鹫。共和党的左翼已经团结在赫尔本·科赫尔领导的狮鹫尼亚社会主义党的周围，并且离开了我党。\n\n这两位候选者是社会民主主义的共和革命家泰奥多尔·韦朗尼，他来自阿奎莱亚。第二位候选者小亚历山大·克梅斯凯更为专制，但也更亲民。他是伟大领袖亚历山大·克梅斯凯的儿子，亚历山大·克梅斯凯领导了978年革命和1010年代的二次革命。两位候选鹫都支持克梅斯凯的观点，但他们对行政权力、宪法和鹫民都有自己的看法。当然，我们已经还有一个显而易见的候选者——我们的现任总统，他把狮鹫尼亚地区的所有狮鹫都团结在了国民共和党的领导下。尽管再多一个任期会引发国内更多对威权主义的恐惧，但它也是通往胜利的明确道路，并将确保一个由共和主义、稳定和鹫民主导的未来。"
 griffonRepublic.2251.a:0 "泰奥多尔·韦朗尼将给予我党活力。"
 griffonRepublic.2251.b:0 "小亚历山大·克梅斯凯将恢复共和国的信仰！"
 griffonRepublic.2251.c:0 "让现任总统去吧。"
 reform_military:0 "选择进行军事改革"
 placate_generals:0 "选择安抚将领"
 griffonRepublic.250.t:0 "克梅斯凯的大清洗"
 griffonRepublic.250.d:0 "在宣布全面戒严之后，总统元帅克梅斯凯开始以986年天际纳维亚革命后从未见过的努力来清洗国内社会主义者和其他的异见元素。社会主义者、工会领袖，甚至一些谐律派发现他们要么被开除出党，要么被流放出国，要么被关押起来，或者以通天际纳维亚敌之名面临审讯。\n\n或许国内在戒严之后反应最大的反政府势力就是克梅斯凯自己的国民共和党左翼了。他们在各地举行游行示威，呼吁“民主”与“自由选举”。里卡德·艾斯特勒在街道上奔走，每日每夜聚集起数百工鹫站起来反对克梅斯凯政权，并呼吁从一开始就期望共和国进行社会改革并取得进展。他的行为已成为对狮鹫尼亚共和国的严重威胁。尽管左翼党本身尚未开始面对清洗的许多预期影响，但元帅却认为，清党是阻止未来可能发生的社会主义袭击的关键。\n\n严苛的警告已经被发送到左翼党的所有成员，告知他们共和国的法律，并要求他们适应。在漫云城的街道上已经有越来越多的警察，逮捕了已经表现出对共和国不忠的法西斯主义者，社会主义者和共产主义者。"
 griffonRepublic.250.a:0 "全是叛徒。"
 griffonRepublic.251.t:0 "大规模抗议"
 griffonRepublic.251.d:0 "撰写了无数有关狮鹫尼亚共和主义和民主制的高产共和国作家与历史学家科尼利乌斯·温克发表了他的新书——《克梅斯凯的大屁话》，在他的书中他刻薄地嘲讽了克梅斯凯政府过去一年以来的行为。“克梅斯凯是个夸夸其谈的家伙”，他这么写道，“除了打仗，他不懂别的什么东西，现在他连仗都不想去打了，所以他最好还是坐在那里，等着他腐朽的身体入土为安吧。”他的这番话得到了多数称赞，这本书很快成为国内最畅销的书。\n\n在我们的政府试图查禁这本充斥着邪恶的、完全都是无中生有的内容的书本时，温克已经制造了足够的骚动，足以触发针对总统元帅的大抗议，哪怕是在军政府支持度很高的北方也是这样。不幸的是，越来越多的狮鹫正在上街，举着“消灭元帅暴政”“漫云属于共和”这样的抗议标语。\n\n我们的政府将不得不应对这一新的危机，否则将面临灭顶之灾。"
 griffonRepublic.251.a:0 "娘希匹。"
 griffonRepublic.252.t:0 "燕祸的公社"
 griffonRepublic.252.d:0 "在全国都在反克梅斯凯抗议中震动，温克和他的数千支持者夺取了荒芜之峰之时，北方则被认为是沉默的。将军们被压制了，鹫们认为北方将恢复对元帅总统的坚定忠诚。\n\n我们错了。\n\n原先忠于共和国的亲天际纳维亚激进分子默·燕祸，已经调转枪口，在共和国北部建立自己的公社。他正在走私越来越多的天际纳维亚武器入境，希望发动一次武装革命。\n\n将领燕祸的权势与影响力在北方壮大，翼哈根、荒芜之峰和漫云的大型示威还在进行，我们要快速采取行动。"
 griffonRepublic.252.a:0 "赤匪现在也参合进来了？"
 griffonRepublic.253.t:0 "左翼党的终结"
 griffonRepublic.253.d:0 "在克梅斯凯决定重新考虑左翼在党内的地位这一紧迫问题时，艾斯特勒的左翼共和党已经经历过一轮清洗了。在戒严期间，这次清洗消灭了党内最糟糕的一批鹫，把默·燕祸流放到北方，并且在政府中移除了所有公开发表革命观点的社会主义者。\n\n但是，随着独裁与永久紧急状态的宣布，社会主义者们再度被克梅斯凯激怒。而很明显我们不能再在党内容忍他们了。在过去的几个星期里，忠于克梅斯凯的特务和军官们展开了一次对社会主义运动的全面调查，关押那些被认为通天际纳维亚之敌的狮鹫们。\n\n全国都设立了裁判所和特别法庭，对忠于共和国的公民而言，毫无疑问的，大量左翼共和党狮鹫和他们的盟友，例如不可信任的工联主义者，都被查出密谋勾结天际纳维亚以颠覆政府。根据我们特务的报告，艾斯特勒自己收受亲天际纳维亚工会和革命组织的数千北风币——真是个他叛国的典型例子。\n\n随着审讯结束，没有左翼党员是安全的——下场最好的是终结了政治生涯，更多地则是被关押或者流放。"
 griffonRepublic.253.a:0 "虽然很遗憾，但我们必须去做。"
 griffonRepublic.254.t:0 "漫云城大镇压"
 griffonRepublic.254.d:0 "三十年以来的第一次，军队踏上了漫云的街头——目的是将城内任何反共和国的抵抗剿除。这一次，军队的角色不再是解放者，而是压迫者。街道上弥漫着诡异的寂静，大多数狮鹫都在家中踱步，等待着武装部队完成安排的反恐任务，离开城市。这次，当亚历山大·克梅斯凯再次驱车巡视漫云的街道时，看到的只有鹫民无比的畏惧。\n\n武装部队进入了漫云的每一间酒馆，每一处饭店与每一座仓房，寻找并审问着叛乱背后是谁在谋划，又是谁在煽动对克梅斯凯政权的不满。克梅斯凯一如既往地在总统府发表了讲话，但是这次他的演讲只有极少数的鹫在场，而不像以往他所适应的鹫山鹫海。演讲本身也极为短促，仅仅提到了叛徒里卡德·艾斯特勒，他的职位已经由一个军事长官替代。从现在起，漫云进入了戒严状态。"
 griffonRepublic.254.a:0 "这样城里就不会有动乱了。"
 griffonRepublic.255.t:0 "燕祸的失败"
 griffonRepublic.255.d:0 "对于燕祸而言，很不幸，当我们进入北方时，没有任何意外的地方，也没有任何陌生的地形拖延我们的部队。先前共和国军就经常在这一带抗击军阀，现在他们比燕祸自己的部队更能适应寒冷的地形。在麦克斯·白羽——克梅斯凯选择的那个最反感天际纳维亚社会主义，并且在瑰翼爪下适应了北方的地形的狮鹫——的指挥下，共和国军在寒冷的积雪中缓慢前行。白羽的部队之后到达了失落之门的附近，他们遭遇了装备有步枪和铲子的大量的社会主义革命者和亲天际纳维亚工鹫。\n\n白羽毫不留情。\n\n当白羽回到克梅斯凯那里之后，他仅仅是告诉老元帅，他交付的任务已经完成，燕祸的部队不再是共和国的威胁。克梅斯凯并没有询问白羽那里发生了什么，在对方进来之前他就清楚白羽肯定是用共和国军队所期望的力量屠戮了社会主义叛军。对老元帅而言，是正义之举——是对986年革命之罪的正义之举，也是一堂上给天际纳维亚狗的胆寒的一课。"
 griffonRepublic.255.a:0 "全都是天际纳维亚的赤匪，叛徒。"
 griffonRepublic.256.t:0 "荒芜之峰的围困"
 griffonRepublic.256.d:0 "荒芜之峰的疯狂作者，科尼利乌斯·温克，在市政厅里躲藏了几个星期，也在本地区和本城中窝藏了数以千计的共和党鹫。他在与克梅斯凯政权的最后一波的斗争中落败。现在，这个疯鹫的运气用完了。\n\n坦克与步兵踏上了荒芜之峰沉寂的街道，鹫民们惊恐地躲在家中，而叛贼们则在自己的堡垒中躲避。关于克梅斯凯大清洗的事情已经传开，越来越多的鹫认为他是个独裁者与暴君——他是个被大家所恐惧，而不是被爱戴的鹫。这次迎接克梅斯凯部队的没有什么排场或者彩带，某些市民甚至向那些正在前往市议会，打算终结温克胡言乱语的共和国士兵们报以讥讽的话语。\n\n这是一次短暂的战斗。温克七拼八凑的部队在共和国的老兵面前轻易地粉碎，这次战斗令他自己也奄奄一息，在他向共和国的“叛徒”们发出最后一击后，他浑身都是伤痕和淤青。这个意识不清的狮鹫被简单地治疗，之后送到了漫云城。在那里，总统元帅与众神的正义在等候着他。\n\n直到上绞刑架前的最后一刻，温克还是满口粗鄙之语，诅咒着“虚伪的共和国”和“玛尔一般的虚伪统治者”。面对绞刑台，自己生命的终点时，他的眼睛瞪大了，随后即是行刑。克梅斯凯和翔日也在鹫群中，注视着这共和国最伟大的狮鹫之一在他们眼前变成一具尸体。\n\n“总统，这是您的错。”一向忠诚的翔日斥道，用他的独眼瞪着总统元帅。“你不应该夺走他的生命。他为我们的共和国写过无数作品，帮助我们反抗旧公国，建立了我们民主的基础，你却随意地杀了他。”\n\n克梅斯凯看了看翔日，叹道“这是我的责任。他是一个试图反抗他自己总统、颠覆自己祖国的叛徒。”\n\n“他所做的一切都是为了国民共和党的三民主义。但是，我的兄弟，你所做的却并不是。”\n\n留下这句话之后，翔日离开了，克梅斯凯独自一鹫立在那里，站在温克的尸体前，眼中仍旧激荡着愤怒。"
 griffonRepublic.256.a:0 "曾经伟大作家的悲惨结局。"
 griffonRepublic.257.t:0 "克梅斯凯最后的话语"
 griffonRepublic.257.d:0 "当小亚历山大·克梅斯凯到医院看望父亲时，他发现自己的父亲在床上痛苦地扭动着，紧紧地抓住床的两边以支撑，是他最不愿意见到的那副模样。\n\n“再……再近点，亚历克斯……”克梅斯凯呻吟着，呼唤着他唯一的儿子靠近点，聆听他的话语，“这是我给你最后的礼物，总统席位的继承权……带上我这个蠢货学到的知识，去做正确的事情吧……我鹫生中的那三十年一直都是英雄，但现在大家只会记得我是个暴君……”\n\n他努力地把话说出口，痛苦地喘着气，羞愧地哭泣。\n\n“我所做的一……一切，都是为了稳定，为了共和国，为了我们的未来……你要恢复民主，恢复宪政，都是我应该做到的……不要像我这样……背负着一个暴君的名声而死……”克梅斯凯紧紧握住他儿子的爪子，两鹫泪流满面。“记住，亚历克斯，民权，民主，民生……”\n\n“我要见北风神了……哦，亚历克斯，还有一点……”他借助说，恐惧地看着他儿子的脸。\n\n“是的，父亲？是什么？”小克梅斯凯依旧紧紧握住爪子。\n\n“求你了，记住我做过的好事，不是坏事……求你了……”\n\n“当然会。我爱你，爸爸……”小克梅斯凯说道。他的父亲笑了笑，闭上了眼睛，陷入了安详的睡眠。\n\n几天后，克梅斯凯的死登报，不过那时他自己的权力只是过去时了，全部都赋予了他的儿子。\n\n小克梅斯凯离开医院，爪握着总统元帅的权力，他有两个选择——像父亲的告诫那样恢复民主？还是继续戒严的国家紧急状态呢？"
 griffonRepublic.257.a:0 "我们将恢复民主。"
 griffonRepublic.257.b:0 "戒严必须持续。"
 griffonRepublic.258.t:0 "国歌的辩论"
 griffonRepublic.258.d:0 "随着国会重开，一个关于我国国歌的迫切问题被摆在了桌上——更确切地说，根本没有国歌。随着狮鹫们争论的进行，有三个选择浮出了水面。\n\n其一是“三色旗”，共和党党歌。许多鹫认为将其作为我们的国歌能增进党派团结，并且向大陆上的狮鹫们宣示我们依旧忠于共和事业。但是，将共和党党歌用作国歌，可能会被认为是对国会中刚组建的各类小党派的攻击。即使抛开其政治寓意，其内容也可造成分裂——副歌部分唱到“纵使懦夫畏缩叛徒讥笑，我们仍要让三色旗飘。”，这被认为是极具攻击性且粗鲁的。但它仍是最受欢迎的非官方国歌之一，坚定地传达着共和国的曲调。\n\n其二是“从废墟中崛起”，这首曲子在共和革命期间走红，讲述了一个团结、自由的狮鹫尼亚。“三色旗”歌颂的是共和主义，而“从废墟中崛起””则宣扬我们的终极目标。“为了你的崇高事业，统一的祖国狮鹫尼亚。”\n\n最后一首是“统一、正义与自由”，从广受欢迎的“狮鹫之歌”中节选的第三段。我们的民主价值观与统一狮鹫尼亚的理念在这一段中回响着。此外，选择这样一首大众皆知的歌曲作为国歌，或许能证明我们作为垂死帝国法理继承者的合法性。\n\n最后，问一下我们究竟选择哪首？"
 griffonRepublic.258.a:0 "“三色旗”！"
 griffonRepublic.258.b:0 "“从废墟中崛起”！"
 griffonRepublic.258.c:0 "“统一、正义与自由”！"
 griffonRepublic.259.t:0 "会谈"
 griffonRepublic.259.d:0 "“我的朋友们。请坐。”\n\n当戈弗雷·赫伦和迪特里希·马赫进入装点着民族革命阵线三色旗的共和国总统府时，曜尾鞠了一躬。在正中间有一幅曜尾最得意的画像，这是克梅斯凯曾经坐过的地方，但是宫殿里老元帅的每一幅画像都被曜尾的笑容代替了。\n\n“我很高兴你们能加入我们今天面对面的谈话，“曜尾在两个狮鹫坐在桌子的两边时继续发话，“我相信你们都知道为什么在这里——狮鹫尼亚民族革命阵线向你们的组织请求支持，组建联盟，共同反对颓废的君主主义者，空谈的自由派和社会主义暴政。”\n\n“恕我直言，总统先生，”赫伦咳嗽了一声，开始对曜尾耳语，“如果你把这个鲁莽的农民元帅从谈判中除去，我就同意。他不配得到这样高的荣誉。”\n\n不幸的是，他的声音不够小，马赫从他的椅子上站起来，指着那个弗羽西亚鹫，“我不能容忍这个青蛙佬在任何的民族共和国存在。他傲慢、懒惰、下流，这是所有赫兹兰狮鹫都知道的！”\n\n“你也一样，你这讨厌的乡巴佬！”这时，赫伦也从椅子上站起身来，对马赫尖声说道：“曜尾，这个狮鹫是个骗子，只是为自己好。我写过小说，写过民族复兴的光辉故事，而这个狮鹫只不过是个鸡犬升天的农民！”\n\n“再说一遍，你这个自大的势利鬼！”马赫和赫伦互相对峙，马赫朝他骂道：“给我一个现在不能开枪打你的理由，你这个该死的池沼鹫！”\n\n这时，曜尾也站了起来，发话了。\n\n“你很快就不会这么做的，朋友。事实上，赫伦已经离开了。”\n\n弗羽西亚鹫试图回答，但当他组织好自己想说的话时，曜尾的卫兵已经把他带出了房间。\n\n“不要把他的离场看作是针对你的，马赫先生。事实上，我已经计划好让他在回振翼城的路上遭遇一场“意外”，这样我们俩就能找到一个更适合弗羽西亚的地方长官。”"
 griffonRepublic.259.a:0 "成立曜尾-马赫联盟！"
 griffonRepublic.260.t:0 "新神官领"
 griffonRepublic.260.d:0 "曜尾的下个复仇对象自然是神官们。他们的组织尽管称自己为中立，但是依旧支持着那些不忠的君主们，甚至是现在皇族的最后一员都被送去见北风神时也是如此。\n\n厄洛斯七世已经被曜尾的部队以叛国罪处死，以及普罗透斯二世，他起兵反对共和国正义而光明的事业。厄里翁十二世同样身首异处，不过他是亡于工团的暴民，而非民族共和国之爪。\n\n由于那些老神官绝大多数死亡，新的几乎和旧的一样坏，曜尾宣布了一个新计划，一个将会彻底剿除神官政治权力的新计划。它们将不能再在狮鹫尼亚的公众领域涉爪了，他们的通谕也将被曜尾的民族共和国情报调查统计局严格审查以确保不会传达不实消息。神官和主教禁止拥有政府职位，所有长期不用的寺庙将被拆毁以发展工业。\n\n任何一个涉嫌叛国的神官将被立刻斩杀，换上新的。希望这些新神官能够学会不能张口反对总统元帅这条真理。对最低等的主教和祭司也是同理。\n\n尽管许多鹫认为这一法令过于残暴，但是那些民族共和国真正的保卫者们将会无比认同，这是控制不忠神官们的唯一途径。"
 griffonRepublic.260.a:0 "他们都会仅仅活在祷告中……"
 griffonRepublic.261.t:0 "曜尾的凯旋"
 griffonRepublic.261.d:0 "曜尾凝视着狮鹫尼亚的地图。他为全体狮鹫民族的利益牺牲了这么多年，这么多个小时，现在他终于站在了金字塔的顶端。他一统全部狮鹫国家，创造了一个如他所愿的新国度。他老敌鹫们最后的堡垒已被摧毁，那些鹫的支持者们遁入隐蔽。他再次打开了桌子上的那封信。\n\n“在此，我向您传达最后的抵抗势力被粉碎的消息。愿阿克图里亚在未来如今日一样庇佑我们。”\n\n曜尾再次合上了那封信，他再次看了看地图。诸多城市被划上了叉，以表示它们的攻陷。干得漂亮。"
 griffonRepublic.261.a:0 "光荣的胜利。"
 griffonRepublic.262.t:0 "二元君主国"
 griffonRepublic.262.d:0 "狮鹫海姆现在处于漫云以及我们自豪的君主爪中，我们必须决定如何处理我们现在控制的新土地，那些对他们的皇帝和赫兹兰文化仍然有着强烈的民族主义献身精神的地区。[Root.GetLeader]已经和他的顾问们讨论了整合旧帝国残余的最伟大的行动方案，几乎每个狮鹫都建议放过皇帝，至少让其仍然担任赫兹兰地区的君主，并将漫云王朝与在民众中颇受欢迎的格罗弗王朝联系在一起。\n\n由此，我们将建立起漫云和赫兹兰的二元君主国，奥斯卡一世统治赫兹兰北方的所有领土，格罗弗王朝则统治赫兹兰，基本上和他们旧时一样。格罗弗六世对二元君主国的忠诚则由一个双管齐下的提议所保证—赫兹兰王族将接受与漫云王族的婚约，两个王朝从此永远联系在一起。\n\n在处理忠诚派事务和当地世代的习俗时，由[Root.GetLeader]本尊领导的二元君主国委员会敲定了两大君主国的行政特权及其立法机构。漫云城和狮鹫海姆都将是二元君主国的首都，虽然漫云城将是仪式性的、法理上的首都，但狮鹫海姆将是大多数行政机构（如联合议会，虽然大部分立法将由君主国各自自行敲定）的所在地，它在作为一个统一国家的二元君主国中将拥有相当大的自治权。\n\n在赫兹兰和漫云都建立议会选举制度得到了承诺，尽管这些议会所许可的民主程度和实际入选的政党仍然是君主制的附属——因此，旧的漫云和赫兹兰政治体系基本上完好无损。当然，尽管许多统治阶级认为这是一个很好的决定，但共和派的报纸和电台对二元君主国进行了激烈的批评。被取缔的国民共和党的评论员宣称，这是朝旧帝国反动统治迈出了一步，而许多君主立宪派成员则小声议论着漫云可能被帝国的专制君主接管。至少格罗弗六世和奥菲莉亚的婚礼很快就要开始了……"
 griffonRepublic.262.a:0 "有趣。"
 fatass_rosewing_empire_focus:0 "二元君主国国策树"
 griffonRepublic.263.t:0 "赤喙叛逃"
 griffonRepublic.263.d:0 "我们功勋卓著的将军之一，丹尼尔·赤喙，刚刚获得了狮鹫尼亚共和国对他煽动反对克梅斯凯罪行的完全特赦。很显然这是个精打细算的政治举动，共和国利用了目前新狮鹫尼亚国内对那些潜藏的共和党叛徒们极端不友好的态势。赤喙自然也咬下了共和国的鱼饵，他已经飞过岩石海和天际湾，抵达了翼哈根，在共和国军中服役。\n\n或许事实令我们政府中的很多鹫都很惊讶，但是赤喙其实在我们政府替代了那个软弱的茶羽总督之后就开始对我们抱有不满了。将他再次以煽动叛乱罪告上法庭只是时间问题，但这一次传票是来自新狮鹫尼亚。"
 griffonRepublic.263.a:0 "叛徒。"
 griffonRepublic.264.t:0 "克梅斯凯已死亡"
 griffonRepublic.264.d:0 "尽管我们尽力在漫云城争夺战之后掩盖克梅斯凯的死，但是消息还是泄露了。现在共和国境内报纸头版头条全部在报导此事。\n\n或许目前的情况中最讽刺的就是没有将领宣布对此事负责。他们把这一事件用作反对敌鹫的材料，而不是宣布自己成为这次叛乱的领袖。这两位元帅都声称对方制造了克梅斯凯的死亡，两派的支持者们也开始爆发一些冲突。曜尾希望获得前共和国支持者的支持，用以反对“君主制支持者”瑰翼。他宣布是一群不服指挥的北方狮鹫在大街上将克梅斯凯处以私刑，还念着漫云语在他的尸体周围跳舞。作为回应，瑰翼则称“恶毒的说谎者和共和国最为危险的狮鹫”曜尾再次欺骗了共和国的鹫民，是他杀死克梅斯凯以获取自身的政治利益。\n\n不管是谁杀了克梅斯凯，瑰翼与曜尾之间的紧张关系已经达到了最高点，他们的支持者们已经开始在翼哈根、漫云和科洛堡的街头械斗。曜尾的支持者开始破坏本土狮鹫的产业与商店，宣布瑰翼杀死克梅斯凯是帝国夺取共和国的第一步，瑰翼的支持者则说曜尾的军队和翼巴第喙索里尼的黑翼军没什么两样。\n\n紧张局势一触即发，最后谁将夺得共和国总统元帅的地位？"
 griffonRepublic.264.a:0 "那我选那个叛徒瑰翼！"
 griffonRepublic.264.b:0 "开玩笑吗？当然是曜尾了！"
 griffonRepublic.265.t:0 "订婚"
 griffonRepublic.265.d:0 "当狮鹫海姆的北风神庙的大门敞开时，音乐响了起来。坐在庙里长凳上的显贵们站了起来，[Root.GetLeader]也在其中，簇拥着正慢慢地走过过道的，在场鹫中最为尊贵的格罗弗和奥菲莉亚。神官站在祭坛前，等待着这对身穿二元王国中所能寻见的最精致的礼服的即将结婚的夫妇。\n\n奥菲莉亚走在格罗弗的右边，略显疲惫，但身着精美婚纱的她从容地主持了仪式，神情沉稳。穿着盛装制服的格罗弗站在另一边，在走向祭坛时，显得非常不自在。\n\n不幸中的大幸，仪式本身很简短。与其说是举办给这对眼神空洞地站着，不断听着神官唧唧歪歪的新订婚者，不如说是做给在场的显贵们看。\n\n神官停了下来。”你，格罗弗·冯·狮鹫岩，赫兹兰国王，愿意在成年后把漫云公主，翎坛家族的奥菲莉亚当作自己生活和灵魂的伴侣吗？”\n\n“我愿意，”格罗弗回答。\n\n“你，翎坛家族的奥菲莉亚，愿意在成年后将格罗弗·冯·狮鹫岩，赫兹兰国王当作自己生活和灵魂的伴侣吗？”\n\n“我愿意，”奥菲莉亚回答。\n\n“那么我宣布你们，以北风神、阿克图里亚和厄耳神的光辉起誓，众神之光将成为你们的纽带，直到死亡将你们分离。”\n\n音乐又一次响了起来，唱诗班开始唱歌。”哦，北风神，狮鹫的保护者，赐予这对夫妻你的盾牌。请赐予他们你的力量和权力，让他们始终强大……”"
 griffonRepublic.265.a:0 "新郎和新娘是，格罗弗和奥菲莉亚！"
 griffonRepublic.266.t:0 "共和国革命30周年纪念日"
 griffonRepublic.266.d:0 "距离克梅斯凯、忠于他的军官以及国民共和党发动这场改变全狮鹫尼亚历史的革命已经三十周年了。\n\n距离我们坐在狮鹫海姆中，作为解放者和英雄也过去三十年了。\n\n这个周年纪念日里，没有像共和党鹫首次占领漫云时，那样欢乐的庆祝活动或愉快的节日。相反，抗议者堵塞了每条街道——在斯卡克、漫云城、翼哈根，军国主义者大喊道要反攻帝都，一劳永逸地摧毁帝国。当政治家们举行演讲和革命的庆祝活动时，他们所有鹫都遭到了愤怒的鹫民们的袭击，要求夺回狮鹫海姆，终止金羽的实用主义与和平主义政策。施纳贝尔·翔日可能是唯一受游行者们支持的政治家，他关于重返狮鹫海姆以及清除格罗弗六世势力的演讲吸引了成千上万的围观者。\n\n这些抗议活动的密度和强度，以及鹫民对金羽政策和克梅斯凯政府的冷漠令我们担忧。很显然漫云的共和党鹫只想要一件事——解放。"
 griffonRepublic.266.a:0 "我们会回来的……我们发誓"
 griffonRepublic.267.t:0 "绿钞协定"
 griffonRepublic.267.d:0 "[Root.GetLeader]靠近了那张放着印好的文件的桌子。就是它了。就是这份文件让自己度过了无数不眠之夜与重压之日。就是这份文件让贵族们一个个地对自己泄火发怒，尖叫不止。其中一个贵族甚至在自己拉他去后方谈话的时候拔出了一把剑。但是现在一切准备就绪。文件就在那里，写好了。但是，与它能产生的成果相比，文件本身显得微不足道。这是二元君主国的基础。这是一个不以琐碎的宫廷纠纷为基础，而是以每个鹫都能承担责任的真实规定为基础的宫廷。然后，各领地间的边界将会变得无比清晰，各个贵族将只治理自己的地盘。每个鹫都要忠诚于上级。伯爵对公爵，公爵对国王。一切理应如此。\n\n[Root.GetLeader]签了字。文件现在具有了法律效力。不管怎么样，旧时代最后的残余逝去了，哪怕其象征还在。"
 griffonRepublic.267.a:0 "为了守卫狮鹫尼亚。"
 griffonRepublic.268.t:0 "棺材上最后的钉子"
 griffonRepublic.268.d:0 "今天，小克梅斯凯宣布在天际纳维亚危机、共和国陷入真正的危险期间设立的《986共和国动员戡乱法案》就此终止。由法案中止所产生的正面反应却戛然而止，因为随后国会就全票通过了《[GetYear]共和国至上防卫法案》。\n\n至上防卫法案同986年法案差别很大，例如先前在老克梅斯凯的命令下中止了20年的国会，现在被彻底废止，改为一个专门为总统元帅服务的咨询委员会。先前并没有因国家级选举中止而停下的地方选举，在共和国所有的直辖市与州份也完全终止。议员和国会议长被开除，那些曾经忠诚的顾问们也被尽数移出。\n\n老克梅斯凯政权的前副元帅施纳贝尔·翔日被解除了所有职务，国民共和党谐律派的其他成员也在[GetYear]法案完全生效时遭到了类似的清洗，阻止他们对小克梅斯凯的政府进行卑鄙的背叛。尽管总统元帅称此次对986年法案的新扩展就是应对那特别的目的，小克梅斯凯的政府是否还可能会回到那个共和国所有决策以民主为前提的旧时代的问题依旧存在。只要狮鹫尼亚还有叛徒，共和国就不会真正安全下来。"
 griffonRepublic.268.a:0 "这是必要的措施。"
 griffonRepublic.269.t:0 "下一个继任者"
 griffonRepublic.269.d:0 "为了确保在年轻元帅死后的继任能安全稳定地进行，小克梅斯凯官方指定了他的儿子，约翰纳斯·克梅斯凯将成为共和国的下一任总统元帅，前提是“永远不会出现需要恢复民主的局面”。约翰纳斯在12岁时就被送进了颇有威望的军政学院，期望他成为共和国的继承鹫，小克梅斯凯还安排了一支贴身卫队日夜不离地在约翰纳斯身边。\n\n共和国内大多数鹫把这一行为视作对共和国民主原则的终极背叛，称这一模式为“世袭君主制”。小克梅斯凯面对这些指责，称是他父亲临终前的决定，让他成为共和国的下一任总统元帅的。\n\n“我的政敌，过于理想主义，还受到了仇恨的蒙蔽，他们都忘记了我今天在这里的原因——正是因为我的父亲指定了我作为下一任总统元帅！没有鹫对那条提议产生质疑，所以我不觉得任何有理智的狮鹫会怀疑我去做相同的行为。你们希望看到我死了之后，某些不称职的公务员或者嗜血的将军接替这个职位吗？当然不会！我以共和国的方式对我的儿子进行教育，这非常好，这样他就可以和祖父一样伟大。”小亚历山大·克梅斯凯这样评论道。"
 griffonRepublic.269.a:0 "他将成为一个适合的接班者。"
 griffonRepublic.270.t:0 "一个时代的终结"
 griffonRepublic.270.d:0 "今天上午，小克梅斯凯以“三民主义”和“共和国之梦”的名义，宣布结束训政，建立真正的宪政政府。与此同时，他自己也辞去了总统元帅的职务，理由是他不是靠民主选举上台，而且在政治上缺乏经验，尽管许多鹫认为这些理由只是为了安抚民主派系，并真正开始选举周期。\n\n第一个站出来的候选鹫是斯特凡诺·阿里韦利，他是一位翼巴第商鹫，也是共和党声名远扬的海因里希·金羽的门生。由于对他的战争罪行的调查仍在进行中，金羽决定不参加竞选。阿里韦利已经承诺建立一个基于自由市场资本主义、简化和务实原则的新政府。尽管许多狮鹫批评他的竞选活动是“为了金羽保住总统之位而做掩护”，但没有谁能怀疑阿里韦利自己对共和国的承诺。\n\n最激进的候选鹫是施纳贝尔·翔日，他是自共和革命以来克梅斯凯的主要盟友和批评者。作为一个由978年的价值观和三民主义所驱动的共和国元帅，翔日是理想主义公民们明确的选择——但在这个冲突的时代，共和国真的需要这样一个好战的民主主义者吗？\n\n第三位候选鹫是沃尔特·埃默里克。和翔日一样，他是一位将军和理想主义者，但他把自己定位为这次选举中的中间派候选鹫。埃默里克强调团结、安全和稳定是他竞选的目标，他在共和党军队中的地位使他得到了克劳斯·瑰翼的支持。\n\n谁将在这第一次真正的选举中获胜？"
 griffonRepublic.270.a:0 "阿里韦利将团结中间派。"
 griffonRepublic.270.b:0 "翔日将赢得胜利！"
 griffonRepublic.270.c:0 "埃默里克将保卫共和国。"
 griffonRepublic.271.t:0 "将领的审判"
 griffonRepublic.271.d:0 "这次对天际纳维亚战争期间将领所犯战争罪行，以及这些将领的其他对漫云鹫民犯下的清洗罪行的审讯由年轻的元帅亲自进行。他的父亲总是教导他一条古训——要让那个犯下杀戮罪行的狮鹫见证自己审判的结束。针对莱因哈特·曜尾、麦克斯·白羽和克劳斯·瑰翼的证据令鹫吃惊，不过也能理解——共和国那时无论是国内还是国外都处于战争状态，老元帅不会过问他将领的行为。但是现在不是老元帅的时代了，儿子继承了父亲，“遵守命令”的辩词越来越无力。\n\n第一个受审的是白羽，他的罪行也许是最严重的。他被指控在燕祸冲突与天际纳维亚战争期间屠杀千余名士兵，证据还显示他还对天际纳维亚的平民们同样犯下了严重的战争罪。在他以“自己部队的举动符合临时战争法”辩护时，法官已经宣判了。有罪。\n\n下一个是曜尾，他的军阀罪行与恐怖组织活动被提及，同样还有对天际纳维亚的平民们犯下的罪行。1003年漫云爆破未遂案所有的证据都指向曜尾，他在天际纳维亚的罪行似乎已经无关紧要了。有罪。\n\n最后一个是瑰翼，定罪原因主要是同君主派组织有勾结。无数北方狮鹫作证，瑰翼给予他们些许贿赂以让他们加入自己的军阀团伙，并尝试在共和国恢复君主制。海军上将，前王室成员奥托·萨克哈根-翎坛告诉法官，瑰翼向他送了许多消息，要求自己成为他公爵复辟的之后的傀儡统治者。有罪。"
 griffonRepublic.271.a:0 "他们都是各行其是的叛徒。"
 griffonRepublic.272.t:0 "最遗憾的事情"
 griffonRepublic.272.d:0 "总统，元帅，英雄。亚历山大·克梅斯凯的荣誉与头衔如此之多，能让他安静地承认这些是很困难的。这些固然是他鹫生成就的证据，他也不打算去否认它们背后的含义。只是现在，他多么希望用这一切来换取自己的信心，哪怕只有一点点。他向那间大房子走去，爪中握着一束鲜花，默默地喃喃自语他多年来一直规划的断断续续的话。\n\n如果他对自己漫长而起伏的生涯有什么后悔的，那就是他落入了许多伟大狮鹫们都落入的那个陷阱。你工作地如此辛苦去完成你的使命，到头来却没有给自己，或者自己的家庭留下点什么……他在花园中找到了她，她正在从玫瑰丛中剪去枯叶，不管她是没有注意到，还是简单地忽视，在他走近的时候她并没有抬头看上一眼。\n\n“过得怎么样啊？”她问，亚历山大发现自己在努力回忆，这是什么时候变成一种出于习惯的机械反应的。但它为什么不是呢？他低头看了看那束花，突然想把它给扔掉。用这种方式来恳求这么多年来对她忽视的原谅简直是一种最可悲的、最缺乏信心的方式了。职责、革命、更伟大的事业，这些借口还没说出口就被否定了。最后，他没做任何反应的行为让她抬起了头，看到了那一束花。\n\n“我……”亚历山大开口说道，他意识到自己已经完全忘记了这番准备好的话语。他就这么站在那里，僵硬地把花束递给她，“我让你失望了。”他脱口而出“我一直都是个糟糕的丈夫。我很抱歉，我希望我还能补偿你……现在算晚吗？”他问道。\n\n她开始大哭，紧紧地抱住了他，让他把戒指还给她，在她骂他花了这么长时间才来看他时，他温柔地来回摇晃着他的妻子，告诉她他是多么爱她。总统，元帅，英雄；所有这些头衔都去见地狱吧！他现在关心的头衔只是丈夫，不多不少。"
 griffonRepublic.272.a:0 "从今天起，我惟一的职责就是让你快乐。"
 griffonRepublic.273.t:0 "克梅斯凯的回归"
 griffonRepublic.273.d:0 "在他的前任踏入办公室时，新上任的里卡德·艾斯特勒总统忍不住感到担忧。他仍然穿着他的制服，表情严肃。不管他造成的结果如何，这位从一开始就在那里的将军身上总有一种不可调和的东西。\n\n“克梅斯凯将军”，他这么说道，不清楚接下来会发生什么。克梅斯凯是一个很难被给予确切评价的狮鹫，他究竟是革命的救星，或者仅仅是一个成功上位的军阀？\n\n“我读了你的信，”对方回答道。“这确实是一个方便的解决方案，不是吗？我之所以来到这里，不是因为我想要辞职，而是因为我想向你说明白下面的东西：在我们被迫北征的那时，我本可以简单地躲起来。在过去三十年任何一个时间点，我都可以卷走财富远遁他乡大鱼大肉地活着。在最近几年，我也完全可以向那些试图打垮我们的势力投降。但是我没有。我知道你更希望我直接走出这扇大门，让你毫无争议地统治这个国家。不过，我将在此起誓。\n\n我发誓我将永远拥护革命。我永远不会放弃这伟大的斗争，也不会让牺牲的鹫们失望。我不会让那些失去亲友的狮鹫们的泪水白流，正如我不会离弃那依旧在军中的士兵们一样。总统先生，我们都知道这里发生了什么。我们都要玩这个游戏，并决定参与其中。（译者注：Rick Astley《Never gonna give you up》的歌词）以上就是我的行动。然而——你却想马上把毫不情愿离开的我从共和国的最高统帅部硬拖出来。我讲清楚了吗，总统先生？”\n\n“是的，将军阁下。”艾斯特勒总统平静地回答。“感谢你对革命事业的贡献，这就足够了。”"
 griffonRepublic.273.a:0 "说到底，这老头子还是个革命的忠诚者。"
 kemerskai_remains:0 "§Y亚历山大·克梅斯凯§!§C仍将作为元帅服役§!。"
 griffonRepublic.274.t:0 "小皇帝的沉思"
 griffonRepublic.274.d:0 "这些天来，曾是很有格调的格罗弗六世的公民格罗弗一直在房中坐着，只是在一小段时间里出来透透风。不过对前女仆、现管家乔安娜而言，这依旧是个不错的改观。前一段时间他很是愤愤不平、无比难受，现在他头脑冷静多了，确实也更懂礼貌了。现在他每天都外出散步，不过只是去图书馆，偶尔几次同街上的狮鹫们互动。回家后他便花上几个小时去阅读这些书籍。\n\n他所借的这些书也引鹫注目：都是有关法律与经济的，以及一本新宪法的副本。这位年轻的狮鹫似乎满腔热情，连续读了几个小时，只睡了一小段时间。在乔安娜送来晚饭时，格罗弗向她道谢。这对她而言曾经如登月一般遥不可及，现在却如此稀松平常。她忍不住瞟了一眼这些书籍，对正在发生的事情无比好奇。\n\n“你在读什么呢？”她向刚刚咽下一口食物、正在擦喙的格罗弗问道。\n\n“那个老乌鸦说我现在可以从事自己想去做的事情……”他说，“而这里写道‘共和国每位公民都毫无争辩地拥有参与政府执政的权利。’而老乌鸦说我也是个公民。我有那封信。如果他说的是对的，那我就不可能再当上皇帝，但我可以竞选总统。不是下次或者下下次选举，但是五六次之后我应该可以去。我还年轻，还有很多时间。”"
 griffonRepublic.274.a:0 "“他给予了我一次新生，我要好好利用。”"
 griffonRepublic.275.t:0 "狮鹫尼亚共和国要求我们的帮助！"
 griffonRepublic.275.d:0 "一份加密信息抵达了[Root.Capital.GetName]。我们使用了旧的国民共和党密钥将其解密。其中包含了[From.GetLeader]亲自发来的消息，称其将立刻解放赫兹兰，重返狮鹫海姆，并且需要我们的帮助。我们同这些流亡者们有着紧密联系，所以很显然我们会加入其解放狮鹫尼亚的斗争。但是这也会终结我们作为独立国家的地位，以及[Root.GetLeader]本鹫的统治。或许我们的领导层还想多掌权一段时间……"
 griffonRepublic.275.a:0 "[Root.GetName]将会做出回应！"
 griffonRepublic.275.b:0 "我们才是真正的共和主义者。"
 griffonRepublic.276.t:0 "[From.GetNameDefCap]加入了我们！"
 griffonRepublic.276.d:0 "好消息。在我们向[From.GetLeader]发送秘密信息请求援助后，他们进行了积极回应，加入了我们的抗争。[From.GetLeader]承认[Root.GetLeader]为共和国正当合法的统治者，其军队将正式与共和国军并肩作战。我们将一道将民权、民主、民生带给赫兹兰，以及更多的土地！"
 griffonRepublic.276.a:0 "为了自由！"
 griffonRepublic.277.t:0 "[From.GetNameDefCap]背叛了我们！"
 griffonRepublic.277.d:0 "不幸的消息。在我们向[From.GetLeader]发送秘密信息请求援助后，他们进行了消极回应，拒绝协助我们的抗争。[From.GetLeader]谴责[Root.GetLeader]是个不正当的暴君，其军队不会和我方合作。看起来我们要想统一赫兹兰就必须和前盟友开战了。"
 griffonRepublic.277.a:0 "叛徒都去死吧！"
 griffonRepublic.278.t:0 "最后的共和党鹫"
 griffonRepublic.278.d:0 "施纳贝尔·翔日那把饱经风霜的灰色爪枪里还剩下一颗子弹。这是他爪中仅存之物。\n\n他所追随的老元帅的继承鹫已经剥夺了翔日在这共和国中所珍视的一切——克梅斯凯那破碎的梦想已经变成了一场噩梦，剩下的仅仅是一个空壳。在他向枪里装上最后一枚子弹时，翔日怀疑这总统元帅是否真正地关心过鹫民，关心过狮鹫尼亚，关心过民主民权民生，或者说这只是一个假象，这只是一个贪图权力的帝国将军想要在狮鹫尼亚历史上永远刻下姓名的赌博。他的儿子显然不关心上边那些。\n\n正是来自耶鲁中间派大学、巧舌如簧的律师海因里希·金羽首先向翔日保证，克梅斯凯并不是像他表面上看起来的那样——他是一只不为自己的权力、财富或荣誉而战斗，而是为了狮鹫平民们的利益和民生的梦想而战斗的狮鹫。那个叫海因里希的家伙现在就在这继承鹫的耳边，持续不断地讲着谗言佞语，并为了“维护共和国的稳定”熄灭了一颗又一颗怀揣共和理想的赤诚之心，翔日就是其中一个，或者说，活下来的最后一个。也许他没有两颗子弹是件憾事。本来可以留一颗给那个无能辩护士的。\n\n漫云的街道寒冷、整洁，而且高效，但对他而言却没有生机——街上唯一的语言是狮鹫标准语，曾经点缀着街道的满载美食和小饰品的摊子也都被遗弃了。鹫群仅有的行动是听那年轻的元帅的演讲，着迷于他的谎言和半真半假的甜言蜜语。这就是翔日发起袭击，终结凯家王朝谎言的地方。\n\n他走向总统讲台，穿过无数着迷的公民们，对那老元帅的话毫不在意——只有自己的心跳声，和那些在978年为一个无法重现的梦想而牺牲的成千上万狮鹫的哭喊，萦绕在他的心头。\n\n“预备。”\n\n“瞄准。”\n\n然后枪声从后面传来。"
 griffonRepublic.278.a:0 "开火。"
 griffonRepublic.279.t:0 "“十世纪的格罗弗主义”"
 griffonRepublic.279.d:0 "当他作为首相的地位稳固之后，克劳斯·瑰翼在漫云开始了一场新的，感情上倾向于914至970年之间的全体狮鹫的皇帝，格罗弗四世意识形态的宣传行动。他试图引起那些出生于四世推行改革、工业化迅速进展的黄金时代的那些君主派和旧共和派的共鸣。他的宣传行动指出了他自己的君主立宪制原则和那个时常与守旧贵族相左的，亲民的，改革主义的格罗弗四世的诸多共性。而那帮贵族，在瑰翼的描述中，和今天占据狮鹫海姆的贵族没什么两样。\n\n尽管格罗弗四世对改革究竟有多么投入这个问题仍然在历史学家之间颇有争议，但是瑰翼和他的政治盟友们已经给那位皇帝绘制了一幅既务实又理想化的，试图弥合君主制意识形态与日益倾向共和派的民众间裂痕的君主立宪者的形象。另一方面，漫云政府也以在瑰翼的反共和立宪和四世皇帝之间找到联系的方式来寻求那些依旧把他当成是赫兹兰占领者，以及共和党同情者的本地君主派的勉强支持。\n\n尽管如此，很多鹫还相信瑰翼的这次把赫兹兰皇帝作为英雄，而把堕落的贵族描绘成持续压榨帝国生命力的奸诈小鹫的宣传行动背后有什么不可告鹫的秘密。“我相信瑰翼对于通过这一行动来获取狮鹫海姆的财富有着自己的兴趣”，处于流亡的施纳贝尔·翔日不满地向媒体抱怨，“这个‘十世纪格罗弗主义’宣传行动仅仅是一个战争贩子尝试去煽动帝国国民支持他自己所谓的君主立宪制，并尝试用它来实现自己肮脏的，统合赫兹兰与漫云君主派的计划。”\n\n"
 griffonRepublic.279.a:0 "君主制做的对。"
 griffonRepublic.280.t:0 "曜尾中风发作"
 griffonRepublic.280.d:0 "曜尾的眼睛微微地睁开了。他躺在床上，但不是他自己的床。他四处张望，发现身边到处都是花圈，阳光从一扇打开的窗户中倾泻而下。他正在医院的病房中，也不是孤身一鹫。护士们在他身边走动，喙在张合，但他不明白说的是什么。她们提供了食物和水，但他挥爪让他们离开。他不饿。他必须……做什么。他意识到自己不记得之前在做什么了。\n\n几个小时之后，他恢复了言语和听力，几十位重要的狮鹫来到床边，都宽慰地哭泣着。曜尾不清楚其中哪些是真心的。从他们的话中，曜尾猜测出他意识丧失已经一周了，在一次正式的晚宴之上中风发作，民族共和国的边疆地区在他缺席的时候险些就陷入了全面暴乱。埃维河谷的地方警察已经召集了军队，而当曜尾醒来的消息传开时，叛乱消退了。但所有的城市中还是覆盖着涂鸦，催促着市民们武装起来反抗“暴政共和国”，并庆祝他那有所夸大的死亡。\n\n接下来几天，曜尾慢慢地恢复，一个想法占据了他的脑海："
 griffonRepublic.280.a:0 "要是没了我，共和国怎能存续呢？"
 griffonRepublic.281.t:0 "秃鹫之巢"
 griffonRepublic.281.d:0 "曜尾独自阅读着情报报告。他终于可以走路了，虽然要过几个星期才能再次飞行，但国家大事可不等鹫。而这些事务确实是肮脏不堪的。似乎不仅是普通的狮鹫在他中风后草草地动员起来。在他短暂的缺席期间，他自己的文职和军事领域的官员贪污钱财，策划政变，并以惊鹫的速度确保他们的权力基础，以期待他死后的最终权力斗争。\n\n一旦他醒来，他们就迅速行动，掩盖这些阴谋，但有十多个高级阴谋已被证实，他的情报机构推测出了更多的阴谋。共和国里有这么多渴望权力的狮鹫，如果没有他来维持这一切……曜尾想到了他的中风。他当时在吃晚饭，没什么特别的。它可能在任何时候再次发生。即使他恢复得很快，民族共和国在没有他的情况下也几乎没有办法撑过一个星期！\n\n他想到了他的核心圈子。他们中有两个，也许是三个狮鹫，强大到足以领导。但是，如果他当时死了，如果他现在死了，他们会为了选择一个新的总统元帅而互相拆台，或者作为关系不稳的三巨头互相争吵，直到共和国的力量被他们的优柔寡断所耗尽。曜尾知道他必须做什么。"
 griffonRepublic.281.a:0 "是时候找个继任者了，快点！"
 griffonRepublic.282.t:0 "如果克梅斯凯在这里，会是如何呢？"
 griffonRepublic.282.d:0 "当曜尾茫然地处理如何实现有秩序的权力交接的时候，一个名字不停地返回到他的脑海之中。亚历山大·克梅斯凯。他的导师、他的朋友，与他的敌手。\n\n克梅斯凯总是说，共和国最强大的优点之一，就是在于它并不像君主国一样，需要依靠一位领袖将其维系起来。然而那个旧的共和国却如此依赖于克梅斯凯，以至于它几近崩溃。民族共和国看来也要在曜尾止息的那一刻覆亡。要是克梅斯凯现在能见到曜尾，他会说什么呢？\n\n“我完成了你没做的任何事，”曜尾对着空房间言语着，“我完成了革命，我守卫了泛狮鹫尼亚梦。我之所以完成，就是因为我没有让所谓的道德，还有懦夫的话语将我从任务上分心。”\n\n他暂停了一下，突然想到现在的状况有多么荒谬。他正对着墙说话，对着死了好多年的狮鹫说话，玛尔肯定会在哪一天把他带过去见克梅斯凯。“我很抱歉。我为你没能意识到必须完成之事而抱歉。也为我没能在太迟之前让你意识到，而抱歉。我希望我能再聪明一些，我能有再多一点时间。我那时候能多一点智慧。我相信，我可以让你理解的。”"
 griffonRepublic.282.a:0 "“我们本能共赴成功的，总统先生。”"
 griffonRepublic.283.t:0 "曜尾的演讲"
 griffonRepublic.283.d:0 "莱因哈特·曜尾一直是一个战士，而不是一个演讲者。在他面前的麦克风感觉就像长着无数双评判着他每一个字的眼睛。他提醒自己，他不过是在自己的办公室里，在广播之前，他有无数次把这段录音录好的机会。\n\n曜尾的声音仍然有点沙哑，他开始了。“我的同胞们，我很高兴地告诉你们，关于我死亡的消息被大大夸大了。我正在迅速恢复的道路上，而且……”\n\n他停顿了一会儿，使劲看了看他在稿子上划的笔记。“我的医生告诉我，我的身体状况还在走上坡路。然而，我……卧病的这一周，暴露了民族共和国的系统性弱点。看来，我的同胞们，尽管你们作出了保证，但是还没有完全接受三民原则。”\n\n曜尾对他放荡的国民们的愤怒渗入了他接下来的话。“当然，这不能完全归咎于你们。事实证明，我的几位官员对民族共和国没什么奉献。他们将以惯常的方式被处理。不必再记得他们了。至于你们，我的同胞们，你们可以在未来的几年里见证巨大的变化。为了确保三民原则的全面接纳——这不仅仅是在赫兹兰，而是在整个狮鹫尼亚——我国政府决定……"
 griffonRepublic.283.a:0 "……让我们光荣的民族共和国稳定下来！"
 griffonRepublic.283.b:0 "……举办民族共和国的第一次总统选举！"
 griffonRepublic.284.t:0 "继任者问题"
 griffonRepublic.284.d:0 "最后只剩下两只狮鹫了。在过去的几周里，曜尾与他的核心圈子交谈，在他的记忆中思索，找寻有关他们的文件，以找出一个有价值的继任者，最后他把范围缩小到了这两个。喀戎·暴风羽，或迪特里希·马赫。\n\n当然，暴风羽是最明显的选择。在漫云的旧时代，喀戎因其忠诚和狡猾而被称为“曜尾的小小鸟”，他对民族共和国的奉献是无可指摘的，他的服役记录堪称楷模。让曜尾犹豫不决的是，在内心深处，喀戎·暴风羽是一个追随者。他不善言辞、固执、谨慎，他总是更善于执行命令而不是下达命令。曜尾担心，尽管他很忠诚，但暴风羽的总统元帅的任期将是一个腐朽和停滞的时期。\n\n然后是马赫。年轻、雄心勃勃、聪明的迪特里希·马赫。他拥有暴风羽所缺乏的所有品质。动力、激情、大胆、领导力。当曜尾离开后，无论他要做什么，都会充斥着热忱和奉献精神去做，曜尾毫不怀疑他会成功。问题就在这里：曜尾并不完全确定马赫当上总统元帅后会做什么。在曜尾的胜利之后，他热情地拥抱了泛狮鹫尼亚主义事业，但在那之前，马赫一直是一个赫兹兰至上主义者。他毫不掩饰自己对弗羽西亚和阿奎莱亚的蔑视，也曾经说过逐渐消灭他们的语言是一劳永逸根除分离主义的最好方法。曜尾担心马赫会重操旧业，把泛狮鹫尼亚民族共和国变成一个名副其实的赫兹兰共和国，并利用它来压迫共和国边境地区最忠诚的鹫。最后，任何一个决定都代表着一种风险：一种是停滞不前的风险，另一种是修正主义的风险。"
 griffonRepublic.284.a:0 "曜尾决定选择他的门徒喀戎·暴风羽。"
 griffonRepublic.284.b:0 "曜尾决定选择他的盟友迪特里希·马赫。"
 griffonRepublic.285.t:0 "利爪尚在"
 griffonRepublic.285.d:0 "科莱特·索里德，阿奎莱亚前军官，阿奎莱亚爱国运动成员。自藏身处现身，组织庆祝总统元帅曜尾的昏迷，并且号召西卫狮鹫拿起武器反抗他。建议剿除。\n科丽娜·特拉斯维拉伊，塔林抵抗领袖。走私武器进入塔林，准备在总统元帅曜尾失去意识期间起义，建议剿除。\n罗莎·软毛及卡洛·红笔。君主社会主义煽动者，在拘押营煽动反抗，当场抓获。建议剿除，并惩罚性增加同一营其他生物劳动配额。\n维克多·阿拉尔。激进的共产主义者。在隐藏多时后于天鹰城散布颠覆性文字。建议先进行审讯以查出社会主义煽动者格朗·克吕的所在，而后剿除。\n盖里塔·扎尔法蒂。翼巴第分裂主义者。尝试袭击卡廷军械库时被捕。建议拘押，并用作迫使翼巴第残余法西斯分子合作的工具。\n\n曜尾一个接一个地在这些建议后面签上了他的名字。接下来的异见者清单则是那些期望从他的陨落中获得利益的腐败官员们的，他得明天再去做。他呷了一口咖啡，对自己笑了起来。这些叛徒们如此确定自己不会再度醒来。他们出牌太早了，这就是他们得到的奖励。这真的让事情变简单了。在民族共和国各地进行的清扫。叛徒们已经现身，不必再从暗影中袭击了，很快，这就会完毕。"
 griffonRepublic.285.a:0 "“希望这是最后一次要执行的清洗。”"
 griffonRepublic.286.t:0 "代表们到达狮鹫海姆"
 griffonRepublic.286.d:0 "狮鹫海姆北风神神庙的大穹顶，消耗了数以千计的鹫力和庞大的资金，终于重建完毕了，建筑被改为泛狮鹫代表大会的新会议厅。你看不出那曾经将其击垮的炮火轰击的痕迹，除了墙上挂着的那些纪念打败帝国的那些战争的挂毯。\n\n代表们被安排在穹顶之下，在经过选举委员会的审查并获得GNRF的成员资格后，通过投票选出。代表们被随机地混在一起，而不是按地区或以前的政治派别入座，这是相当有意的。\n\n这边，装腔作势的翼巴第法西斯分子维托里奥·费利斯，用蹩脚的赫兹兰语对一个阿奎莱亚代表说话，后者是一个改头换面、终于看到了泛狮鹫尼亚主义智慧的MPA成员。那边有一匹弗羽西亚的小马在对一个来自冥翎的前黑斗篷成员大喊大叫，一个民族主义神职哥萨克坐在他们中间，表情愤愤不平。\n\n就在房间即将爆发混乱的时候，喀戎·暴风羽站到了中央讲台上，代表总统元帅向代表们致意，并宣布泛狮鹫代表大会第一届会议开始。"
 griffonRepublic.286.a:0 "欢迎代表们！"
 griffonRepublic.287.t:0 "长长的规则"
 griffonRepublic.287.d:0 "随着总统选举的临近，国家选举委员会发布了一套针对总统候选人的规则和准则。虽然管理泛狮鹫尼亚代表大会的规则很严格，但这些规则更加严格，因为总统将是整个民族共和国的新形象。\n\n首先，他们必须表现出对三民原则的坚定不移的忠诚。这意味着不能有自由主义者，因为他们的有限政府和政治自由的想法损害了民安原则；不能有社会主义者，因为他们失败的经济体系破坏了民生原则；不能有那些奉行过于和平主义的候选者，因为这也与民安原则相矛盾；不能有地区主义者，因为民族原则当然意味着泛狮鹫尼亚民族主义；不能有文化异类，他们会通过侵蚀共同的传统和身份而破坏民族原则，当然也不能有君主主义者，钻石狗，隐性君主主义者，国际主义者，等等等等。任何候选者还必须从民族共和国的每个地区都获得至少1000个签名才能登记，这样，他们都必须在全国范围内进行竞选活动，以作为对地区主义的进一步防范。\n\n世界各地的谐律和社会主义共和国都谴责这些措施，认为这些措施实际上是在禁止任何不承诺延续曜尾政策的候选者，并称民族共和国的民主是虚伪的，是个法西斯国家。虽说由于狮鹫民族革命阵线是狮鹫尼亚唯一合法的政党，没有反对党，但许多地方领导人已经敦促他们社区的狮鹫抵制这些选举，其中一些鹫因为用煽动性的词语来描述委员会的规则而被监禁了。"
 griffonRepublic.287.a:0 "没有地方主义者、没有自由派和社会主义者？谁能竞选呢？！"
 griffonRepublic.288.t:0 "首次大选"
 griffonRepublic.288.d_kem:0 "在数周的竞选活动之后，总统投票日终于来临了。投票将分两轮进行，第二轮仅包含前两位。这样，如果出现了太多的候选人，胜者就不会是某个在单个地区拥有大量支持但没有能力吸引整个国家的鹫。\n\n最广为人知的候选者是喀戎·暴风羽，他早先就在曜尾的身边，拥有巨大的影响力。几乎整个当权派都支持他，而且他得到了军队的隐性支持。他承诺将继续执行曜尾的政策，重点是进一步将河间地边境军事化，但很多鹫觉得他是一个苍白的模仿者，他的反对者声称，暴风羽的总统任期将带来停滞和软弱。\n\n第二个候选者是迪特里希·马赫，他因参与确保赫兹兰的安全而崭露头角，此后一直是曜尾的忠实助手。马赫主张民族共和国进一步中央集权，指出边境地区的叛乱证明应该升级狮鹫标准语教育运动，并且要采用法团主义经济，将生活的各个方面置于国家的牢固控制之下，然后扩大GNRF的成员、增加其作用，使它为国家的关键机构，而非军队。他的反对者指责他是一个赫兹兰至上主义者，比地区主义者好不了多少，而且他的支持在赫兹兰之外相对较弱。\n\n第三位候选者是小亚历山大·克梅斯凯。他乘着对两位元帅的崇拜的顺风，被视为暴风羽和马赫的温和替代者。除了“支持平凡狮鹫”和“尊重我父亲和莱因哈特·曜尾的遗产”之外，他对自己的立场一直很模糊，他唯一的签名承诺是，只要像NRP这样的反对党坚持三民原则，他就会解除党禁。他在那些寻求变革的鹫中得到了很多支持，但坚定的民主派和谐律派仍在抵制选举，并表示“任何期望从小克梅斯凯那里得到除却御用反对派和更多虚假选举之外，更多东西的家伙都很天真”。\n\n最后，投票率很低，但三位候选者都接受了选举结果，莱因哈特·曜尾最终下台，而接替者是……"
 griffonRepublic.288.d_sun:0 "在数周的竞选活动之后，总统投票日终于来临了。投票将分两轮进行，第二轮仅包含前两位。这样，如果出现了太多的候选人，胜者就不会是某个在单个地区拥有大量支持但没有能力吸引整个国家的鹫。\n\n最广为人知的候选者是喀戎·暴风羽，他早先就在曜尾的身边，拥有巨大的影响力。几乎整个当权派都支持他，而且他得到了军队的隐性支持。他承诺将继续执行曜尾的政策，重点是进一步将河间地边境军事化，但很多鹫觉得他是一个苍白的模仿者，他的反对者声称，暴风羽的总统任期将带来停滞和软弱。\n\n第二个候选者是迪特里希·马赫，他因参与确保赫兹兰的安全而崭露头角，此后一直是曜尾的忠实助手。马赫主张民族共和国进一步中央集权，指出边境地区的叛乱证明应该升级狮鹫标准语教育运动，并且要采用法团主义经济，将生活的各个方面置于国家的牢固控制之下，然后扩大GNRF的成员、增加其作用，使它为国家的关键机构，而非军队。他的反对者指责他是一个赫兹兰至上主义者，比地区主义者好不了多少，而且他的支持在赫兹兰之外相对较弱。\n\n第三个候选者是奇里亚科·梅迪亚泰，是阿兰提戈具有争议性的革命者。有些鹫把他看作是共产主义的叛徒，另一些则认为他是普通鹫民的捍卫者。他推行“社会爱国主义”，将平等的国营经济与狂热的民族主义和个体对国家的全面奉献相融合。他险些触犯了选举委员会的规定，后者仅仅是勉强地支持了他参选。但是，他却出乎意料地在边境各地获得了相当的支持，他们只不过是不想再让一个赫兹兰狮鹫当权了。\n\n最后，投票率很低，但三位候选者都接受了选举结果，莱因哈特·曜尾最终下台，而接替者是……"
 griffonRepublic.288.a:0 "喀戎·暴风羽，曜尾的正统继承者！"
 griffonRepublic.288.b:0 "迪特里希·马赫，年轻的将军！"
 griffonRepublic.288.c:0 "为了两位元帅，选择小亚历山大·克梅斯凯！"
 griffonRepublic.288.e:0 "奇里亚科·梅迪亚泰，阿兰提戈革命者！"
 kemerskaiSpeech.1.t:0 "克梅斯凯就格罗弗的失败发表演说"
 kemerskaiSpeech.1.d:0 "“格罗弗五世，全体狮鹫的皇帝、赫兹兰国王、狮鹫海姆公爵、978年革命的摧毁者，早早逝去。终年四十七岁。\n\n同胞们，我也希望我能流下眼泪，但真相却是，除了令赫兹兰陷入毁灭与绝望之中，他并没有为这块土地做出任何贡献。我相信你们大家也赞同这一点——他令卡特琳堡被烧毁、强化了神官们的权威，在首都推行政教合一，并终结了狮鹫尼亚大陆上任何世俗化的希望。哪怕是第二次狮鹫尼亚革命近在眼前，他还是反悔了自己所有君主立宪的改革的诺言。\n\n他放松了对东边的骑士团的管控，令他们肆意屠杀小马。并把狮鹫岩公国抛给了一个孱弱的，由一个自称“爷爷”的老狮鹫控制的摄政议会！他连死的都不是时候！他给帝国留下了如此大的烂摊子，我几乎为他的死而欢呼。他的儿子甚至不到六岁，接下来很有可能由一个由贵族制，寡头的和腐败的摄政委员会来代替他。\n\n尽管很难说出口，但这是共和国的胜利。神罚终于降临到这个中年鹫的头上，而随着他的死亡与小皇帝的接任，整个赫兹兰的共和派与勇敢的爱国者们都将奋起反抗封建领主。从安江的布卢姆，或者叫“小克梅斯凯”，到罗马坞的迪·卡廷，整块大陆上的鹫民们都在准备着。\n\n我相信到了共和国的抗争结束、我们撰写历史课本的时候，民众们将会记述皇帝之死，以及它是如何改变狮鹫尼亚的。”"
 kemerskaiSpeech.1.a:0 "此即为暴君恶果。"
 kemerskaiSpeech.2.t:0 "克梅斯凯就阿奎莱亚革命发表演说"
 kemerskaiSpeech.2.d:0 "国民们，大家好。\n\n那句我已经重复了成百上千次的话语，共和之光终将在某日光耀整块大陆。这句话再次被证明是无比正确的。由那位老元帅泰奥多尔·韦朗尼先生发动的第二次阿奎莱亚革命，已经在西南轰轰烈烈地开始了。那个腐朽的阿奎莱亚王国，亦将再次灰飞烟灭。同胞们，978年与980年的共和革命已经开始回归了。这只是伟大抗争的序幕，而在最终我们终将在狮鹫海姆再度插上三色旗！\n\n在我发表演讲的同时，我已经授权我国政府正式承认韦朗尼先生的政权乃是阿奎莱亚的合法政权。我也希望在未来，我们两国政府可以握爪站在一起，共同反抗从鹫民爪中夺取应有权利的君主制的威胁。\n\n这是狮鹫尼亚大陆与全世界新黎明的开始，我们永远不要放弃民主的梦想！"
 kemerskaiSpeech.2.a:0 "祝贺你，韦朗尼！"
 kemerskaiSpeech.3.t:0 "克梅斯凯就天落城发表演说"
 kemerskaiSpeech.3.d:0 "天落确实是一个充满矛盾的地方。几乎所有的恶习都会在当地的街道上蔓延，然而在那里，你可以找到最典型的狮鹫们的竞争精神和雄心勃勃的梦想。他们能同时与暴君和英雄交易，而每次你觉得你应该谴责他们时，他们却让你吃惊。\n\n至少在路过的时候，很少有鹫不熟悉它的老总理黑哈尔德，同时，不撒谎还能夸赞这位狮鹫的就更少了。多年来，他一直安坐在天落城中，从狮鹫尼亚的混乱状态中牟取暴利。然而！天落又让我们惊讶了！在他的侄女接替他的时候，很多鹫会说天落已经被扭曲成了一个简单的寡头政权，但我要求这些鹫研究一下吉纳维芙·激翼总理的成就，准备感到惊讶吧。\n\n许多鹫可能会说，为了赶走黑哈尔德，武装革命是必要的，然而吉纳维芙·激翼却兵不血刃地做到了这一点。曾经统治那里的寡头们在她的周围分崩离析，而鹫民则站在高处。在赫兹兰，共和梦想的火炬仍在熊熊燃烧，而天落却一如既往地以自己的方式行事。"
 kemerskaiSpeech.3.a:0 "共和主义的火炬继续扩展！"
 kemerskaiSpeech.4.t:0 "克梅斯凯就喙索里尼发表演说"
 kemerskaiSpeech.4.d:0 "在最近的一段时间里，在翼巴第海岸上美丽的卡廷市，民主遭遇了暴政的重击。独裁者们不能通过鹫民的支持来获取力量，他们就向卡廷进军，以武力夺取此地。国内外都有些许的声音宣称喙索里尼将军可能是我们共和事业的盟友。但是在这里我必须声明一句，这些想法非蠢即坏。\n\n当共和国奋起抗争时，它是为了反对暴政，捍卫我们视为神圣而不容置疑的自由。它试图推翻专制的国王，让所有狮鹫都喝到自由之杯。这场翼巴第的运动却与我们大相径庭，他们更关心的是把他们的国王当作一个傀儡来炫耀，他们的军队则镇压所有敢于公开反对他们的狮鹫。\n\n我的共和党鹫们。毫无疑问，如果在三十年前，如果某个狮鹫像他一样夺取了所有的权力，他就不会是我们的盟友或同志。相反，他可能是反革命分子聚集起来的暴徒中最邪恶的一个，他们想要推翻革命，甚至后来他还篡夺了皇位，声称要保护它。\n\n无论我们的革命和这个所谓的“杜切”之间有什么表面上的相似之处，我们的核心目标和价值观都是不同的，甚至是矛盾的。在他身上，我们看到的不是另一种革命，而是旧秩序最后的、残酷的垂死挣扎。我们是否会在战斗中与他作战还有待命运来说明，但是我们永远、永远、永远不可能与这个暴君有任何合作！"
 kemerskaiSpeech.4.a:0 "暴君与独裁者。"
 kemerskaiSpeech.5.t:0 "克梅斯凯就镰爪夺权发表演说"
 kemerskaiSpeech.5.d:0 "国民们。\n\n我自豪地宣布，986年脱离我们伟大共和国的天际纳维亚社会主义革命政府已沦为专制独裁的国家，他们对社会主义或革命没有真正的忠诚。曾经是一位理想主义的将军的阿斯皮尔·镰爪已经废除了天际纳维亚的立法机关，并动爪加强自己对政府的控制。天际纳维亚在对自己所宣称的自由、社会主义和革命原则的令鹫不寒而栗的背叛中，倒下了。\n\n我早在几十年前就预见到了这一点——很明显，即使在他们刚脱离的时候，他们的革命也只是一个空想主义的梦。在野蛮征服北方部落期间，他们屠杀了成千上万小马，并从它的灰烬中建造了新天际纳维亚市。从那时到现在，他们的革命一直是对共和国不计后果的、莽撞的空想主义的警告。"
 kemerskaiSpeech.5.a:0 "我们都知道他们从开始就是腐朽的。"
 kemerskaiSpeech.6.t:0 "集中力量反对曦爪！"
 kemerskaiSpeech.6.d:0 "“国民们，帝国最近发生了一件大事，现在我必须让你们都知晓它。斐迪南·曦爪，一名驻军在狮鹫海姆的帝国将军，在帝国首都发起了一次政变，夺取了帝都并屠杀了小皇帝。据传他们将这个孩子的头直接撞向墙壁，事后他的尸体甚至无法被辨认。国民们，这就是我们要反抗的对象！我们正在反抗君主制必然的失败生出的造物，一种更为黑暗且危险的思想——极端民族主义，就像是翼巴第的法西斯主义者或者狮鹫海姆的护国公那样。\n\n然而，我们国内甚至还有鹫支持那个已经被取缔的狮鹫尼亚民族革命阵线，他们的意识形态和这个屠戮孩童、妄自尊大、无比邪恶的将军一模一样！他们知道自己支持的意识形态同那个把孩子撞到血肉模糊的狮鹫一样吗？知道了这些，他们晚上怎么还能闭眼呢？\n\n这个护国公引起的威胁甚至比任何专制君主国都要大。这是个极端贪图权力的狮鹫，他将会把这片大陆毁灭，以自己的想法重塑这篇大陆。这是所有共和党鹫都应该反对的反动意识形态的缩影。我们必须不惜一切代价战斗，夺回狮鹫海姆，消灭护国公的暴政。我们将执行正义，为他帝国的罪行执行正义，为谋杀年轻的狮鹫和成千上万的抗议者的罪行执行正义。他为数不多的支持者有句名言——“一切权力归护国公”，但我认为“集中力量反对护国公”更适合这种情况。不久，我的同胞们，我们将为这个狮鹫的罪行讨回公道。”\n\n顺带一提，虽然最终有消息传出，曦爪只是开枪打死了格罗弗，没有把他的头撞到墙上，但他的演讲表现得格外出色，共和国的应征数目在接下来的几天里急剧上升。现在帝国里有这样一个恶棍，我们也许有机会获胜。"
 kemerskaiSpeech.6.a:0 "“护国公”是君主制不可避免的产物。"
 kemerskaiSpeech.7.t:0 "第二次革命开始了"
 kemerskaiSpeech.7.d:0 "同志们，国民们，朋友们，大家好。\n\n在我发表演讲的同时，你们正勇敢地向南前进，为我们数十年来所面临的最大斗争做好了准备。前方的任务是艰巨的，因为我们正在面对帝国，而这个帝国已强硬地重启自己的暴政，并欲使我们的鹫民陷入束缚。它已经用武力将赫兹兰鹫重新囚禁，使土地染满鲜血。\n\n然而，自第一次革命以来，我们的承诺就挺立着。我们曾绊倒过，但没有跌下。978年的烈火仍然在我们心中燃烧，而我们对民权，民主和民生的承诺也被这些考验所历练。我们现在比以往任何时候都更加团结一致，在狮鹫尼亚的鹫民为自由而呐喊时，我们屹立不倒。\n\n从阿奎莱亚到格里富斯，被压迫者都在高声呼喊，要求拥有不仅仅是臣服与被压迫的权利，这一次，暴君们将意识到自己的野心将会受到无比的阻挠。\n\n在这个时候，我们作为共和事业的领头鹫之责任比以往更加明确，为此，我们现在准备纠正过去所犯下的错误，我们不仅为自己奋战，而且为所有尚未出生的狮鹫奋战，为所有鹫共享自由之杯而战。\n\n道阻且长，只有血泪才能换取我们渴望的自由。但这是我们所有鹫都必须愿意付出的代价。从第一次革命就开始战斗的同胞们，尚未长大就接替父母使命的孩子们，漫云勇敢的狮鹫们，以及全世界所有为这一伟大事业而团结的生物们：\n\n今天，第二次革命开始了！"
 kemerskaiSpeech.7.a:0 "为了共和国！"
 FAT_lord_protector_reaction:0 "§Y护国公§!控制了狮鹫尼亚帝国。"
 FAT_situation_in_nova_unfriendly:0 "§Y新狮鹫尼亚§!的情况对共和派§R不友好§!。"
 griffonRepublic_history.2.t:0 "狮鹫海姆起义"
 griffonRepublic_history.2.d:0 "格罗弗五世的政府在流言称四世的改革将被取消，以及皇帝实际上只是个贵族的傀儡之时陷入了政治动荡，帝国的政治框架开始出现了裂纹。贵族们骄奢淫逸，聚集了大量的钱财，而鹫民们受苦受难。军队中对皇帝的不满日益增长，尤其是一个由克梅斯凯、曜尾、瑰翼领导的有许多军官的小团体。在978年决定性的一天中，农民与工鹫占领了狮鹫海姆的街道，同街头安保战斗，冲进了豪宅与牢狱之中。帝国牢房中所有的囚犯都被释放了，鹫民们开始向皇宫进军。克梅斯凯和其他帝国军官加入了军队的哗变，同成百上千平民一道向帝国皇宫与帝国政府的大门射击。在这完全的混乱之中，一波平民成功涌入宫殿，踩烂了古老的地毯，将工艺品抛掷在地，击碎了神庙的彩窗。\n\n但是，尽管克梅斯凯尽最大努力寻找格罗弗五世，但没有鹫找到。根据共和党鹫的报告，他在最后时刻被厄洛斯带走了。不过平民与军队确实找到了除了他们两鹫之外的整个摄政议会。有些鹫被草草处决，剩下的就是游街示众，少数试图从鹫群中逃脱。摄政议会失去了在首都的权势，他们的死鼓动了无数狮鹫们。鹫民迅速在哗变的军队与国民共和党身后聚集起来，狮鹫尼亚共和国成立了。"
 griffonRepublic_history.2.a:0 "消灭这些帝国派！"
 griffonRepublic_history.3.t:0 "革命者的首次战斗"
 griffonRepublic_history.3.d:0 "在狮鹫海姆被夺取之后，帝国军逃向了铜岭和施塔莓公国，施塔莓的鹰爪家族向神官与皇帝提供了庇护。克梅斯凯派遣他的部队快速夺取了帝国直属领地，狮鹫海姆公国。他自己将占领鹫王河附近的间河地区，他的父亲芬宁男爵依旧统治着那里。莱因哈特·曜尾、施纳贝尔·翔日和安德斯·冯·布鲁玛，一名来自耶鲁的指挥官迅速加入共和国，向克罗纳方向进军。克劳斯·瑰翼被派遣东进，包围金斯顿的帝国军。\n\n克梅斯凯的军队在鹫王河与间河公爵乔纳斯·哈德威勒交战。这是他作为共和国临时大总统与新元帅首次展示自己策略的作战，并获得了决定性的胜利。乔纳斯的部队向北溃退，在与共和国部队的再次交战之后，逃入了铜岭。在这次作战中，克梅斯凯的军队借助河流作为优势，而乔纳斯则不善谋略，派他的军队强行跨河，他的士兵被共和国炮火一个个击倒，而共和国军只有少数战死。\n\n哈德威勒之后被揭露出他在战前喝得酩酊大醉，觉得共和国军队只不过是一帮农民，根本不需要真正的谋略。神官意外地恼火，将他流放出了帝国，据说公爵他最后在斑马里加把自己灌死，坚信共和国军的胜利是必然的，而他辜负了小皇帝。"
 griffonRepublic_history.3.a:0 "干得漂亮，克梅斯凯！"
 griffonRepublic_history.4.t:0 "间河公国的陷落"
 griffonRepublic_history.4.d:0 "在克梅斯凯向间河北部行进时，一件令鹫惊讶的事情已经发生了。当地首府伍滕莱斯的居民，紧随着他们的公爵在鹫王河失败流亡后组织了一次农民起义。公爵的兄弟和继承者被驱逐到了钻石山以服侍神官，间河的农民为自己赢得了自由。这个全新的间河农民共和国本质上几乎是社会主义的，它分发财富，鹫鹫平等，并开始组建公社。克梅斯凯本来希望威慑这些叛军，他的政治对手阿斯皮尔·镰爪劝他与农民会面，以优厚条件接纳他们。会谈中，间河将在完全忠于共和国的情况下给予高度自治，而共和国也遵守了诺言。"
 griffonRepublic_history.4.a:0 "看来革命势不可挡。"
 griffonRepublic_history.5.t:0 "大义灭亲"
 griffonRepublic_history.5.d:0 "克梅斯凯的在间河的军队继续北进，伴随他一同前进的还有间河农民共和国的农民民兵。在那里他们同克梅斯凯的父亲，年老的芬宁男爵阿德斯的部队交战了。在芬宁之战，阿德斯的部队一开始占据上风，但是他的儿子利用了防御策略和他出名的弹幕射击战术，在防御期间打垮了他父亲的部队。数以千计的狮鹫在克梅斯凯的防御线上倒下，而在他进攻的时候，男爵在数量上占优的部队反而被驱赶进了城市。\n\n男爵的军队投降了，他自己被他的亲儿子监禁。和他的军官一道（士兵们被给予了加入共和国军的机会，拒绝加入的被立刻处决）被带到了芬宁城中心的广场，这里曾经是他宣读皇帝诏书、执行砍头的地方。现在一转攻势了，阿德斯以同鹫民作对的罪名被斩首。被他亲儿子背叛的芬宁男爵在临终前的最后一刻大骂了克梅斯凯。\n\n共和国控制了整个间河地区，曜尾与瑰翼的部队在东、南、北三个方向也取得了成功。看来现在共和国已牢牢控制了环狮鹫海姆的地区，很多部队向共和党支持率甚高的卡特琳与安江行进。"
 griffonRepublic_history.5.a:0 "令鹫胆寒的时刻。"
 griffonRepublic_history.6.t:0 "狮鹫尼亚的新春"
 griffonRepublic_history.6.d:0 "在控制了以狮鹫海姆为核心的帝国中部地区后，国民共和党党首与间河战役的胜利者亚历山大·克梅斯凯被很多鹫看作是革命领袖，他决定举行帝国史上首次总统选举。选举上他自己领导的国民共和党占据了主导地位，但是也有其他党派，例如社会主义鹫民党，由年轻的理想主义者阿斯皮尔·镰爪领导，拥护社会主义和革命价值观。选举中还有一些右翼革命组织，如由已经亡故的Peter Alstrenner领导的狮鹫民族革命阵线，支持极端的反君主主义、民族主义和泛狮鹫尼亚价值观，以及法团经济。\n\n毫不吃惊的是，克梅斯凯赢得了77%的票数，剩余两党的票数都不足15%。国民共和党所提出的华丽的民主原则，以及革命尚未结束，鹫民需要稳定的现状，都大大地促进了该党派的胜利。克梅斯凯作为战争英雄的经历也让他成为了极受欢迎的参选者，他的内阁主要由各温和派系之间的妥协组成，包括军队将领、务实主义者和理想主义者，他们都在民主事业下团结，或者说，理论上如此。\n\n克梅斯凯执政的首个百日意外地稳定，那些帝国的反革命分子还在北边舔着伤口，没有对新生的共和国发动大型的入侵。为了安抚工农阶级，以及其他不满的民众，他立刻开始进行大规模的改革。第一项改革是移除帝国国内任何的奴隶制、农奴制等制度的残余，不让任何鹫陷入那样的绝境，哪怕这些制度在帝国境内已经几乎不再实行。他对平民的福利进行了改进，设立了诸如最低工资法的工业改革，对贵族和寡头增加税收以进行对平民的财富再分配。他的政策广受支持，支持率进一步提升。不过，他的政府确实难以解决通胀问题，比起平衡预算，他的经济学家们更关注于福利政策，令印钞机不停运转，印出北风币以满足克梅斯凯的雄心壮志。\n\n狮鹫尼亚自由了，至少现在如此。"
 griffonRepublic_history.6.a:0 "一个真正的民主制国家？"
 griffonRepublic_history.7.t:0 "好景不长"
 griffonRepublic_history.7.d:0 "不幸的是，那些流亡的贵族并不愿意把国家拱爪交给共和国。在神官厄洛斯七世，五世皇帝忠诚的守护者与宗教导师的帮助下，他们发动了一场反革命行动。这次行动也获得了子民异常忠于帝国的铜岭伯爵与施塔莓女公爵的协助，反革命分子因此在北方站稳了足跟。帝国军自铜岭与施塔莓方向而来，他们击垮了间河的共和国军，终结了此地的社会主义农民共和国，恢复了芬宁男爵的爵位，将其授予克梅斯凯的兄弟奥古斯都一世。镰爪逃过一劫，继续支持克梅斯凯的共和党，而许多极端民族主义者在共和国沦陷时抛弃了他。\n\n钻石狗和厄洛斯七世，以及帝国、鹰爪、弗羽西亚军一同围剿总统元帅，克梅斯凯只得要求从狮鹫海姆全面撤退。他希望战术撤退到北方，夺取虚弱的漫云公国。他把计划传达给了军中所有的将领。参与这次长征的部队包括克梅斯凯在间河的部队，瑰翼与白羽在卡特琳、安江作战的部队与曜尾在北方的部队。还有其他很多部队试图参与，但是他们接连被帝国军的扫荡消灭了。很多共和国军留在了安江，藏在广袤的沙伊斯森林中，时常对安江的林中小镇发起小型袭击。还有些前往了卡特琳，其中包括支持共和国的骑士师，忠诚的骑士与共和党革命者确实是个奇怪的组合。"
 griffonRepublic_history.7.a:0 "再见了，共和国甜蜜的家"
 griffonRepublic_history.8.t:0 "始之终末"
 griffonRepublic_history.8.d:0 "卢卡·瓦特将军，在防守铜岭占领区时，被交付了一项任务，率一支共和党鹫与钻石狗组成的军队跨过白尾山脉以送到漫云北部，在漫云公国疲于应对南方攻势时从后方夹击。卢卡的作战计划对轻易击败漫云公国和缓解白尾山脉地区已经揭竿而起的茶羽义军的窘境很是关键。但是，他被铜岭伯爵爪下由现在有名的舍普·铁厅将军带领的军队俘虏。他的军队被多个钻石狗师团从侧翼进攻并被剿灭，让双面夹击漫云公国的计划变得不可能。随后，卢卡的尸体被发现和乔治·茶羽的尸体躺在一起，乔治的女儿卢娜继续他那未竟的事业。\n\n在卢卡的军队于北方失败的时候，一位名叫黑石的不起眼的共和国军官，叛离了共和事业，她的部队变成了一支自主行事、四处掠夺的匪军。她原本的为革命夺取狮鹫岩的目标蜕变成了夺取狮鹫岩建立她的盗匪国度。随着她继续向南进军，克梅斯凯要求她逃往漫云的信件也被烧得一干二净。她的军队不再向北长征了。\n\n但是，不是所有的希望都泯灭了。克梅斯凯的军队同曜尾、瑰翼的部队在弗羽西亚边境会师，并尝试向北撤退进入漫云公国。在其继续北撤时，他们被施塔莓公国和忠于弗羽西亚大公的大军阻截了。尽管军队被削弱，但是这三位狮鹫共同的勇敢与智慧让他们三个与自己的军队得以脱困，但是遭受了中等的损失。米拉贝尔战争胜利了，三支军队跨过弗羽西亚边界进入漫云。"
 griffonRepublic_history.8.a:0 "诸君，向漫云城进发吧！"
 griffonRepublic_history.9.t:0 "漫云南部的战斗"
 griffonRepublic_history.9.d:0 "当共和国军从弗羽西亚-漫云边境向北进军时，他们首先到达了科洛堡市，这是公国境内唯一一个被非世袭制统治者管理的地方。它其实是一个帝国自由市，确切地说算是狮鹫帝国的直辖附属国。但是在965年时，由于虚弱的帝国难以做出反应，漫云公爵奥托二世尝试将这座城市并入公国。但是，科洛堡公开宣布支持克梅斯凯的叛乱，向他的部队提供武器、补给、食物和居所。科洛堡市长卡尔·斯文斯-林纳，和他未来成为共和国显赫部长的学生托比亚斯·谢芬霍夫成为了漫云公国亲共和派运动的领袖，在他们宣布支持克梅斯凯后在漫云国内激发了无数的农民起义和袭击。\n\n尽管共和国方面相信漫云公国将会很快陷落，在北方的战争却一直持续下去。在979年的冬天，共和国军只是掌控了南方的一些省份，包括翼哈根省绝大部分（翼哈根市依旧处于共和国军激烈的围城战中）。漫云海军依旧驻扎在该市港口，从韦迪纳和帝国那里购买货物以支持守军。有趣的是，帝国军此时没有从南边进攻共和国军，他们这时正在镇压内部的叛乱，努力保全自己在多个附庸宣布独立之后自己仅存的一点领土。看起来共和国军陷入了长久的战争，翼哈根的围城胜利和进攻漫云只是一个梦。\n\n当共和国军对夺下翼哈根已经失望时，局势却向他们一方偏转。来自弗羽西亚一个小贵族家庭的共和国海军军官赫尔曼和科尼利乌斯·哈森泰尔夫率领的一小支舰队的抵达打破了僵局。这对兄弟打垮了漫云海军，后者根本没有注意到共和国海军的存在。在漫云海军被击溃之后，翼哈根向共和国投降了。Leonhard Gørtz伯爵向克劳斯·瑰翼写了一封投降信，但是这封信没有挽救他的生命。由于他对共和国和革命犯下的罪行，投降几个小时之后他就被吊死。"
 griffonRepublic_history.9.a:0 "至少我们获得了一些公众的支持……"
 griffonRepublic_history.10.t:0 "漫云城之战"
 griffonRepublic_history.10.d:0 "在接下来的几个月里，共和国军的战线向前推进了少许，但是依旧未能夺取最终目标漫云城。这座城市被曜尾和瑰翼数目超过两倍多的师团围困，但是奥托的部队远比共和军的规模要大，这样他们就能依靠数量优势击退战术围困。由于西部和东部主要由共和军控制，目前导致公国投降的主要因素就是漫云的存亡，当伯爵和男爵们在他周围倒下时，奥托二世将自己和他的军队封闭在公国的中心地带。\n\n但是，尽管奥托二世可以保护他的城市免受共和国军入侵，他却不能从自己的市民爪中保住城市。在暗夜的掩护之下，共和国间谍带领数千工农鹫们冲进了漫云宫殿，和978年那一幕无比相似。共和军命令允许二世暂时活着，之后就被他们以叛国吊死。在被驱逐出狮鹫海姆后一直渴望复仇的共和军的怂恿下，漫云的工鹫和共和军士兵对无数的贵族处以私刑，这就是后来大家所知的“漫云之劫”。奥托二世的儿子和继承者卡尔，以及他的兄弟克里斯托弗都被共和党鹫杀死，翎坛王朝最亲密的成员也是如此。\n\n奥斯卡·翎坛是奥托的侄子，在克梅斯凯面前祈求活命。克梅斯凯也允许他和妻女活了下来。在克梅斯凯的仁慈被用作共和党的宣传工具时，奥斯卡则被流放到邻近国界线的一个北方部落小村庄，确保翎坛家族的鹫不会再威胁漫云城和共和国。"
 griffonRepublic_history.10.a:0 "胜利了！"
 griffonRepublic_history.11.t:0 "最黑暗的时刻"
 griffonRepublic_history.11.d:0 "“这叛逆的反革命无疑是比厄洛斯七世、鹰爪和铜尾加在一起更危险。因为我们是一个统治阶级只占少数，且农民的资产已经被毁的国家，此外，这次分裂还会释放大量潜在暴动的元素。”——亚历山大·克梅斯凯，对天际纳维亚革命的评论\n\n986年的选举原本预计是亚历山大·克梅斯凯领导的国民共和党以微弱多数获胜，但即便如此，共和党内的许多鹫仍对选举结果是否真的会让克梅斯凯获胜心存疑虑。社会主义激进分子和革命者阿斯皮尔·镰爪，他利用了国内对“老元帅”的异议不断增加的机遇，以及他与漫云狮鹫权利党的联盟，这意味着社会主义鹫民党可能最终会在全国范围内对克梅斯凯政府构成威胁。当报纸预测镰爪有微弱的获胜机会时，克梅斯凯做出了一个决定，这个决定将永远改变共和国。\n\n国民共和党控制的立法机关以三分之二多数通过了“986年共和国动员戡乱法案”，这将大大加强总统执政的权力，并且暂停国会和总统选举直到“国家安全回到让民主制度再次繁荣的有利位置。”任何镰爪担任总统的希望都破灭了，克梅斯凯的NRP再次成为共和国唯一的政治力量。\n\n社会主义者虽然是叛徒，但他们对“986年共和国动员戡乱法案”绝不掉以轻心。阿斯皮尔·镰爪组建了统一社会主义革命阵线，并在第二次长征中逃往北方，而饱受战争蹂躏的共和国军队无力阻止他。天际纳维亚社会主义共和国成立了，986年的革命永远地在这个刚刚起步的共和国的历史和政治上打下了烙印。"
 griffonRepublic_history.11.a:0 "一切都失去了吗？"
 griffonRepublic_history.12.t:0 "瑰翼之变"
 griffonRepublic_history.12.d:0 "虽然共和国已经从986年的革命和天际纳维亚的背叛中恢复了许多，但许多政府里的鹫仍然对克梅斯凯政权的政策不满，尤其是克梅斯凯忠实的参谋长和副总统克劳斯·瑰翼。（在他被解职后，这两个职位分开了）\n\n瑰翼对克梅斯凯的独裁措施大失所望，他开始与未能实现共和革命最初承诺的原则的克梅斯凯总统就越来越琐碎的事情发生争执。当瑰翼暗示君主立宪制应该会比当前的克梅斯凯政权更好时，克梅斯凯总统愤怒地以“不服命令”这一简单罪名将他免职。他的副总统职位交给了施纳贝尔·翔日，这是另一位对克梅斯凯日渐增长的威权主义持怀疑态度的政治家，克梅斯凯的目的是重新缓和全国共和党谐律派与其共和党右翼守旧派分子之间的关系。他的参谋长继任者是莱因哈德·曜尾，备受争议。当时曜尾正接受媒体和政府的调查，以确定他是否与极端民族主义团体有联系。为了统一共和国的政治因素，克梅斯凯任命了曜尾这个尽管有能力当元帅，但绝对不应该领导军队的狮鹫。\n\n克梅斯凯把瑰翼送到北方去“维持和平”，但这将被证明是一个致命的错误。瑰翼被他曾经发誓要支持的政府的行动激怒了，他开始了小规模的土匪和军阀活动，召集漫云本土狮鹫和君主主义力量组成地下联盟。虽然瑰翼劫掠的程度并没有像后来曜尾那样高，但他的行为加速了共和国陷入乱局，盗匪活动和军阀主义日渐增长，这些因素甚至影响到今天的共和国。"
 griffonRepublic_history.12.a:0 "糟糕了。"
 griffonRepublic_history.13.t:0 "曜尾叛离"
 griffonRepublic_history.13.d:0 "在1003年10月13日夜，漫云城差点被火焰所烧毁。莱因哈特·曜尾和很多同狮鹫尼亚民族革命阵线有关系的共和国指挥官与政治家，被发现犯有无法形容的暴行——对共和国的叛国行为，以及恐袭未遂。尽管曜尾没有被发现真正有罪，但是民族革命阵线内部的一个线鹫泄露了他们的一份详细计划——制造一次恐怖袭击，嫁祸于社会主义者和共和党谐律派，以此来促使革命阵线控制政府。而这名单中自然也包括曜尾。\n\n曜尾否认了政府方和审讯者指控的所有罪名，克梅斯凯没有足够的证据给曜尾参与恐怖袭击定罪，而是把他流放到北方去，取消他所有的政府职位。曜尾的总指挥职位由翔日，克梅斯凯眼中一个极为危险的副总统接替，翔日的副总统则由金羽接任，他是一个务实主义者，还是克梅斯凯自革命以来坚定的盟友。瑰翼和曜尾都被逐出了政府，这两位最高指挥官之间达成了一种默契，不过对于流放到北方这件事，曜尾比瑰翼看得更重。"
 griffonRepublic_history.13.a:0 "真TM该死！"
 griffonRepublic_history.14.t:0 "共和党左派的崛起"
 griffonRepublic_history.14.d:0 "在一次未被共和国内所有鹫预见的政治变动之中，社会主义和工联主义者再度崛起，夺取了自986年革命以来的巨大胜利。\n\n一切都始于漫云城议员、激进主义者里卡德·艾斯特勒的起势，他支持广泛的福利项目、工鹫的合作社自主管理，以及对这座挣扎求存的城市持续进行城市化。他的“左翼共和党”迅速在共和国内很多市议会赢得了席位，从斯卡克到翼哈根，新的社会主义理念正在共和国的工会与厂房中刻下自己的印记。\n\n而一个小小的议员席位也无法满足艾斯特勒了，在1005年，他尝试竞选漫云市长，这是克梅斯凯中止宪政后为数不多依旧能进行选举的职位之一。时任市长尼古拉斯·埃格舍尔指责艾斯特勒为“一个没有信仰的赤匪、一个天际纳维亚的傀儡和一个愚蠢的理想主义者。”埃格舍尔自己属于翔日的那一派，和艾斯特勒有很多共同支持的观点，但是他强硬的反社会主义观念成为了他的弱点。艾斯特勒在他最近几个月于漫云推广的福利项目加持之下以微弱优势赢下了市长的位置，埃格舍尔也离开了他就任长达20年的席位。\n\n很快，艾斯特勒被任命为克梅斯凯的政务委员会委员之一，国民共和党左翼的势力在共和国内茁壮成长。成长的不只是左翼的影响力，还有艾斯特勒的雄心。"
 griffonRepublic_history.14.a:0 "操蛋的社会主义者。"
 griffonRepublicNews.1.t:0 "小马利亚承认了[FAT.GetName]"
 griffonRepublicNews.1.d:0 "[This.GetNewspaperHeader]今天，在几次小马利亚和狮鹫尼亚共和国的特使的会面之后，[equestria.GetLeader]公开承认共和国是狮鹫尼亚的合法政府。此外，小马官方发表声明，称共和国将会为鹫民带来民权、民主和民生，她的成功将会终结大陆上的暴政压迫。作为回应，狮鹫尼亚帝国谴责小马利亚为“腐朽国家”。"
 griffonRepublicNews.1.d_ne:0 "[This.GetNewspaperHeader]今天，在几次小马利亚和狮鹫尼亚共和国的特使的会面之后，[equestria.GetLeader]公开承认共和国是狮鹫尼亚的合法政府。此外，小马官方发表声明，称共和国将会为鹫民带来民权、民主和民生，她的成功将会终结大陆上的暴政压迫。"
 griffonRepublicNews.1.a:0 "我们要感谢小马利亚的朋友。"
 griffonRepublicNews.1.b:0 "卑鄙的蠢货！"
 griffonRepublicNews.1.c:0 "这是伟大友谊的开端！"
 griffonRepublicNews.1.e:0 "有趣。"
 griffonRepublicNews.2.t:0 "狮鹫海姆升起了三色旗"
 griffonRepublicNews.2.d:0 "[This.GetNewspaperHeader]今天，共和国三色旗在帝国前首都，狮鹫海姆的皇宫升起。这标志着共和国军队的巨大胜利。通过承诺改革与和平，它已经控制了原帝国绝大多数领土。[FAT.GetLeader]宣布民权，民主和民生是所有狮鹫享有的基本权利。至于这句诺言是否成真，还有待验证。\n\n共和国战胜了她古老而专制的对手，大陆的新时代将由她来引领。"
 griffonRepublicNews.2.a:0 "这是个全新的纪元！"
 griffonRepublicNews.2.b:0 "有趣。"
 griffonRepublicNews.2.c:0 "令我们惊叹。"
 griffonRepublicNews.2.e:0 "真可怕！"
 griffonRepublicNews.3.t:0 "克梅斯凯元帅逝世"
 griffonRepublicNews.3.d:0 "[This.GetNewspaperHeader]今天，狮鹫尼亚共和国的总统元帅克梅斯凯去世了。他的死亡也是共和国全国哀悼，狮鹫们向共和国革命中最伟大英雄告别的起始。在革命中，他引领了共和国走向独立。\n\n随着她最伟大的政治家和将领的逝世，整个共和国陷入了悲痛。"
 griffonRepublicNews.3.a:0 "共和国永远不会忘记她的元帅。"
 griffonRepublicNews.3.b:0 "又少了个麻烦制造者。"
 griffonRepublicNews.3.c:0 "一名伟大的英雄离世了。"
 griffonRepublicNews.3.e:0 "他也该献身了。"
 griffonRepublicNews.4.t:0 "克梅斯凯总统下台"
 griffonRepublicNews.4.d:0 "[This.GetNewspaperHeader]随着国民共和党左翼上台，克梅斯凯的执政生涯也终于到了尽头。他仅仅保留“国父”之号、还有一个国会中的荣誉席位，并作为新总统的特别顾问。随着他的下台，共和国现在实行了民主社会主义，并且共和党的左翼很可能会同谐律派合作。新政府宣布他们依旧坚信共和国之梦，并且不会向天际纳维亚方面屈服。不过这在国内依旧产生了诸多疑虑。被罢黜的前总统克梅斯凯在翼哈根的新家这么评论道“这简直是个无比令鹫恶心的举动，就算这是他们自称的民主社会主义，但这是在我们共和国所象征的一切之上吐了一口浓痰！”这究竟是共和国之梦的新阶段呢？还是一个共和国噩梦的开始呢？"
 griffonRepublicNews.4.a:0 "共和国是时候向前进发了。"
 griffonRepublicNews.4.b:0 "他是个不错的政治家，没有谁可以否认。"
 griffonRepublicNews.4.c:0 "社会主义者在资产阶级把持的民主中获胜了？"
 griffonRepublicNews.4.e:0 "共和派的渣滓，他罪有应得。"
