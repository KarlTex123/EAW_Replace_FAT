 FAT_Chaos_idea:0 "土匪肆虐"
 FAT_Chaos_idea_desc:0 "在共和国被狡诈的帝国击败之后我们被迫北征，到那帝国压迫不到的地方。尽管我们已经控制了占领导致的混乱，土匪势力依旧为祸乡间，我们的政府无力镇压。"
 FAT_Chaos_idea1:0 "土匪祸乱"
 FAT_Chaos_idea1_desc:0 "我们已经开始平定乡下，将确保正义的法律与秩序带给这块土地。我们依旧有很长的路要走，但我们已经开始保存并传递共和主义的火炬。"
 FAT_Chaos_idea2:0 "土匪问题"
 FAT_Chaos_idea2_desc:0 "现在，随着我们压制了那些最无法无天的家伙们，阴霾似乎已经散去了。晚上狮鹫们已经可以安心在街上行走，也清楚犯罪必定会受到惩罚。有些土匪的堡垒依旧存在，但他们不会威胁共和国太久了。"
 FAT_unruly_army_idea:0 "不服管教的军队"
 FAT_unruly_army_idea_desc:0 "我们所继承的军队是旧共和国的残余，以及来自旧帝国那些理想主义者，被排斥者和雄心勃勃的鹫。但是，由于我们先前的不作为，军队的士气暴减。有些部队甚至诉诸于掠夺与兵变。这完全摧毁了我们发起任何军事行动的能力，并损害了公民对政府的尊重。在部队彻底瓦解、国家毫无防卫前我们必须把士兵们和他们那投机取巧的将领们带回正轨。"
 FAT_refuse_orders_idea:0 "逃兵"
 FAT_refuse_orders_idea_desc:0 "尽管士气低落已经有段时间了，现在我们的士兵开始完全抗命，并索要我们无法承担的巨额加饷。我们只能希望在我们重新管好他们之前他国不会乘虚而入。"
 FAT_unruly_army_idea1:0 "不服管教的军队"
 FAT_unruly_army_idea1_desc:0 "我们所继承的军队是旧共和国的残余，以及来自旧帝国那些理想主义者，被排斥者和雄心勃勃的鹫。\n由于最近对军队的妥协让步，他们开始渐渐守规矩起来，但是还是要做更多的工作。"
 FAT_unruly_army_idea2:0 "不服管教的军队"
 FAT_unruly_army_idea2_desc:0 "我们所继承的军队是旧共和国的残余，以及来自旧帝国那些理想主义者，被排斥者和雄心勃勃的鹫。\n几乎所有的士兵都恢复了忠诚，但是还是有些不愿服从，不过我们终于可以看到曙光了。"
 FAT_offer_favors_idea:0 "贿赂换取服从"
 FAT_offer_favors_idea_desc:0 "我们选择以大笔钱财和资源来安抚曜尾。现在其余鹫必须努力工作来弥补这个损失。"
 FAT_building_military_academy_idea:0 "正在建造军校"
 FAT_building_military_academy_idea_desc:0 "我们投入了许多资金以建造新的军校以培养明日的共和国英雄。这会在短期延误我们其他的建设项目。"
 FAT_military_academy_idea:0 "共和国军校"
 FAT_military_academy_idea_desc:0 ""
 FAT_reform_chain_of_command_idea:0 "改组的指挥系统"
 FAT_reform_chain_of_command_idea_desc:0 "我们重组了军事官僚机构和指挥系统，令其更能适应新千年。这会帮助我们以才华为标准更轻松地提拔军官们。消灭大量文书工作的另一个好处是，我们可以发出有争议的指令而无需先填写十张表格。"
 FAT_loyal_army_idea:0 "忠诚的军队"
 FAT_loyal_army_idea_desc:0 "军队现在知道是谁摧毁了帝国的铁链，是谁在绝望时刻带大家北征。当然是我们勇敢的总统元帅。现在他们已经过改革，并被提醒了职责所在，他们将跟随总统走向胜利。为了总统我们将赴汤蹈火，见证并实现他的梦想！"
 FAT_modern_army_idea:0 "现代化的军队"
 FAT_modern_army_idea_desc:0 "革命之梦燃烧在所有鹫的心中，而军队可以实现这个梦想。我们会为了自由正义而战。只要还有一只鹫没断气，还有一只爪子可以拿枪，我们都将奋斗到底！"
 FAT_Army_Reform_idea:0 "经改革的军队"
 FAT_Army_Reform_idea_desc:0 "我们已经提高了征兵的标准。尽管以前我们可能很想不顾一切地接受任何鹫，但我们再也不能放任自流了，否则会让我军乃至整个共和国的声誉都受到威胁。因此，现在只能使用最聪明，最健康的狮鹫。这应该有助于确保未来任何军事行动的成功。"
