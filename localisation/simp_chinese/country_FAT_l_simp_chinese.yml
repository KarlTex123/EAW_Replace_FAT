 FAT_our_history:0 "共和国抗争史"
 FAT_our_history_desc:0 "狮鹫尼亚共和国拥有短暂而丰富，充满冲突、奋斗与战争的历史。从978年革命爆发，到次年的长征，再到986年的天际纳维亚困境，共和国经历了无数冲突与挣扎，几乎使我们的国家崩溃了。"
