 FAT_The_Cloudburian_Minority_idea:0 "语言鸿沟"
 FAT_The_Cloudburian_Minority_idea_desc:0 "国民共和党主要由赫兹兰鹫组成，同占大多数的漫云本土狮鹫之间有明显的语言文化差异，难以跨越。有些差异甚至存在于意识形态层面上，相当多本土狮鹫都希望漫云公国复辟并驱逐这个他们得不到代表权的共和国。克梅斯凯来自赫兹兰，许多政府职位也不是本土狮鹫所从事的。有时共和国税务官与其他官员甚至不能理解漫云语，这导致在北部这一本土狮鹫占主导的地区行政效率明显下降。"
