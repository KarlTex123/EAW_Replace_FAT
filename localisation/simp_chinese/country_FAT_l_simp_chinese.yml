 FAT_political_1:0 "托比亚斯·谢芬霍夫"
 FAT_political_1_desc:0 "托比亚斯·谢芬霍夫本来不是克梅斯凯革命运动的成员。他是奥托二世统治时期科洛堡市一位杰出的公务员。当共和军开始向北长征时，他们首先到达的城镇之一就是科洛堡。谢芬霍夫说服了市长卡尔·斯文斯-林纳支持共和党运动。科洛堡开始成为共和国军最重要的据点之一。由于他在长征中的支持，谢芬霍夫成为了杜恩峡湾的第一位参议员。谢芬霍夫的政策建立在妥协与和解的基础上，他成为共和国中一个非常受欢迎的鹫。"
 FAVORABLE_CONDITIONS_SIVENHOF:0 "该国是§Y民主共和国§!，或者谢芬霍夫§Y是首相§!。"
 FAT_political_3:0 "里卡德·艾斯特勒"
 FAT_political_3_desc:0 "里卡德·艾斯特勒，国民共和党左翼的创始者和领袖，981年出生于漫云。当时漫云城处于共和国的控制之下，是由克梅斯凯政府中唯一一个的没有参加过长征和革命的部长统治的。艾斯特勒的父亲是土生土长的漫云狮鹫，他的母亲是来自共和国赫兹兰领土的难民，他们用漫云鹫的方式把他抚养长大，艾斯特勒很快就开始崇拜天际纳维亚社会主义共和国及其独特的政府制度。\n\n艾斯特勒参加了许多社会主义和工会运动，最终成为漫云市议员，在左派NRP的旗帜下，他承诺将为共和国建立一个民主的社会主义政府。虽然他在漫云市议会任职期间放弃了许多支持天际纳维亚的观点，但许多狮鹫开始不信任他，他忍受了无数对他的诽谤。\n\n然而，尽管困难重重，艾斯特勒还是在1005年时在一次被克梅斯凯政府允许的地方选举中当选漫云市长。他的对手是一个激进的共和党和反共分子，被赶下台。艾斯特勒立即开始在这个正在进行工业化城市进一步推进改革。\n\n他的市长职位现在把他置于一个有趣的境地——作为共和国最有权势的政治家之一，艾斯特勒拥有成为共和国下一任总统的权力和影响力——如果共和国不陷入反天际纳维亚的狂热的话。"
 FAT_political_2:0 "埃里希·克里格"
 FAT_political_2_desc:0 "埃里希·克里格出生于格赖芬马尔申农民共和国，他总是被共和的理想和言辞所吸引。然而，他发现农民共和国严重缺乏共和，因为它是狮鹫海姆君主主义者的傀儡，而且太弱了，无法完成任何实质性的工作。不久之后，他加入了国民共和党。他在格赖芬马尔申的经历让他对分权化的国家产生了怀疑。正因为如此，他加入了共和党的右翼，相信一个强大的政府能够解决土匪问题。克里格的经历让他成为了军备和战争部长，但他因为不会说漫云语而受到北方狮鹫的批评。"
 FAT_political_4:0 "科尼利乌斯·温克"
 FAT_political_4_desc:0 "温克出生于菲兹拉，是个高产的共和国作家。他以煽动性的文笔而出名，也是因为写出“扰乱安宁”的激烈鼓动共和主义的文章而被逐出天落。他来到了弗羽西亚，并加入了此处的共和国军。长征之后，他日渐隐世，最后彻底消失于大众视野，在邻近韦迪纳边境的房子一鹫呆着。他继续写作，但是风格越来越混乱，文笔越来越晦涩。他的某些新书销量格外高，例如其中一本批判小马利亚君主制为“谐律君主制的谎言”的书。但也有些作品就是彻头彻尾的疯话，例如他在一本书中声称“在终末之终，山羊们将会回归，与玛尔一道毁灭我们的种族。”"
 FAT_political_6:0 "莱因哈特·曜尾"
 FAT_political_6_desc:0 "被大家认为是“共和国内一鹫之下，万鹫之上”的曜尾是克梅斯凯在革命期间最信任的将领之一。他是个残暴的狮鹫，他的观念由对他眼中“腐朽”与“寡头”的帝国及其政治系统的厌恶与复仇所驱动。在克梅斯凯取缔了狮鹫尼亚民族革命阵线，一个曜尾参与的极端民族主义与泛狮鹫尼亚主义党派之后，他与克梅斯凯的关系就破裂了。这些年来，他带着自己爪下的军队在乡间游荡，抢劫军械库、城镇与农场，导致共和国内军队的不服管教。不过，如果给予足够的让步与妥协，这个国内最危险的狮鹫将会成为克梅斯凯最忠诚的盟友，愿为革命献身。"
 FAT_political_7:0 "斯特凡诺·阿里韦利"
 FAT_political_7_desc:0 "斯特凡诺·阿里韦利来自翼巴第的卡廷市。972年，甘贝托国王死后，他的家庭搬到了帝国境内，在那里他们不受欢迎，因为帝国鹫对翼巴第鹫怀有敌意。斯特凡诺加入了军队，但他的翼巴第籍贯却一直备受嘲笑，他在该地区逐渐发展起来的泛狮鹫尼亚共和主义运动中找到了安慰。斯特凡诺最终参加了革命和长征。然而，他不会说漫云语，只懂一点赫兹兰方言。尽管他在翼巴第经济学院时是一名银行业专家，但他已经开始酗酒并浪费自己的时间，厌倦了自己无法与这个共和国的大多数狮鹫打交道的事实。\n\n唯一让他留在共和国的是他对革命的狂热忠诚，以及对他最伟大的朋友海因里希·金羽的忠诚，金羽也是一位学者。作为金羽事实上的二把手，阿里韦利按照民生和民权的原则，推动了务实的改革和商业鼓励措施。"
 FAT_political_8:0 "奥拉夫·雷岑"
 FAT_political_8_desc:0 "奥拉夫是漫云本土鹫，一直是和平主义者，在长征期间加入共和国。他是一位多产的艺术家，他的作品常常带有和平主义与共和主义的主题。当NRP接管公国时，奥拉夫·雷岑加入了他们，成为共和国受欢迎的领袖之一。他创立了失落之门艺术学院，之后升任为失落之门的第一位议员。在NRP的谐律派领导下成功连任两届之后，由于派系的冲突，以及对当前的谐律派领导鹫，鼓吹军事扩张主义和军备制造以打击帝国的施纳贝尔·翔日的厌恶，他和政府渐渐疏远。随后，奥拉夫辞去了参议员的职务，回到了他的绘画生涯。他因为在艺术上的工作而被总统授予荣誉勋章，并通过他的工作继续为共和事业服务。"
 FAT_political_9:0 "克劳斯·瑰翼"
 FAT_political_9_desc:0 "克劳斯·瑰翼，是克梅斯凯在抗击帝国的革命中最信任的朋友之一，于941年出生于安江的荡鹫城，或许是最落后的帝国省份。在他年轻时他见证了此地普遍的贫穷，好奇它为何会发生。\n\n在他24岁时，他参加了帝国军，比克梅斯凯要早上几年。当克梅斯凯参军时，他们的友谊迅速进展，并且开始讨论共和主义与谐律理想。作为一名务实主义者，相比于君主制这一概念本身，他更反对五世皇帝。他相信在合适的情况下，一个君主国可以进行改革以适应谐律理念。他们共同向皇宫进军，在克梅斯凯夺权之后，瑰翼任命为二把手。\n\n瑰翼随后也同克梅斯凯逃到了北方，两鹫之间在共和党的言论和理想方面存在许多分歧，这当中也包括瑰翼对君主制的同情。这导致瑰翼的总指挥职务被开除，随后同法西斯组织有联系，也更有野心的曜尾接任。瑰翼的幻想破灭，带上他的部队前往了北方。\n\n后来，曜尾加入了他，在纯属偶然的联盟中对抗克梅斯凯政权。瑰翼对共和理想的怀疑化作了厌恶，之后也抛弃了谐律理念，转而推崇军事独裁于盗匪国家。但是瑰翼的劫掠强度远没有曜尾那么高，也常把劫获的战利品分给部下。他更倾向于抢劫军械库，警告部队不得进攻城镇，任何这样做的都会被处死。瑰翼的这种劫掠方式在他的士兵中很受欢迎，不过当他劫掠这片他曾经浴血奋战的土地时，他的内心也时常感到酸楚，回想到曾经与克梅斯凯共度的时光，泪，流了下来。"
