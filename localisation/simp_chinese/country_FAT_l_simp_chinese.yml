 FAT_political_pragmatist:0 "海因里希·金羽"
 FAT_political_pragmatist_desc:0 "如果你问一位共和国公民，共和国第二把手的海因里希·金羽在过去4年里做了什么，他们会无话可言，尽管金羽的议程安排很满。\n\n海因里希·金羽于949年出生于耶鲁的格林盖特。年轻的金羽受过法律和经济方面的训练，看起来根本不像是革命领袖的合适鹫选，但他进步的法律先例使他成为共和主义最坚定的捍卫者之一。当革命于978年爆发时，金羽本来对之将信将疑，但在狮鹫海姆被攻陷、摄政议会被逐出后加入了凯梅斯凯一方。他首先是律师和政治家，其次才是革命者，金羽在国际层面上主张共和主义，尝试去达成大量与小马利亚和河间同盟的协议——但两者都很大程度上否认了他的进步。他在克梅斯凯任期内的法律和政治行动缓解了公众的不稳定和对共和党鹫的愤怒，但却无法在军事上拯救革命。\n\n他没有参加长征，而是逃到了天落，后来又逃到了新独立的城市菲兹拉，最后在漫云的控制权得到巩固后，在欢呼的鹫群中抵达共和国。虽然他在长征中没能支持共和党是许多鹫不赞成的一点，但他继续在漫云的新位置上代表共和国鹫民。\n\n1003年，金羽成为克梅斯凯的二把手，他专注于国内事务，取代了野心勃勃的军事家翔日。自那以后，金羽的工作基本上都是在幕后进行的。面对不服管教的军队和农村的土匪，金羽开始制定一项和翔日那用暴力解决异见者之想法相反的政策。他与数百名漫云本土狮鹫领袖会面，帮助修复了瑰翼最初的骚动之后农村的完全混乱，这些行动使他成为全国范围内最亲本土狮鹫的领袖之一。实用主义是金羽的主要目标，但是随着国家政治和种族的两极分化，这个目标变得越来越艰难。\n\n他会成功吗？或者他会像他的敌鹫所说的那样，死的时候爪里拿着所有的牌，却没有勇气使用它们？"
 FAT_political_idealist:0 "施纳贝尔·翔日"
 FAT_political_idealist_desc:0 "施纳贝尔·翔日是国民共和党谐律派的领袖，也是共和国之梦与泛狮鹫尼亚主义的笃信者。他在弗羽西亚的一个贫民窟诞生，为了糊口参加了帝国军，挣到了自己的那份口粮。在军队中，他加入了炮兵军官亚历山大·克梅斯凯的行伍中，也学到了谐律与共和思想。他很快就被这些思想所吸引，开始深入钻研有关小马利亚和西卡梅翁的书籍。后来他参与了革命，并在国民共和军中以荣誉和杰出的身份服役。当他来到北方之后，他开始活跃地参与政治事务，努力寻求反攻狮鹫海姆，以及恢复已被中止的宪政。他成为了漫云参议员，接下来组建了党内属于他的那一派——谐律派。他对共和国与谐律有着近乎疯狂的投入精神，是个理想主义者与军国主义者，也让他成为漫云城里最危险的狮鹫之一。"
