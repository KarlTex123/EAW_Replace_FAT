  Battle_of_New_Griffonia.7.t: "点燃革命"
  Battle_of_New_Griffonia.7.desc: "新狮鹫尼亚革命在高潮之后迎来了终幕，高丘和他的军队溃不成军，军政府已经垮台，高丘本鹫已经潜逃到了幻形灵之地，当新狮鹫尼亚共和国的军队解放最后一个城市以后，新狮鹫尼亚得到了全境解放。\n      新狮鹫尼亚共和国的临时总统海因里希.红尾在维特举行了大规模的阅兵，与其一同出席的还有狮鹫尼亚共和国的革命英雄加里波第和嘶大林格勒的卢宁元帅，看起来他们将一起塑造战后新格局。\n      海因里希.红尾向民众承诺将尽快进行选举，并恢复国会，宪法将得到保障，新狮鹫尼亚共和国看来将回到正轨，愿一切安好。"
  Battle_of_New_Griffonia.7.a: "干杯！"
  Battle_of_New_Griffonia.8.t: "革命终熄"
  Battle_of_New_Griffonia.8.desc: "新狮鹫革命迎来了最残酷的结局，高丘和他的军队已经击溃了共和军最后一支有生力量，高丘将新狮鹫尼亚牢牢掌握在了自己的手中，大批革命者被监禁，屠杀。\n   共和军的领导人们逃往了嘶大林格勒和狮鹫尼亚共和国，并且发誓要和暴君战斗到底，高丘在维特进行了盛大的阅兵仪式，据悉有幻形灵的军官也参与其中，看起来血色的同盟已经建立。\n高丘自封为新狮鹫尼亚的总统和三军元帅，开始了他的独裁统治，新狮鹫尼亚的未来一片迷茫。"
  Battle_of_New_Griffonia.8.a: "哦，天哪"
  Battle_of_New_Griffonia.9.t: "革命僵局"
  Battle_of_New_Griffonia.9.desc: "没有鹫会想到新狮鹫尼亚革命会演变成如此僵持的战争态势，新狮鹫尼亚已经变成了血肉磨坊，无数家庭妻离子散，土地被荒废，工厂被摧毁。\n      比这更加糟糕的是，我们浪费了太多的精力和时间在新狮鹫尼亚，现在狮鹫帝国已经开始整军备战，马奎斯大陆的幻形灵也开始了她的扩张之路，我们已经失去了先机。\n      愿北风神保佑他们，现在我们必须集中精力开始整顿国内和军队，狮鹫尼亚共和国将退出这场干预。。。"
  Battle_of_New_Griffonia.9.a: "我们不能再浪费精力了"
