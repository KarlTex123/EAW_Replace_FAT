FAT_XINSHIJIEZHIEMENG: "新世界之梦"
FAT_XINSHIJIEZHIEMENG_desc: "随着我们在漫云地区逐渐站稳了爪跟，共和国的革命也得到了阶段性的确保，是时候将目光放眼世界了。"
FAT_XIAOMAPENGYOU: "小马大陆的朋友"
FAT_XIAOMAPENGYOU_desc: "小马大陆的朋友"
FAT_GONGHEGUOGONGYUE: "共和国公约"
FAT_GONGHEGUOGONGYUE_desc: "我们不能单打独斗，鹫多力量大这个道理是不会变的，我们需要寻找志同道合的同志们来一起对抗帝国公约这个反动堡垒。"
FAT_LIANLUENANFANG: "联络南方共和党"
FAT_LIANLUENANFANG_desc: "对抗帝国我们并不是毫无准备，通过在赫兹兰重建的地下情报网络，我们可以与潜伏在赫兹兰的同志们通力合作。"
FAT_HEIJIANPOBIN: "河间破冰"
FAT_HEIJIANPOBIN_desc: "河间地区在格罗弗这个邪恶的军事独裁者进行过血腥战争以后，在此后的数百年都对于狮鹫没有任何好感，我们可以通过卡梅莉塔的影响力打破这种刻板印象。来为共和国争取更好的外交环境。"
FAT_JIRIZHEMINGYUN: "击日者的命运"
FAT_JIRIZHEMINGYUN_desc: "雁之喙地区的混乱状态已经持续太久了，游击队，盗匪在那里进行着斗争，随着我们革命的稳固，是时候解决这个问题了。"
FAT_WEIDINAGAIGE: "韦迪纳的革命"
FAT_WEIDINAGAIGE_desc: "虽然韦迪纳王国的意识形态是所谓的谐律君主制，但是这只不过是君主施舍的一点仁慈罢了，我们必须彻底击碎皇冠，现在时机成熟，是时候了。"
FAT_XIELVZHIBEI: "协律之北"
FAT_XIELVZHIBEI_desc: "伴随着北狮鹫尼亚领土的全部解放，我们的革命进入了新的阶段，我们需要好好得教导这些地区，使其彻底遗忘暴君和独裁带来的恐惧。"
FAT_JISUIHUANGGUAN: "击碎皇冠"
FAT_JISUIHUANGGUAN_desc: "香火在雨中烧\n几十个暑和寒\n血脉相连一方苦行山\n\n龙珠九转十二金光\n返指五岳和三江！"


######################军事线######################
route_artillery:0 "火炮路线"
route_tank:0 "坦克路线"
FAT_National_Revolutionary_Army:0 "国民革命军"
FAT_National_Revolutionary_Army_desc:0 "国民革命军是共和国的军队，自大革命以来，就是我们赖以生存的力量，我们必须让我们的军队跟上世界的进度"
FAT_Expand_the_Manyun_Military_Academy:0 "扩展漫云军校"
FAT_Expand_the_Manyun_Military_Academy_desc:0 "漫云军校自建立以来就是共和国的鹫才储备所，我们需要扩展他的课程，为我们带来更优秀的士兵"
FAT_The_establishment_of_the_General_Staff_Headquarters:0 "参谋总部的建立"
FAT_The_establishment_of_the_General_Staff_Headquarters_desc:0 "为了应对日新月异的战争态势，建立一个可以协同各部的参谋总部迫在眉睫"
FAT_The_Advantage_of_Artillery:0 "火炮之利"
FAT_The_Advantage_of_Artillery_desc:0 "如果说战场之上什么东西最硬，那就是火炮的口径和它的射程，大总统克梅斯凯的炮兵理论将指引国民革命军走向未来"
FAT_Precise_fire_control:0 "精准火控"
FAT_Precise_fire_control_desc:0 "控制好火炮的精确度可以极大的提升炮兵带来的威慑力，让我们的军队战无不胜"
FAT_Establish_a_rapid_collaborative_force:0 "建立快速协同部队"
FAT_Establish_a_rapid_collaborative_force_desc:0 "战场局势瞬息万变，我们不能再和以前一样等待机会，而是要协同各军种的行动完善现代化战争"
FAT_Emphasize_artillery_technology:0 "重视火炮科技"
FAT_Emphasize_artillery_technology_desc:0 "光是改革军队还是不够，我们应该重视军事科技的发展，将我们的军队武装起来"
FAT_Kemeskey_s_artillery_theory:0 "克梅斯凯的火炮理论"
FAT_Kemeskey_s_artillery_theory_desc:0 "克梅斯凯大元帅提出了一种很先进的炮兵理论知识，通过他的帮助，我们可以很快的成为世界上首屈一指的军队"
FAT_The_Harmonic_Crusade:0 "谐律十字军"
FAT_The_Harmonic_Crusade_desc:0 "旧时代的骑士只为了贵族老爷和皇室服务，而我们的军队将化身成为现代的，只为革命理想和劳苦大众服务的谐律骑士，就如同向格罗弗二世雕像发起冲锋的唐吉鹫德一般，我们将会把共和民主带向整个大陆"

FAT_The_Might_of_the_Tank:0 "坦克之威"
FAT_The_Might_of_the_Tank_desc:0 "在战场之上没有什么武器比坦克更加具有压迫感了，我们将会组建我们自己的钢铁洪流，曜尾校长的装甲理论将带领国民革命军走向未来"
tank_rikstanken_armor: "临时装甲"
tank_rikstanken_armor_desc: "这种装甲为了节省开支由铁片制成而非钢材。但至少比没有装甲好……大概吧。"
FAT_Establish_a_new_type_of_armored_unit:0 "组建新式装甲部队"
FAT_Establish_a_new_type_of_armored_unit_desc:0 "我们可以通过先试行小规模的坦克部队组建来测试其可行性和可靠性"
FAT_Emphasize_armored_technology:0 "重视装甲科技"
FAT_Emphasize_armored_technology_desc:0 "好的装甲部队离不开其发达的科技支持，我们应该重视这方面"
FAT_Learning_from_stalliongrad:0 "学习嘶大林格勒"
FAT_Learning_from_stalliongrad_desc:0 "我们的盟友嘶大林格勒向我们展示了装甲部队的宏伟和威力，我们可以参照她们的例子来进行建设"
FAT_suntail_s_Armor_Theory:0 "曜尾的装甲理论"
FAT_suntail_s_Armor_Theory_desc:0 "漫云军校的校长曜尾将军提出了一种全新的，适应于现代战争的装甲理论，我们可以采纳他的理论来武装国民革命军"
FAT_The_Harmonic_Crusade_1:0 "谐律十字军"
FAT_The_Harmonic_Crusade_1_desc:0 "旧时代的骑士只为了贵族老爷和皇室服务，而我们的军队将化身成为现代的，只为革命理想和劳苦大众服务的谐律骑士，就如同向格罗弗二世雕像发起冲锋的唐吉鹫德一般，我们将会把共和民主带向整个大陆"


