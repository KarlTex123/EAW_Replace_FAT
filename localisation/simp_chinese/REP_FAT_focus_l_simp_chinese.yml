 FAT_sanshiniangonghemeng: "三十年共和之梦"
 FAT_sanshiniangonghemeng_desc: "经历了第一次狮鹫尼亚大革命的失败，渡过了瑰翼叛乱的险境，屡败屡战的共和派从未放弃梦想。在帝国的围剿与封锁，全世界君主主义者的敌视中，革命死灰复燃，国民共和党重整旗鼓，漫云苦旅磨练了共和派的心智，随着海外革命联盟的建立，改组后的共和党比以往更加强大，革命即将卷土重来，30年前的故事将要翻下新的篇章。暴君将毁灭，共和将胜利。"
 FAT_minquan: "民权"
 FAT_minquan_desc: "民权主义是政治上的革命即“推翻帝国，建立共和”，克梅斯凯通过研究小马国谐律思想与狮鹫启蒙运动，第一次提出建立由自觉之民众造成国家，建立真正的民主共和。在这样的思想下，爆发了轰轰烈烈的978年革命，革命建立的民选政府光辉照耀四方，然而随着革命的失败，民权的理想蒙上了现实的阴影，共和与专制的界限越来越模糊。在共和国又一次稳定后，重申民权主义将会成为下一步革命的基石，也许我们不会立刻转入宪政阶段，但我们会让所有狮鹫明白共和主义的理想从未被放弃，共和主义永不褪色。"
 FAT_minquan_tt:0 "获得: §Y民权主义§!"
 FAT_guominzhuquan: "国民主权"
 FAT_guominzhuquan_desc: "共和国因何而生？并非少数共和主义者的狂想，而是从全体民众对自由平等民主的渴望中诞生。共和国属于全体国民，所有国民将获得同等的权利，享有同样的由国家赋予的自由，不因为财产，种族有所增减，因此，任何国民不应有侵犯他者的权利。同样，正因为共和国属于全体国民，当政府堕落为暴政，国民有权以各种形式表示反抗。"
 FAT_guominzhuquan_tt:0 "§Y民权主义§!追加效果:\n每日政治点数 §G+0.1§!\n抵抗度增加 §G10%§!\n核心领土防御 §G+10%§!"
 FAT_zongtongyuanshuai: "总统元帅"
 FAT_zongtongyuanshuai_desc: "克梅斯凯的总统职位来自978年的赫兹兰选举，这是狮鹫第一次民主的选举，此后我们也再难举行如此有代表性的选举。随后作为共和军大元帅与国民共和党总裁，克梅斯凯在党政军各方面拥有无与伦比的权力，这样的权威一定程度上掩盖了共和国制度上的混乱，何种权力归于共和党总裁，何种权力归于总统，何种权力归于陆海军大元帅，这些界限尚不明晰。当克梅斯凯最近不时发生心绞痛，他意识到自己必须理清这些权力的界限，让共和国体制稳定下来，为身后的秩序做出安排。"
 FAT_kanluandongyuanfaling: "戡乱动员法令"
 FAT_kanluandongyuanfaling_desc: "帝国依然在南方威胁着共和事业，颁布戡乱动员法便是顺理成章，根据法令，一切鼓吹君主制行为均被认为叛国，叛国罪将在地方党部裁决下处理。政府有权利在任意地区实施管制，未经允许进入管制区民众即为叛国。政府有权召集所认定必须者入伍参军，有权接管国防必备之资产，一切涉军案件由总参谋部设立军事法庭处置。这些严厉的条款或许使民主受损，但为了革命的胜利必须要进行暂时的忍耐。"
 FAT_lixinghuazhengfu: "理性化政府"
 FAT_lixinghuazhengfu_desc: "大部分国家的政府充满了迷信与专制时期随意叠屋架床的痕迹，哪怕是被我们称之为谐律摇篮的小马国，政府依然是古老的蒙昧时代的产物。经过了千年的发展，随着科学与工业力量改变着世界，国家的组织形式也不再遵循古老的准则，而是由理智，逻辑，科学进行设计，让我们能第一次自主决定我们的政治生活。理性设计的政府将会成为全大陆最高效的产物，它将如同一艘蒸汽铁甲舰，战胜那些古老的木船。"
 FAT_lixinghuazhengfu_tt:0 "§Y民权主义§!追加效果:\n顾问花费 §G-10%§!\n顺从度增长 §G+10%§!\n建造速度 §G+5%§!"
 FAT_minsheng: "民生"
 FAT_minsheng_desc: "民生主义意味着国家不会如同帝国一样对自己的国民不管不顾，克梅斯凯吸收了马科斯与无政府主义者的理论提出了民生主义。不过与强调阶级斗争的马科斯主义不同，民生主义认为狮鹫尼亚的阶级分化尚不明显，通过国家的强力干涉，阶级分化与阶级斗争完全可以避免。随着与嘶大林格勒的合作，民生主义与社会主义的界限越来越模糊，轰轰烈烈的社会革命也在民生主义的口号下展开。"
 FAT_minsheng_tt:0 "§Y开启经济建设系统§!"
 FAT_xunzhengqixian: "训政期限"
 FAT_xunzhengqixian_desc: "根据997年改组，共和国正式进入训政时期，在此期间国民共和党将垄断政治权力并培养民众政治能力。迄今为止训政已过10年，在成果斐然的同时也带来新的压力，随着新一代狮鹫在共和国旗帜下成长，他们普遍认为民众已经具备共和信仰与实行民主政治能力，结束训政的呼声日益高涨。尽管克梅斯凯已经重申，结束训政应当等待帝国灭亡考虑，但制定结束训政的时间表不失为凝聚民心的良策。"
 FAT_gemingkongbu: "革命恐怖"
 FAT_gemingkongbu_desc: "帝国如何对待革命者？他们所采取的手段残忍无比，赫兹兰到处都挂着处以绞刑的革命者躯体，他们以为只有自己懂得利用暴力手段，我们将以革命的暴力予以回击。竖起断头台，设立革命法庭，让党部和民众追查隐藏的反革命分子，发现之时便是他们的末日。"
 FAT_chongshenlingtuwanzheng: "重申领土完整"
 FAT_chongshenlingtuwanzheng_desc: "哪里是狮鹫祖国？是赫兹兰？是卡廷？是葡萄生长的阿奎莱亚还是海鸥聚集的天落城？是历史辉煌的狮鹫岩还是海峡彼岸的殖民地？是稻米丰收的埃维河谷还是白雪皑皑的北方大地？不不不，狮鹫祖国比那更强大，只要是狮鹫飞翔的地方，天空中充满着勇气和荣誉，那就是狮鹫尼亚，我们伟大的祖国，赐予我们力量，让狮鹫民族永远不分离。"
 FAT_chongshenlingtuwanzheng_tt:0 "§Y民权主义§!追加效果:\n部队训练时间 §G-10%§!"
 FAT_zhongzuzhengce: "种族政策"
 FAT_zhongzuzhengce_desc: "狮鹫尼亚是狮鹫的大陆。但并不完全正确，小马，牛头怪，钻石狗……这些少数种族同样与狮鹫一起生活在这片大陆上，目前在北方边疆上活跃的小马部落同样应该纳入共和国的框架，但是如何对待他们是一个问题，我们可以参考过去狮鹫国家的方法，通过尊重他们社群自治的方式将他们隔绝在政治之外，只设置必要的官员加以监管，或者也可以通过强硬手段将他们纳入公民的行列，两种方法各有所长需要慎重抉择。"
 FAT_xuanjuquan: "选举权"
 FAT_xuanjuquan_desc: "国家属于所有国民，但在实践上，我们不能指望一个婴儿行使选举与被选举的权利，如果民众政治能力与知识不够，则有可能出现君主制由选举复辟的闹剧。在训政期间，选举将仅限为市镇会议，任何成年公民都将拥有选举权。当训政结束，从议会到总统都将由选举产生，但曾经为君主的家族成员将不具有被选举的权力，他们永远不能通过欺骗民众实现他们的野心。"
 FAT_xuanjudafaguan: "选举大法官"
 FAT_xuanjudafaguan_desc: "司法权独立是启蒙思想家提出的优秀体制，但如果不能获得全体民众的支持，司法独立又有什么意义？大法官依然是终身制保证具有相当独立性，但从现在开始，每一位总统提名的法官都要通过议会的审查与表决，以此保证，法律不会成为束缚民众的工具。"
 FAT_xuanjudafaguan_tt:0 "§Y民权主义§!追加效果: \n稳定度 §G+5%§!\n意识形态变化抵制力度 §G+15%§!"
 FAT_zonglifu: "总理府"
 FAT_zonglifu_desc: "随着年岁渐长，克梅斯凯的精力日益减少，他不再能像过去那样一天十几个小时处理政府事务的工作的同时还承担军事事务。出于健康也是为了顺应国家转型的需要，更多的权力将转移给他所任命的行政院院长，通过建立总理府的方式，行政院院长得以获得更多资源处理维持国家运行的一般工作，克梅斯凯得以将注意力转移到更紧迫的方面。"
 FAT_jianchilifatongyi: "坚持立法统一"
 FAT_jianchilifatongyi_desc: "立法权必须统一才能够同行政权形成制衡，狮鹫国民议会作为统一的立法机构，直接由各地民众选举产生，拥有立法与监督政府的权力。同样，统一的议会将象征着民众的团结，来自不同地区的代表将得以汇聚一堂，摒弃地域之见，共同决定国家的未来。"
 FAT_jianchilifatongyi_tt:0 "§Y民权主义§!追加效果:\n战争对稳定度修正 §G+40%§!\n法案花费 §G-25%§!"
 FAT_jianchayuan: "监察院"
 FAT_jianchayuan_desc: "监察院是克梅斯凯的新创造，由独立的监察院对政府官员及议会议员进行监督弹劾，作为对立法权与行政权的监督防止立法专制或者行政专制。监察院本身将由市镇议会间接选出代表组成，7年任期。为保证独立性，代表必须公开宣誓不参与议会任何政党，不在监察院中形成政党，只对全体主权者效忠。由此确保监察代表是独立的监督者而非政客的跟班。"
 FAT_jianchayuan_tt:0 "§Y民权主义§!追加效果:\n意识形态变化抵制力度 §G+15%§!\n间谍网强度增长 §G+25%§!\n敌方获取的情报 §G-25%§!"
 FAT_xianfacaoan: "狮鹫共和国宪法草案"
 FAT_xianfacaoan_desc: "尽管表决和修改应当等待全狮鹫尼亚的同胞共同完成，但通过漫云时期的民权实践，我们已经有信心制定出足够完备同样又符合实际的宪法草案，草案同样具有指导共和国的作用，并在正式宪法出台前发挥宪法的作用。狮鹫尼亚各地的民众将通过这份光芒万丈的草案一窥共和行于世界的未来，憧憬着自由到来的那一天，草案将会成为行路的灯塔，即便共和国的抗争不幸失败，它也将激励后继者继续为民权而战。"
 FAT_minzhu: "民主"
 FAT_minzhu_desc: "尽管现在共和国龟缩于北方，但共和不会局限于一隅之地，我们的斗争必将扩展到整片大陆整个种族，甚至不仅在狮鹫尼亚，世界上只要存在暴君，民主的理想就不会完全实现。共和国的斗争是所有智慧种族的斗争，民主的精神最终将照耀世界。"
 FAT_fanshijiuzhilu: "泛狮鹫之路"
 FAT_fanshijiuzhilu_desc: "泛狮鹫理想要实现，必须脚踏实地做起。重申我们的目标，尽管苦行漫云，我们依然是全体狮鹫的祖国，狮鹫共和国欢迎来自四面八方的一切狮鹫，我们将平等的对待这些背井离乡的斗士，依照他们的能力提供适合的岗位，迟早有一天，我们会回到他们的家乡，将解放带给所有狮鹫。"
 FAT_xingemingdang: "新革命党"
 FAT_xingemingdang_desc: "过去的共和党是松散的精英俱乐部，党员仅有个体与个体之间的关系，这正是978年革命失败的原因。随着共和党改组，效仿小马式社会主义政党采用了民主集中制原则，国民共和党一改往日的散漫，党的力量日益强大，三十年来，共和革命从未如同今天一样得到这么多的支持。共和党严密的政党机器将成为共和革命的支柱。"
 FAT_dapotianhuaban: "打破天花板"
 FAT_dapotianhuaban_desc: "没必要因为地域之见使英才蒙尘，共和国唯才是举，现在支持着共和国的漫云狮鹫应当得到更好的待遇。曾经存在的隐形天花板将打破，更多的漫云狮鹫将不止停留在中低级职位，党政军的最高职位都将欢迎新一批成员的加入，这将使漫云狮鹫更加支持共和国。"
 FAT_gonghegdiantai: "狮鹫共和电台"
 FAT_gonghegdiantai_desc: "由于狮鹫帝国的封锁，传统媒体无法抵达南方，共和国的现状对于很多民众还是一个谜团，各种中伤共和国的谣言在帝国的支持下肆意传播毒害民众的头脑。得益于嘶大林格勒的经验与设备，狮鹫共和电台将对全狮鹫尼亚进行广播，无线电波将会洞穿谎言，将共和国的消息真实传递给每一个共和事业的支持者。"
 FAT_yuanlaopingyihui: "监察委员会"
 FAT_yuanlaopingyihui_desc: "监察委员会理论上直接对党主席负责，主要职能是监督共和党员的行为，确保不至于发生党内腐败和帝国渗透，但在目前，监察委员会中充斥着改组后失去权力的老资历革命狮鹫，克梅斯凯似乎将这里当作某种安慰这些失意者的礼仪性职位，又或者，他是借此平衡日渐左倾的国民共和党。无论如何，监察委员会依然具有相当多权力。"
 FAT_zhongyangzhiweihui: "执行委员会"
 FAT_zhongyangzhiweihui_desc: "执行委员会是党的行动部门，一切决议都由执行委员会贯彻执行。成员包括各院院长，各独立委员会主席，以及共和党总裁克梅斯凯。共和国一切事务事实上完全受执行委员会的控制，以此确保共和党始终垄断着共和国的政治权威。"
 FAT_chongshenpanluan: "重审瑰翼叛乱"
 FAT_chongshenpanluan_desc: "瑰翼确实是因为自身的堕落背叛了共和，但那些随他一同叛乱的漫云狮鹫的家属难道也应该被永远打入另册吗？或许是共和国的忽视导致了他们的反叛，随着时间的推移，共和国将重新为其中的事件定性，恢复一部分被裹挟者的名誉，赦免他们的罪恶，以此安抚他们的家人。"
 FAT_guojiakuangjia: "泛狮鹫国家框架"
 FAT_guojiakuangjia_desc: "想要管理一个横跨整个大陆的庞大国家，我们必须有所准备，如何划分行政区域，政府如何适应风俗各异的狮鹫与多样的地形，目前还没有一个可靠的方案。未来我们是应当吸收狮鹫帝国曾经的经验，或者做出自己的方案，这一切都应当早做打算。"
 FAT_biancuanwenji: "编篡克梅斯凯文集"
 FAT_biancuanwenji_desc: "克梅斯凯除了作为一个功勋卓著的军事家政治家，同样是一位高产的作家，数十年来他关于三民主义哲学的论述汗牛充栋，对各种政治现象政治理论的分析鞭辟入里，是全体国民的指路明灯。为了更好的教育国民，共和国将收集克梅斯凯最重要的著作文章与演讲，文集将下发到各地作为政治学习和扫盲运动的主要材料，不仅提高国民素养，同时培植共和精神。"
 FAT_yanjiuhui: "民众运动部"
 FAT_yanjiuhui_desc: "在学习嘶大林革命的基础上，国民共和党设立民众运动部，任命大量社会主义者参与其中促进社会运动。民众运动部下设5大部门，分别为工鹫，农民，士兵，妇女，学生，负责对应团体的革命宣传鼓动。运动部同样负责管理一系列共和党刊物。每天每夜，源源不断的口号，标语，海报，社论从民众运动部流向狮鹫尼亚各地，这些无形的东西最先触及民众，说服顽固者鼓舞追随者，使共和主义的基础不断壮大。"
 FAT_junweihui: "军事委员会"
 FAT_junweihui_desc: "共和党军事委员会由克梅斯凯任军事委员会主席，负责管理共和军的党部，以党的力量监督各级军事主官，同时将革命理论灌输到普通士兵的头脑中。共和军一切作战计划首先应当在军事委员会中讨论，随后才能够实施。此举将避免下一个瑰翼出现，确保共和军始终是革命的队伍而不是堕落为占山为王的土匪军阀。"
 FAT_wenxiehui: "漫云文化协会"
 FAT_wenxiehui_desc: "虽然被认为是苦寒之地，但漫云的文化依然绚丽多彩，民间传唱的史诗，公国画家的油画，幽默的民间小调……这些珍贵的文化与赫兹兰阿奎莱亚卡廷的文化一样值得推广与纪念。漫云文化协会将在官方支持下发掘北方优秀的文化，丰富共和国的精神生活，鼓舞国民的精神。"
 FAT_kuodashengquanli: "扩大省议会权力"
 FAT_kuodashengquanli_desc: "省议会目前只是一种折衷策略，虽然由各地市镇议员选举产生，但没有立法权，仅仅是培训民主意识的工具与对漫云流亡状态的默认。随着狮鹫国民议会逐渐丧失功能，强化省议会将会是一个有益的补充，为共和国在漫云地区的管理提供便利，当共和国走出漫云，相似的省议会也许还会在其他地方组建。"
 FAT_manyuntebieshi: "漫云特别市"
 FAT_manyuntebieshi_desc: " 在数十年间漫云市事实上成为了共和国的临时首都，为了表彰这一贡献，漫云市将划为特别市由中央政府直接管辖，官员直接由议会任命。除了方便漫云市的发展，特别市将会通过直接任命减少地方色彩，使漫云市成为真正的共和国之都。"
 FAT_bianzhunyu: "狮鹫尼亚标准语"
 FAT_bianzhunyu_desc: "数十年的政治分裂使各地的方言逐渐具备某种程度的官方地位，长此以往狮鹫语言的分裂将会危害政治的统一。过去狮鹫帝国具有官方书面语言，我们则将更进一步，以使用人数最多的赫兹兰语为基础建立狮鹫尼亚标准语。从现在起共和国学校与政府将强制使用标准语，通过共同的语言促进民众的团结。"
 FAT_gaizaohuogaizu: "强化基层党部"
 FAT_gaizaohuogaizu_desc: "过去共和党为什么一团散沙？其中最主要的原因便是共和党只有高层没有基层，嘶大林格勒式政党给我们提供了方向，通过强化基层党支部，各地党员得以在支部中开展党内生活，不断强化共和主义信仰与共和党员认同，党员将能够互相监督互相鼓励，底层党员也能够在党组织中具有话语权，使共和党真正成为牢不可破的革命先锋。"
 FAT_jiyufangyandiwei: "给予方言地位"
 FAT_jiyufangyandiwei_desc: "实事求是的说，随着帝国崩溃的数十年，各地的方言已经完成了书面化成为了当地民众生活与精神的语言。帝国曾经确实有通用的书面语，但那只不过是少数神官和贵族的工具，带有严重的封建与赫兹兰霸权色彩。共和主义者不应该追随帝国的陈规，而是顺应各地民意，对各地方言的地位予以承认，保证共和国始终处在民众的一边。"
 FAT_buxuanliuwangyihui: "补选流亡议会"
 FAT_buxuanliuwangyihui_desc: "光荣的第一届狮鹫国民会议是978年革命的产物，它真正代表了广泛的狮鹫民意……但那已经是30年前的事情了。为避免议会仅仅代表漫云狮鹫，第一届国民会议从未结束，随着时间的推移，抵达漫云的议员逐渐老去死亡，议会的空座位越来越多，国民议会也渐渐成为了泛狮鹫的象征而非实际的立法机关。现在，对议会空缺的议员进行改选势在必行，这不仅能恢复议会功能，同样能强化共和国与漫云狮鹫的纽带，促进新一代狮鹫对共和国的支持。"
 FAT_manyuntizhi: "漫云体制"
 FAT_manyuntizhi_desc: "漫云体制某种意义上与嘶大林格勒非常相似，均是由一个政党进行统治，政党的权力渗透到社会的方方面面，但是与完全由共产党统治的嘶大林格勒不同，漫云体制为一个正常谐律国家该有的机构留下了空间，尽管由于训政这些机构都没有实际运作，这样复杂的体制究竟将共和国带往何种道路，一切都将由革命回答。"
 FAT_xinshenghuoyundong: "新生活运动"
 FAT_xinshenghuoyundong_desc: "共和国的社会应当与帝国截然不同，社会生活的方方面面都应当进行相应的改造以扫除封建色彩。新生活运动旨在为全体鹫民提供一套共和主义的生活方式，这种生活方式充分尊重个体尊严，具有民主性和自由性，符合科学发展与理性原则，能够从各个方面提高国民素质。"
 FAT_gonghejiatingguanxi: "共和家庭关系"
 FAT_gonghejiatingguanxi_desc: "正如某些学者所说，狮鹫社会的家庭充满了压迫色彩，父权制与等级制存在于家庭的方方面面，家长对子女有着巨大的权威，可以随意教训子女。这样的家庭环境怎么能培养出新一代共和派？新的家庭关系将是和谐与尊重的，家庭暴力将得到介入。未来，平等的父母与子女将围坐在火炉前，共同阅读三民主义书籍，互相尊重着走向新生活。"
 FAT_tongzijun: "狮鹫童子军"
 FAT_tongzijun_desc: "童子军运动的目的是为了培养健康的公民，通过户外活动与集体生活，青少年狮鹫将得以学习团结意识与共和精神。童子军发布的任务也会鼓励少年狮鹫积极为社会做出贡献，促进整个社会风气的变化，童子军徽章将促进荣誉意识。必要的军事训练也可以作为培养新士兵的补充。"
 FAT_yuyangaige: "语言改革"
 FAT_yuyangaige_desc: "狮鹫语言中存在太多封建色彩，诸如上下级老爷夫人之类的称呼，上层社会做作的贵族腔调，习惯性的祈求神明皇帝保佑……如此种种都是改革的对象。共和国国民无论上下级一律以公民相称，一切贵族用语都将从词典删除，君主与皇帝相关的痕迹都将以共和的词语替代。"
 FAT_gemingyishi: "革命仪式"
 FAT_gemingyishi_desc: "如何让共和深入人心，节日庆典仪式必不可少。正如某位古老谚语，维持帝国的是面包与马戏。革命仪式包括共同栽下共和树在树下跳共和舞，在共和祭坛前庆祝起义节，为革命烈士树立纪念碑合唱革命歌曲，在节日里一起进行火炬游行……当然还有郑重的投下选票。"
 FAT_zhiyuaninkun: "支援贫困"
 FAT_zhiyuaninkun_desc: "共和国不应该放弃社会中的每一个鹫，我们不会如帝国一样对落后坐视不管。共和精神要求我们深入社会最贫困的角落，合格的共和主义者应当以全体鹫民的福祉为自己的追求，时时刻刻为改善社会最贫困者的生活而奋斗。"
 FAT_zhiyuaninkun_tt:0 "§Y为每月财政增加额外开支§!"
 FAT_qimengshehui: "启蒙社会"
 FAT_qimengshehui_desc: "由启蒙作家们畅想的，科学家所探明的，克梅斯凯领导的东西现在还与社会大多数绝缘。许多狮鹫至今不明白什么是科学什么是共和，还传着诸如国王的触碰可以治病的迷信。共和国将大力发展科教事业，通过宣传与教育将科学与共和思想植入民众的脑海，使他们从臣民变成一个合格的公民。"
 FAT_gonghexinyang: "共和信仰"
 FAT_gonghexinyang_desc: "随着共和精神笼罩在社会的每个角落，一种全新的信仰悄然发芽，在共和国社会中成长的新一代，他们由共和派教师养大，学习着三民主义的教条，他们在市政厅举行婚礼，由市长而非神官祝福婚姻幸福，他们尊敬的是共和国烈士组成的英灵殿，遵守的是以宪法和共和国法律组成的行为准则，以三民主义和共和精神指导着自己的方方面面，当他们发誓，他们是以共和国的名义。这一切都是共和信仰的组成部分，共和国取代了古老的宗教和教会决定着鹫民的生活。"
 FAT_kuodayanlunziyou: "扩大自由言论"
 FAT_kuodayanlunziyou_desc: "共和精神当然要求我们对保证所有发言者的自由，但在训政阶段，言论自由实际上收到了各种限制，不同的法律封闭了鹫民的嘴巴。当共和国日益稳固，开放言论自由正是一种自信的体现。当然，赞美帝国与君主制的言论什么时候都不在言论自由的范围内。"
 FAT_gonghezuojialianmeng: "共和作家联盟"
 FAT_gonghezuojialianmeng_desc: "以科尼利乌斯·温克为代表，共和党拥有一大批忠实的作家。成立共和作家联盟将更好的集合他们的创作力量，作家联盟将为那些共和派作者提供奖金，举办三民主义理论讲座，颁发共和文学奖。这些举措将鼓励作家创作更具共和主义价值观的作品，确保三民主义的权威地位，令共和主义从他们的小说诗歌戏剧中走进鹫民的内心，通过文化增强世界共和主义的力量。"
 FAT_guligemingwenxue: "鼓励革命文学"
 FAT_guligemingwenxue_desc: "那些描述革命战争，秘密行动，革命者生活的作品一直都相当受欢迎。但质量却良莠不齐，很多作品仅仅只是将革命作为一种刺激的冒险加以描绘，其中部分革命者的形象甚至更接近土匪和浪荡贵族，这样的文学完全无助于一般民众的认识。克梅斯凯提出，真正的革命文学将以现实的笔调描述革命，贴近鹫民的生活，赋予其坚定的理想与大无畏的浪漫色彩。"
 FAT_xiudingtudifa: "修订土地法"
 FAT_xiudingtudifa_desc: "共和国土地法按照民生主义原则制定，废除了农奴制度，设立土地基准价格，使农民能够通过较低的价格赎买土地获取自由。然而，雇工与地主的矛盾依然存在，一些顽固的地主拒绝出售土地，许多土地产权导致的纠纷导致了命案。而在某些地方，社会主义者的农会又开始按照嘶大林格勒的模式进行集体化。修订土地法显然迫在眉睫。"
 FAT_nongxiediwei: "农民协会地位"
 FAT_nongxiediwei_desc: "由社会主义者力主建立的农民协会已经在乡村扎根，农会决定着乡村生活的一切。不可否认，农会确实为共和国的管理提供了方便，但农会武装的膨胀，对地主的暴力行为也使农会招致非议。是扩大农会，将农会作为乡村管理的基础，还是限制农会权力，仅仅将农会作为农业生产的协调者，党内纷争不休。"
 FAT_xiangcunjiansheyundong: "乡村建设运动"
 FAT_xiangcunjiansheyundong_desc: "许多村庄还保持着中世纪的面貌，乡村建设运动通过引进农业机器，改进农业方法，引入良种的方式改善农业生活。通过建设公厕，接种疫苗，灭鼠灭虫的方式改善村庄卫生。通过对乡村道路和村庄房屋的翻新建设改变村民生活质量，使乡村居民也能够感受到现代化的成果。"
 FAT_shehzhuyilianmeng: "社会主义者的联盟"
 FAT_shehzhuyilianmeng_desc: "自978年革命开始，社会主义者与共和主义者便站在同一条战线上，我们都有同样的革命目标，随着与嘶大林格勒合作的强化，共和党热情的对社会主义者敞开大门。虽然如此，三十年时间在其他地方形成了相当多独立的社会主义政党，他们在进行共和党活动时保留了相当多的自主性，引发了党内其他成员的猜疑。党内保守派对于合作也并非对此没有意见。克梅斯凯虽然一如既往支持着社会主义的联盟，但当他去世，后继者如何还是一个未知数。"
 FAT_shehuizhuyizhediwei: "社会主义者地位"
 FAT_shehuizhuyizhediwei_desc: "镰爪等一代老社会主义者已经成为了共和党高层，基层共和党员中也涌现了一批精干的持社会主义信仰的党员。以漫云市新市长为代表，这些党内新星的涌现也招致了不同的声音，部分老党员反对将更多社会主义者送入高层，他们认为这将改变共和党的本来面目，但相当多声音要求党的领导层应当革新，以更具能力的新生代取代日渐衰老的旧党员，即使是更加左倾也毫无问题。这些声音最终都将由克梅斯凯裁决。"
 FAT_gonghuifa:"工会法"
 FAT_gonghuifa_desc:"该法律旨在保障工会在国家政治、经济和社会生活中的地位，确定工会的权利与义务，发挥工会在社会主义现代化建设事业中的作用。详细规定了工会在劳动权益保障、集体协商、劳动争议处理等方面的权利与义务。完善《工会法》可以对共和国内的大大小小的工会起指导监督性作用"
 FAT_heweimishengzhuyi:"何为民生主义"
 FAT_heweimishengzhuyi_desc:""
 FAT_heweimishengzhuyi_tt:0 "此国策效果将会取决于你之前路线选择的国策，你将合并民生线的民族精神"
 FAT_gongyejianshefa:"工业发展法"
 FAT_gongyejianshefa_desc:""
 FAT_gongshangbaoxiejishiyebaozheng:"工伤保险及失业保障"
 FAT_gongshangbaoxiejishiyebaozheng_desc:"在面对因工作原因遭受事故伤害或患职业病或因本意中断就业、失去工资收入期间，共和国并没有合适的方法来进行处理，但是随着社会主义者们提交的新的法律提案，这一情况将有所改变。在工伤保险及失业保险的保障下，对因工伤患亡，因非本意中断就业的劳动者的生活有所保障"
 FAT_jingjijihuaweiyuanhui: "经济计划委员会"
 FAT_jingjijihuaweiyuanhui_desc: "经济计划委员会是模仿嘶大林格勒设立的机构，委员会对狮鹫共和国的经济活动进行统计，并为政府提供经济规划的方案，管理国有企业，调整生产物流。这显然无法达到计划经济的水平，但依然能使政府对经济进行有力的调控，防止经济领域的无序化。"
 FAT_shengchanxianfa: "生产宪法"
 FAT_shengchanxianfa_desc: "由嘶大林格勒经验总结而成的生产宪法为共和国带来了全新的生产管理模式，这为国有企业的活动提供了规范，生产方面的无序性将进一步降低，生产效率将得到进一步提高。"
 FAT_gongheyinhang: "共和银行"
 FAT_gongheyinhang_desc: "共和银行是共和国的中央银行，这将为管理经济提供新的手段。银行负责货币与国债的发行，为共和国内的商业活动提供支持。通过共和银行，共和国将得以接入天落与阿奎莱亚的银行网络，使共和国能够吸收金融市场的资金支付政府开销。"
 FAT_xinjianzhongxiaoxue: "新建中小学"
 FAT_xinjianzhongxiaoxue_desc: "教育过去是由神官进行，仅有少数市民与贵族能够聘请世俗教师。共和国虽然提出要进行义务教育，各地教师却没有足够的场地进行教育。新建中小学不仅能够满足教育所需，同时也会成为共和主义与启蒙思想的堡垒，促进整个社会的进化。"
 FAT_xinkeben: "新课本"
 FAT_xinkeben_desc: "以往狮鹫往往利用宗教典籍进行识字教育，所学的知识也仅仅只包括宗教神话和加减乘除。新课本由教育委员会编写，国语课本以克梅斯凯演讲和优秀作家的散文小说进行启蒙教育。数学与科学也作为单独的课本普及适应现代社会的知识，政治课本教授共和理论与共和国法律，还有美术与音乐课本陶冶情操。这一套新课本将能够为一个共和国模范公民提供必备的知识，保证下一代的健康成长。"
 FAT_kuozhangongjiuyexiao:"拓展工鹫夜校"
 FAT_kuozhangongjiuyexiao_desc:"在过去，许多社会主义者组织就通过创办工人夜校，向工人阶级宣传社会主义、开展识字教育和政治启蒙。共和国成立后，社会党便在各个工厂区设立夜校，这种夜校在扫盲运动和职工文化技术教育中发挥了重要作用，帮助大批工鹫实现文化翻身。这种制度可以避免占用工鹫白日劳动时间，提升工鹫素质的好方法"
 FAT_liuwanggongjiaoshi:"流亡共和派教师"
 FAT_liuwanggongjiaoshi_desc:""
 FAT_gonghexueshenglianhehui:"共和学生联合会"
 FAT_gonghexueshenglianhehui_desc:""
 FAT_tongyikaoshi: "统一高校考试"
 FAT_tongyikaoshi_desc: "传统狮鹫大学以推荐制入学为主，虽然有考试，但往往被教授所左右，只要加以贿赂轻而易举就能通过，大学中因此充满了富有但品行低劣的学生，学位成为了富裕阶层的镀金，贫寒者则没有受高等教育的机会。统一考试将避免这些问题，保证各种出身的学生有同样的机会获得高等教育。"
 FAT_guolidaxue:"国立漫云大学"
 FAT_guolidaxue_desc:"在漫云，许多学校都曾被贵族所控制，共和国虽然驱逐了他们并新建了不少中小学校，但是这些学校大都只能胜任教书育鹫。为了承担国家重大科研任务并培养高级科学家，因此在硬件和师资上需要具有垄断性的优势"
 FAT_shelikaoshiyuan: "设立考试院"
 FAT_shelikaoshiyuan_desc: "除了负责组织高校考试，考试院同样应该对议员公务员进行考试与监督，确保公共职位总是由有能力胜任者担任，保证公务员的素质。对于议员，考试院同样要进行审核。政府官员晋升，同样由考试院负责审查，并依据适当的流程审查官员的工作，确保政府的专业与清廉。"
 FAT_guomingonghedangquanhui:"国民共和党全会"
 FAT_guomingonghedangquanhui_desc:""
 FAT_minzhu_tt:0 "获得 §Y民主主义§! \n解锁 §Y解放世界宣言§!决议"

