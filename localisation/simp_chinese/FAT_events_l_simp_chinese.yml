FAT_start.8.t: "豪克兰的共和之光"
FAT_start.8.d: "豪克兰作为链接狮鹫大陆和小马大陆的关键地区，其战略重要性不言而喻。直到978大革命以前，这里还是狮鹫帝国的殖民地，大革命以后，共和国的叛徒麦耶带走了我们的空军叛逃到了豪克兰，并在这里建立了他的独裁统治。\n\n共和国不会原谅他的背叛，等待他的只有审判——而现在，这个机会已经到来了：一批依然对§4共和主义§!保持信念的老兵已经掀起了对麦耶的反叛，我们必须支援他们的革命!"
FAT_start.8.1: "帮助同志们，为了三民主义！"
FAT_start.8.1_t: "我们将开启§Y豪克兰博弈机制§!"
FAT_start.8.2: "豪克兰的事由他们自己解决"

