 FAT_MilitaryGov.20.t:0 "国民革命军的改组"
 FAT_MilitaryGov.20.d:0 "革命军的历史使命随着国防军事改组而落下，新共和政府的遮羞布实在太薄，只要轻轻一戳就会显出两位元帅那无处不在的控制，不知该说是幸运还是不幸，元帅们的彼此制衡和复杂立场反倒使得军队高层不好透出渗透政府的倾向，当国防军改革结束，革命一词与军队脱钩，军政府中参与政变的革命将领们参与到赫兹兰各大区的地方事务中去，国防军中能参与中央决策的只留下了两位大元帅，这是加里波第在军政两权分离上推进的一大步，对嗜好权力的狮鹫而言这一举措无异于自废羽毛，但对共和来说，这是在受过重创之后艰难得来的一次回春。"
 FAT_MilitaryGov.20.a:0 "革命与共和同行了半个世纪。"
 FAT_MilitaryGov.21.t:0 "克梅斯凯的遗赠"
 FAT_MilitaryGov.21.d:0 "三民主义在各党乃至共和党内部的诠释都存在争议，但克梅斯凯战术却从未被质疑，狮鹫史学者们认为帝国末期对装甲师的狂热正是起于面对克梅斯凯火炮战术的溃败，实际上，除却战术和战略的双重成就，克梅斯凯的治军能力亦是无鹫能出其右，他对鹫才和技术的尊敬创造了克梅斯凯战术和漫云军校这样的军事成就，对思想建军的执行则铸就了共和军魂，他以共和团结起了诸王国残部，硬生生将本就地广人稀的北地上东拼西凑培养起来的革命军拧成了一股绳，如今，随着军队改革，各大藩国军队的共和国防军重整顺利将克梅斯凯的建军方略运用到了更广更深的层面。"
 FAT_MilitaryGov.21.a:0 "总统元帅，不世伟鹫。"
 FAT_MilitaryGov.22.t:0 "忠于国家，忠于宪法，忠于理想"
 FAT_MilitaryGov.22.d:0 "国防军改革的计划推行已有数月，各地整编混乱的问题在忠诚可靠的将军们处理下逐渐平定，锐利无比的共和国军锋化整为零，重新把曾被他们打得七零八落的帝国各地军队很好地组织了起来，在军队改革的中期，军区化和中央军集权压制了帝国旧部的抵抗情绪，在那些富有经验和热情的革命将领教导下，新的国防军凝练成了守护共和与三民主义的坚定战士。在加里波第的构想中，重建的国防军将遵循克梅斯凯思想，并且更为坚定地捍卫他的遗产。"
 FAT_MilitaryGov.22.a:0 "军人以服从为天职。"
 FAT_MilitaryGov.30.t:0 "赫兹兰的经济现状"
 FAT_MilitaryGov.30.d:0 "在软禁结束后，回到职位上的狮鹫们发现各党的力量对比变化实际不大，只是左右的动作均被两元帅的铁爪所压制，加之曜尾居中调停，各党的关系反而因此缓和不少，唯有左翼乡村派强势崛起这点令金羽担忧。因为他的立场和能力都有目共睹，金羽属最早被放出的那批，尽管没当总理，他要操心的事有增无减，得知狮鹫海姆金融业对经济态势的新预报，是金羽复任的第一个大问题：赫兹兰经济，正在共和国之治下衰落。\n\n现任政府被军队把控，又在军改的重要时期，不能触军费的霉头；天落被纳入共和版图，中立外交港名誉的丢失减少了一笔外汇；战后的阿奎莱亚以及各大自治共和国也很难向赫兹兰输血，经济重心正悄无声息地向漫云北移，但金羽认定这不适于长久，狮鹫海姆的工业基础和地理位置更利于国家经济稳定和工业自有化，其作为帝国经济中心的地位一旦丢失，也势必导致帝国经济的崩盘。为此，他再一次显出自己的业务能力，在星风和加里波第的全力支持下，要与经济改革委员会为赫兹兰施展起死回生的手段。"
 FAT_MilitaryGov.30.a:0 "笨蛋，问题在于经济！"
 FAT_MilitaryGov.31.t:0 "货币的统一"
 FAT_MilitaryGov.31.d:0 "星风不理解金羽提前将消息放给漫云银行的意义，他们发行新币明明从狮鹫海姆开始，金羽向她解释，在新币发行期间，整个共和国将会同时存在三种官方货币，而他们能掌控的只有明面上的汇率而非真正的货币购买力，在经济改革期，投机倒把的事情只多不少，让银行得到这个消息，正是要由他们去“垄断”这些事，比起地下黑市，大银行更加可控，也更容易收紧，而且让银行去存款和发债，也能让新发货币快速周转流通，这样，不仅能减少通胀，还能将银行内同时存储的大量经济作为国家财政的后备，在资本可控的前提下，这是降本增效压低风险的周密手段。"
 FAT_MilitaryGov.31.a:0 "将共和国紧密联系起来吧。"
 FAT_MilitaryGov.32.t:0 "国父时代的经济奇迹时代余波"
 FAT_MilitaryGov.32.d:0 "共和军入主漫云后，克梅斯凯采用的是一套灵活变通的经济方法，通过特权企业和地方保护，从大企业手中收到了巨额税收，借以扩军和漫云城建设，这些款项快速在各阶层中流转，在底层催生并保护新的中小企业，这套方式依赖共和热情顺利运行着，并没有出现太大问题，虽然后来证明有鹫逐步被腐化，但只要经济上升，大企业便不会停摆、小企业也能维持，军队也在经历镰爪出走和瑰翼事变后仍能不断保持着扩张，在理想、同谋和生产力的发展下，诞生了共和国历史上的三十年经济奇迹。\n\n这种对经济发展的热情还存在于共和党心中，星风正是认识到这一点，才决定掺蹄经济，漫云的经济底蕴胜于千疮百孔的帝国，但无论原料还是科技，都是狮鹫海姆更胜一筹，值得利用的还有各藩国的独立企业，为此，星风的意见是一面重建帝国内联系、保证小企业数量，就能由经济圈发展带动经济活力，一面支持漫云的企业坐大，但遏制他们抢占赫兹兰，保障这部分大头企业税。只消重建和扩军的两大缺口未被填满，这套托身于漫云奇迹的体系就能在不腐化的前提下继续运转。经济改革委员会也支持这套稳定而可靠的方法，并开始向帝国内部注资，只要这些藩国经济不崩溃，漫云奇迹就能升格为赫兹兰奇迹。"
 FAT_MilitaryGov.32.a:0 "只希望能度过最艰难的第一波。"
 FAT_MilitaryGov.33.t:0 "重生的工会"
 FAT_MilitaryGov.33.d:0 "与乡村派的团结和亲嘶意向不同，城市左翼内部的分化严重，而工会则是这其中加里波第最厌恶的产物，与嘶大林格勒不同，共和国的工会没有经历过武装斗争，也没有各种声音的包容，这里的工会只由最激进的左翼成员组成，表面声称为工人阶级争取权利，实际却是在国会上唱反调和鼓动游行示威，即使在左派中间，他们也最多地反对内部决定，私自组织行动，让艾斯特勒难以维持。克梅斯凯没有多余的心力制止他们，麾下各党又各怀心思，才让工会一直拖到了今日，在国会军变后，工会内部几近崩溃的狂热让卢咔难以下定决心，直到加里波第准备向其出手，才让左翼内部找到了机会，在元帅的越级干预下，工会内部成员大幅变动，被软禁的激进派多数直接革职，留下的也被明暗调动。\n\n重组的工会将调解新经济形式下的劳资纠纷，保障无产阶级利益，最重要的是，参与工会不再有党派限制。\n\n艾斯特勒从报纸上得知工会重组的消息时，并不觉得兔死狐悲，相反地，连他也松了口气。"
 FAT_MilitaryGov.33.a:0 "希望这能够奏效..."
 FAT_MilitaryGov.34.t:0 "克劳迪娅的矿业帝国"
 FAT_MilitaryGov.34.d:0 "自共和国地方保护政策加重以来，几个北方港口的出口利润就在减少，在罗莎尽力拖延着小马利亚投资方的不满撤资时，星风的经济改革计划让她看到了新的希望，毕竟比起棉衣和布料，帝国的一些资源要硬得多。\n\n“你想办新公司？”在私下会面中，星风担忧地看着她：“我觉得垄断北方纺织业的工作已经足够压垮一匹小马了，铜岭的事还是留给钻石狗吧。”眼前的雌驹既是外来资本和保守党的外交官，又是几大产业的联合托拉斯代表，她没有用这些牌逼迫政府，而是来和自己商量，本身就已经很不容易，然而，长远的影响也实际存在，外资的坐大会不会意味着更多的问题？罗莎知道麒麟的两难，她当然知道，要不然她干嘛专门来找星风？\n\n罗莎抓上了她的蹄子：“星风，我只需要开采权，其他的事情我都能处理，让我接手比任何狗都强，他们的设备能有马奎斯先进？再说了，那些狗绝不会把全部矿产都交底掉，让我来，又方便合作又能多交税。”她绕开那些必然造成的影响，只把那些好处摊给对方看，“我并不代表谁，星风，你也不必顾忌我们彼此的任何一个身份，你做决定吧，这笔交易值不值得？”星风的蹄子轻微晃动着，究竟值不值得？\n\n在看到新项目后，外资重新回流到克劳迪娅名下，她的公司能特例于共和国的保护条例，哪怕代价是远高于小笔交易的各类税收也值得，克劳迪娅带来了优质设备和技术，又自掏腰包让钻石狗们满意于为她效劳，更完美的是，这些额外收入基本都进入了共和国的报表，那些未来的影响，似乎都重要不过眼下这幅和乐融融的画面。星风头一仰，靠在办公椅上，总统元帅的巨大画像悬挂于上，但还处于喜悦中的星风并不担心这次的决定会有任何问题了。"
 FAT_MilitaryGov.34.a:0 "资本总是短视的！"
 FAT_MilitaryGov.35.t:0 "企业家大会"
 FAT_MilitaryGov.35.d:0 "在外汇年年减退的前提下，共和国政府决定放开外贸，让几大港口和其他大陆的生意往来支持共和，从天际纳维亚到阿奎莱亚，几乎所有的大企业家都齐聚于狮鹫海姆，大会开始前，罗莎和青柠慕斯会合，她已经从内部渠道打听到了这场会议的内容，但她扬着嘴角，并不着急把这些情报分享给那些有所顾虑的同行们。\n\n进入会场后，庞大的场馆和数层楼之多的大宴会甚至鹫满为患，让在漫云城风光惯了的青柠慕斯意识到这里的角儿要比自己的小圈子里多得太多，不由得向罗莎身边缩了缩，等到会议正式开始，那些鹫马都来到了一层的巨大会议厅，台上的狮鹫毫不严肃，几乎不像政府官员，他主持着炒起气氛，一个接一个地抛出议题，关于进出口的新政策明显宽松了许多，除了违禁品的刑罚更加严厉，几乎所有的商品品类都在补贴名单中，政府对支持创业的承诺也让这些成功的商鹫商马议论纷纷，在场的每一位都清楚，共和国的商业氛围将达到一个极新的高度，青柠慕斯听得欢喜，身旁罗莎却不太热烈，她这才想起来，罗莎的交际远广于自己，她碰了碰罗莎：“罗莎，你是不是早就知道了？”\n\n她何止知道，那些建议中，有一些就是她交代的，毕竟，放眼共和国，能同时影响两位大元帅的商鹫，自己也是头一号了。当然，她不会告诉青柠慕斯自己和曜尾的多次会面和私下贿赂，她只是简单地点点头，就足以让青柠慕斯羡慕嫉妒恨了。"
 FAT_MilitaryGov.35.a:0 "全狮鹫尼亚最好的港口都要忙起来咯。"
 FAT_MilitaryGov.36.t:0 "青柠慕斯的汽水帝国"
 FAT_MilitaryGov.36.d:0 "青柠慕斯的家传生意在漫云城独占鳌头，尤其在战后，青柠家的汽水更是火爆到漫云城中鹫爪一瓶，但看到那庞大的赫兹兰市场时，青柠慕斯眼中的仍是一片漫无边际的花园。那些历经战争的狮鹫们正迫切需要一份甜蜜！\n\n在她进军赫兹兰市场的过程时，尽管没受到什么阻拦，但扩张却十分缓慢，当赫兹兰的销售许可办下来时，她找到星风一起买醉，哭诉帝国鹫没有品味，星风提出帮她做宣传的主意，后来当星风想装作忘记此事，青柠则紧咬不放，几次下来，最终星风只好松口答应让她的汽水品牌和政府合作，而喝过他们家汽水的漫云狮鹫又由于业务调整去往了赫兹兰各地，一来二去，便把汽水带到了各个地区，短短几个月，青柠慕斯的汽水生意名声便打开了，此时的青柠慕斯又做促销又找代言，借着政府影响力甚至将卡梅莉塔请到广告中来客串，这一下，赫兹兰的饮料市场便彻底为之疯狂了。青柠慕斯的生意越做越大，在规模上已然成为了共和国自营企业的代表，这又进一步为她争取了更大的影响力，据她本马说，已经有了向马哈顿市场进军的打算。"
 FAT_MilitaryGov.36.a:0 "运气来了，就连陆马都能乘着碳酸气浪一飞冲天。"
 FAT_MilitaryGov.37.t:0 "经济奇迹"
 FAT_MilitaryGov.37.d:0 "统一货币、协调生产与扩大建设的努力逐渐汇合。新工厂正在投产，旧生产线完成更新，共和国的经济重建迈入了新的阶段。"
 FAT_MilitaryGov.37.a:0 "向着更好的未来。"
