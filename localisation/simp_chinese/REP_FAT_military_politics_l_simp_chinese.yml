 FAT_MilitaryGov.1.t:0 "国防理事会"
 FAT_MilitaryGov.1.d:0 "随着国会闭门，一部分中立议员官复原职，国防军成员和一些旧官员维持着政府的运作，为这场共和国的政变收尾，但狮鹫和麒麟互相心里都很清楚，他们不过是处理了国会，庞大的地方官僚体系和军队事务也只是表面上还在运转，实际上，格外安静的曜尾以及他的那批好学生近乎独走，自治区天际也没有对改组政府表态，加里波第和星风必须退回幕后，否则他们就是民主的破坏者，于是，由新理事会带来的二次训政开始了，只是，此次训政的掌权者由一个军人变成了两个军人，最要命的是，在这二者之中，共和和克梅斯凯的地位有着不可调和的分歧。"
 FAT_MilitaryGov.1.a:0 "所有的混乱又一次交汇在微妙的平衡点。"
 FAT_MilitaryGov.2.t:0 "再无戡乱"
 FAT_MilitaryGov.2.d:0 "国会看起来已经完全恢复了正常运作，各党派在肃清内部之后继续维持着稳定，只要自己能控制局面，战时制度的余波便可以彻底结束了，这是加里波第早就希望的事情。废除战时戡乱法令的议案轻松得到了绝大多数赞成，随着议案宣布通过，那份用于“平定乱党”的紧急权力被收回，两大元帅战战兢兢紧握的达摩克利斯之剑得到安放，那些尚在软禁中的反对派松了一口气，鹫民也对这一系列权利的回归感到满意，这场表演让军政府执政的紧张消去了不少。"
 FAT_MilitaryGov.2.a:0 "共和，轻而易举啊！"
 FAT_MilitaryGov.3.t:0 "民主的承诺"
 FAT_MilitaryGov.3.d:0 "在国会上出席军方代表本就诡异非常，高位军衔的出现更是让政客们创伤应激，因此两位元帅尽量少出席无关的会议，每当他们在场，所有的表决都会变得沉默又漫长，因此，有些会议表决他们不得不由曜尾出席，他对政坛的了解以及手下的亲信处理了很多问题。\n\n但今天的会议上，出席的是加里波第和星风，许多议员窃窃私语，还拿出爪机开始发消息，当加里波第示意要上台发言时，有些议员已提前离开了会场。加里波第扫了眼会堂，有些官员已经是一副视死如归的表情，星风啼笑皆非地看着他，他有些尴尬地清了清嗓子进入正题：“诸位，我今天要和各位宣布关于结束训政的新方针，作为一名共和军人，我并不希望长期维持国家紧急状态，但我们面对着和进入狮鹫海姆前一样甚至更糟的政治环境，除了狮鹫海姆和北方诸国，加入我们的新共和国并没有与我们的新政府整合，而是处于高度自治中，阿奎莱亚，天落以及各帝国邦都还未安定，反动派依旧蠢蠢欲动，河间地仍旧紧闭大门，可以说，尽管疆域扩大，狮鹫尼亚共和国，仍是一个孤立的国家，帝国用了数百年安定疆域，想要我们在一两年内做到是不可能的，但在那之前，我们内部的问题应该内部解决，政府应当团结起来，一切为实现共和理想，不可内斗。我能给各位一个明确的承诺，三年内，新政府安定下来，紧急时期过后，军方绝不干涉选举，待各位真正为共和选出一位合适的总统，以在场狮鹫尼亚共和国元帅名誉担保，军队中止一切干涉措施，全权交由新总统发落。”"
 FAT_MilitaryGov.3.a:0 "这份承诺，重量几何？"
 FAT_MilitaryGov.4.t:0 "无声的稳定"
 FAT_MilitaryGov.4.d:0 "星期日的早晨十点，天涯带着购物袋走在街道上，她的生活就是如此平淡，她会沿着家门往南的大路走约一公里，再绕进三条小巷子，穿出来的街道上弥漫的香气就来自她最爱去的面包店，那里的店长熬果酱有一手，她今天去买了新进的应季果酱和明天的早餐面包；她会为了看极光穿过大半个共和国去天际旅游，今天早上她还顺便绕了点路去了一趟邮局，手里拿着在天际那边结交的朋友每半个月寄来一次的信还有一个包裹，是他们上次寄信时说好要送给自己的礼物；\n\n“街道上好安静啊..也没有什么马。”天涯左顾右盼，今天的街道上有穿着军装的士兵们，抱着似乎是刚从路边墙上撕下来的传单，她也没有侧目，前几天在那个街角海报边还有好几个狮鹫争得不可开交，今天这些传单就统统被清理掉了。当她回到自己家的楼下，才发现街对面的演讲台也被拆得差不多了，无论是谁干的，真该给他们发奖金，她这一周都没能早睡就是因为各路奇奇怪怪的狮鹫在这个台子上从早到晚地对路人讲些奇奇怪怪的话，感谢北风神，那个露天玩意终于被拆了。\n\n哦，说不定是大选结束了呢！她才想起来前些日子听说要结束街头混乱，谢天谢地，终于结束了。天涯心情极好，上楼的蹄子都轻快不少。"
 FAT_MilitaryGov.4.a:0 "今天还真是充满了高兴的事情。"
 FAT_MilitaryGov.5.t:0 "赤色之褪"
 FAT_MilitaryGov.5.d:0 "红色的幽灵在过去三十年间一直若即若离地飘游在共和国每一个鹫马的脑海中，祂仿佛和革命一体双生，与世上每一个新生共和国的政治史都密不可分。翼展曾对总统元帅断言嘶大林正等待着接管革命，而艾勒斯特则力图用社会党的路线告诉克梅斯凯共和国的红不会被取代。但不管共和国的高层如何争论，左翼思想早就在这个国家的乡野基层扎下了根。\n\n国防军上台当然震撼了地方政府，这其中多数农村有自己的农会，这些地方上的红色组织有着建立地方武装的趋势，共和国左派势力推举的新领袖同样是一名地方议员，卢咔出生于小乡村的工鹫家庭，是根正苗红的乡村派左翼，比起嘶大林路线更喜欢镰爪，与艾勒斯特的城市路线相对应，他在漫云罢工期间为工会站台，且始终推动着社会党内部的乡村自治计划落实，他是那种——共和国害怕的赤色狮鹫。\n\n加里波第坚决反对内部清洗的和平过渡承诺平息了社会党的恐惧，而他提出可以通过停在国会表决的乡村自治计划以此换取国内左派的支持更是诱鹫，就这样，将信将疑的社会党最终和新政府达成了妥协，左翼势力认可新政府的合法性，并会同天际自治区接洽，同时停职处理社会党和共产党内部不支持政府的反对派，即使如此，这仍似乎是笔好交易，卢咔盘算着，比起始终抵触社会主义思想的共和政府，这两位国防军元帅似乎要比他想的更...实际一些？"
 FAT_MilitaryGov.5.a:0 "赤色浪潮暂时褪去了。"
 FAT_MilitaryGov.6.t:0 "公民与权力"
 FAT_MilitaryGov.6.d:0 "通讯器响起，星辰微光离开正在训练的新兵，接起电话：“你是说，由我去做漫云城的军事督理？”罗莎点了点头：“党内考虑的，漫云毕竟是革命老区，星风安排你去也是为了好办事。我只是给你透个风，回漫云来对你我都好，星风...军队中央计划把各地区划按种族文化重新划过，漫云虽然没有狮鹫海姆那么肥，总是流油的地方。”她简单答了一句：“听安排吧。”挂了机后回到军中，她回想起这段时间的变化。\n\n从攻入帝国后，上面的风向就一直在变，星风和加里波第军变，曜尾元帅先是躲回部队，后来又加了官，不管怎么说，管这套方式叫共和，也太把马当傻子了。现在又要搞什么种族文化区划，难道星风其实是潜藏在共和派中一个正宗的种族主义者？不不不，那不可能，再说加里波第可是世界共和革命的英雄鹫，想也想不明白，无论如何，回漫云城再看吧。\n\n作为军事督理，星辰微光回来后才得知，这一职位更像是军区司令，负责地区防务以及军队对接，漫云城的政府没什么变化，只是选官采用了民主选举的方式，这套威权民主的方式让星辰微光诧异之余也没什么可做。她的生活回到了过去那样，在漫云城做督理不仅少了训练部队的事务，还能和熟悉的老友会面，偶尔出席青柠慕斯的酒局，日子倒也还惬意。但对于星风，她抱着密切的关注，她还挺想知道，这出军变训政的闹剧，会以何等方式收场。"
 FAT_MilitaryGov.6.a:0 "第一蹄踏错，正确的方向也无法改变错误的结果。"
 FAT_MilitaryGov.7.t:0 "我们为何而战"
 FAT_MilitaryGov.7.d:0 "落花生参军的原因很简单，一百格罗申，在卡特琳这种穷乡僻壤，顶的上乡村家庭两年收入。这还只是入伍的补贴！对于当兵，她倒是早有准备，如果遇到黑石土匪，就照着村里收拾贼的样式弄他们，如果遇到打仗，那就躲起来，逃走，怎么都可以。当她踏入军营，看到的净是穿着军装的鹫马，找到部队之后，落花生才知道自己身为少有的雌马被分到了后方，这下轻松得多了，来到宿舍，落花生和同宿的鹫马打了招呼，然后便去了新兵训练处集合。\n\n教官看起来不凶，这也让落花生感到幸运，在她暗自窃喜时，教官讲解了一些基本的事项，扫视了一圈新兵们，突然说道：“你们为什么要参军？”并不需要回答，教官继续说下去：“参军并不困难，每个生物都能参军，保家卫国，建功立业，无论何种原因，进入军队，就相当于将自己的性命置于考验之中，特别是在——”她的爪子抬起来，指了指脚下：“这里。”\n\n她继续解释：“卡特琳始终处于周边各个匪帮的骚扰中，以前，保卫卡特琳的是贵族和白银爪套，你们知道吗？”她不可一世地斜视这群新兵：“我就是一位骑士。我知道自己为何而战，荣誉。你们相信荣誉吗？”落花生想摇头，但是没摇。“我知道你们不信，在共和国来之前，卡特琳的工业化进度迟缓，你们一辈子都没离开过土地，而且，你们中有不少小马，小马能干什么？要么乖乖种地，要么欠一屁股债，溜到心脏地去当土匪。这就是我对你们的刻板印象。”落花生看着教官，感到有些生气，教官察觉到有不少小马成功被她惹恼，踩了踩爪子：“小马们，你们相信狮鹫天生高你们一等吗？”终于，有回应的声音了：“不相信！”教官满意地点了点头：“很好，不要相信任何逼迫你低人一等的谎言！小马们，狮鹫们，我们为此团结而战，这才是荣誉的显示！”"
 FAT_MilitaryGov.7.a:0 "在落花生简单的心思中，新的观念开始成型。"
 FAT_MilitaryGov.8.t:0 "再无民族"
 FAT_MilitaryGov.8.d:0 "民族主义是被保守派扭曲的三民主义思想，秉持这种想法的鹫马并不理解民族主义的本质，北方小马和漫云小马不一样，帝国狮鹫和漫云狮鹫不一样，而漫云的小马和狮鹫又不一样。星风作为一只麒麟，自然理解种族间的差异，但与民族主义者不同的是，她来自小马利亚，那里有一个几乎不可复制的完美方案，谐律。民革会不会支持这个说法，但当下民革会只有一位话事鹫，而那个狮鹫，星风有把握能与之合作。\n\n曜尾仍藏身于军中，但他也未对这场政变表态，这就意味着这个手握狂热军官的狮鹫仍有和平争取的可能，加里波第和曜尾极不对付，于是即使万般不情愿，他还是只能同意星风去会面曜尾，当星风离开时，曜尾的亲兵看到这位自视甚高的狮鹫笑着与麒麟握爪道别。第二天，曜尾解散了他的近卫队伍，进入了国防理事会，并且开始着爪清理民革会埋下的政治暗雷和军中的极端主义份子，他甚至开始同加里波第交接事务，力图早日恢复军队稳定。"
 FAT_MilitaryGov.8.a:0 "我们可以接受民族思想，但不能接受民族主义。"
 FAT_MilitaryGov.9.t:0 "克梅斯凯的最终遗产"
 FAT_MilitaryGov.9.d:0 "不同派别对先总统的道路各有解释，却仍共同承认他为共和国留下的基础。政府将整理他的教导、支持相关研究，并以国父的记忆凝聚分裂之后的社会。"
 FAT_MilitaryGov.9.a:0 "铭记他留下的责任。"
 FAT_MilitaryGov.10.t:0 "团结就是魔法"
 FAT_MilitaryGov.10.d:0 "共和国的建设需要工匠、农民、教师与士兵，也需要不同种族的公民共同参与。新的动员不再只强调战场，而是邀请每个生灵在国家的未来中找到自己的位置。"
 FAT_MilitaryGov.10.a:0 "每个生灵都有用。"
 FAT_MilitaryGov.11.t:0 "新时代的展望"
 FAT_MilitaryGov.11.d:0 "共和国已经走过最危险的动荡，却还没有抵达理想的终点。政府将继续建设国防与民生，并准备以一个属于所有生灵的共和国之名，宣告新的时代。"
 FAT_MilitaryGov.11.a:0 "我们将守望共和国的未来。"
 FAT_MilitaryGov.100.t:0 "共和国的剧变"
 FAT_MilitaryGov.100.d:0 "[This.GetNewspaperHeader]狮鹫共和国的政治斗争以军方的胜利告终。维系不同派别的大帐篷政府被新的统治秩序取代，国民共和党重新占据了压倒性的优势。新政府承诺恢复稳定，并继续承担保卫共和国的责任。"
 FAT_MilitaryGov.100.a:0 "新的秩序已经形成。"
 FAT_MilitaryGov.101.t:0 "世界解放宣言"
 FAT_MilitaryGov.101.d:0 "[This.GetNewspaperHeader]狮鹫共和国政府发表宣言，宣布共和理想应当属于所有生灵。宣言重申了对旧有特权的反对，并将建立狮鹫尼亚生灵共和国列为下一步目标。这份宣言将在大陆上引起怎样的回应，仍有待观察。"
 FAT_MilitaryGov.101.a:0 "宣言将传遍大陆。"

# 第二阶段军事与经济分支
