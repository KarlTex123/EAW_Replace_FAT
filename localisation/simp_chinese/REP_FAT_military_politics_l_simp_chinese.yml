 FAT_military_liberate_country_desc:0 "与[FROM.GetName]商讨狮鹫尼亚的未来。谐律主义国家将通过谈判并入共和国，不自动获得核心；非谐律主义国家将进入宣战事件。"
 FAT_MilitaryGov.12.t:0 "必要蹄段"
 FAT_MilitaryGov.12.d:0 "伴随着大选的临近，国会日日充斥着争吵和指责，在帝国威胁下尚且压抑的权斗彻底沸腾，这些共和国政界最权威的喙仿佛已经退化成了构陷谎言和秽语的工具，而当这场纷争似乎又要和前几天一样随着议员们的离场渐渐平息时，大门却被轻轻推开，又很快关上，纷乱的争吵也很快变小直至消失，在场的所有议员，包括各党领袖在内，眼睁睁地看着星风和持枪士兵穿过鹫群走上主席台，察觉情况不对的翼展还想动作，但门口早站满了持枪的士兵，他跺了跺爪，思索着事情为何会走到这一步。\n\n“ 星风，你这是要兵变吗！”不知是谁向这显而易见的事情发问了，星风没有答复这个问题，当她确定所有议员都看着自己之后才开口：“自即日起，大选准备工作即刻停止，国防军将接管政府直至国内局势稳定。在座的每位都需要留在我们为各位准备的临时集中区，我再声明一次，请各位配合，不要有反抗的想法。”翔日的仇视，艾斯特勒的惶然和翼展的冷峻，她尽收眼底，唯独金羽似乎对此事早有预料，对上了她的观察，几乎一霎，他们就双双错开了目光。\n\n场内的军鹫们开始行动，加里波第确定最后一个议员也被押带着离开会场，回头看了眼星风，她点了点头，于是加里波第也离开了这个空荡的建筑。\n\n星风看着那年轻又威武的克梅斯凯，在这幅为纪念国父的巨幕画像前，他的战友们都已背叛了本心，星风屈膝向他下跪，为了自己刚刚做的事，和未来要做的所有事，她不会原谅自己的。"
 FAT_MilitaryGov.12.a:0 "再无回头路。"
