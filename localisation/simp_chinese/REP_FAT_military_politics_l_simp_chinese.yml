 FAT_MilitaryGov.1.t:0 "国防理事会"
 FAT_MilitaryGov.1.d:0 "新的国防理事会将由军官与文官共同组成，统筹征募、军备建设和国防资源。军队的扩充不再只是各部门各行其是的任务，而将服从共和国的统一规划。"
 FAT_MilitaryGov.1.a:0 "让国防事务有章可循。"
 FAT_MilitaryGov.2.t:0 "再无戡乱"
 FAT_MilitaryGov.2.d:0 "为战争而颁行的严苛法案正在逐步放宽。政府向各地公布了新的行政准则，要求结束不必要的紧急措施，使生产与日常生活回到稳定的秩序之中。"
 FAT_MilitaryGov.2.a:0 "让和平走进每一座城镇。"
 FAT_MilitaryGov.3.t:0 "民主的承诺"
 FAT_MilitaryGov.3.d:0 "政府再次重申，共和国的最终目标是让公民治理自己的国家。但军方认为，在新解放地区建立可靠的行政体系之前，训政仍须继续。这份承诺带来了希望，也引来了对权力何时交还的追问。"
 FAT_MilitaryGov.3.a:0 "我们不能忘记自己的承诺。"
 FAT_MilitaryGov.4.t:0 "无声的稳定"
 FAT_MilitaryGov.4.d:0 "工厂重新开工，街市恢复营业。政府要求地方机构保障普通公民的生活，制止任意清算，并为愿意继续服务共和国的技术人员保留岗位。秩序的恢复，首先体现在这些细小而安静的变化中。"
 FAT_MilitaryGov.4.a:0 "让公民安心生活。"
 FAT_MilitaryGov.5.t:0 "赤色之褪"
 FAT_MilitaryGov.5.d:0 "乡村自治计划开始推行。政府将部分地方事务交由村社处理，为运输、仓储与基层协作提供支持。社会主义者在乡间仍有影响，但地方自治也为他们参与共和国建设提供了新的途径。"
 FAT_MilitaryGov.5.a:0 "乡村也应当拥有自己的声音。"
 FAT_MilitaryGov.6.t:0 "公民与权力"
 FAT_MilitaryGov.6.d:0 "省级自治督管制度开始试行。地方代表将参与公共事务，中央派出的督管负责协调与监督。如何在统一行政与公民参与之间取得平衡，将由这些试点给出答案。"
 FAT_MilitaryGov.6.a:0 "从地方实践开始。"
 FAT_MilitaryGov.7.t:0 "我们为何而战"
 FAT_MilitaryGov.7.d:0 "服役者与他们的家庭应当得到共和国的保障。新的福利安排将覆盖征募、退役安置和家属生活，使士兵能够相信，他们守护的国家也会照顾他们。"
 FAT_MilitaryGov.7.a:0 "为了家园，也为了彼此。"
 FAT_MilitaryGov.8.t:0 "再无民族"
 FAT_MilitaryGov.8.d:0 "政府与军中民族派达成了新的安排：愿意服从共和国统一领导的人员将获得职位与保障，独立于国家之外的政治动员则必须停止。这场妥协需要付出代价，但也为眼下的秩序争取到了支持。"
 FAT_MilitaryGov.8.a:0 "忠诚应当归于共和国。"
 FAT_MilitaryGov.9.t:0 "克梅斯凯的最终遗产"
 FAT_MilitaryGov.9.d:0 "不同派别对先总统的道路各有解释，却仍共同承认他为共和国留下的基础。政府将整理他的教导、支持相关研究，并以国父的记忆凝聚分裂之后的社会。"
 FAT_MilitaryGov.9.a:0 "铭记他留下的责任。"
 FAT_MilitaryGov.10.t:0 "团结就是魔法"
 FAT_MilitaryGov.10.d:0 "共和国的建设需要工匠、农民、教师与士兵，也需要不同种族的公民共同参与。新的动员不再只强调战场，而是邀请每个生灵在国家的未来中找到自己的位置。"
 FAT_MilitaryGov.10.a:0 "每个生灵都有用。"
 FAT_MilitaryGov.11.t:0 "新时代的展望"
 FAT_MilitaryGov.11.d:0 "共和国已经走过最危险的动荡，却还没有抵达理想的终点。政府将继续建设国防与民生，并准备以一个属于所有生灵的共和国之名，宣告新的时代。"
 FAT_MilitaryGov.11.a:0 "我们将守望共和国的未来。"
 FAT_MilitaryGov.100.t:0 "共和国的剧变"
 FAT_MilitaryGov.100.d:0 "狮鹫共和国的政治斗争以军方的胜利告终。维系不同派别的大帐篷政府被新的统治秩序取代，国民共和党重新占据了压倒性的优势。新政府承诺恢复稳定，并继续承担保卫共和国的责任。"
 FAT_MilitaryGov.100.a:0 "新的秩序已经形成。"
 FAT_MilitaryGov.101.t:0 "世界解放宣言"
 FAT_MilitaryGov.101.d:0 "狮鹫共和国政府发表宣言，宣布共和理想应当属于所有生灵。宣言重申了对旧有特权的反对，并将建立狮鹫尼亚生灵共和国列为下一步目标。这份宣言将在大陆上引起怎样的回应，仍有待观察。"
 FAT_MilitaryGov.101.a:0 "宣言将传遍大陆。"
