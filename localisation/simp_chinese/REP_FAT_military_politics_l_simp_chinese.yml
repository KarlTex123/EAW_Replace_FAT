 FAT_MilitaryGov.20.t:0 "国民革命军的改组"
 FAT_MilitaryGov.20.d:0 "国防理事会宣布新的整编方案，统一陆海空军的指挥与训练制度。共和国军将以保卫国家、宪法和共和理想为共同职责，继续承担新时代的国防任务。"
 FAT_MilitaryGov.20.a:0 "让共和国的雄狮苏醒。"
 FAT_MilitaryGov.21.t:0 "克梅斯凯的遗赠"
 FAT_MilitaryGov.21.d:0 "先总统留下的不只是军校和装备，更是一支经历长征与战争的军队。老兵将把战斗经验传授给新兵，使共和国的军事传统延续下去。"
 FAT_MilitaryGov.21.a:0 "将经验传给下一代。"
 FAT_MilitaryGov.22.t:0 "忠于国家，忠于宪法，忠于理想"
 FAT_MilitaryGov.22.d:0 "新的誓词将在各军营中宣读。共和国军的忠诚应当归于国家与宪法，并以共和理想约束自身的力量。政府同时批准了面向狮鹫尼亚其他国家的解放行动筹备。"
 FAT_MilitaryGov.22.a:0 "让誓言成为行动。"
 FAT_MilitaryGov.30.t:0 "赫兹兰的经济现状"
 FAT_MilitaryGov.30.d:0 "帝国统治留下的工业与贸易网络庞大而复杂。政府将重新调查工厂、矿山和金融机构，为统一后的经济建设建立可靠的基础。"
 FAT_MilitaryGov.30.a:0 "从清点家底开始。"
 FAT_MilitaryGov.31.t:0 "货币的统一"
 FAT_MilitaryGov.31.d:0 "各地流通的旧货币与不同兑换制度妨碍着贸易。共和国将推动统一结算和货币流通，使工厂、商人与普通公民能够在同一套制度下交换生产成果。"
 FAT_MilitaryGov.31.a:0 "让市场重新连为一体。"
 FAT_MilitaryGov.32.t:0 "国父时代的经济奇迹余波"
 FAT_MilitaryGov.32.d:0 "黄金十年积累的管理经验和建设人才仍然留在共和国之中。政府将重新组织这些力量，把曾经在北方取得的建设成果推广到新整合的地区。"
 FAT_MilitaryGov.32.a:0 "延续建设的经验。"
 FAT_MilitaryGov.33.t:0 "重生的工会"
 FAT_MilitaryGov.33.d:0 "工会将在新的共和国制度下重组。政府希望通过稳定的劳资协调和工人参与，恢复工厂秩序并改善生产组织，使劳动者重新看到自身在国家建设中的位置。"
 FAT_MilitaryGov.33.a:0 "让工会参与重建。"
 FAT_MilitaryGov.34.t:0 "克劳迪娅的矿业帝国"
 FAT_MilitaryGov.34.d:0 "克劳迪娅的商业网络正在进入赫兹兰的矿业。共和国将协调勘探、开采与运输，使矿产资源能够更有效地服务于工业建设，同时扩大煤炭供应。"
 FAT_MilitaryGov.34.a:0 "资源将支持新的工业。"
 FAT_MilitaryGov.35.t:0 "企业家大会"
 FAT_MilitaryGov.35.d:0 "来自各地的企业家齐聚大会，讨论重建投资、生产恢复与市场扩张。政府将以新的经济安排鼓励建设，也将承担相应的民用消费需求。"
 FAT_MilitaryGov.35.a:0 "让建设继续向前。"
 FAT_MilitaryGov.36.t:0 "青柠慕斯的汽水帝国"
 FAT_MilitaryGov.36.d:0 "青柠慕斯的企业从饮料生产拓展到了更广的工业合作。政府希望利用漫云积累的技术人才与组织经验，推动科研与建设共同发展。"
 FAT_MilitaryGov.36.a:0 "把漫云的经验带向全国。"
 FAT_MilitaryGov.37.t:0 "经济奇迹"
 FAT_MilitaryGov.37.d:0 "统一货币、协调生产与扩大建设的努力逐渐汇合。新工厂正在投产，旧生产线完成更新，共和国的经济重建迈入了新的阶段。"
 FAT_MilitaryGov.37.a:0 "向着更好的未来。"
