l_simp_chinese:
 GAL_alignment_button_text: "阵营归属"
 GAL_alignment_button_tooltip: "查看狮鹫尼亚大陆各国当前的阵营归属。"
 GAL_alignment_title: "狮鹫尼亚阵营归属"
 GAL_members_title: "成员"
 GAL_alignment_faction_info_title: "阵营标识"
 GAL_alignment_info_tooltip: "§Y[GALGetAlignmentTitleName]§!\n[GALGetAlignmentDesc]"
 GAL_republican_pact_title: "共和国公约"
 GAL_republican_pact_desc: "团结在狮鹫尼亚共和国身边的革命阵营，以共和国国父克梅斯凯的三民主义为纲领的反狮鹫帝国大联盟，其宗旨在于完成978年未竞的革命，将共和民主撒向狮鹫尼亚大陆。"
 GAL_river_federation_title: "河间联盟"
 GAL_river_federation_desc: "一个奇特的多种族联盟组织，既没有共和国公约的激进，也没有帝国公约的保守，她们维持着自己的团结与友谊，共同面对即将到来的革命世纪。"
 GAL_independent_title: "独立国家"
 GAL_independent_desc: "未归属于共和国公约、河间联盟或帝国公约的狮鹫尼亚国家。"
 GAL_country_name_tooltip: "§Y[THIS.GetNameWithFlag]§!"
 GAL_imperial_pact_title: "帝国公约"
 GAL_imperial_pact_desc: "由曾经狮鹫尼亚大陆的霸主狮鹫帝国所建立的阵营，虽然狮鹫帝国的荣耀早已逝去，但是他们会竭尽所能的再度实现伟大理想，是狮鹫尼亚最大的保守壁垒。"
 GAL_alignment_unlock_tt: "解锁§Y阵营归属§!界面，可在政治页面查看共和国公约、帝国公约、河间联盟及独立国家。"
