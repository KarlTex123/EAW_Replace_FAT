 FAT_the_war_in_the_north_desc:0 "自狮鹫革命者占领漫云以来，共和国继续向北方扩张以拓展革命根据地，不可避免的导致了与本地小马部落的冲突，经过会议决定，共和国将保持平稳速度推进北方苔原纳入共和国版图。\n\n对左翼共和党鹫来说，他们希望能够在废除古老部落建立公社体制与保障少数种族平等之间建立平衡"
 
