the_setuation_of_the_state_desc_1:0 "由于历史因素的影响，铜陵的保皇派力量尤其强大，主流政治党派坚决反对共和，即便是社会主义者也持有君主派观念，我们在当地的活动很难获得盟友，但是铜陵却又是共和国南下的重要道路。共和国在铜陵的任务是尽可能获取地形情报，以改革派的外衣收拢一部分合作者，利用社会主义系列法造成的不满拉拢激进派共产主义者，收集曾经参与共和革命的钻石狗老兵，为共和军南下的军事行动提供便利。\n[BRZ.GetRulingParty] [BRZ.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_2:0 "安江的共和党由莱昂·布鲁姆一爪支撑，他的能力与他的野心一样庞大，身处丛林的他对自己在党中央的边缘化深感不满，安江党组织也未能跟上改组的浪潮保持松散的状态，共和党在安江只是共和军的附庸。但是面对男爵的军队，只有他能够在沙伊斯森林带领共和党残部坚持这么久。他们的盟友包括曾经加入共和国运动的舍勒教授所领导的无政府主义游击队，当地另一个可能的盟友是社会民主党，尽管他们对共和党有着奇怪的疏远，除此之外布鲁姆甚至与一些犯罪组织和男爵派将领有千丝万缕的联系，由此从安江渗透而出的共和派网络成为了南方共和运动的基础。共和党在安江的任务是保持现有的革命联盟，尽可能对安江党组织进行改组，让布鲁姆不要因为野心走上歧路。\n[ANG.GetRulingParty] [ANG.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_3:0 "耶鲁学区是整个狮鹫尼亚的教育中心，共和党在当地以学生运动和兄弟会的方式影响这些狮鹫尼亚的未来。曲鲁斯法尔大学的无政府主义学生组织先锋队，谐律主义学生组织新光闪耀运动是共和党可能的盟友，共和党的任务是尽可能将新光闪耀运动变为共和派的学生组织，从这里建立耶鲁共和党支部。保证与先锋队的合作，限制他们过火与不成熟的行动。最后通过宣传手段吸引政治冷感的学生，改善我们因为帝国抹黑跌落的声望。如果我们能够控制这个学术中心的舆论，将这个教育中心变成培养青年共和派的温床，那么共和运动将能够前进一大步。\n[YAL.GetRulingParty] [YAL.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_4:0 "女男爵疯狂的统治已经将整个卡特琳变成了废墟，贵族派的声望已经跌至谷底，虽然这导致作为共和派运动核心的青年知识分子力量孱弱，但无数绝望的农民投身在共和大旗之下，而由于农民的倾向，即便是作为帝国统治支柱的骑士团也有较为进步的白银爪套骑士团愿意与共和党合作。曾经的卡特琳主教暮羽出走建立了三神宗教社会党，他的立场与共和派或社会主义者都有所不同，但是依然可以进行联络达成协议。我们在当地将尽可能满足农民的愿望，组织农民运动，同骑士团和宗教社会主义者结成进步派联盟，孤立冥顽不化的银色黎明骑士团，推翻反动贵族团的统治。\n[KAT.GetRulingParty] [KAT.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_5:0 "罗马坞自由市具有一定的自治权，这意味着共和派在当地存在一定的活动空间，嘉比蕾拉·迪·卡廷作为罗马坞元老院的一员组织了共和党罗马坞支部，她与当地工团主义者达成联盟获得了工会的支持，使罗马坞共和运动重新焕发生机，罗马坞也是第一个响应改组的共和党支部，一直作为模范党支部存在。要对抗厄尔神官和元老院贵族的联盟，共和党与工会必须团结一致，我们要保证工会内部始终具有党的代表，如果合作顺利，这样的联盟将是当下共和党总路线的绝佳体现，届时凭借罗马坞重要的地位，这里将取代保守的安江成为南方共和运动的中心。\n[ROU.GetRulingParty] [ROU.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_6:0 "农民共和国算是帝国境内唯一具有民主政治的地方，但是这里的民主是软弱的消极民主，由格赖芬马尔申保守党影响的农民共和国会一直是帝国的忠仆，与之相反，共和国另外的三个政党都与共和派运动保持着一定的联系。格赖芬马尔申共产党一直接受着镰爪的指导并与北方社会主义者保持着密切往来，如果与社会主义者的合作能够保持，共产党将很快并入当地的共和派组织。格赖芬马尔申谐律党由小马利亚谐律主义者组建，我们可以通过说服与宣传促使他们意识到共和主义才是真正的谐律主义。至于国民行动党，虽然其政治理念与共和党大相径庭，但共和军存在一定与他们联络的渠道，在统一赫兹兰的态度与共和党一致。共和党在农民共和国的任务是从三股势力中组建共和党组织，结束农民共和国的消极民主实现革命民主，让农民共和国成为帝国肋下的利刃。\n[PYT.GetRulingParty] [PYT.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_7:0 "赫兹兰的心腹地区，帝国的直接控制区。在这里共和派遭到了严重的镇压，迄今为止共和派运动也未能恢复元气，只能在狮鹫海姆的陋巷中维持仅有的秘密组织。我们不太可能直接在狮鹫海姆发起共和派起义，也很难维持完善的党支部进行宣传，因此，狮鹫海姆共和党的任务是尽可能获取帝国情报，完善狮鹫海姆作为南北中转站的作用，并尽一切可能保持自身的存在，在帝国的镇压下存活下来。\n[GRI.GetRulingParty] [GRI.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_8:0 "施塔莓是帝国贵族集团的大本营，也是帝国封锁线的最主要力量，鹰爪女公爵在施塔莓的统治相当稳固，主流政治势力均是她的盟友，我们不太可能获得有价值的同盟者，发展自身组织也相当困难。共和派在当地的任务是保持自身的存在，在农民中进行宣传与月喙的支持者争夺影响力，侦察封锁线的漏洞，为共和国南下的军事行动做出铺垫。\n[STW.GetRulingParty] [STW.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"
the_setuation_of_the_state_desc_9:0 "帝国最富庶的公国，宪政派运动的中心。一纸宪法似乎让弗羽西亚有了民主的表象，一些政党在承认君主制的前提下在议会中争权夺利似乎这就能消除革命的火焰。我们在当地的任务是在议会政党中发展支持者，秘密筹建共和党支部，促使各政党激进派影响力强于其内部的稳定派，使宪法假面最终被戳破。工党内部激进派势力最强，与共和党的意识形态最接近，我们最有可能在这里实现目的，自由民主党虽然持谐律意识形态，但他们已经与公爵合作背叛了共和，只有将他们边缘化才有共和运动的空间。除此之外民联党的激进派也可以通过共和军间谍机构形成某种意义上的合作，我们将支持其中的共和派，限制贵族派的力量。\n[FEA.GetRulingParty] [FEA.GetLeader] 可合作势力状态：%d 共和国当地力量：%d"

