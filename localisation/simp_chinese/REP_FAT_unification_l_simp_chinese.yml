l_simp_chinese:
 REP_FAT_unification_category:0 "狮鹫尼亚联合之路"
 REP_FAT_unification_category_desc:0 "\n\n\n\n\n\n\n\n£REP_FAT_unification_banner \n\n\n\n\n\n\n\n新生的共和国已经稳定，国父的遗产也得到了保障，是时候完成未竞的革命了，将狮鹫尼亚团结在同一面旗帜，同一个理想下了！"
 FAT_unification_unlock_tt:0 "解锁§Y狮鹫尼亚联合之路§!：对接壤的狮鹫尼亚国家谈判合并或宣战，并可向特殊邻国伸出友谊的橄榄枝。"
 FAT_unification_can_process_tt:0 "目标须为谐律主义，或为可以开战的非谐律主义国家（不属于同一阵营、不是我国附庸且未签订互不侵犯条约）。"
 FAT_unification_target_changed_tt:0 "目标局势已变化，本次行动取消并退还§Y50§!政治点。"
 FAT_unification_offer_friendship:0 "向[FROM.GetName]伸出友谊的橄榄枝"
 FAT_unification_offer_friendship_desc:0 "改善与[FROM.GetName]的关系：双方相互关系增加200，并签订互不侵犯条约。每个国家只能执行一次。普通“处理问题”决议继续保留；非谐律国家在条约有效期间不能通过该机制宣战。"
 FAT_unification_friendship_opinion:0 "友谊的橄榄枝"
 FAT_Unification.1.t:0 "相逢一笑"
 FAT_Unification.1.d:0 "革命不都是需要流血的，我们的意识形态有很多相似的敌方，也许我们可以不通过战争就让他们愿意加入我们，作为让步，我们不会彻底吞并他们，他们将作为联邦加入共和国，保持大部分自治权，希望这样可以让他们同意。"
 FAT_Unification.1.a:0 "会有不流血的革命吗？"
 FAT_Unification.2.t:0 "必要之战"
 FAT_Unification.2.d:0 "由于我们的意识形态差异过于巨大，和平谈判是不可能的，现在只能一战了，我们必须将已逝国父的理想散播到狮鹫尼亚，新生的国防军已经做好了准备。"
 FAT_Unification.2.a:0 "那就战！"
