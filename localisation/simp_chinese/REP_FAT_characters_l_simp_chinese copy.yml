 FAT_Garibaldi_Giuseppe: "加里波第·朱塞佩"
 FAT_Garibaldi_Giuseppe_desc: "出生：947年7月4日\n\n传记：加里波第出身于翼巴蒂一个有共和传统的海商家庭，其父兄参与过著名的烧炭党运动。青年时代的朱塞佩从事着家族传统的海运事业，驾驶着商船穿梭在三大陆之间，在旅行中朱塞佩愤懑于世界上存在的不平等与压迫，励志为世界的自由事业贡献自己的力量。\n\n970年开始朱塞佩便参与了废奴活动，在斑马里加攻击运奴船与摧毁奴隶庄园，这些活动让他翼巴蒂激进派中打响了名号。978年革命爆发后，加里波第返回自己的家乡组织了一只志愿军北上支援革命，这只部队均身着红色上衣，因此被称为“红翼军”。尽管在革命战争中奋勇作战，革命者还是不得不踏上了逃亡之路，加里波第率领红翼军自愿为主力部队殿后，虽然没有经历过系统的军事教育，但凭借此前的冒险经历加里波第展示了杰出的游击才能，他带领部队且战且退与数十倍的敌人周旋，成功牵制了帝国军队，而红翼军的奋战也成为了当时媒体的中心。在一年多的苦战接近弹尽粮绝后，加里波第率领仅剩的红翼军穿过白尾抵达漫云与共和国主力汇合。在漫云落脚后，加里波第被重新安排为外贸负责人，利用自己的航海经验穿越封锁线为共和国提供给养与情报，冬季革命中，加里波第同样参与支援，带领尚无经验的赤卫队抵抗当地领主的镇压。冬季革命后，加里波第又前往斑马里加，在那里加入了对抗风暴大王的战争。\n\n1006年风暴大王战败后，加里波第回到了共和国，他传奇的冒险经历使他拥有了极高的声望，克梅斯凯安排他重新入伍成为了军队指挥官，但耀尾为代表的传统军官并不怎么瞧的上这位野路子出身的革命英雄。"