 FAT_star_wind:0 "星风"
 FAT_star_wind_desc:0 "星风：出身自澜麟的星风在一场冲突中杀死了自己的长官，不得不离开故乡辗转于世界各地，她在随后几年作为雇佣兵参与了斑马里加和狮鹫尼亚的许多冲突，在996年的冬季革命，她被地方贵族雇佣参与了镇压革命的作战。尽管如此，星风对横征暴敛的贵族十分反感，最终，在雇主要求星风对俘虏的赤卫队进行处决后，彻底失控的星风变成了逆麟消灭了她的原雇主，投向了革命军。革命胜利后，星风找到机会与狮鹫共和国顾问搭上了线，与他们一起返回了共和国。在了解后克梅斯凯决定将她也提拔进军事改革委员会，一方面是利用她对世界各地军队的丰富知识，同时也作为某种国际主义的象征，不过比起军事改革委员会的工作，星风更愿意去基层参与那些无休止的边境冲突让自己的内心平静。"
 nirik:0 "逆麟"

