 FAT_Garibaldi_Giuseppe: "加里波第·朱塞佩"
 FAT_Garibaldi_Giuseppe_desc: "出生：947年7月4日\n\n传记：加里波第出身于翼巴蒂一个有共和传统的海商家庭，其父兄参与过著名的烧炭党运动。青年时代的朱塞佩从事着家族传统的海运事业，驾驶着商船穿梭在三大陆之间，在旅行中朱塞佩愤懑于世界上存在的不平等与压迫，励志为世界的自由事业贡献自己的力量。\n\n970年开始朱塞佩便参与了废奴活动，在斑马里加攻击运奴船与摧毁奴隶庄园，这些活动让他翼巴蒂激进派中打响了名号。978年革命爆发后，加里波第返回自己的家乡组织了一只志愿军北上支援革命，这只部队均身着红色上衣，因此被称为“红翼军”。尽管在革命战争中奋勇作战，革命者还是不得不踏上了逃亡之路，加里波第率领红翼军自愿为主力部队殿后，虽然没有经历过系统的军事教育，但凭借此前的冒险经历加里波第展示了杰出的游击才能，他带领部队且战且退与数十倍的敌人周旋，成功牵制了帝国军队，而红翼军的奋战也成为了当时媒体的中心。在一年多的苦战接近弹尽粮绝后，加里波第率领仅剩的红翼军穿过白尾抵达漫云与共和国主力汇合。在漫云落脚后，加里波第被重新安排为外贸负责人，利用自己的航海经验穿越封锁线为共和国提供给养与情报，冬季革命中，加里波第同样参与支援，带领尚无经验的赤卫队抵抗当地领主的镇压。冬季革命后，加里波第又前往斑马里加，在那里加入了对抗风暴大王的战争。\n\n1006年风暴大王战败后，加里波第回到了共和国，他传奇的冒险经历使他拥有了极高的声望，克梅斯凯安排他重新入伍成为了军队指挥官，但耀尾为代表的传统军官并不怎么瞧的上这位野路子出身的革命英雄。"
 FAT_Blue_Time:0 "蔚蓝时光"
 FAT_Blue_Time_desc:0 "蔚蓝时光，原名法尔斯-威卡多-兰利，出生于小马利亚的坎特洛特。在小马利亚的军队中担任要职，具有丰富的战斗与指挥经验。\n虽然共和国与小马利亚的外贸交流被贵族阻挠而失败，但是共和国革命成功的消息却传到了她的耳朵里。在共和国使团离开前，蔚蓝时光在背地里接见了使团们。\n由于长久以来的和平导致小马利亚的军事趋于停泄，虎视眈眈的幻形灵，逐渐成长的嘶大林格勒以及那些旧贵族让塞拉斯蒂亚心神不宁，趁着一次机会，蔚蓝时光建议外派几名军官前往刚刚结束革命的共和国进行军事经验交流，塞拉斯蒂亚欣然同意，然后就让蔚蓝时光作为军官团的领导前往共和国。\n初次抵达这个国家时，这个国家还处于混乱之中。克梅斯凯亲自接见了这只来自小马利亚的军官团队，由于与幻形灵一次战争中获得的丰富的作战经验和强大的指挥能力，让她很快就在这片土地上获得一席之地。\n虽然没有进入一线，但是蔚蓝时光对军队大多数狮鹫十分的友好，但是除了那些贵族的余孽之外。\n共和国境内也有着不少的小马存在，除了帮助共和国训练军队之外，蔚蓝时光还额外的帮助共和国来处理狮鹫与小马之间的关系。当然，是用友谊的方式。\n在她刚刚来到共和国的那段时间里因为语言问题导致发生了不少尴尬的事情，不过她很快就学会了狮鹫们的语言……她现在正致力于打破军队中各种狮鹫之间的语言鸿沟"
 FAT_Tri_service_coordination:0 "三军协调"
 XUR_weiguang:0 "星尘微光"
 FAT_XUR_weiguang_desc:0 "星尘微光\n980年生于赫墨莱塔\n生平事迹：毕业于坎特洛特皇家陆军学院，后以上尉军衔指挥小马利亚北境某部队。后北境爆发革命，微光多次不顾平民伤亡攻击城市并处决战俘且于上司爆发争论后被撤职还乡。后在坎特洛特得知小马利亚当局撤军并停战后，在坎特洛特街头高调批评谐律当局无能与腐败希望能使公主再次宣战，随后被逮捕并被羁押六个月。出狱后心灰意冷的微光得知在遥远的狮鹫大陆上一个新兴的国家出现，共和国，虽然微光刚开始认为那里有太多的进步份子会使国家堕落。后得知漫云军军校长耀尾的一系列军事改革和对解决狮鹫问题的见解颇为认同。认为在共和国或许能更有施展抱负的空间。1000年，微光带着自己的所有财产动身前往共和国，由于自己在小马利亚的军事生涯和卓越的后勤能力很快变被耀尾为首的保守派看中并收纳其中。凭借卓越的管理能力和严酷管理制度短短两年时间便在保守派中获得一席之地，同时计划多种未来战时状态的工业计划。但是，由于过度压榨劳动力和危险的右翼思想，星辰微光也是各种社会主义者的批评对象。"
 FAT_military_expert:0 "军工专家"
 FAT_star_wind:0 "星风"
 FAT_star_wind_desc:0 "出身自澜麟的星风在一场冲突中杀死了自己的长官，不得不离开故乡辗转于世界各地，她在随后几年作为雇佣兵参与了斑马里加和狮鹫尼亚的许多冲突，在996年的冬季革命，她被地方贵族雇佣参与了镇压革命的作战。尽管如此，星风对横征暴敛的贵族十分反感，最终，在雇主要求星风对俘虏的赤卫队进行处决后，彻底失控的星风变成了逆麟消灭了她的原雇主，投向了革命军。革命胜利后，星风找到机会与狮鹫共和国顾问搭上了线，与他们一起返回了共和国。在了解后克梅斯凯决定将她也提拔进军事改革委员会，一方面是利用她对世界各地军队的丰富知识，同时也作为某种国际主义的象征，不过比起军事改革委员会的工作，星风更愿意去基层参与那些无休止的边境冲突让自己的内心平静。"
 nirik:0 "逆麟"

 suntail_desc:1 "没有鹫怀疑曜尾的革命信念，他15岁跟随克梅斯凯闹革命，历经第一次革命中克罗纳的残酷手段、瑰翼叛乱时带领总统卫队突围等事，严于律己、滴酒不沾，信仰坚定，是完美的共和国骑士，是值得信赖的革命志士、克梅斯凯的好学生、永不变色的共和党。然而，只有他自己知道，他已失去对三民主义的信念。他亲身参与提出三民主义的辩论，深知理论中的问题；克罗纳战役让他明白谐律口号和大众支持无用，铁与血才能拯救革命；瑰翼叛乱让他看到克梅斯凯的狼狈与昏招，尤其是克梅斯凯向赤色分子屈膝后，他仅剩的忠诚也消失了。曜尾重新思考三民主义，认为革命是用强力阶级取代腐朽贵族，让狮鹫民族征服异族成为世界之主。此后数年，他悄悄完善思想且未与鹫谈起。直到克梅斯凯安排他任漫云军校校长，他意识到机会来了，能绕开被管控的党，在军校学生中收获支持者。在隐秘交流中，他的小团体生根发芽，支持者以血誓保密，通过单独活动让他的影响力从军队扩散到社会。不久后，曜尾将付诸野心，届时无人能阻。"
 FAT_max_whitefeather_desc:0 "作为共和军中最年长的将领，白羽几乎经历了一整个格罗弗四世的统治，那时帝国经过一百多年的休养生息，中央集权日益加强，帝国正在由一个传统的封建国家向现代社会迈进，新的阶层不断涌现，旧贵族的权力正在经历着挑战。作为一名商鹫的儿子，白羽受益于禁卫军的改革，他是第一批平民军官，在沉默寡言的格罗弗四世面前下跪宣誓效忠皇帝，他从来没想过，这样庞大的国家竟然会在短短几年时间便走向衰败。当年幼的格罗弗五世即位，政权迅速把一帮贪得无厌的旧贵族把握，他们迫不及待的推翻老皇帝的一切改革，将帝国变成了他们的游乐场，随后的独立浪潮迅速摧毁了帝国，庞大的帝国军没有经过真正的战斗就选择了退缩，看着帝国四分五裂。愤恨的白羽也是从那时起加入了克梅斯凯瑰翼等军官组成的反政府组织，他只是想回到老皇帝的统治时期，却没想到时代的浪潮竟然将他带的如此之远。共和革命爆发后，白羽作为禁卫军老将被任命为南部战线负责人，他与瑰翼一起指挥安江的战役，在局势恶化后与共和军一同长征。当瑰翼起兵反叛时，如果不是因为他陈旧的泛狮鹫思想影响，恐怕他也将作为政变集团的一员，阴差阳错，他还留在共和军中，对当下日益左倾的共和党感到格格不入，这不是他的运动，也不是他的国家。"
 FAT_simon_rigstag_desc:0 "西蒙的父亲是老共和军的一员，年幼的西蒙在母亲的怀抱之中走完了漫云长征。由于其父亲的影响，西蒙自然而然的走上了军事道路，作为一名基层军官加入了经历瑰翼叛乱元气大伤的共和军，在随后的服役生涯中，他意识到如果共和军以传统作战方式进攻帝国的封锁线，只会造成严重的伤亡，过慢的速度会让原本分裂的帝国贵族有机会获得反应时间集中力量应对共和军，到那时仅凭漫云的力量无论如何也无法战胜帝国，西蒙一直困扰于此，将自己大部分的精力都花费在这个难题上。996年，西蒙参加了冬季革命军事顾问团，在谢伟良纳他见识到了一种由拖拉机改装的战车，西蒙迅速意识到了这种新式战争机器的潜力。回到漫云后，西蒙总结自己在冬季战争的经验，并构思了装甲突击理论，在他的构思中，战车部队将作为矛头撕开前线，后续部队将乘坐机动工具快速通过防线消灭敌人在后方的指挥节点与集结地，紧接着剩余部队将解决已经被装甲力量分割已经首尾不能相顾的敌人。志得意满的西蒙将这一理论写成专著，却没想到他的理论同时受到了两方面的驳斥——党内左翼认为这是过于看重物质力量而忽视了群众的决定性作用，军队高层则怀疑战争机器的可靠性。在数次进言后，西蒙只获得了一个新团进行他的装甲战实验，尽管他不断强调，仅仅一个团不足以完成装甲战的训练，共和国想要击败帝国必须依靠高速装甲突击，高层却兴趣缺缺。为了能够让装甲部队得到更多的支持，西蒙不得不在军中四处活动进行他厌烦的政治活动，希望能够说服高层将装甲战理论作为共和国军改的未来。"
 FAT_otto_gremmersen_desc:0 "奥托在年轻军官中几乎是一个传说，他的传奇始于一个平常的沙盘推演，在战役学教学结束后，作为作业的一部分，教官让学生们扮演撤退的共和军，重新推演那一场几乎决定共和军命运的弗羽西亚北部战役，那一场战役由共和军最杰出的三个狮鹫——克梅斯凯，曜尾，瑰翼共同指挥，他们在一场恶战后击退了帝国部队，但共和军也损失不小。教官原本只是让学生们意识到指挥一场战役会有多么困难，但是没想到有一个学生竟然做出了比历史上更好的回答，奥托指挥曜尾的部队进行诱敌，随后通过一次回旋成功的让共和军主力来到帝国军薄弱的侧翼，接下来的进攻几乎摧毁了帝国军主力。出于对军事传奇的维护，教官们又连续为奥托设置更苛刻的条件，奥托却轻而易举的适应了越来越苛刻的要求，一次次的证明，他能够让共和军以更小的损失获得更大的战果。当奥托以第一名的成绩作为漫云军校的第一批学生毕业后，他几乎立刻被拉入总参谋部，并迅速得到了克梅斯凯的青睐，成为了军校生中的第一个师长。然而，奥托在独立领兵的过程中却陷入了一系列问题，他和政治委员的关系非常糟糕，奥托不断抱怨政委束缚了他的指挥，士兵也不断抱怨，这个新长官总是下达一些不可能完成的命令，部队士气糟糕，奥托不得不回到总参谋部，他继续在自己熟悉的岗位上工作，但心高气傲的奥托始终希望能够洗刷耻辱，证明他才是共和军最好的指挥官。"
