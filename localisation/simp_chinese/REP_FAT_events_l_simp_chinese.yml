FAT_FP.27.t:0 "任命新总理"
FAT_FP.26.d:0"行政院院长象征着最高行政权，但是过去这一职位与总统的权力抵触，于是在大众眼中基本上变成了克梅斯凯的私鹫秘书，不过随着时钟滴答，再伟大的鹫也终会老去。他已不能独力支撑全部的总统职能与元帅军务了，为此他决心设立一个新的总理府，将更多行政事务交给行政院院长处理。但这一职位的选择亦令人纠结，共和党内的每个狮鹫都有他们自己的站队，能孚众望的狮鹫本就不多，还必须制衡得下党内的勾心斗角。\n他第一个想到的自然是施纳贝尔.翔日。三色旗团居于民革会与左翼同盟中，以不忘共和初心而立身，其资历与军事才能足以服众，但翔日与军队重将曜尾不对付是其一，他强烈的硬汉形象与军事主张哪怕在实力最为强大的盟友小马利亚的眼中都是极其富有侵略性的，更遑论嘶大林与其他盟友了。\n然后，就是当下的二把手海因里希·金羽。金羽的中立立场是全党皆知的，他的工作能力在自己看来更是无可指摘，只是其行事太过低调，若选择由他担任总理，左右两派都难免会出现质疑之声，那么似乎也与设置总理府的初衷相违背。\n最后，是克梅斯凯所能想到的最独特的一位朋友，马克西米连·翼展。他是漫云议会的风云人物，共和主义传播者的资历也足够使鹫认可，更不用说其强硬的性格绝不会让其他同僚产生轻慢之心，只是他虽有才华却因反对当下党内的社会主义思潮而在共和国的政坛中不受重视，而且他的“党国”并不是克梅斯凯希望见到的，反而很受右翼们的欢迎。\n克梅斯凯内心清楚他必须选出一位总理，在内心纠结之后，他最终敲定一鹫。"
FAT_FP.27.a:0"“施纳贝尔·翔日，共和初心永世不改。”"
FAT_FP.27.b:0"“海因里希·金羽，他卓越的能力会说服质疑者。”"
FAT_FP.27.c:0"“马克西米连·翼展。我们肯定需要他的斗志。”"

