FAT_start.80101.t: "对麦耶的审判"
FAT_start.80101.d:0 "我们终于活捉了那可耻的叛徒迈耶，他的党羽大多都被当场击毙了。当我们的革命军找到迈耶时，他正像条野狗一样躲在他庄园的地道里浑身脏渣。在我们支持的革命势力控制豪克兰的几个港口后，迈耶的消亡就只是时间问题了。在他无力支付费用后，迈耶的多数雇佣军甚至选择了就地解散拒不抵抗。随着三色旗飘扬在鹰之港上空，这片有海上十字路口之称的群岛终于回到了革命的旗帜之下。\n对迈耶的审判就在岛上进行。鉴于迈耶曾对革命和海域周边国家做出的诸多罪恶行径，克梅斯凯决定带着曜尾和翼展亲临对这个可憎叛徒的审判现场。\n由于迈耶的王国根本没有成文的法律，自然也没有专门的法院，审判只好在迈耶以前的会议室进行。法官先是把爪子放在共和国宪法上宣誓，然后开始宣读对迈耶的指控——他带着飞机叛逃到岛上是为叛国罪和分裂国家罪；他自立为王成立伪政权是为反革命罪；他从事海盗行为掠夺附近船只是为劫持船只罪和抢劫罪；他在抢劫时经常屠杀船员或当地的居民是为故意杀害罪。除去这些主要的指控，还有若干罪名指向他非法统治豪克兰时犯下的滔天恶行。迈耶在法官宣读他罪行时情绪很激动，尽管有法警把他摁住，但他还是大吼大叫着辱骂法官和在背后旁听的克梅斯凯一行。法官和克梅斯凯几个都没有理会迈耶的吼叫，这不过是虫豸被碾死前最后的嘶鸣。\n法院仍然给了迈耶为自己辩护的机会，迈耶拒绝了共和国给他分配的律师，决心自己给自己辩护——尽管他根本不懂法律。他眼中的所谓劫掠和杀害不过都是很平常的事，他对自己的辩护里面其实全都是用污言秽语攻击克梅斯凯，攻击共和国。法警试图捂住他的鸟嘴，却被他的喙啄伤了。不得已，只能给他打一针镇定剂，这才让他收敛一点。\n镇定剂的效果很快显现了，迈耶脑中准备好了的脏话消失了，取而代之的是海量的往事。他想到自己出于投机主义加入革命，无论他的本意是怎样，他确实在加入革命初期为战斗提供了空中优势。但后来，他的野心越来越大，他不再满足当一个空军元帅。贪欲是他叛逃的根本原因。迈耶回想起自己煽动共和国空军占领豪克兰的那个夜晚，当时的他满心以为自己可以就此无法无天永远快活下去。现在，在药物的作用下，他终于清醒地认识到自己的处境，脑中的回忆还在不断地涌现，和法官宣读的声音交杂在一起，使他甚至产生了一丝后悔——并非后悔自己背叛革命，而是后悔没有早点逃跑。\n迈耶先前的癫狂和后来的沉默都被克梅斯凯看在眼里，曜尾和翼展窃窃私语地讨论着他的事。见法官已经宣读完了对迈耶的指控，迈耶也没有再提出异议，是时候由克梅斯凯最后裁决叛徒的命运了。"
