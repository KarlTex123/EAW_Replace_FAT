FAT_FP.27.t:0 "任命新总理"
FAT_FP.26.d:0"行政院院长象征着最高行政权，但是过去这一职位与总统的权力抵触，于是在大众眼中基本上变成了克梅斯凯的私鹫秘书，不过随着时钟滴答，再伟大的鹫也终会老去。他已不能独力支撑全部的总统职能与元帅军务了，为此他决心设立一个新的总理府，将更多行政事务交给行政院院长处理。但这一职位的选择亦令人纠结，共和党内的每个狮鹫都有他们自己的站队，能孚众望的狮鹫本就不多，还必须制衡得下党内的勾心斗角。\n他第一个想到的自然是施纳贝尔.翔日。三色旗团居于民革会与左翼同盟中，以不忘共和初心而立身，其资历与军事才能足以服众，但翔日与军队重将曜尾不对付是其一，他强烈的硬汉形象与军事主张哪怕在实力最为强大的盟友小马利亚的眼中都是极其富有侵略性的，更遑论嘶大林与其他盟友了。\n然后，就是当下的二把手海因里希·金羽。金羽的中立立场是全党皆知的，他的工作能力在自己看来更是无可指摘，只是其行事太过低调，若选择由他担任总理，左右两派都难免会出现质疑之声，那么似乎也与设置总理府的初衷相违背。\n最后，是克梅斯凯所能想到的最独特的一位朋友，马克西米连·翼展。他是漫云议会的风云人物，共和主义传播者的资历也足够使鹫认可，更不用说其强硬的性格绝不会让其他同僚产生轻慢之心，只是他虽有才华却因反对当下党内的社会主义思潮而在共和国的政坛中不受重视，而且他的“党国”并不是克梅斯凯希望见到的，反而很受右翼们的欢迎。\n克梅斯凯内心清楚他必须选出一位总理，在内心纠结之后，他最终敲定一鹫。"
FAT_FP.27.a:0"“施纳贝尔·翔日，共和初心永世不改。”"
FAT_FP.27.b:0"“海因里希·金羽，他卓越的能力会说服质疑者。”"
FAT_FP.27.c:0"“马克西米连·翼展。我们肯定需要他的斗志。”"

FAT_FP.28.t:0"军队的现状"
FAT_FP.28.d:0"又是一轮阅兵，克梅斯凯大元帅照例坐在主席，共和党的其他高级领袖坐在总统元帅身旁。每有一支方队走过，总统元帅都会起身敬礼示意。这么看来，底下这些整齐的方阵似乎让鹫觉得共和国的军队还挺不错的。但仔细一看，即便是阅兵方阵，士兵也是高矮胖瘦良莠不齐，细看之下，他们爪中拿着的枪也都是十几年前的老型号，绝大部分是单发栓动步枪。重型武器就更是不堪入目了，数十年以来同样的火炮在场上轮番上阵，仅有的新鲜玩意只有后续的装甲车方阵，但非常不凑巧，这阅兵式上唯一的新式兵器却当场抛锚，西蒙连忙带着工程师下去维修，最终才让稀稀拉拉的装甲车开过检阅台。\n克梅斯凯高站在台上敬礼的时候，脸色其实是很不好看的，幸亏没鹫察觉，可能也就觉得这只是严肃的表情。三十年前，这些老兵虽然短暂地攻下了狮鹫海姆，却在帝国的诸侯的进攻下不得不撤退。更别说眼下帝国已经在幻形灵顾问团的帮助下迅速提高帝国的现代化水准。为了维持一直与帝国庞大力量匹敌的军队，漫云地区已经竭尽全力，但是还远远不够。\n时间拖得越久，克梅斯凯就越心慌，帝国的威胁逐日具体，而自己的军队却完全没有做好应对新世纪的准备。军队改革必须现在开始，甚至不能再等到明天。随着最后一支方队离场，克梅斯凯立刻要求党内所有要员随他召开会议，脸色铁青地提出自己的担忧和军改的初步想法，该想法获得了一致赞同，曜尾和镰爪尤其表示支持。"
FAT_FP.28.a:0"比如首先……也许我们应该多造点新的大炮？"

FAT_FP.29.t:0"国民革命军的未来"
FAT_FP.29.d:0"漫云军校自第一批学生毕业以来，就开始源源不断地向军队中输送鹫才，其中大部分是热血的青年，也有重新学习理论的老兵。尽管青年们还没有实战经验，但这并不妨碍他们提高军队的整体素质水平，军校的扩建则加速了这一进程，期望下一次阅兵能看见更多年轻面孔。\n新的千年已经到来，大洋彼岸的几大强国都开始尝试一种叫做坦克的新型武器。据称，即使是帝国都开始接触这类新军种。从目前来看，这种武器的实战还只在冬季革命亮相过，作为首战，坦克（其实是装了机枪的拖拉机）对步兵展现了强大的压制力。克梅斯凯想到，如果能给坦克上装配更大威力的武器和更厚的装甲，不就能做到攻防一体，碾碎敌人的防线？但技术鹫员同时提醒道，要在车体不散架的情况下堆叠火力和装甲对于目前的科技水平来说过于困难了。坦克的造价远远高于火炮，非战斗损失简直像是在给产能放血\n就个鹫来说，克梅斯凯还是更喜欢火炮。这种武器已经在世界上称霸了几百年，因其相对便宜可以量产，在几百门火炮的轰击下几乎可以肃清一个阵地。也许是天赋，克梅斯凯在指挥炮兵时总是能敏锐地察觉战场情况，选择最安全有利的环境对敌进行火力覆盖。虽然火炮不像坦克那样能自己开着走，而是要鹫拉着才能移动，但数百年的经验已经几乎覆盖了炮兵使用的方方面面。成熟的理论也是火炮面对坦克的一大优势。\n很可惜，共和国产能有限，没法在大规模开发新兴兵种的同时让老方案保持压制力，总统元帅需要在两种兵种中做出抉择：是赌坦克的前途无限，还是拥抱更稳妥的火炮？"
FAT_FP.29.a:0"火炮轰鸣的时代还没有结束"
FAT_FP.29.b:0"现代的战争就要用现代的武器"

FAT_FP.30.t:0"新时代的骑士"
FAT_FP.30.d:0"随着军改的进行，越来越多的新鲜血液注入到了军队之中，他们大多甚至是在978年革命之后才出生的，但他们的革命热情一点都不输那些老兵们。克梅斯凯决定专门检阅一遍这群由青年面孔组成的新军队。\n克梅斯凯扫视着眼前整齐排列的士兵们，他们受过严格的训练，但在亲眼见到总统元帅时还是难掩心中的激动。总统元帅称，在过去，帝国的骑士们不过是贵族和神官的爪牙，他们所谓的“骑士精神”早就被异化成了对鹫民的镇压和对老爷们的维护。而今，共和国雄踞北方，我们要发展属于自己的骑士精神——那就是对革命的忠诚和对共和的信仰，并希望每一名士兵都能恪守这一点。\n士兵们激奋地高喊着口号，就连他们身后停着的新式大炮仿佛都在震颤。作为共和国最新锐的力量，新军队配备了相当强悍的重火力，在克梅斯凯决定继续延续火炮优势后，新型的火炮在火力和部署上变得更加精益求精。有了这些大炮，士兵们就可以趁着火力压制的间隙向阵地中残存的敌军发起冲锋，由此达成扫荡的效果。\n最后一支队伍离场，克梅斯凯望着他们的背影，他们是共和的利刃，是对抗封建的十字军。"
FAT_FP.30.a:0"炮火铸造身躯，意志淬炼灵魂"

FAT_FP.31.t:0"装甲的主攻方向"
FAT_FP.31.d:0"自从共和国组建了一支试验型装甲部队后，坦克在某些特殊情况下的弱点也被暴露了出来。例如，坦克很难在森林里前进，而共和国与帝国的边界上有相当多森林地带，需要一支专门的工兵部队把道路上的树木全都砍光才行。这么一来就浪费了不少时间，共和国的坦克没有厚重的装甲，只能靠速度博取优势，因此这种情况是绝对不能接受的。\n既然普通的工兵已经不能满足装甲部队的需要了，就必须想办法开发一种新的思路来解决这个问题。科学家们提出了两种设想，其一是设计一种全地形用的功能性装甲车辆，这种战车几乎没有对敌杀伤能力，却能根据地形选择不同的配件来让崎岖的地形变得尽可能好走一点。\n另一种设想是，在现有的坦克上进行改动，使其可以装备大功率的喷火枪。由于要搭载更多燃料供喷火枪使用，这种坦克就会变得不再适合装备其他武器。喷火坦克与上述的装甲支援车最显著的优势是，喷火器的装配可以在沼泽和森林地形中取得更好效果。\n很可惜，我们的产能有限，这两种设想只能选一种。"
FAT_FP.31.a:0"装甲支援车听起来更全面"
FAT_FP.31.b:0"术业有专攻，还是研究喷火坦克吧"
