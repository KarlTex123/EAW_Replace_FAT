FAT_DIP_Focus.5.t:0"卡梅莉塔歌后在河间地的巡回演出"
FAT_DIP_Focus.5.d:0"一幅幅精美的海报张贴在了大江共和国各大城市的街头，海报上，狮鹫共和国的传奇明星—斯卡尔歌后卡梅莉塔展开华丽的羽翼，眼神中饱含着关于爱情的烈火。许多小马市民对此抱持着怀疑的态度，毕竟，关于狮鹫的记忆总与帝国和战争联系在一起。\n然而，当那位斯卡尔歌后卡梅莉塔在江源城剧院的舞台上开始表演时，偏见在音乐的浪潮中消解。她的声音嘹亮而又华丽；她的舞姿优雅而又灵动。演出结束后，剧院内寂静片刻，随即爆发出雷鸣般的蹄声。江璇总理在剧院亲自接见了卡梅莉塔，双方进行了一次友好而非正式的会谈。江璇总理表示，卡梅莉塔小姐的艺术展现了狮鹫共和国文化截然不同的一面，值得尊敬。"
FAT_DIP_Focus.5.1:0"艺术不分种族，不分国界，不分阶级"

FAT_DIP_Focus.6.t:0"致韦迪纳帝国政府及诸邦之最后通牒"
FAT_DIP_Focus.6.d:0"致韦迪纳帝国的最后通牒\n鉴于韦迪纳皇室及其贵族集团以暴政统治荼毒国民，以世袭特权践踏民众诉求。共和国今向韦迪纳帝国发出最后通牒。\n要求如下：\n一、君主即刻退位\n皇室及其直系继承人须于七十二小时内宣布永久放弃皇位，解除所有军政权力。皇室成员须接受国内法庭对其罪行的审判。\n二、全面政治赦免\n立即无条件释放所有因政治立场被囚禁之共和派人士，撤销对自由派知识分子的通缉令，保障每位公民不受迫害之基本权利。\n三、启动宪政改革\n1. 解散世袭贵族议会\n2. 组建临时国民大会\n3. 于六个月内举行全民普选\n4. 确立三权分立之共和宪政\n四、贵族集团处置\n所有世袭贵族即日起剥夺特权，其非法侵占之土地资源收归国有。主要战犯贵族须接受审判。\n最后警告：\n若于本通牒送达四十八小时内未获明确答复…"
FAT_DIP_Focus.6.1:0"§R共和国将立刻对帝国宣战§!"

