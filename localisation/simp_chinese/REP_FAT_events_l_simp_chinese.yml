#FAT_start.10101.t: "国民共和党民族革命同志会"
#FAT_start.10101.d: "在与社会主义者达成合作后，一部分军官痛感国民共和党组织松散导致社会主义者几乎渗透到党的方方面面，他们聚集在耀尾身边，成立了一个秘密社团并影响着诸如退役军人协会之类的外围组织。\n\n革命同志会渴望通过强权手段与铁血方式壮大共和国，因此，同志会对正统三民主义也提出了自己的补充，即民族主义代替民主主义，他们认为世界各种族已经卷入生存竞争，必须尽快建立统一的狮鹫国家参与世界争霸，尽一切手段扩大狮鹫民族的生存空间。\n\n领导人：耀尾"
#FAT_start.10101.t: "会见耀尾"
#FAT_start.10101.d: "耀尾整理了自己的军服，挥爪推开了克梅斯凯办公室的大门。\n“元帅。”耀尾向他敬礼，不同于政府的其他成员称呼克梅斯凯为总统，耀尾自始至终都以共和军时期的元帅称呼克梅斯凯，此时，他的老上级在办公桌后方，爪子里攥着一本小册子，听到耀尾走进了，克梅斯凯抬起头，眉头紧锁看着耀尾。\n“耀尾校长，漫云军校图书馆最近怎么进了一批喙索里尼的书？”克梅斯凯的声音不怒自威：“我还听说，是你力主引进的，甚至找学员组织过讨论会？”\n“是的，我确实从天落购买了一批喙索里尼的作品。”耀尾冷静的回答到：“也确实让一些学生讨论过。”\n“胡闹！喙索里尼背叛共和，向王国政府献媚打击进步者，我早就谴责过他。”克梅斯凯将手中的小册子扔到桌上：“这里头写的也全是混淆视听颠倒是非的歪理，告诉我，耀尾校长，你打算让我们革命军鹫从这个疯子的胡言乱语里学到什么道理？还是说你已经迫不及待打算背叛革命去卡廷加入黑翼军了？”\n“我对共和事业绝对忠诚，绝不会背叛元帅！”面对克梅斯凯的训斥，耀尾做出慷慨的姿态：“没有及时报告让元帅产生误解是我作为校长的失职，但对于这件事现在我立刻向您解释，希望时间还不算晚。”\n克梅斯凯点了点头，示意耀尾开口。\n“学校进这批书存粹是采取批判性了解的态度，让学员来了解狮鹫尼亚最近的政治动向。为了防止产生危险，借阅学员的名单学校都会保存登记，如果元帅您需要，我立刻让图书馆呈到您办公室来。”耀尾恭敬的解释：“我考虑到翼巴蒂毕竟相隔甚远，我们对法西斯运动的了解也多少有些失真，引进这些书籍也是为了更好的批判喙索里尼，否则，我们对着空气打靶，可能会起反效果让一些不明就里的学员对喙索里尼产生好感。”\n“这样到说得过去。”克梅斯凯对耀尾的回答还算满意：“让军校政治部也读一读这些书，找个机会开个批判大会把书里头的理论一条条说清楚，澄清我们的立场，我不想还有迷糊的家伙来我这里说喙素里尼是我们的什么同志。”\n“属下明白，您要不要也来做演讲？”\n“那就不必了，我对你还是放心的。”克梅斯凯挥了挥爪，但耀尾依然立正站在办公室里。\n“你还有话要说？”\n“元帅，关于政治部我必须向您报告另一件事。”耀尾开口到：“最近政治部教师上课，所用的材料几乎全是社会主义书籍，所教授的内容全是马科斯和嘶大林的理论，政治课内容几乎不提三民主义。据他们说，是因为三民主义过于驳杂不适合作为上课的教材。”\n耀尾看着克梅斯凯沉思片刻，他的两爪敲击着桌面，思考后做出了决定。\n“这样吧，批判会就由你组织，待会让政治部主任来这里见我。”"
#FAT_start.10101.1: "耀尾应该摆正自己的位置"
#FAT_start.10102.t: "国民共和党社会改造大同盟"
#FAT_start.10102.d: "在社会主义者纷纷加入国民共和党后，除镰爪巴枯宁等少数领袖外，大部分社会主义者均处于共和党中下层，他们以最大热情投入革命工作，发动群众对落后的漫云社会发起进攻。新入党的青年狮鹫大部分受此影响，立场更为左倾，他们形成了诸多社会服务团体，积极开展社会运动。\n\n艾勒斯特当选为漫云新市长后，他以漫云市团体为核心整合了这些松散的青年组织成立了社会改造大同盟。其成员多半认为社会主义与三民主义是同一回事，强调三民主义的左翼色彩，很少关心社会主义与三民主义的差异。\n\n领导人：艾勒斯特"
#FAT_start.10103.t: "橙红三色旗团"
#FAT_start.10103.d: "瑰翼叛乱极大触动了翔日，他没有想过曾经与自己生死与共的革命同志居然会公开背叛革命，共和党颓丧的现状也让他无比担忧，在一些流亡者俱乐部的基础上，翔日成立了橙红三色旗团，通过组织理论学习，讨论会等方式提高党员塑造，强化革命信念。\n\n在共和党改组后，三色旗团依然以俱乐部组织的方式留存下来，其成员大多为共和党老党员与不同时期北上漫云的流亡者。三色旗团秉持正统的共和主义观点，强调对三民主义的信仰，赞扬谐律主义，并宣誓忠于革命与共和国。\n\n对翔日来说，三色旗团是日益纷杂的共和党最后的底线，当类似瑰翼叛乱的危机再一次出现时，三色旗团能够发挥作用，联络共和党最忠实的成员保卫克梅斯凯与共和国。"
#FAT_start.10104.t: "国民共和党中央政治委员会"
#FAT_start.10104.d: "国民共和党包罗万象，数次失败的革命，三十年来狮鹫尼亚大陆的种种政治运动所造成的影响均可在党内显现。中央政治委员会由二十五席组成，每年改选三分之一，持不同政见的成员对革命与共和国的态度各不相同，但都在克梅斯凯的领导下对共和国的各类事务进行讨论决策，其下属各委员会负责指导共和国各机构，贯彻指令协调关系。\n\n领导人：克梅斯凯"

