FAT_FP.11.t:0"总统权力讨论"
FAT_FP.11.d:0"总统阁下？\n克梅斯凯时常觉得压在自己肩上的担子重过了头，虽然他仍然满腔热忱，激情澎湃，但也确实年近半百了，他不是天角，没有那样长的寿命与精力。共和党内的暗潮时时烦扰着他，陪他打下江山的老战友们对他每一个放弃权力的构想都极度敏感，但军队以外的声音却呼吁着要他回归共和本意。\n心口终于放松下来，施纳贝尔.翔日担忧的独眼目光让克梅斯凯定了定神：“我没事。你说到哪里了？”\n他把目光移回手中的文件，“是，社会共和改革的阻力远比艾斯特勒设想的大，虽然最关键的失落之门和漫云城都支持改革，但这次不止是金羽和埃里希，连镰爪都表示了不满。”\n镰爪...克梅斯凯想起来哪位与他关系不甚融洽的老狮鹫，但他和他那群共产主义者一贯是支持艾斯特勒的才对...哦，或许因为艾斯特勒的改革与他所构想的公社模式还是大相径庭。从共和改革中看到了被夺取生态位的危险？\n就像自己一样。\n曜尾再三劝告，共和理想离不开一个强有力的掌舵者。自己总有一日会卸下总统的职位，届时，倘若共产主义或更糟——法西斯主义者成为了大会中的主导，总统却没有执炬之能，共和国，岂不是毁于一旦么？或许，总统这个职位所代表的权力可以再强硬一点，哪怕不冠他克梅斯凯的名，也足以保护共和。\n翔日看他低头沉思，也不再追问，留下文件便走出办公室。只留他一人坐在总统椅上，思索着这个名号究竟应该意味着什么，他握有的头衔已经如此之多，大元帅，总统，总裁，在党治之下，似乎总统这个职务可以适当减少权威。"
FAT_FP.11.a:0"总统仅仅是共和国的象征"
FAT_FP.11.b:0"总统是共和党当仁不让的中心"

FAT_FP.12.t:0"训政争论"
FAT_FP.12.d:0"   狮鹫共和国特别会议记录\n克梅斯凯（敲击桌面）：今晚召集的会议旨在确定胜利之后的宪政实施时间，诸位畅所欲言。\n翔日：诸位，没有充分准备，共和便是空中楼阁。我主张应先完成国民教育，完善市镇选举，确保民众觉悟提高再行宪政。诸位，鹫智未开，何谈共和？欲实行共和，党必须保留最终审查权，这是对革命负责！\n艾斯德勒：可以我之见，此言有些过于悲观了。在我担任市长的漫云城内，公民皆有参与议会的资质，同时他们也热烈期望宪政之实施，总有人到市政府请愿，希望我们能结束训政。因此我个人提议：应当明确宪政的实施时间，最好...为解放帝国后五年之内。\n翔日：（摇头）先完成民主教育的地区，固然可以先以省议会的方式实行准备宪政，比方说被共和国治理了30年的漫云，而南方的那些乡村呢？在那里，帝国的簇拥仍在活动，民众一不知民主二不知共和，只跟随帝国教士的宣传，如此选举只会让反动势力借议会卷土重来，到时候共和又要沦丧于瑰翼这等野心家之爪。\n（两方的言论引起了激烈的讨论）\n书记翼展：总统，布鲁姆同志称受南方民众心愿所托，特致函表明立场。\n克梅斯凯：念出来\n翼展：致中央委员会：今南方民智已开，对宪政深切盼望，争相请愿，要求战胜后制宪、大选议程从速，某不肯罔顾民意，特作此信。如若中央难以决策，恐民心尽失，运动重创，望定以明确时限，早日行宪以安民众。\n（长时间的沉默）\n金羽:他不久前才以南方民智未开为由抱怨运动无力向中央讨要经费，信中的话多半有夸大之嫌\n镰爪:但南方革命浪潮涌起也是事实，布鲁姆的信即便有所夸张也不是空穴来风\n克梅斯凯：都说完了？那我补充两点：第一，宪政必须保障共和国永续；第二，以结束训政的条件而言，只有彻底击败大陆上的分裂政权，共和党的使命才算完成，这时才有余地实行宪政\n耀尾：（点头）我赞同元帅的意见，即便击败帝国也不能说宪政条件成熟……\n克梅斯凯：这不过是属于我个鹫的想法，而且弊端明显，因此不会作为决议表决\n克梅斯凯：大家如没有补充意见，那我将宣布会议结束，进入投票环节，我将作为主持鹫主持方案投票。\n（无鹫反对，进入投票议程）\n最终，经过大会讨论与决议表决，会议通过决议：\n一、宪政为共和国必要之政策，共和国应该在彻底解放旧帝国后，开展制宪运动。\n二、制宪运动时间…"
FAT_FP.12.a:0"应于解放狮鹫帝国五年内"
FAT_FP.12.b:0"胜利后由共和党视时而定"

FAT_FP.13.t:0 "克梅斯凯就小马内战发表演讲"
FAT_FP.13.d:0 "悲惨的消息已经得到了证实，小马利亚已经陷入了战火，不是因为外敌，而是由于内患。正如我多次强调，小马将民主与谐律的希望寄托在几个永生的公主身上，希望公主们永远不会站在谐律的对立面，这样软弱的心态实际上不过是对开明专制的幻想，迟早会使小马们尝到恶果。而今这已经成为了现实，这是每一个对政治有基本认识的狮鹫都会做出的推理，也是我们狮鹫种族千年历史带来的教训，永生的公主确实比格罗弗家族的统治更具有迷惑性，所以直到今天才让小马们看到君主制度的灾难。在这样的时刻，除了对小马的悲剧报以同情，我们同样不应该丧失对自身事业的信心。谐律的家园发生的悲剧无疑让很多公民对共和与民主失望。但我们同样不应该忘记，促使小马形成谐律的并非公主的法力或是强权，对谐律与民主的热爱是根植在整个小马社会，存在于每一匹小马的心中。民众会看清公主制度的假面，经历了教训，建立了辉煌的文明，诞生了谐律的光荣的小马国民将会意识到自身的错误，摈弃幻想战胜敌人，建立由民众决定一切的制度。而万千鹫民支持的狮鹫共和国也会战胜我们的君主，让共和之光遍布狮鹫尼亚，到那时，两个解放了的大陆将携爪同行。正如我一直所说，谐律最终会取胜，民主最终会取胜。"
FAT_FP.13.a:0 "民众终将胜利"

FAT_FP.14.t:0 "克梅斯凯就暗月帝国获得胜利发表演讲"
FAT_FP.14.d:0 "小马利亚因何走到今天这一步？我要说，是君主制的盲目导致了一切，无论说的多么天花乱坠，君主制度实际上只有一个作用，那就是让民众放弃思考，去心甘情愿跪倒在某一个统治者之下，无论是何种君主制度都只会阻塞国民的意识，让他们忽视近在咫尺却生死攸关的问题。让我们看看小马吧，是什么给了梦魇之月卷土重来的机会？会有声音告诉我们这是来自某种荒诞不经的心理阴暗面失控或者是塞雷斯蒂娅公主的疏忽。但真正导致内战的是什么？是什么组成了梦魇之月的军队？是所有小马数千年来的忽视，他们将一切交给高高在上的君主，忽视了自己的同胞，面对危险他们不加思考便相信了公主们的说辞，最终导致了今天的结果，谐律不是被一个突如其来的暴君摧毁，而是被冷漠，短视，无动于衷所摧毁。无论梦魇之月雇佣多少喉舌鼓吹所谓的善政，我们真正的共和派不会为之迷惑。共和国欢迎所有为抵抗暴政而奋斗的小马，当他们在绝望中看向海的另一边，我们一直会在这里向他们张开怀抱。"
FAT_FP.14.a:0 "不要放弃战斗"

FAT_FP.15.t:0 "克梅斯凯就伟大战争发表演讲"
FAT_FP.15.d:0 "在我们同邪恶的狮鹫帝国进行殊死战斗时，另一个大陆上的独裁者，格罗弗家族的盟友邪茧也向谐律的家园伸出魔爪。毫无疑问的，整个世界已经日益形成了两个阵营，一个是独裁者们组成的霸权力量，他们是三个大陆大大小小的独裁者和狂徒，打着种种旗号力主将每一个生灵变成他们铁蹄下的奴隶。而另一边则是所有与暴政进行战斗的爱好和平与民主的族群，共和国将始终站在解放力量的一边，尽管小马曾经对我们报以冷眼，但是现在，我们的斗争就是他们的斗争，小马，狮鹫还有所有为正义事业而战的族群将联合起来，以一切力量粉碎和制止敌军的势力和意图，共和国将有幸站在民主与自由的一边，用生命和鲜血捍卫我们所珍视的原则，在光荣的战争中摧毁所有暴君的锁链，一个自由的世界将取代混乱和暴政，解放的日子必将到来！"
FAT_FP.15.a:0 "共赴胜利"

FAT_FP.16.t:0 "克梅斯凯评论狮鹫帝国摄政嘉比蕾拉"
FAT_FP.16.d:0 "嘉比蕾拉匆匆忙忙丢下她的领地前往狮鹫海姆当摄政，她为了什么呢？真是如她所说只是一个姑姑对侄儿再合理不过的关切吗？她真正关切当然不是坐在王座上的那个小朋友，自己兄弟的死亡她可以说是最开心不过，不然她何以成为帝国的掌控者？当施莓它的嘉比蕾拉看着王座上的侄儿，她想的最多的恐怕是该用什么阴谋手段才能让自己戴上那凝聚无数鲜血的皇冠。她真正迫不及待的想要照看的，是她以及她代表的一整个贵族集团的利益，贵族们抵着嘉比蕾拉的背，摇旗呐喊着让她拼命拦住时代的车轮，让一切保持数百年前的相貌，亲情不过是弥天大谎，贪欲才是实在的诉求。很快我们就会看到贵族们为了争权夺利权力在格罗弗家族的小家伙面前表演的一幕幕滑稽戏，演出者包括骄横的贵族，虚伪的教士，利欲熏心的包税人与伺机而动的野心家，就让我们冷笑着看完封建制度的最后一出戏剧，让他们谢幕的会是共和大军的枪炮子弹，我们会在漫云磨好利剑，审判即将降临。"
FAT_FP.16.a:0 "而你们时日无多"

FAT_FP.17.t:0"签署戡乱动员令"
FAT_FP.17.d:0"昔日的漫云公国随着共和国的诞生迎来了千奇百怪的面孔，除却狮鹫尼亚各地的革命者来投，北方港口还承载着海上到来的革命者们，就连豪克兰方向都还时不时会有来访。然而不是每一个革命者内心的火焰都能忍耐北国的冬风，来来去去的过客中有些选择了离开，更有甚者选择了出卖他们的共和理想。\n当下帝国与我们再度剑拔弩张，紧急管制有了更显著的必要性。不仅要确保国家稳定，还必须防止出现机密情报泄露的情况。为此，中央政治委员会多数通过了《戡乱动员法令》，允许中央权力临时在任意地区实施战时管制，随时召集当地兵源入伍，收用国防之必要资产，以及贯彻共和最要紧一事——坚决反对帝制。"
FAT_FP.17.a:0"为共和理想之远大未来，此乃必要之举。"

FAT_FP.18.t:0"执委会种族问题会议"
FAT_FP.18.d:0"镰爪回归之时曾提出过关于北方部落的问题，他认为这些小马身上原始的野性难以驯化，不能直接加入共和国和现代化的社会框架，当时他给出的方案是在攻下北方部落后逐步进行教化，但彼时的共和国还在为了争分夺秒进入现代化社会而焦头烂额。一晃又是近十年，当各大陆的革命者们齐聚于共和国时，种族问题自然就又一次被提上了会议，三民主义中未有明确标定关于种族的争论，因此在这场会议上执行委员会只达成了一个初步共识：无论种族，只要怀有共和理想的生物加入进共和国来，就能够成为共和国公民。\n但在具体落实中克梅斯凯却又就部落问题与曜尾发生了辩论，克梅斯凯本打算按照镰爪那套教导方案教化北方小马；曜尾却代表同志会提出了别的看法，整合小马费时费力，与帝国的战争迫在眉睫，让原始小马们进入国民共和党会极大降低效率。应当建立他们的自治政权，共和国仅仅进行最低限度的指导即可。他还提出，对那些非共和革命的其他种族占多数区也应当用这样的方式进行过渡管理，一直到共和革命彻底成功为止。\n眼见二鹫争执不下，艾斯特勒便掏出了左翼的第三方案，其实天际与北方部落在长期相处中关系已有所松动，共产党已开始用现代化的利益与三民主义思想去分化招揽各部落，逐步将北方部落吸收进共和国的理想蓝图中。如果共和国愿意分出足够的资源来支持这一方案，就可能迅速和平解决北方问题，避免大规模的军事调动。"
FAT_FP.18.a:0"克梅斯凯依靠威严强行说服了执委会采取基础布置，维持原定方针。"
FAT_FP.18.b:0"曜尾的造势加上同志会的暗桩，成功让执委会同意了执行自治方案。"
FAT_FP.18.c:0"如里卡德所想，这场争执让一些党员心怀忌惮，足够通过第三方案。"

FAT_FP.20.t:0"有名无实的选举"
FAT_FP.20.d:0"又是一度选举季节。\n白日花觉得这是件很新鲜的事情，在小马利亚，大部分投票最多也就是选一选餐厅的地步，但在共和国，小马和狮鹫们居然要用自己的选票挑选出统治者！\n她对革命抱有不切实际的热情，对嘶大林格勒亦然，但父母不允许她前往那里。作为小马利亚出身的乐天派新生代革命者，她从未参与过武装斗争，仅仅是在学校里听说了共和国的故事便不远万里来到这里，她知道，作为一位外来者，她一落地就应该开始申请加入共和党，但在回信前夕，她迎来了马生的第一次选举，被带进投票处，从地上捡起了另一份被来来去去的爪子踩脏的选票。\n然后她看到了什么呢，这个选票上只有一个名字，国民共和党候选者—威廉.利喙。只在这个黑字下面有一条横线，让投票者可以写上其他的选项，但是白日花思来想去，却不知道应该写上谁，总不能写她下榻旅馆的老板吧？最终，她也只能在共和党候选者这里画上勾，投票站内的士兵似乎也并不在意这一神圣的仪式，只是随便看了一眼选票就投到了面前纸糊的投票箱中。\n在漫云闲逛两个月后，灰头土脸的白日花终于乘上了返回小马利亚的轮渡，心中比来时永远的少了一些东西。"
FAT_FP.20.a:0"那位狮鹫甚至不知道自己有一张票。"

FAT_FP_19_war:0 "三十天后对北方部落宣战"

FAT_FP.21.t:0"焕然一新"
FAT_FP.21.d:0"共和国的政体最初以君主制的独裁为反例将权力分为了立法、行政、司法三权，并分别设立不同领导的立法院、行政院与司法院。仅此一点，共和便迥异于君主制的独裁，但这破天荒的制度在运作中却不能一下脱离过往，克梅斯凯声望过高，他同时提出另外把两项重要工作摘取出来，一个是监督政府、另一个则是录用人才，待三院职权分作五院。五院纠缠不清，最后还由几个权力最大者拍板以至于一切实际举措仍要暗中看总统脸色。一直以来，由于局势的复杂，克梅斯凯对自己的隐形专权只能视而不见，而问题大部分解决后，他便马上召集执委会开始着手改造政府架构。\n清晰界定工作分属何部。通过重组的部门之间有各自的归属，避免出现高层之间暗地角力争夺部门职能的情况。\n在新制度下，权责分明的政府运行飞快提速，新部长们努力避免陷入权斗泥潭重蹈覆辙，共和政府的一切都在向好发展，国民委员会也有了更多余力进一步针对各院进行手术刀改动。"
FAT_FP.21.a:0"共和新气象。"

FAT_FP.22.t:0"最高法院提名"
FAT_FP.22.d:0"最高法院的争夺似乎一直处于风暴中心，克梅斯凯与最高法院之间虽然没有明说，但其中的龃龉不难看出。一直以来，从赫兹兰抵达的老同志们把持着这个职位，但随着时间的推移，老同志们对共和国的一系列新变化越来越抵触，只要克梅斯凯不亲自表明态度，那么老同志们就敢裁定改革非法，而为了尊重司法独立，克梅斯凯不能总是出面干预，最终的结果就是，他选择以停止提名法官作为抗议，随着部分大法官的离世，最高法院已经达不到开会数目，拖延的新法官提名也不得不开始，克梅斯凯不禁思考，是按照过往惯例提名老同志以缓和日益分裂的共和党，还是让那些在革命实践中崭露头角的新鹫来提供一些新生代的动力。"
FAT_FP.22.a:0"老同志们值得继续担任这份工作。"
FAT_FP.22.b:0"革命最需要的是新鲜血液。"

FAT_FP.23.t:0"曜尾来访"
FAT_FP.23.d:0"他虽然极力作出谦恭表情，仍无法克制得意姿态。这也难怪，毕竟这一次的大法官提名中，好几位他的盟友成功通过了选举成为了大法官，这意味着接下来本就保守的法院将会进一步成为他的盟友，在党内争夺中拥有关键性的优势。\n推开门，艾斯德勒与他对上了眼，脸上几乎要露出无法克制的厌恶表情，但片刻后便又消失无踪。连带着他自己也低着头避免与这位趾高气昂的胜利者视线接触，连克梅斯凯去哪了都不说就匆匆错身离开这个象征着权力的房间。\n那又有什么关系呢？他得意洋洋地走进办公室。元帅还没有彻底忘记胜利需要的是铁与血，这让他久违地回忆起了赫兹兰起义中那个天才的战略家。"
FAT_FP.23.a:0"曜尾已经很久没能怀着这样的心情等待克梅斯凯了。"

FAT_FP.24.t:0"法院的助力"
FAT_FP.24.d:0"作为共和国的二把手，金羽虽然会同最高法院对接，却鲜少与最高法院合作。\n这是他的专业领域，但显然不是那些法官的。在最需要现代化的法律领域里，他只看到这群鹫面兽心的家伙在庄重的法庭上喋喋不休战时的严刑峻法，迫害异见党派政客；欲盖弥彰地阻塞改革，逼迫修改法案拖延革命的时间。\n现在不一样了，原本被保守派把持的法院第一次有了新的面孔，那些在基层法院工作过的新一代漫云狮鹫。\n看着新面孔们接过烂摊子时那略显慌乱的模样，金羽觉得光改变最高法院并不能从上到下完全理顺整个国家法律执行中存在的混乱，他性格中注定要劳碌的那一部分开始隐隐作祟。"
FAT_FP.24.a:0"这位工作娴熟的外援让最高法院喜出望外。"

FAT_FP.25.t:0"履行职务"
FAT_FP.25.d:0"越过程序就代表着高效，在科洛堡工作了五年，抹拉总结出这样的经验。共和国的审核程序就是一滩巨大的泥潭，任何陷入其中的加急文件都会缓慢沉入最后消失的无影无踪，为此，市长授权她这个副市长自行越级处理了大部分工作，然而有一天，监察院督察们就这样毫无预兆地找上了她，以“政治专制”的理由将她收押监察院调查。\n当抹拉了解到是市长为了躲避调查而将越权工作都推到她头上时，她自然是崩溃了，一直以来自己兢兢业业地为这座城市工作，到最后却换得前途尽毁。她一股脑地倾泻着自己的辛劳，咒骂着共和党中央政策，还爆出了许多市长和自己曾利用职权做过的腌臜事。但督察们经过商议，却取消了对抹拉的弹劾，在他们看来，比起眼前这位做实事的鹫，科洛堡市长肩负领导权却推卸责任，主责应当在此鹫。\n在抹拉意识到自己洗脱了“专制”之名后，她对这些办事干练的督察印象大为改观，他们摆脱了传统的官僚习气，也不结党营私，甚至可以说，他们就是抹拉曾经向往成为的那种狮鹫。\n监察院撤销了对抹拉的指控，甚至还体贴地封存了她在审讯期间对党的胡言乱语。但她还是因为贪污受贿被立案调查，当然，相比起她的老上司，这个结果已可以说是北风神的恩赐了。\n她的忏悔来得或许迟了些，总是要好过不来的。"
FAT_FP.25.a:0"以共和之名，我们将坚守公正。"

FAT_FP.26.t:0"制宪定稿"
FAT_FP.26.d:0"共和政权一直处于紧急状态中，争论了那么多年，实践了那么多年，也是时候该有一份真正的共和国宪法了。\n制宪委员会长久以来的调查研究已经只差临门一脚，在党员大会上，当克梅斯凯提出对宪法草案进行表决时，会场的气场都发生了变化——三十年，整整三十年！无数狮鹫牺牲的三十年，为的就是这份宪法，共和之梦凝练于此，这是一份真正要使整个世界天翻地覆的方案！克梅斯凯清楚地看到前排，有不少同志是以颤抖的爪子接过宪法的复印件的，他们脸上的庄重绝无半分虚假。\n自978革命以来，共和之火燃起又暗弱，似乎是在不断重复中挣扎，它也曾在这片大陆上的许多角落诞生，却从未有过彻底的实行。直到今日，那共和理想所真正拿在手中的只有这几份纸，代表了他们对狮鹫尼亚未来全部最美好的遐思。\n“第一条  狮鹫尼亚共和国基于三民主义，为民有民治民享之民主共和国...”\n克梅斯凯缓缓呼吸了一下，他的心口似乎又有些发痛。这份文件从制宪委员会动笔到现在他已经读过想过提过无数次，各个派系的领导鹫也大概了解了其中内容，但克梅斯凯还是知道他们就是没办法把心拧成一股绳。鹫才济济的共和国政坛隐藏在繁荣表面下的汹涌暗潮将在草案通过的这几天进入最激烈的状态，每一个派系都会竭力宣传他们的解释以争取对草案的控制地位，中央委员会和民革会的力量虽大，但其中不少需要依靠军队，真正拥有政治喇叭的反而是深入基层的社会主义者，对草案的释经权争夺将一举扭转派系间的实力对比，不过。此时此刻，他们等待着克梅斯凯的下一句话，思考究竟是哪一份提案成为了最终的选择。\n在这值得欢呼雀跃的时刻，克梅斯凯只有再一次感到深刻的疲惫。衰老带来的多虑让他不由得又思考起来，对这群思想各不相同的狮鹫们来说，共和最终究竟是怎样的一副面孔呢。"
