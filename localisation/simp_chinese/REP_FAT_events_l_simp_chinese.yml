FAT_FP.36.t:0"银行业密会"
FAT_FP.36.d:0"狮鹫尼亚银行业的中心佛罗伟纳市，数家大银行的代表齐聚一堂，他们正在谈论着这一不同寻常的代表，来自漫云城的共和党专员。这显然是个稀罕事，毕竟自从共和党改组以来，他们这些银行家全部被拒之门外，共和党竟然主动寻求他们的支持，实在是罕见。\n\n“估计共和党快破产了。”有位大亨窃窃私语到：“他们看来是打算找我们救急……”\n“那你打算帮他们？这帮家伙自作自受我看挺不错。”\n“有生意做为什么不做，要是共和党有诚意我也不是不能给他们放贷。”\n会议开始，专员先大概讲述了革命的目标与理想，同时有意无意地透露共和党党内并非只有反对资本主义的社会主义派，还有像自己那样“识时务”的渴望合作的鹫。那几个商界大亨自然听懂了这层意思，不动声色地让他继续，但是他们都很明白，这些不过是能够让会议进行下去的前提，共和党还没有表露真正的来意。\n“现在诸位应该明白，帝国已经油尽灯枯，消灭他们实在是不会废什么力气，唯一的问题是消灭帝国后会如何。”专员抛出了重磅炸弹：“我，还有我们共和党内的同志们一致认为，现在的共和党过于左倾以至于疏远了诸位这样的真正的国家支柱，因此战胜帝国的同时，我们同样必须对那些社会主义者作战，而这就需要各位提供经济支持。”\n“你的意思是，我们给钱帮助你打击社会主义者？我们有什么好处？”\n“我们拥有军队，只不过军饷物资还掣肘与他们。至于好处，如果诸位能够提供帮助，你们将会拥有一个比现在混乱的狮鹫帝国更为广阔的市场，新政府将会采取一切措施全力支持各位的生意，不让任何鹫危害这一点。”\n那几个大亨低语着交流了几句，“我可以先投资……这个数，姑且算是试一试。希望贵国不要让我失望。”一名阿奎莱亚来的富商在纸上写了个数字，展示给了共和国的专员。\n开了这个头，剩下的几个大亨也有条不紊地提出了一些投资和合作的想法。作为老练的商鹫，他们喜怒不形于色，但就目前他们的态度来说，这次会议不可不谓成功。\n那个专员就没那么能矜持得住了，他看着一个个自己一辈子没见过的数字在眼前飞来飞去，很难掩饰心里的狂喜。\n曜尾阁下……和克梅斯凯总统一定会为此高兴的。"
FAT_FP.36.a:0"市场越开放……"
yinghangmihui_tt:0 "银行网络作为政治势力增加到政治系统中"

FAT_FP.37.t:0"工会模式"
FAT_FP.37.d:0"随着共和国工业化的推进，越来越多的狮鹫定居在了各大城市里。乌烟瘴气的工厂和一眼望不到头的荒原可谓是两个极端，对于我们的革命祖国来说，让工鹫淹沉在漆黑的烟尘中是绝对不可接受的，正是因为他们的工作危险而辛苦，才应该尽可能保障他们的生活。但是，共和国认为嘶大林格勒式的阶级斗争过于具有破坏性，需找到一种更温和的解决方案，鼓励工鹫参与工会活动就是一种不错的方法。\n通过工会，工鹫们可以更有效地团结起来对抗不公平的待遇，党内成员也会定期发起宣传活动，毕竟斗争的第一步总是要先意识到自己处于可悲的境地。在共和党的大力支持下，各地的工会运动如火如荼地进行着。但当下的情况实在是有些过火了，几乎每天漫云街头都有工会宣布罢工，搞得金羽桌面上几乎堆满了企业家的抗议信，要是继续这样下去，恐怕工鹫利益是满足了，革命未来就危险了。\n为了不让社会舆论批评共和党站在财主与压迫者一边，金羽提出了一个迂回方案——按职业建立分条工会，这样就能通过党对国有企业工鹫的控制限制工会过火的行为，将领导层中加入更多管理者与工程师，这样的工会模式不容易引起工鹫串联，其罢工更容易协调。而反对者同样强调当下的工会模式才能更好的保护大多数工鹫，许多服务业与临时工只有现在的工会模式下才能够获得权利。\n最终共和党中央决定"
FAT_FP.37.a:0"采纳金羽决议，建立职业工会"
FAT_FP.37.b:0"否决，现在的工会模式不需要修改"
