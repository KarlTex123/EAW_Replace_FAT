FAT_FP.61.t:0"漫云喊话"
FAT_FP.61.d:0"自由的同胞们，帝国已行将就木。暴君的统治下的狮鹫尼亚，已经进入到最黑暗的时期，你们没有唱歌的自由，也没有听歌的自由…” 夏尔扛着枪，吃着后方送来的罐头，漫不经心地听着对面共和国边界传来的讲话。每天下午四点，共和国的讲话就会准时响起，有时候比他们的午饭还准时。 “同胞们，迈向自由吧！让我们协同创造一个新的世界…”\n夏尔很喜欢听广播中的那位雌鹫讲话。“她似乎是共和国的歌星，叫什么来着？”夏尔想着，她的声音总让夏尔想起少年时期邻居家的那个雌鹫，那真是一段美好的时光，要不是动乱，兴许他们能相处到现在。 \n当夏尔正沉浸在在思考时，督战员的大嗓门粗暴的打断了他的思路：“敌营广播！敌营广播！捂住耳朵！不要收听！” 夏尔感到有点厌倦了，但他还是顺从地和战壕里的其他士兵一样，用双爪捂住了耳朵。这只是个形式，那个声音依旧无孔不入地钻进脑海：“在邪恶的帝国独裁者的统治下，你们一无所有。吃不饱，穿不暖。既然如此，为什么不加入我们，为自由奋斗呢？来吧，狮鹫同胞们，让我们一起创造新世界！” \n督战员继续沿着战壕巡视，目光扫过每一个狮鹫，确保每个人都做出了“拒绝聆听”的姿态。夏尔用眼角的余光能看到那双有些破旧的皮靴从自己面前走过。 “创造新世界…” 这个词轻轻搔刮着夏尔的心。 “共和国那边，是否真的像广播里说的那样，有歌声，有阳光，有……自由？”他想着，带着几分怀疑。可那位美妙且熟悉的女声描绘的图景，至少比眼前这片该死的、只有硝烟气息的战壕要迷人得多。 \n广播还在持续，而督战员已经转到了下一个哨位。士兵们像得到无声指令般，纷纷放下了爪子，战壕里恢复了之前的沉寂。夏尔慢慢抬起头，望向对面共和国阵地的方向。他想，此刻，那个说话像记忆中邻居雌鹫的歌星，是否也正看着这他这一边？ 他默默吃完最后一口罐头，将空罐子随爪扔在战壕角落。然后，他拉动枪栓，检查了一下武器，将身子更紧地贴向工事，继续他漫长而无望的守望。"
FAT_FP.61.a:0"第二天，队伍的点名少了一个人"

FAT_FP.62.t:0"送别"
FAT_FP.62.d:0"共和国码头，海浪轻轻拍打着海岸，一艘不算大的轮船随着海浪上下浮动。 几个带着钢盔的士兵将头探出船舷，在码头上，共和国总统克梅斯凯正握着韦朗尼的爪。 “预祝你此行顺利。”克梅斯凯拥抱了自己的老友，随后放下翅膀:“你已经能够回家了。” “你也很快就会有这么一天。”韦朗尼微笑着，用他那包含热情的双眼与克梅斯凯对视：“我相信，阿奎莱亚的革命必将成功！到时候两个共和国从南北夹击，民主共和一定能在全大陆建立。” 这番话像一簇火苗，点燃了克梅斯凯内心的激情。他挺直了脊背，看向北方大海灰色的天空，神情变得坚定：“从第一次革命到现在已经30年了，这么多年过去，我们终于有了第二次机会，大陆已经分裂了这么多年，狮鹫同胞正在专制领主的压迫下沉沦……我们不能再等了！” 说到这，韦朗尼坚定的点了点头，随后说道：“对！再干一次，再来一次革命！吸取上次的教训，我们一定能干的更好，之前的革命因为分裂让叛徒有了可乘之机，这次我们不会犯同样的错误。” “正是要有这种精神！韦朗尼同志，祝你成功！”克梅斯凯回应道：“革命一定会胜利。” “是，一定会胜利。”\n韦朗尼转身走上轮船，在与自己一同返乡的革命者簇拥下，最后向克梅斯凯举爪致意。 克梅斯凯抬爪回礼，注视着轮船。汽笛鸣响，船载着韦朗尼以及100多位革命者缓缓驶离了码头，越行越远，承载着革命希望的船最终化为了海平线上的一个小点。"
FAT_FP.62.a:0"会成功的…一定会"

FAT_FP.63.t:0 "安江社民党的真面目"
FAT_FP.63.d:0 "当同僚们一个接一个地落座后，海拉却还没有出现在场，这令在座者不免有些诧异，明明是社会民主党的紧急秘密会议，党魁却没有到场，反而是共和党的布鲁姆出现在此。鹫们纷纷看向社民党的二把手，海拉的副手纳夫罗，纳夫罗也正面色凝重地看向众鹫，接下来，那个共和党鹫投下了一颗重磅炸弹——海拉.艾希贝格的真实身份是黑爪的领导人。\n纳夫罗面色铁青地制住了险些爆发的哗然，勾了勾爪子示意坐在鹫群中的伯理出手，伯理站出来绘声绘色地描述起了黑爪对他和许多年轻贵族的引诱，而他假意服从实际内心无比恐慌，又害怕纳夫罗也是黑爪，于是向共和党的莱昂求助，纳夫罗等着他说完，这才补充幸而在此事闹大之前，莱昂和纳夫罗彼此交了底。而现如今，海拉和不在场的狮鹫全部不可信任，黑爪的埋伏也不知身在何方，一旦事发无法控制局面。因此当下他们必须摈弃政治斗争与共和党团结起来，绕开海拉的羽翼建立一个私下的秘密核心圈来慢慢架空她，当然，共和党有权参与其中到这个秘密政府里。\n倘若没有布鲁姆，他们真的就连死都不知道怎么死法。这份感激让他们选择性忽略了伯理的一面之词是否可靠，而共和国安插在帝国之内的地下传奇施季里茨的真相便也继续掩埋。"
FAT_FP.63.a:0 "这群共和鹫在大敌面前总算能团结一致。"

FAT_FP.64.t:0"布鲁姆宣誓服从中央"
FAT_FP.64.d:0"在这远离帝国的革命胜利之后，莱昂借助共和派的势力与他根深蒂固的关系网紧紧掌控住了这片边缘地区的种种不安定因素，令得安江余下的黑白两路以及周遭的帝国与黑空等渗透皆不能再渗入权力圈分毫，而我们的前期工作在此事上取得了更大的回报——这只复杂的狮鹫放下身段，向千里之外的共和国投来了绝对忠诚的誓言，承诺在共和旗帜插回到狮鹫海姆之后，我们将得到一个堪称共和模范的安江地区。"
FAT_FP.64.a:0"帝国的大后方又升起了一面三色旗。"

FAT_FP.65.t:0"布鲁姆抵达漫云城"
FAT_FP.65.d:0"随着共和党上位的失败，从共和国前来的指导层为莱昂指明了新的道路，在他处理完毕手头的党务工作后，许多职权被交接给了其他共和派，布鲁姆旋即便从安江森林的泥潭中抽身，在共和派遍布帝国的地下联络网所提供的情报协助下，他将如同三十年前的长征那样暗中穿过整个帝国，前往全狮鹫尼亚的共和之心。"
FAT_FP.65.a:0"天际城迎来了又一位共和理想的革命者。"

FAT_FP.67.t:0"友谊的插曲（上）"
FAT_FP.67.d:0"（一日，某处海边沙滩上酒吧的吧台，蔚蓝时光正与星风聊着天）\n蔚蓝时光：“当时我刚从小马利亚过来，什么都不懂，蹄下的狮鹫们大半又说的漫云方言，我只能勉强用帝国语交流几句，闹了不少笑话...”\n（而这时，微光从门口走了进来，走到吧台边朝服务员要了一杯苹果酒）\n（微光与蔚蓝时光虽然同为小马，但是她们在工作上并无太大的交集，在工作以外也同蔚蓝时光一样只是点头之交）\n（星风一边听一边笑，将星辰微光的注意力也吸引了过来）\n星辰微光：“别管漫云语叫方言，这里跟小马利亚不一样，漫云是个独立国家，漫云语也是正统狮鹫语的一个分支”\n（这时微光点的苹果酒正好送了上来，星风赶紧岔开话题）\n星风：“苹果酒还得是苹果家族酿的最好喝，我之前还在蔚蓝时光那喝过一次，在狮鹫大陆喝的苹果酒总是不对味。”\n蔚蓝时光：“确实如此，狮鹫酿的酒烈得过头了……还没有我自己酿的威士忌好喝”\n（微光大口喝下那杯苹果酒，又加了话题进来）\n星辰微光：“从帝国工业化开始，狮鹫烈酒的量产就扩大到了现在这种情况，净是一个味。闻起来就跟嘶大林格勒的铁锈一样恶心”\n（正当酒吧内的气氛逐渐凝固的时候，一个声音传来）\n？？？：“嘿嘿，几位贵客还真是支持我们漫云酒业呀，今天的消费怎么会让各位买单呢，诸位屈尊到场，我当然不能让各位贵宾自掏腰包的。”\n（她们看向声音的源头，走过来的小马正是今天举办这个社交派对的青柠慕斯，她在这几位小马中最为年轻，是共和国赫赫有名的革命实业家，凭着父亲留下的家底和对共和国的支持闻名遐迩，而跟着青柠慕斯而来的小马让星辰微光喊出了名字）"
FAT_FP.67.a:0"罗莎.克劳迪娅"

FAT_FP.68.t:0"友谊的插曲（中）"
FAT_FP.68.d:0"（皇家卫队对嘶大林格勒的镇压行动的失败始终是微光心里的一根刺，在她看来，嘶大林格勒是分裂谐律，背叛公主的行径，尽管她对姬里津的平民并非毫无同情，但她们叛离小马利亚，便是叛徒无疑，而公主和谐律的软弱让她失望）\n（但是同为小马利亚将领的蔚蓝时光却不这么想，相反，她对嘶大林格勒态度甚至偏向支持，这让她对蔚蓝时光颇为不满）\n（当她携全副身家来到共和国时，是曜尾长官慧眼识英，与此同时已在共和国站稳脚跟的罗莎正与曜尾背后的保守派利益息息相关，也因此，时有走动的二者关系要比其他几位小马更好）\n（借着各自千丝万缕的联系与青柠的破冰，四位来自小马利亚的客人互相熟络了起来）\n青柠慕斯：“几位觉得，共和国的革命与小马利亚的安稳，究竟哪样更好呢？”\n星风：“共和国就像在我的第二个家一样，在这里的生活很好。至于谐律和共和之辩，不是我一介军麟考虑的。请容在下敬您一杯，青柠慕斯小姐。”\n蔚蓝时光：“我认为共和理想与谐律是不谋而合的，在共和国的这段时光我也很开心。小马利亚的谐律停滞了太久，向新时代学习同样很重要。”\n（微光有些不安地看了一下罗莎，罗莎看了她一眼，举了举酒杯）\n青柠慕斯：“那你们二位呢？对共和和谐律又有什么看法？”\n罗莎：“我觉得谐律共和都一样，都是站在世界前沿的，而且与共和国做生意交朋友，是很愉快的的一件事。”\n罗莎：“而且小马利亚也将是共和国在谐律世界永远的老大姐”\n（说完之后罗莎便笑了笑，然后喝了一口自己杯子里的苹果酒）\n（微光的酒量不是很好，只是几杯苹果酒就让她的有些上头了）\n星辰微光：“几位倒是乐观，共和国也好，小马利亚也罢，都有个大问题，共产主义。”\n（她靠着柜台上，罗莎从后面用蹄子轻轻碰了碰她）\n罗莎：“微光小姐的意思是，共产主义的路线有它的独特性……”\n罗莎：“不过想要让不同立场的公民们要融洽相处确实是共和国的难题”\n（罗莎轻轻的笑了笑，打着圆场）\n罗莎：”但无论怎么样，小马们会因为相同的原因团结起来，而且我们大家是朋友”\n（蔚蓝时光轻轻的吁了一口气）\n蔚蓝时光了：“没错，无论怎么样，各位都不是什么阴险之辈，也不会为了一句无心之言上纲上线”\n（坐在蔚蓝时光身后的星风动了动）\n星风；“那既然如此，在下也就有话直说了”"
FAT_FP.68.a:0"（她挑了挑眉，几只小马都看向她）"

FAT_FP.69.t:0"友谊的插曲（下）"
FAT_FP.69.d:0"（作为一位被共和理想所吸引的麒麟，星风对小马利亚和谐律的感受并不是很大，最大的感受就是她在共和国的时候听到了在两位和谐元素的帮助下麒里亚结束了整整一个世纪的“沉默”）\n（再然后就是遇到了来自小马利亚的蔚蓝时光，同为军人的她们很快就熟络了起来，在这段时间里也得知了许多有关谐律的事情）\n（但她们之间最多的还是战术上的交流，星风听蔚蓝时光说，她正在给小马利亚设计一款全新的重型坦克）\n（星风斟酌了一下，一口将剩下的苹果酒喝光）\n星风；“在我看来，谐律更像一种生活方式而非政治制度，既不依赖扩张也不进行演变，而是一种朴素道德的象征。因此我不会去评价小马利亚和共和国之间的分歧，总统元帅确实是一位伟人，但即便是他不也采取了许多不被认可的爪段吗。掌权者被权力腐化的情况如此之多，哪怕天生统治小马利亚的天角兽也是一样。作为一匹普通的麒麟，在下所能做的不过是坚持本心，互相关爱。共和理想值得我为之而战，而传扬谐律的愿景更是在下的毕生追求。因此，我愿意为了谐律而战，也愿意为了共和国而战。”\n（说完，她又点了一杯苹果酒）\n（一边的微光听完之后陷入沉思，谐律是一种生活方式而非政治手段，真的是这样吗？她想着，这也是从一种新的角度来看待谐律）\n（微光点了点头，心里的某处似乎好了一些）\n青柠慕斯：“星风元帅还真是高风亮节。尽管不是每个小马和狮鹫都能像您这样理解谐律，但在下很敬佩您的想法。”\n（青柠慕斯顿了顿，将自己的杯子举了起来）\n青柠慕斯：“那么这一杯敬谐律。”\n（星风愣了愣，然后举起自己的酒杯）\n星风；“敬共和！”\n（她又转向其余几位小马）\n小马众“敬理想！”\n罗莎：“友谊万岁~”\n（四个小马和一只麒麟互相碰了碰杯，将气氛推至最高点）\n（那天青柠慕斯的派对究竟是什么时候结束的，四匹小马和麒麟已经没什么印象了。只记得她们的话题越来越深入又越来越离奇，还聊到了小马国的新公主友谊公主暮光闪闪和她那几位几次拯救坎特洛特的朋友们，直到最终她们回到了翼哈根假日酒店，七仰八叉地睡在了青柠慕斯的VIP套间里）\n（随着周末派对的结束，微光本以为她与蔚蓝时光的关系也就到此为止，但当几天后她在指挥部再次偶遇蔚蓝时光时，对方直接跑了过来握了握她的蹄子）\n蔚蓝时光：“嗨！微光！终于又见面啦。”\n（微光有些不好意思，垂着头）"
FAT_FP.69.a:0"很高兴再次见到你"

FAT_FP.70.t:0"边境冲突"
FAT_FP.70.d:0"马卡作为共和军的边境巡逻队的士兵，正跟随着他的排长巡逻与帝国的边境，马卡他们已经巡逻过十几次了。\n在今天下午，副班长马卡与他的班长万伊带着士兵们去检查边境上的铁丝网，看有没有被破坏。万伊他们看到铁丝网被剪开一个大洞，刚准备叫通讯兵汇报，万伊突然就被帝国军隐藏起来的重机枪打成筛子了。\n\n“突突突突！”\n“ 隐蔽！隐蔽！”马卡将旁边还愣在原地的新兵一脚踹倒，自己也迅速趴下。与此同时，帝国军约两个班的士兵在一辆装甲车的掩护下向着马卡这边进攻。\n马卡拿着半自动步枪迅速击倒两名正在给铁丝网安装爆破索的帝国军工兵，战友们也迅速还击。\n可为时已晚，伴随着爆炸声，铁丝网迅速被炸开，帝国军的装甲车迅速前进……\n用车载重机枪压制马卡他们。\n帝国军的两挺重机枪压着马卡这边抬不起头。\n“通讯兵！通讯兵！”马卡叫了半天，扭过头一看发现通讯兵早已阵亡，12.7毫米的子弹将通讯兵的脑袋打炸，身体抽搐，钢盔直接被打回钢渣。\n来不及哀伤，马卡看着离众人越来越近的帝国军装甲车，又看着瑟瑟发抖的新兵，心一横。\n“把你们的反坦克手榴弹给我。”他大声喊道。\n拿完之后，马卡先朝着装甲车方向扔出一枚烟雾弹“掩护我！”拔出手枪和刺刀，戴上防毒面具，便向装甲车方向冲了出去。\n\n帝国军这边，由于马卡掷出的烟雾弹，步兵正忙着戴防毒面具，装甲车则与后方的步兵脱节，单车驶入烟雾。\n马卡迅速拿着刺刀将装甲车的轮胎扎漏气，又紧着将反坦克手雷扔向装甲车的引擎，迅速跑回战友所处的地方。\n伴随着爆炸声，金属射流在1秒之内引爆了装甲车的引擎，而引擎又产生爆炸，又过了几秒装甲车冒出滚滚黑烟。\n而帝国军的士兵看到装甲车被摧毁了，于是迅速的溃逃了。"
FAT_FP.70.a:0"决战之日将至"

FAT_FP.71.t:0"军队中的演唱会"
FAT_FP.71.d:0"海鲁是共和军军队中一名再普通不过的基层士兵。\n“海鲁，你听说了吗，卡梅莉塔歌后要来我们部队开演唱会。”在今天，同班战友卡齐向海鲁说道。\n“真的假的？”海鲁第一层反应是不信，毕竟卡梅莉塔作为享誉世界的明星，怎么会来军队呢。\n卡齐像是早就知道海鲁的反应一般继续说道“这是星风元帅通知的，估计等一下连长就要宣布了。”\n果不其然，连长向大家宣布“等一下卡梅莉塔女士就要来我们部队开演唱会，你们老实一点。”\n“不然的话，继续加练。”\n到了下午，海鲁和战友们席地而坐，坐在地上唠着嗑。\n\n“让我们欢迎卡梅莉塔女士，欢迎她来我们部队做客。”\n连长的声音响了起来，所有士兵都朝着同一个地方望去，卡梅莉塔迈着独属于她的优雅步伐踏上了临时搭建起来的演出台上，海鲁和卡齐第一次见到歌后，就被她的魅力折服了。\n卡梅莉塔站在麦克风前，清了清嗓音“我向革命同志们献上《我心如火》\n\n随着那几乎可以说是摄人心魄的歌声回荡在军营之中，所有鹫和马都安静了下来\n卡齐听得入迷，眼睛直勾勾的盯着卡梅莉塔，坐在他旁边的海鲁则跟着轻轻唱道。\n唱完之后，全场响起了更加热裂的掌声。\n演唱会结束之后，海鲁看着卡齐扭扭捏捏的样子，忍不住了直接说道“有啥心事？”"
FAT_FP.71.a:0"“能不能上去帮我要个签名？”"

FAT_FP.72.t:0"共和国特色议会"
FAT_FP.72.d:0"早晨，议会就乱乱哄哄的，有的议员刚刚入座，有的则和自己的同僚交谈着什么，很快，议会便座无虚席，如果把视角拉远，就会发现，坐在左边的狮鹫和小马们大多年轻，身上仿佛有着无穷的活力和抱负。而右边的一群则大多看着有些衰老和精明。\n一名穿着干练的年轻狮鹫首先走上演讲台，同志们，我今天的议题非常简单就是希望可以落实八小时的工时，这项伟大…，还不等这位年轻狮鹫说完一句话，台下的一个狮鹫便打断了他。\n谁又是谁家的小孩跑出来了？这个问题都说了多少回了，不可能，你们这些喜欢口头玩过家家的康米是不是不知道南方的帝国还好好活着呢。\n放屁！是你们这些混蛋拿了那些黑心工厂的钱，才会反对这项举措，要我说，反腐部就应该把你们全抓走！你们这些用钱买了议员位置的都是贪污犯！\n你个小崽子敢这么诬陷我？！台下两个狮鹫作势要打起来，被身旁的小马和狮鹫连忙按住。\n大家都冷静一下，我们应该好好谈一下问题，至少说一下自己的观点\n我们狮鹫的国家什么时候需要你们这些外来的谐律小马插手？这里有你什么说话的份？\n这句话如同导火索一样引爆了现场，几个小马和狮鹫瞬间和刚刚说出这句话的狮鹫扭打在一起，其他小马和狮鹫也一拥而上。几个军方代表试图把打架的拉开。\n安静！安静！不要打了，这里是议会！议长愤怒用锤子敲打着桌子却没有任何一方在乎。\n突然，议会大门被护卫打开，星风和翼展先走了进来。当克梅斯凯走进议会的一瞬间，刚刚还扭打在一起小马和狮鹫，马上站了起来，拍了拍身上坐回原来的位置。\n看着一片狼藉的议会，和等待自己的发话的议员们，克梅斯凯只是轻轻叹了一口气，然后说一句注意秩序，便离开了，议会大门刚刚关上后，里面很快又是嘈杂的声音"
FAT_FP.72.a:0"这就是民主("

FAT_DIP_Focus.1.t:0"共和国公约的宣言"
FAT_DIP_Focus.1.d:0"我们，狮鹫尼亚共和国的公民，在此庄严宣告，为捍卫我们共有的尊严、自由与未来，缔结此神圣共和国公约。\n\n我们坚信，每一个公民的权利与尊严不可侵犯。国家因保卫这些价值而存在，法律为彰显这些原则而施行。我们摒弃一切形式的压迫与歧视，无论其源于血缘、信仰或观念。\n\n我们确认，权利与责任相伴相生。个体的自由以不侵害其他个体同等自由为界，个体的发展需融入社会的共同进步。\n\n我们宣告，此公约奠定我们共同防御的基石，为击败狮鹫尼亚最大反动堡垒而联合，为共和主义之胜利而联合！"
FAT_DIP_Focus.1.1:0"这将成为共和革命的保障"

