FAT_start.8.t: "在豪克兰的意外之喜"
FAT_start.8.d: "迈耶，那腌臜的虫豸，可耻的叛匪！愿北风神诅咒他的名字和他那龌龊的劫掠王国！自从这逆徒背叛革命，还带走共和国几乎全部的空军跑去小岛上开始海盗生活之后，由于我们没有一支足够强大的舰队，只能放任他在海上逍遥自在。通过登陆作战消灭他不现实，就这么完全不管他又会让他变本加厉地袭扰我们的海岸。好在事情最近有了转机，当年迈耶叛逃时，自然有些士兵是受他蛊惑“真心”追随他的，但有些士兵只是害怕自己被当场杀害而被裹挟去豪克兰的。如今，迈耶的罪恶行径愈发不加掩饰，那些被裹挟而去的老兵对他的厌恶与日俱增，终于在前不久的某天晚上，他们偷走了迈耶最近掠夺来的战利品，并以此为启动资金正式宣布反对迈耶的统治。\n岛上并没有多少地方够他们展开战线，好在迈耶的兵力也不强，革命老兵们利用现有的资源还能勉强抵抗。这一消息传到了克梅斯凯那里，他意识到这是个绝佳的机会，共和国可以借此从内部击败迈耶。单靠岛上现有的革命力量肯定不足以彻底打败迈耶，要想取得胜利就必须给予他们支持。毕竟我们虽然没办法进行全面登陆，但悄悄往岛上送点物资和士兵还是可以做到的。为了收回我们革命祖国固有的土地，我们必须行动起来了。"
FAT_start.8.1: "前进！消灭叛徒！"
FAT_start.8.1_t: "我们将开启§Y豪克兰博弈机制§!"
FAT_start.8.2: "我们无能为力"

