FAT_start.6.t: "西部机遇"
FAT_start.6.d: "自从我们和北方的天际纳维亚和平统一之后，便对西边的韦迪纳王国形成了完全包围之势。风暴翼王朝唯恐自己延续多年的封建统治成为共和国下一个要推翻的目标，多年以来他们一直期望向帝国求援。可南方的帝国连自己的家务事都搞得一地鹫毛，哪还有工夫管你这片北方的蛮荒之地？\n出于对自己随时可能丢掉特权享受的恐惧，本就保守的韦迪纳王国的统治阶层开始变本加厉得镇压进步鹫士，并增派了更多军队前往边境试图阻挡共和国可能的进攻。没想到他们采取的高压政策适得其反，一些原本正常的活动和诉求现在在王国看来都是在拨动他们敏感的神经。在当局的镇压下，许多温和的反对者被迫转向激进的斗争，在愈靠近共和国的地方，镇压就愈残酷，相应地，革命运动也就愈激进，混乱的示威游行和斗殴时常发生。\n就在前几日，弗嘉兰地区的共和派群众又开始了游行。他们甚至没有一开始就直接提出废除君主制，只是希望当局能减少暴力镇压，开放有限选举。这在王国眼里仍然是不可饶恕的僭越之举，于是又派出军警镇压。按照以往的惯例，无非就是拉上警戒线，再把几个带头的打一顿关起来。但这一次，不知是有意为之还是擦枪走火，一名士兵向呼喊的民众开枪了，一只前排举着牌子的狮鹫被当场打死。其他鹫先是愣了一下，随后变得更加愤怒，他们一拥而上冲破了警戒，负责镇压的长官见他们没有如预想的那样四散逃跑大为震怒，宣布允许士兵使用致命性武力。直到又倒下一批市民后，游行队伍才有被驱散的趋势。但很多士兵也深感自己对鹫民有愧，宣布今后绝不会再听从对群众开枪的命令。这次血腥镇压看似成功了，但实际上却让当地民众彻底失去了对王国的信心，士兵们停止服从命令的行为也在实质上掐断了再次暴力镇压的可能性。\n对于共和国来说，这是革命向西进发的机会。经过共和国的调查和评估，如果我们把军队开进弗嘉兰，那么很有可能不会受到任何抵抗，反而会受到当地的热情欢迎。但同时，这一行为必然会被韦迪纳视为侵略，他们很有可能情急之下宣布和我们进行全面战争。我们真的要冒着开战的风险回应那里鹫民殷切的期盼吗？"
FAT_start.6.1: "我们不能辜负革命群众的热情"
FAT_start.6.2: "战争的风险不容忽视"

FAT_start.601.t: "竭诚欢迎"
FAT_start.601.d: "弗嘉兰的城市内驻军已经不再听从命令，韦迪纳宫廷只能调派边境的忠诚士兵进入城市继续镇压。与此同时，共和国军已经在凌晨跨过边境线并迅速清扫了剩余的驻防部队。弗嘉兰广阔的乡村地区在卡车的驰鸣中被迅速控制，后续部队也陆续控制了韦迪纳其他地区通往该地的通路，以防止王国回援。\n首府诺丹堡已经被完全包围，共和国不愿在城内展开巷战，于是往城里喊话希望守军投降以避免不必要的伤亡。守军回应他们将战斗到底，无奈之下，共和国军只能开始逐步向城内推进。尽管有当地共和派的引路，但共和国士兵们毕竟对这里不熟悉，忠于王国的军队随时可能从某个建筑里开黑枪。本来我们的指挥官并不想遭受太多伤亡，但眼下既然守军如此顽强，他必须开始考虑全面强攻。\n好在，先前宣布拒绝从命的士兵们此时开始哗变，他们在共和国开始攻城后被新来的指挥官要求接触武装。由于害怕上交武器后被当场叛徒处决掉，他们只能先发制鹫宣布归顺革命。这群狮鹫常年驻扎在城内，对城市地形了如指掌，在与共和国军取得联系后，他们里应外合迅速包围了王国军的总指挥部。王国指挥官还想负隅顽抗，却被一发炮弹打中指挥室当场殒命。剩下的士兵一瞬间作鸟兽散，共和国的文官随即接管了诺丹堡的政府办公室，沿途不断有群众为他们欢呼。共和党共和军所到之处，民众竭诚欢迎，正可谓占尽天时。那种勃勃生机万物竞发的境界就在眼前。"
FAT_start.601.1: "探囊取物，何等容易"

