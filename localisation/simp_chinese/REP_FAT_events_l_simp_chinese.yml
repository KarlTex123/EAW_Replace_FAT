 fat_borderwar.3.t:0 "边境冲突胜利！"
 fat_borderwar.3.d:0 "我们英勇的战士从边境进军，突破了敌人的防线并摧毁了多个目标！太棒了！"
 fat_borderwar.3.a:0 "今日我们欢庆！"
 fat_borderwar.4.t:0 "边境冲突失败"
 fat_borderwar.4.d:0 "我们英勇的部队未能突破卑劣敌军的无畏抵抗。"
 fat_borderwar.4.a:0 "荣耀属于烈士！"
 fat_borderwar.5.t:0 "边境冲突无果而终！"
 fat_borderwar.5.d:0 "在我们与敌方的边界上爆发的战斗似乎已经陷入僵局，现在看来，我国一无所获。因此，我们的指挥官决定停止进攻。"
 fat_borderwar.5.a:0 "下次一定让他们知道厉害！"
 fat_borderwar.6.t:0 "我们最好的努力！"
 fat_borderwar.6.d:0 "我们英勇的战士成功抗敌并保卫我国边境。"
 fat_borderwar.6.a:0 "万岁！"
 fat_borderwar.7.t:0 "边界遭遇劫掠！"
 fat_borderwar.7.d:0 "敌军已突破了我们的防御，并摧毁了边界周围的几个军事目标。"
 fat_borderwar.7.a:0 "那可真糟。"


