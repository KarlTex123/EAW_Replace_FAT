FAT_FP.43.t:0 "与镰爪的会谈"
FAT_FP.43.d:0 "镰爪驮着公文包，朝着克梅斯凯的办公室走去。自从大和解以来，克梅斯凯一直对他们这群社会主义者持友好态度，在他们要求进一步革命——或者说嘶大林格勒化的时候也总是尽可能提供支持——但镰爪对此并不完全满意，他一直对克梅斯凯的宽容——或者说，懦弱，心怀不满。\n“大总统，我应邀前来了。不知这次您找我有什么要事呢？”镰爪以一种刻意的冷漠感说道。\n“镰爪啊，你上次说要新建几个报社的事搞得怎么样了？”克梅斯凯决定先给话题拐个弯。\n“哦，挺好，同志们可是一个个都有十二分的热情呢。”镰爪的语气里面听不出一丝感情。他又一边从公文包里掏出几张数据文件交给克梅斯凯检阅。“比如说，现在在漫云市已经有了五万多订户，读者的反应都很热烈……”\n克梅斯凯只是略看了两眼报告，他的主要目的并不是问这件事。\n“那么，镰爪同志，在你们辛勤工作的时候，没别的同志们没给你们添麻烦吧？”\n镰爪愣了一下，他大概猜到克梅斯凯找他是要干什么了：“啊，倒是还好，大家都挺友善，这些事就不用费您操心了。”\n镰爪还想说点什么，但克梅斯凯叹了口气打断了他：“我还是直说吧，党内对你们有意见我相信你也是知道的。你们的工作做得好，这我当然看在眼里，但前几天又有鹫跑到我这来发牢骚，说年轻同志们不把老同志放在眼里，对于这点，我不做评价。不过既然这件事已经闹到我这里了……”克梅斯凯压低了点声音：“我希望你能够出面缓解一下，你也是参加过长征的老同志了，你来解决不会有什么反对声音的。”\n镰爪刚想反驳说什么“这种事情不应该作为共和党总裁的你来解决”之类的话，但克梅斯凯严厉的眼神止住了他。镰爪只能不情不愿地说：“好吧，总裁，我是可以去给年轻同志们做工作，但是这个事情能够发生，显然也不完全是年轻鹫的问题。”\n克梅斯凯点了点头，又说了些宣传工作的事情，便同镰爪告别。\n在交接完镰爪带来的文件后，克梅斯凯独自靠在椅背上，既没有看报告，也没有写什么东西，抽屉里面还躺着好几张关于社会改造同盟的所谓“破坏党内团结”之类的报告。\n“我还能维持党内和平多久……？”"
FAT_FP.43.a:0 "帐篷的主支柱还未倒下……暂时的"

FAT_FP.44.t:0"民生主义的内涵"
FAT_FP.44.d:0"三民主义之民生，在多年的努力后终于实现了。如今的土地已经服务于鹫民，旧公国遗留的封建主再也不能把农民拴在土地上奴役；在工会的管理下，工鹫福利与工业建设齐头并进，铸造了革命的钢铁基座；新兴的各类学校扫荡了千年以来普通生灵的愚昧，并以先进的革命思想武装他们的头脑；各级党员以身作则，成功引导了社会风气，共和与自由已经流动到了每一条大街小巷。克梅斯凯满眼欢喜地看着这片土地几年间发生的翻天覆地的变化，决定召开一场会议作为民生主义的总结。\n会议如期在漫云城召开，在以喜悦为基调的这场大会中，就连不同派系的狮鹫们都少见地没有发生争吵。克梅斯凯站在巨幅的三色旗前发表致辞，他热烈地肯定了在各党员和群众的不懈努力下国内迸发的新生机，这对于革命的发展是极其重要的一步。总统的发言得到了一致掌声，而后是个派系的领袖发言，其中艾斯特勒和翔日的发言最值得关注。\n艾斯特勒兴奋地说：“我要尤其感谢克梅斯凯大总统的信任，有了这一点我们的同志们才能放心地推进那些原本看起来‘不太可靠’的办法。无论是来自外部的先进思想，还是我们内部探索出的新办法都取得了骄鹫的成绩，这无不说明了民生主义和社会主义之间高度的重合。毕竟，我们正是在这样的思想指导下才完成了这些惊鹫的壮举。”\n翔日无意否认社会主义在建设民生工程中发挥的重要作用，但在这样的大会上这么邀功还是有点张扬了。他没有直接否认艾斯特勒的说法，而是说：“我们多年以来建设的民生主义，可以说几乎都是基层群众和党员的功劳，最终也是为他们服务的。我时常在想，民生主义的内涵当然可以用一大堆专业术语来描述，但其归根结底，所有为了创造鹫民生活安宁的举动不都可以归于民生主义吗？民生主义应该是一个更宽泛的概念，它属于每一个心中有共和的生灵。”\n克梅斯凯微微一笑，他说出了在他心里，民生主义的最终内涵——\n\n……其实，无论要怎么对民生主义下一个最终的定义，都不会影响夜中坐在新家具上饮茶的共和国最贫困的农民，也不会影响正和家鹫享受热腾腾餐食的最贫困的工鹫。漫云城离他们很远，但民生主义离他们很近，近到他们正躺在它的怀抱之中。不过，既然大总统都已经发话了，那么看一看报纸上刊登的他的想法也没什么不好的。白纸黑字就写在那里，谁都不能更改："
FAT_FP.44.a:0"民生主义就是普世万民的幸福。"

FAT_FP.45.t:0"断头台下"
FAT_FP.45.d:0"在帝国的一些偏远郊区，狮鹫们仍能见到矗立着沾满血迹的绞刑架，最可怖的那些甚至还吊着早就腐化烂透的风干残躯。那是革命的余波，以恫吓共和派的同情者们，在暴君铁腕无法触及的乡野，这些虐杀的刑具代表了他们对共和革命的真实恐惧。为了审判这些惨绝鹫寰的恐怖手段，共和国最高革命法庭预备推行《训政时期反革命特行条例》，鼓励发动群众内部纠察，揪出内部潜藏的背叛者与反革命分子并进行公审，我们不会使用原始而野蛮的绞刑，公正的审判和惩戒是共和精神的骄傲，当然那些罪不可赦的叛徒还是需要被被彻底肃清。而斩首正是我们所需要的，兼具威慑与高效的死刑制度。\n鹫首分离，为一生罪孽落下一个短而迅速的句点。"
FAT_FP.45.a:0"太便宜它们了。"

FAT_FP.46.t:0"棋局之中"
FAT_FP.46.d:0"翼展与克梅斯凯的友谊与国际象棋少不了干系，虽然翼展的棋品不怎么样，却恰恰是因此才能和克梅斯凯和谐起来，毕竟克梅斯凯是那极少数基本下不过他的朋友。\n克梅斯凯抵着脑袋看桌面，但翼展今天的心思却没有都放在棋上。总统敲敲棋盘打断他走神，翼展看了看局面，可以进兵再吃掉克梅斯凯一个兵。\n他开口了：“总统阁下。”对方将目光上移。“我想和您，私下讨论下共产主义者的问题？”克梅斯凯了然地点了点头：“每个鹫都想和我谈这个，不过你说吧。”\n翼展吃掉了那个兵。“共产主义者名义上加入了我们，实际上又怎么样？他们嘴上说尊重三民主义，实际上还不是由得镰爪带着他们继续搞那套共产主义，现在他们还在党内活动，迟早有一天会惹出事端——共和国不能变成下一个嘶大林格勒”他一边说，一边分心向前推进棋局，又一次吃下一个卒子。\n克梅斯凯还是很冷静，这有点出乎翼展意料。他微微颔首：“关于共产主义的事情还需要观察，并没有任何证据表明嘶大...共产主义者想要对共和国不利。帝国大敌当前，此时出手夺权，怕是要寒了同志们的心啊。”翼展不再说话了，左右之争始终是共和国的内部事务，克梅斯凯搬出帝国，显然是不打算处理天际问题了。或许只有等到克梅斯凯或者共和国其中一个死去，共产主义者的问题才能得到真正的重视。\n克梅斯凯的主教吃下那深入阵营的士兵，翼展这才惊觉他后方的国王皇后以及主教由于兵的牺牲都可以直接进入战场中央，整个局势顷刻反转。他赶紧把思维集中到面前的方寸棋盘中。"
FAT_FP.46.a:0"切不可一心二用。"

FAT_FP.47.t:0"乡村怪鹫"
FAT_FP.47.d:0"行停村粮仓被破开了一个近两米的口子，用老鼠来解释未免显得有些吓人。起初，村里只是补上了洞，增派了两名守夜鹫，但没有效果，守夜鹫们不可能围着粮仓整夜巡查，而且补洞用的木板是爪子拆下来的，声响不大，对方也确定无疑只拿走了粮食，这至少说明目标是一个智慧生物。为了抓住这个贼，村长组织了大批青壮狮鹫进行蹲守，终于在当晚抓获了这个神秘的窃贼。他的羽毛油亮到反光，貌似是有狮鹫打理的。而他被手电的光亮照得遮住了眼睛，毫无反抗的意思。\n这头狮鹫虽然看起来有些胆怯，但却既不懂帝国语也不懂漫云语，只能通过比划作些简单的交谈，他的个头几乎到了房梁，说话的声音却很小。他没有逃跑，而是在村牢里老实呆着，把白天的早午饭都留到晚上吃，但他一餐要吃六七碗饭，吃不饱便会一直“嗷嗷”地低声哀唤，于是村民们便直接管这只野兽般的狮鹫叫“嗷嗷”。在审讯中，有的村民表示似乎曾在击日者山脉边界见到过这样硕大的身影，嗷嗷对此作出的回应只有恐慌摆手。\n在被吃了半个月后，村长终于受不了听他刚学会的那几个简单词语来回打转，直接上报到了地方政府，一来一回又过了几日，政府在派狮鹫观察情况后，作了一个决定——破格将这头狮鹫招入共和国军队。\n村长不知道这是地方政府敲定的解决方案还是共和军那无限扩招公告下的一个小小注脚，但既然赈济款到位，粮仓肯定是可以修好的。政府狮鹫到来接走嗷嗷时，不用下地的妇女和孩子们特意来送了他一程，嗷嗷看起来有些慌乱，但看着狮鹫们对他挥手，他还是挥手向他们告了别。"
FAT_FP.47.a:0"有几个孩子坚称他们听到嗷嗷说了“再见”。"

FAT_FP.48.t:0"隔阂"
FAT_FP.48.d:0"黄毛尖酒吧是小地方，比不过城里演出攒劲，天天除了吹牛就剩打架。大家伙们自然就越吹越狠，品评风云，激荡文字，打韦迪纳公主婚事聊到曜尾脱发无所不包，一个一个轮着跳桌上慷慨陈词。烂毛最吸引人的说辞就是狠骂共和国，今儿他一跳桌上张口搬出来就这套：“要我说，这共和三十年了，该干成早干成了！玉米都熟几茬了，还窝在北边，打个屁！换了皇帝总统不照样收租子，谁上台都是拿我们小老百姓当粮袋用！”\n狮鹫们有的支持他，有的站上对台。白嘴壳喝的少，脑子还灵光：“大伙儿，甭说了！城里下的命令你又不是不知道，现在可不好讲这么些！”烂毛故意晃了晃桌子，手里的酒杯洒了不少：“怕啥！小尖子以前不就是共和军，你还替他护上了！”\n此话一出大伙自然又看向黄毛尖，他在吧台后面听得乐呢，一看这架势又给自己老底端出来，赶紧跟老主顾们解释：“各位大哥喝酒开心开心，注意点就是。乡里乡亲的，再说我早退伍了！”本来说好了，老俏又来了一句：“欸，那小尖儿你咋说嘞。”黄毛尖咳了咳：“这话我可不方便说。”大伙马上就起哄了：“哎！乡里乡亲的！”\n黄毛尖看大伙抓着自己不放赶紧说：“要我说，共和肯定是好事。三十年了，大伙可以看看咱村儿提高了多少收成，挣了多少钱！没这笔钱，这酒吧可做不起来。”大伙马上喝起倒彩：“没劲儿！”店长笑了笑：“还是说，大伙更喜欢奥托？”\n这话一出，酒鬼们连忙否定，转头就去痛骂奥托时期的苛政了。\n但明天大伙还是要骂共和国的。黄毛尖门清，这些农民之所以要骂，并不是共和国做的不好，而是那个炽热的理想实在过于美妙，他也曾为之神魂颠倒，只是随着时间流逝，脚踏实地的狮鹫们自然就要回来关注更现实的问题，他们害怕帝国的强大，害怕共和的失败，害怕在三十年前点燃火星的理想最终随着革命失败一同消灭。他们现在的种种言论，不过是为了强迫自己去适应最糟糕的情况而做的保护预演。"
FAT_FP.48.a:0"就连他自己，也是不能克服这恐惧才选择了退伍。"

FAT_FP.49.t:0"天际纳维亚之光"
FAT_FP.49.d:0"2/5/1008——\n亲爱的日记，我们已经踏上了共和国的土地。母亲曾说这里被革命摧毁成了荒芜的废墟，但现在看来，共和国的发展已经超过了我们的想象。这里的道路要比家乡还宽敞平坦，我已经开始期待这次极光之旅了！\n\n6/5/1008——\n亲爱的日记，漫云城比我想象的要大得多，而且和以前的西卫一样到处都有军队巡逻。虽说这座城市井然有序，但到处貌似都被共和党的狮鹫管理着，走在路上还会被盘查证件。尽管知道共和国目前处于战备状态，这里和我所期望的革命共和国还是有点不同。\n为了避免麻烦，我们最好抓紧上路，根据旅游指南，天际的管控应当没有这么严格。\n\n11/5/1008——\n亲爱的日记，我们已经抵达北方最大的城市新天际纳维亚了。这里比起漫云城更像是小马和狮鹫的混居地？那些穿着原始的部落小马和那些手不离本，显然来自嘶大林格勒的马儿们随处可见，路过大会堂的时候，我发现这里的全体大会恰好就在后天，而且只要预约就可以旁观。 多呆一天应该不会赶不及到丁考吧？\n\n12/5/1008——\n亲爱的日记，新天际纳维亚的全体大会的确很有趣。他们的表决基本是公开的，虽然大会堂内部没我猜的那么光鲜，但他们真的就聚在那里面花大半天表决了许多关于自己社区的议案！虽然要我说这效率肯定很低，但不能否认，他们开会的时候真的充满热情，想必是真的认为自己所作的一切能够实现共和理想。\n我认为阿奎莱亚也会需要这种热情的。\n\n15/5/1008——\n亲爱的日记，我们马上就能见到北方曙光了！丁考不愧是狮鹫大陆的最佳观测点，我好不容易才占到一处制高点，转眼就又被挤满了。这里到处都挤满了来观测极光的狮鹫和小马，要在这种夜晚里等三个小时真叫人心烦，还好再过半个钟，我们就能一窥那极夜中的璀璨神迹了。"
FAT_FP.49.a:0"秉烛而行，以耀幽冥。"

FAT_FP.50.t:0 "新时代的骑士"
FAT_FP.50.d:0 "随着军改的进行，越来越多的新鲜血液注入到了军队之中，他们大多甚至是在978年革命之后才出生的，但他们的革命热情一点都不输那些老兵们。克梅斯凯决定专门检阅一遍这群由青年面孔组成的新军队。\n克梅斯凯扫视着眼前整齐排列的士兵们，他们受过严格的训练，但在亲眼见到总统元帅时还是难掩心中的激动。总统元帅称，在过去，帝国的骑士们不过是贵族和神官的爪牙，他们所谓的“骑士精神”早就被异化成了对鹫民的镇压和对老爷们的维护。而今，共和国雄踞北方，我们要发展属于自己的骑士精神——那就是对革命的忠诚和对共和的信仰，并希望每一名士兵都能恪守这一点。\n士兵们激奋地高喊着口号，就连他们身后停着的装甲车辆仿佛都在震颤。克梅斯凯认为，坦克的发展前途要比火炮宽广得多。只需攻克几个技术难关，被认为“不可靠”的战车就能摇身一变成为装载着强力火炮还能四处移动的碉堡。他敏锐地意识到，这种新式武器很有可能改变过去战争中以静态为主的战场局面。\n最后一支队伍离场，克梅斯凯望着他们的背影，他们是共和的利刃，是对抗封建的十字军。"
FAT_FP.50.a:0 "随着钢铁巨兽，碾碎封建"

FAT_FP.51.t:0"友谊何处去"
FAT_FP.51.d:0"维卡是共和国戍卫南方边境的一名士兵，自入伍之后，他因为身材高挑而被选中担任这份边防工作，作为面向帝国的革命面貌。\n维卡的一天被安排得很满，边境的局势紧张又不是一天两天的事了，常规的军事训练就已经让鹫骨软筋麻，士兵们又处于这样危险的敏感地带，他们的精神也必须时刻紧绷着应对一切突发情况，毕竟若是战端再开，这里立刻就会变成血腥的前线。\n好在傍晚时分，在饭后到点名有段时间管理不是那么严格，他可以找借口溜出军营去——只要保证及时归队就行。森林里被各种树木和灌木丛塞满了，但他总能精准地在意想不到的地方跨过去，绕了好几个弯，他来到一片小空地，那里有一颗大点的树桩子，足够他坐在上面安静一会。维卡也不知道这里在地图上到底算共和国的领地还是帝国的领地，他希望这里不属于任何鹫。\n直到某一天，维卡照例溜出军营，路程不算近，但他跑得快。借着几乎被完全遮住的零碎的月光，他似乎发现树桩上已经坐着一个鹫影了。他本想小心翼翼地靠近，但想到在他来此的路上造成的噪音肯定已经被察觉了，索性直接走了过去。他勉强辨认眼前的狮鹫，只能肯定这不是共和国的士兵……维卡下意识地摸向了配枪。\n“不要这么紧张，我知道你是那边的，我也知道你来这只是为了安静一会。既然我也是如此，那我们为什么还要在此争斗呢？”\n维卡觉得他说得对，他已经把整个白天奉献给了革命的斗争，也许该拥抱一下自私一点的夜晚。维卡也坐到了树桩上，跟他交换了名字，那名帝国的士兵叫罗素，据他所说，他还是弗羽西亚的一名贵族，尽管到他这一代，能拥有的土地也就比普通农民多一点点了。\n“你知道我们是要来革你们的命的。”\n“呵，你也知道我们是要来平你们的乱的。”\n维卡并不记得自己曾见过罗素，这也正常，边境可不是什么让鹫交朋友的地方。他试探性地问：“你……什么时候还会过来这里？”\n罗素擦拭着爪中的眼镜，镜片上大概能看出来有一片污渍，但很难说在这种光照下能把它擦得多干净：“不知道。但是我有机会就会溜出来。”\n时间差不多了，他们必须往回赶了。\n此后，他们还是会往这一块不知道到底属谁管辖的小空地跑，有时他们会错过，但大部分时候都能碰上。他们的话题不再局限于帝国和共和国的斗争，而是更多地谈论自己的家庭和见闻。维卡有一天忍不住问罗素：“我们那边的架势……看来迟早要跟你们打起来。说实话，我不想在战场上见到你……”罗素说：“我更不希望见不到你。”维卡追问：“那战争结束之后，你会去哪？”罗素笑了一声：“这样的话，那要么是你被当成叛党处死，要么就是我被当成反革命给清洗掉咯。”\n他们不再说话，月光依然昏暗。\n回到军营去，现在是晚间新闻时间，维卡坐在战友们中间，他的心中突然出现了一丝对战争的恐惧，在此之前，他都是渴望向南革命彻底的急先锋。\n“……接下来让我们关注帝国的消息。据报道，昨日帝国某企业员工因不满薪资过低爆发罢工，被当局出动军警暴力镇压……”"
FAT_FP.51.a:0"我想做革命者，我也想做自己"

FAT_FP.52.t:0"宣传攻势"
FAT_FP.52.d:0"共和国是以狮鹫为主体民族的，这点当然没错，但这并不意味着其他种族的生灵就会受到歧视。除了狮鹫之外，小马种族也是共和国的重要组成部分，他们中有一部分是几代之前就定居于此，也有的是在共和革命后怀揣理想移民至此的。作为小马的天涯就是在革命后来到共和国的第一批外来种族之一。\n来到共和国后，天涯凭借曾经在小马里亚工作的经验，为自己谋得一份工程质检员的差事，即主要负责监管工程材料质量和工程结果完成情况。这份工作并不需要她全天待在工地，因此多数时候她都比较清闲。这天下午，她在外边散步的时候听见旁边有什么动静，还没细看是什么事，但感觉起码挺热闹。走过去挤在其他同样来凑热闹的小马和狮鹫中间，只见有个台子上一只狮鹫背靠着一幅三色旗，说是在宣讲什么三民主义。一听到三民主义，天涯马上就来劲了，她正是因为想要追随共和理想才跨过大洋来到狮鹫尼亚的。\n台上的狮鹫说：“每一个生灵都渴望自由，而要在国家层面保障公民自由就离不开透明公开的民主制度。我们的选举就是为了让政府听见你们的声音，请不要小看你们手中的这张纸，它承载着克梅斯凯总统对‘民生’的落实。共和党始终以生灵们的生活幸福为奋斗目标，民生主义实际上和谐律主义一样，都是对美好生活的切实保障。所以，为了自由和光明，请支持谐律！”\n听众们很激动，天涯尤其激动，她亢奋地跳了起来，不小心猛地蹭到了前面狮鹫的羽毛，那狮鹫不由得回过头嫌弃地看了天涯一眼。\n第2天，天涯决定再去听听演讲，反正今天仍然没有工作要做。昨天“谐律”的狮鹫不在了，今天演讲的是“共产”的狮鹫。那只狮鹫一上台就几乎是咆哮地喊：“万恶的资本主义奴役和愚弄民众的时代必将被伟大而光荣的共产主义革命钉死在历史耻辱而肮脏的柱子上！”还没等天涯消化完这句话，台上的狮鹫就开始说下一句了：“焦糖·马科思已经提出，共产主义社会是必将实现的。那么什么是共产主义？这一点完全可以结合总统提出的‘民权主义’来看。实现共产主义要靠无产阶级专政，而民权主义正是为了让生灵掌握政治权利而诞生的，因此我们就是民权主义的践行者。为了革命，请支持共产主义！”\n天涯觉得今天的演讲比昨天的演讲还要好，共产主义者说的道理一定程度上已经被嘶大林格勒变成实际了，所有生灵都希望能对自己的权利有所掌握，天涯当然也一样。\n第3天，天涯又来到了同一个地方，因为今天她还是不用工作。这次演讲的狮鹫站在巨大的克梅斯凯肖像前，他说：“是什么铸就了共和国？是生灵。更详细地来说，是认同自己是共和国公民的生灵。我们的共和国由不同的种族组成，但这并不妨碍我们形成一个统一的革命‘民族’。所谓民族主义，归根结底是对我们作为共和国公民的新身份的认同，任何革命的生灵都是我们这一新民族的一份子。只有当我们这个新民族在共和党的统一指挥下，我们的革命才能拥有无坚不摧的力量。为了强大，请支持我们的新民族认同！”\n天涯看着那幅克梅斯凯肖像和三色旗，感到心中有什么热烈的东西正在澎湃，在民族主义的宣传下，她有了一种力量感，迫切地想要高歌着以死捍卫共和国与革命。\n回想起这三天里她受到的鼓动，天涯回到家后冷静地想了想。她觉得那三只狮鹫说的都有道理，但其内容又天差地别。她很奇怪，为什么一个党的内部会有这么多不同的声音呢？他们三个中的谁才是共和党的真实面貌呢？\n“到底谁说得最好呢……？”"
FAT_FP.52.a:0"我也不知道"

FAT_FP.53.t:0"歌曲的力量"
FAT_FP.53.d:0"共和国乃至世界的巨星卡梅莉塔受邀前往小马里亚进行巡回演出。这并不是一次普通的文艺活动，卡梅莉塔深知在帝国的宣传下，共和国在世界上的形象往往是一个由叛匪建立的混乱的法外之地，更有传言说什么卡梅莉塔在共和国境内还经常遭到迫害。要扫清这些谣言，在国际上树立共和国正确的形象，就只能主动向世界展示自己的面貌。\n小马们听说卡梅莉塔要来小马里亚演出的消息后都很激动，甚至在她正式到访之前就开始热烈讨论这件事了。在她即将演出的各剧院早就开始了准备工作，其中一项是报纸宣传，原本他们写的是“热烈欢迎狮鹫尼亚共和国歌星卡梅莉塔小姐莅临演出”，觉得不妥，把“狮鹫尼亚共和国”改成了“漫云公国”，这么一改感觉更不好了，最终他们决定还是写“北狮鹫尼亚歌星”。尽管卡梅莉塔事先说过，她不希望这次演出过多地被政治裹挟，但就凭她的影响力，即使是细节上的用词不当也有可能被过分解读，还是注意点好。\n终于到了正式演出的日子，卡梅莉塔的首站在马哈顿，这座马奎斯最繁华的港口城市而今因为一名巨星变得更加拥挤。场上座无虚席是基本的，其中还有很多从世界各国慕名前来的其他种族的观众，幸亏小马里亚的影视传媒比较发达，该演唱会可以实时直播转载。在拥有大屏幕的各大广场上，也往往呈现小马挤小马的场面。在现场，卡梅莉塔一出现就尖叫不断，即使这时聚光灯还刻意没有打开，只是模糊的黑影就能调动气氛。五分钟后，等到现场稍微安静下来，聚光灯才打在她身上，她的华服上点缀着雕刻过的琉璃，在聚光灯的照射下使她本鹫看起来发着光。\n卡梅莉塔演唱的第一首歌曲是带有悲壮色彩的咏叹，描述的是战争中失去一切的平民对厄运的控诉。虽然此时世界上还没有发生大规模战争，但就算是所谓“小规模”的战争，也足以摧毁一个普通生灵的一生。在歌曲的高潮部分，卡梅莉塔带有哭腔的尖叫似乎使听众们眼前浮现了残垣下痛苦的嘶鸣，而在高潮之后，歌曲戛然而止，象征生命在一瞬间被杀死。听众们愣了两秒，而后才爆发了掌声。\n而后的几首歌曲不再像第一首那样悲壮，但总归都是表达的对人道主义的重视，不少听众开始流泪，卡梅莉塔不愧被克梅斯凯评价说“嗓音能抵十个宣传队”。\n最后一首歌曲是一首情歌，以这样温柔的方式结尾是因为卡梅莉塔希望所有生灵都能记住世间美好的一面并尽力守护它。歌曲写的是一对情侣获得了灵魂上的共鸣，并发誓要不惜一切让这样的生活延续下去。对比第一首歌，这时她的声音变得绵软娇柔，足以让所有生灵沉浸在甜蜜之中。\n“卡梅莉塔在小马里亚的首场演出兼具力量和温柔，她天籁的嗓音完全足以驾驭这两种风格。而尤其可贵的是她对普通民众的关怀和对一切残酷之事的批判。”——马哈顿时代报评。"
FAT_FP.53.a:0"再听一遍！"

FAT_FP.54.t:0"一场悲剧"
FAT_FP.54.d:0"“哦，不好，完蛋了。”\n说这话的是一名医生，所以其实真正完蛋的是他的患者。翼哈根作为全共和国最大的港口城市，拥有丰富的医疗资源，按理来说每天因病死亡的生灵也不在少数。但这次情况很特殊，医生是一名狮鹫，而患者是一匹小马。这只小马被检查到肾脏出了点问题，本来按照普通的流程从马类使用的药物中给他开点药就行了，但这个医生不知道是怎么回事，把本来该用于治疗狮鹫的药物开给小马了，等到输液输到一半那只小马突然开始抽搐，医生见情况不对赶紧停药。可惜已经太晚了，即使事后各位医生已经尽力抢救，但这只小马还是去世了。\n消息很快传了出去，小马的家属流着泪控诉无良黑医草菅马命，还有媒体在一旁拍摄。涉事医生见到这个阵仗开始语无伦次，其中一句话是：“我怎么知道小马跟狮鹫差别这么大？你们跟我们完全不一样！”本来这句话只是想表达物种之间身体上的差距，却在报道之后被别有用心者解读成了“小马对于我们狮鹫是异类，这只小马死掉是活该”。这么一来，有越来越多的小马开始关注此事，一方面是出于同情，另一方面是谁也不希望这种事出现在自己身上。他们包围了这家医院，要求严肃处理此事，院长马上把涉事医生推出去，涉事医生看着愤怒的小马们也不知道说什么，只能一遍遍地说对不起，好在现场终究没有发生暴力事件。\n翼哈根市政府得知了这一消息，察觉到这件事已经不再是一次简单的医疗事故，现在已经发展到可能威胁小马与狮鹫种族之间的关系与信任了。政府派专员先把涉事医生控制住并受理小马家属对该医生的诉讼。另外还派鹫赶赴现场稳定群众情绪，要求院长也必须出面作正式道歉。\n“……我们的共和国之所以叫‘共和’，其中当然包含了‘共其他种族和平相处’的意思。也许除了狮鹫以外的种族在数量上出于少数，但这绝不代表他们的利益就可以被侵犯。所有生灵一律平等，这是我们一贯的原则和底线……”\n院长也说，这次事故直接责任当然在那名医生，但究其根本在于本医院管理制度存在漏洞。本院从来没有也绝不会轻视任何一位患者，从今以后会采取更加严格的管理措施，以实际行动恳求各位重建对本院的信任。而关于受害者家属，我们将尽力进行赔偿，愿逝者安息。"
FAT_FP.54.a:0"这种事还是别再发生了……"

FAT_FP.55.t:0"爪停喙停"
FAT_FP.55.d:0"当罢工员工与漫云警察开始对峙时，艾勒斯特害怕了。尽管现场已被控制，但支持工会的沸腾民意似乎已有发酵成反对共和党的形势。\n作为左翼在政府中的定海针，漫云的本地工会和他有千丝万缕的联系，在这场罢工中，自己究竟该站什么位置？他回忆以往的工作，却发现自己身为共和党高层却从未深入过一场真正的事变，天际风波也好，瑰翼政变也罢，他只需要完成工作等待局势重归平静。\n但这一次他无法置身事外，工会送来密信，称目前的舆论有利于谈判形势转好，希望他作为党内代表站队支持工会。\n党中的诸多派系正处于风波中的动态平衡，漫云鹫心未稳而反赤化声势不绝，内外交困的共和国有太多要紧事务。他们真的以为光靠几次内讧就可以让全狮鹫尼亚的同志们实现解放理想吗？艾勒斯特镇定下来，拿着信函去向总统办公室。\n他已知道自己要做些什么。\n对峙的工鹫工马与警察队伍气氛焦灼，工厂主只答应接受自主调休和部分涨薪，但拒绝降低生产指标和增长日常休息时间。漫云城！这里寸土寸金，怎么可能减产！在警长协调无果后，对峙又经过了四十二小时，沟通渠道已被对立情绪堵塞，疲态出现在在场的所有鹫马面上，当全副武装的军队入场时，双方都是毫无预料。\n双方被半强制地推到谈判桌上接受官方条款，以归还工厂与恢复生产为代价免除了一切停产损失，增加职工福利和调整工作时间。这次胜利并不让工会方面为他骄傲，甚至内部争论起了艾勒斯特的立场问题，许多民间左翼鹫士也声称军事镇压是“反共产主义”的举措。\n但艾勒斯特并不太在乎这些，他在乎的是那些狮鹫和小马们，他们不必被工会作为弃子而丢掉工作，还可以在厂里的午饭后轻松地多睡个小午觉，这才是真正的改变。"
FAT_FP.55.a:0"今天解放工厂，明天解放世界？别开玩笑了。"

FAT_FP.56.t:0"民主之问"
FAT_FP.56.d:0"丽天拽了拽刚要离开会场的翔日，这匹由母亲陪伴着的小雌驹显然对他刚刚的共和讲演有所思考：“大哥哥，你刚刚讲民主是大家一起管理我们的国家，这是说我们都有机会当大总统吗？”\n翔日停下爪子回头站定，看着她回答道：“当然啦，小姑娘，大总统是民主选举的，只要能争取到狮鹫们和小马们的支持，无论是谁都有机会当的。”\n丽天紧接着又说道：“爸爸教过我，奥托是国王，以前我们国家的狮鹫和小马也听他的话，但不能大家轮流做，但是大总统可以轮流做。大总统是不是就是轮换的皇帝呢？”翔日一怔，这个理解出乎他的意料，这匹聪颖非常的小马似乎有些奇妙的误解。值得他仔细解释一番：“小姑娘，民主的意思确实是由我们每一位公民去做国家的主人，但我们也有自己的日常生活和工作，大总统是我们为了方便更好地管理国家而选出来的，因此我们在共和国中都是平等公民。皇帝则是用强迫的手段做我们的主人。就比如说，你有选择睡懒觉或者起床的权力，但皇帝专制则是要强迫你起床来为他工作服务。”\n丽天似懂非懂地点了点头：“所以，强迫我起床就是专制咯？”眼见夫人的神色不那么好看，翔日赶紧补充：“这个嘛，这么说吧，专制是不由分说也要把你从被窝里拽出来，民主则是你可以想要多睡一会，而别人也可以希望你起床，然后你们商量着来决定，谁也不该强迫彼此，而是用思考观点说服对方。”丽天歪了歪脑袋，思索着这些说法的含义。\n傍晚时分，二马回到家后，丽天跑到父亲的蹄边蹭了蹭，得意地宣布了她今天学到的新知识：“很高很壮的狮鹫大哥哥告诉我们，我们生活在民主共和国里，所以只要我想，每天都可以睡懒觉。”父亲抬起蹄子搓了搓她的小脑袋瓜：“好呀宝贝，不过明天早上我们吃热可可和奶酪面包，你如果起得晚就冷掉了喔。”丽天听到后开心地跳了跳：“那我还是要早早起来！”"
FAT_FP.56.a:0"我们完全自发地选择了甜蜜的民主。"

FAT_FP.57.t:0"何为种族文化"
FAT_FP.57.d:0"狮鹫们总嫌弃小马有过不完的节和喝不完的苹果酒，迎霜节正是其中之一，与驱寒节不同，漫云小马们的迎霜节是为了迎接冬天的到来，每年的这个时候，小马们的活跃总教狮鹫们不爽，狮鹫们的节日安排总是细致且安定，迎霜节庆典正正好和这俩词不搭边，就像小马那套宇宙公主们升起太阳月亮一般不切实际。随共和国而来的大批赫兹兰鹫更是对这本地文化不屑一顾，马克西米连.翼展不止一次地希望以扰民名义缩小庆典规模，但每年都被小马们的热情挡回来。但翼展何许鹫也，他早就有两手方案。\n随着共和深入人心，革命者们带来的赫兹兰文化与漫云文化以及北方部落的原始文化在共和国的心脏地和谐共处已有二十余年，而共和党中的一股势力则不遗余力地支持帮助翼展加速这个进程并赋予其正当性，他每隔一段时间就会提出树立共和国文化倡议和种族平等法案的推进，这些举措既能够将小马和狮鹫团结在一面新旗帜下，又可以堂而皇之地修改去除一些无用的社会开支——比如迎霜节庆典。最开始，议会成员们在文化保护的名义下各执一词，从未考虑过将之变为实际，但翼展年年都向议会鼓动这一方案，各地文化交融发展的趋势也日益强盛，这套方案似乎真的将会在不久的将来变为共和国的新制度。届时，整个共和国将不再讲求狮鹫、小马还是别的什么，大家都是共和文化下的公民。"
FAT_FP.57.a:0"有点小差异，各有各的美。"

FAT_FP.58.t:0"漫云天际线"
FAT_FP.58.d:0"加里波第象征性地敲了敲虚掩的门扉，推门而入时，他立即看到的并不是正襟危坐的克梅斯凯，而是一张庞大，是的，足以用“庞大”形容的地图立在总统的办公桌上。 \n地图的两侧各自被一只爪子抓住，那爪子左右一拉一抖，弯立的地图便轻轻落回了桌面，露出背后那对似乎永不沮丧的眸子，克梅斯凯放下地图，加里波第走上前来，正欲开口之际，眼神又不自觉地瞥向了那张狮鹫尼亚地图，只一眼他便理解了这张地图为何需要如此规格的纸张，这张图为整个狮鹫尼亚的每一处关键城市都作了只有克梅斯凯本人明白意思的标识和连线，其详实程度几近于作战指挥室里那张更大更厚实的战区图，细致程度只比你能在天落买到的天落市旅游地图差一截。当然，如果考虑这张图上的内容充满了数千个天落，那这份地图的工程量只能说不可能像梓悦的旅游传记那样好赚。\n无论在何鹫看来，此物可称杰作都是定然无疑的。加里波第收回目光，向克梅斯凯简单汇报了自己军队的训练事宜，为狮鹫奋斗一生的总统欣赏于他的革命视野，一向对他尊敬有加，因此，汇报刚一结束，总统便请他走过桌子这头到自己身边，为他解释起自己的地图。总统亲爪指点向帝国的心脏狮鹫海姆，在那穿越千里以外的城市，帝国特快发向四面八方，连结起赫尔海姆与它的封臣们，这项格罗弗五世唯一留下的庞大工程很大程度上捆住了帝国中的异心，显示忠诚的漫云公国能从铁道线上得到它必要的物资援助，而没有铁道联系的击日者们难以离开山脉，就只能在山中依靠抢掠自生自灭。铁道对一个城市乃至一个国家的重要性不言而喻...克梅斯凯一面发着关于铁道的议论，一面指点那些他作的注解，那是他理想中整个狮鹫尼亚的铁路线规划。 \n但衰弱的五世却也是在完成了火车巡游后死去的，这似乎有某种命定的意味。加里波第思绪又飘开了一点，他不自觉地走神回忆起过去在迦骀基做生意时见到过的那种极其简陋的铁路与火车，但那些车满载的不是货物或旅客，而是被捆绑起来的沙漠斑马们。 克梅斯凯的讲话将他拉了回来，“帝国的铁路只不到一万里，还只为这些贵族皇族治理的大区建立联系，而我们的共和国，最少最少要有两万里，把所有的狮鹫，团结在一起。”说完这句话，房间里安静了下来，加里波第这才仔细欣赏起了这张堪称艺术的地图，上面的红线不拘泥于任何一个狮鹫国家，而是广泛地联系着漫云，天际，卡廷，击日者，阿奎莱亚，狮鹫岩，埃维河谷，鹫王河，甚至河间的许许多多国家... "
FAT_FP.58.a:0"天下去得。"

