FAT_FP.35.t:0"整理党务决议"
FAT_FP.35.d:0"随着大会进一步进行，南方共和党的布鲁姆也同样向中央派出了自己的代表，这位代表同样带来了一份令诸位代表们震惊不已的报告——在赫兹兰地区，曾经被认为应当听从共和党领导的左翼政党实际上完全奉行嘶大林格勒的指示，他们不仅没有支持统一战线，反而在不少地方同共和党作对。更为关键是，布鲁姆发现他们同时与漫云城有密切的联络，这只能说明一件事，镰爪虽然重新加入了共和党，依然保持着社会主义的独立组织。\n这与接受监督的社会改造同盟完全不同，这样一个秘密通讯网络到底在策划些什么？镰爪被要求对此进行解释，同时曜尾也提出，镰爪必须完全公布所有的通信名单，由联调局将一切调查清楚。\n虽然经过调查这一通信网络并没有针对共和党的阴谋，但其中蕴含的可能性依然让克梅斯凯担忧。镰爪辞去了中央委员职务，党中央同样加强了对社会改造同盟与工会农会的管理。\n随后，根据翼展，曜尾，金羽等代表提议，整理党务决议出台。根据这一决议，社会主义者的活动必须符合共和党中央指示，不得私自召集会议与民众集会，社会主义者对三民主义的批判态度必须改变。为了更好的统一共和革命阵线，一切赫兹兰地区组织同嘶大林格勒的交往必须通过共和党渠道，地方共和党组织领袖不得担任其他政党领袖。\n社会主义者高涨的势头被猛地泼了一盆冷水，曾经团结热烈的革命气氛无疑冷却许多，虽然共和国依然同嘶大林格勒与各类左翼组织保持合作，但共和党中央讨论的核心已经从扩大革命基础转变为如何吸收限制社会主义者的影响力。\n而对于党内保守派来说，这一举措无疑是"
FAT_FP.35.a:0"回归正轨！"
