FAT_FP.34.t:0"新三民主义诠释成为主流"
FAT_FP.34.d:0"随着更多社会主义者进入执行委员会，左派在大会上正式提出应当对三民主义理论进行重新诠释，按照这一新诠释早已在左派刊物中盛行，主要内容便是将民生主义的内涵由避免贫困变为马科思主义的社会革命，这无疑是推翻了过去克梅斯凯与嘶大林格勒宣言的内容，但克梅斯凯本鹫则在大会上赞同了这一提案，并表示，民生主义的理论基层就是马科思理论，因此两者不说完全等同，也应当是统一的。\n在做出此决定后，克梅斯凯同时在狮鹫共和国议会宣布任命艾斯特勒为总理。\n在克梅斯凯准备走向议会后台做最后的准备时，翼展找到总统，试图在最后关头让他回心转意：“总统！你决不能让艾斯德勒成为总理！他们的所谓‘新三民主义’，完全就是对你的理论，我们党理论本来面目的亵渎！”\n“翼展同志，一切行动应该以革命未来为先。”克梅斯凯头也没回地答复了他。\n艾斯特勒满面红光地走到台上，他尽力摆出了一副严肃的表情，随即将爪子放到共和国宪法上宣誓。宣誓完成后，整个会场爆发了热烈的掌声，这一次几乎见不到有谁发出异样的声音。\n处在角落里的曜尾不动声色地看着这一切，既没有鼓掌也没有流露不满。\n艾斯特勒趁势继续发表宣讲，称自己将在任期内对贫困和愚昧持续不懈地斗争，并在社会主义思想指导下继续改良新三民主义，为共和事业创造一个更光明的未来。而另一边，翼展宣布将辞去所有党政职务抗议这一决定，不过除了一些老学究的伤感与愤慨，这一举动并没有更多的影响。绝大部分下级党员与革命群众对此欢欣鼓舞，保守派党员的辞职不过是让更多社会主义者得以进入领导岗位，而狮鹫尼亚革命阶段论也正式被共和党中央认可，现在，共和政治革命之后将会是社会民生革命，虽然手段不会如嘶大林格勒一般坚决酷烈，但私有制最终将会在狮鹫尼亚消失。"
FAT_FP.34.a:0"为了新三民主义！"
