FAT_FP.32.t:0 "共产主义者的膨胀"
FAT_FP.32.d:0 "要说怎么保障民生，建立基层组织当然是必不可少的。在嘶大林格勒顾问的帮助下，社会改造同盟充分吸收了大洋另一端同志们的组织经验，他们的工作效率自然也是最高的。但与此同时，原本的老党员们则发现他们似乎完全插手不上组织事务，党会变成了由改造同盟的同志把处理好的报告照旧念上一遍，随后一致拍爪通过而已。\n翼哈根市内，改造同盟刚刚举行了一场针对船坞工鹫的宣传，台下的听众有来凑热闹的本地居民，也有几个翼哈根市中央党部的狮鹫跟着一起听，嘶大林格勒的顾问只是站在一个不怎么起眼的地方注视着这一切，毕竟演讲稿都经过了他们的润色。台上的狮鹫叽里呱啦地讲了一大堆关于如何学习嘶大林格勒经验，在顾问团帮助下团结奋斗之类的话，身后两张巨幅的克梅斯凯肖像和马科思肖像几乎平分了整个幕布。\n中央党部的狮鹫一边拍爪一边走上来。\n“小同志，你刚才的演说真是棒极了！同为党员，我们这些老家伙实在是羞愧啊……所以，我们才希望各位赐教一下这类工作有什么要点？”这位老党员一边说着，一边伸出爪子期待握爪。\n改造同盟听到这什么也没说，只是冷冷地看着那只伸出来的爪子，气氛凝固了好一会，直到老同志尴尬到准备收回爪子，改造同盟才不情愿地把爪握住：“这些事交给我们来做就可以，您平时事务繁忙，这时候关心细枝末节有什么用。”\n老同志脸上的笑容更加僵硬了：“同志……这……我们难道不能问问你们的工作方法吗？你看，我们老同志也想了解基层……”\n年轻狮鹫对此也没有回应，只是随着他们的眼神愈加冷漠，那位老狮鹫的声音也越来越小。\n“这我可不能苟同！”另一位在分发材料的狮鹫见状走上来大声说，“你们天天躲在办公室里头领着高级工资看报纸，我要怎么相信你们真的信奉‘鹫鹫平等’？”\n“那么，您还是去办公室处理那些上传下达的公文吧，那里更需要您。”年轻狮鹫用表面尊敬的语气讽刺到。\n“好，好，既然你们是这个态度，那我跟你们也没什么好说的。我马上走，不过我倒是看看这共和国到底是共和党还是嘶大林格勒的”老狮鹫不再争辩，面色一冷，拉起自己的几个伙伴转身离开。\n“我期待那一天的到来。”这会那个改造同盟狮鹫倒是奇怪的说了这样一句话。"
FAT_FP.32.a:0 "你期待那一天吗？"

FAT_FP.33.t:0"共和党第六届党员大会"
FAT_FP.33.d:0"对于全世界各大政党来说，召开这样的党员大会往往都伴随着永远吵不完的争执，而对于共和党这样试图包涵所有鹫的组织来说就更是如此。无数狮鹫前往漫云城，他们很自然的分成了两拨，一些鹫在会议前就在各个场合表达了对嘶大林格勒过分干预党内事务的不满，利用倾向于他们的报社历数自己的革命资历，痛斥嘶大林格勒的顾问不符合狮鹫尼亚的实际，而另一些则加入了工会与游行的行列，似乎打算乘着党大会的时间在社会改造同盟的大本营学到社会主义者的经验与方法，并用到自己的党支部中。\n两派自然而然的利用明里暗里的手段开始了攻讦，“嘶大林格勒忠犬”“封建老顽固”无数的谩骂与不断的游行，似乎漫云已经处在了内战边缘。\n然而，当会议开幕，登记、安检、入座，两个派别在会议上却展示出了团结的面貌，克梅斯凯早已正襟危坐在主席台上，被讲台挡住了整个身躯，他的身旁是6位主席团成员，虽然社会主义浪潮喧嚣尘上，主席团中仍然只有镰爪是公开的社会主义者。\n会议正式开始，克梅斯凯站起身发表开幕致辞，“根据共和精神制定的共和党党章赋予的民主原则”、“以广大农民和工鹫为核心利益群体的统治根基”以及最重要的“在三民主义指导下团结一致推翻封建专制的不屈理想”，根据这些精神召开本次大会。开幕词结束后，党员一致地热烈鼓掌将团结气氛继续延续。\n接下来是近乎流程性质的总结过去共和党的成就，随后大会开始了选举执行委员会的流程，团结到此为止了。每一位执行委员会委员表决都引起了空前的动荡，按部就班，党内新星艾勒斯特自然成为了执行委员会成员。出乎意料，之前专心军务的曜尾进入了执行委员会。事先谈好的支持喝彩与临时变卦导致的愤怒在会场回荡，花了比预想的多得多时间，共和党执行委员会名单出炉，而最终结果是。"
FAT_FP.33.a:0"更多的社会主义者进入了执行委员会。"
FAT_FP.33.b:0"仅有镰爪与艾勒斯特加入了执行委员会。"
