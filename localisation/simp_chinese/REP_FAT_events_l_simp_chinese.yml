REP_FAT_history.1.t: "长征漫云"
REP_FAT_history.1.d: "随着革命军在赫兹兰的惨败，克梅斯凯元帅率残部长征至漫云公国，利用社会主义者与当地共和派的支持，漫云公国爆发了大量民众起义，革命军在得到漫云狮鹫支援后战胜了公国军队入主漫云城。得到喘息机会后，克梅斯凯带领革命军重整旗鼓击溃了帝国北上的追击部队。帝国诸侯在意识到革命军依然保有余力后，对北上彻底剿灭共和派丧失了兴趣，比起费力不讨好进行远征，他们更关心如何在混乱中的狮鹫帝国为自己攫取更多利益，于是，双方暂时熄火，帝国在北部建立了一条防线隔绝共和派势力，共和派也得到了喘息的机会休养生息。"
REP_FAT_history.2.t: "漫云新政"
REP_FAT_history.2.d: "来到漫云的共和军迅速实行了一系列改革措施，废除了各种封建制度，共和国设立各种机构管理国家，实行了民主制度，同时利用北上流亡者带来的各类技术鹫才创立工业，漫云社会为之一新。然而漫云新政并非十全十美，首先，漫云工业的建设主要为满足军事需求，为支持反攻帝国重任，克梅斯凯继续扩大军队，征兵造成的负担压在漫云狮鹫身上。为筹措军费，一些商鹫获得了特许经营权力，他们的存在助长了腐败，民众生活水平并未提高。其次，由于怀抱泛狮鹫主义理想，共和国议会由跟随克梅斯凯北上议员占据，赫兹兰阿奎莱亚乃至翼巴蒂狮鹫充斥议会，漫云本地狮鹫仅获得极少议席，克梅斯凯制定《戡乱动员法》宣布暂停议会选举，议员任期延长，克梅斯凯就任共和国陆海军大元帅直至完成革命，民主选举仅限于市镇范围，这挫伤了许多漫云狮鹫的热忱，也造成了隐患。在外交领域，狮鹫共和国并没有获得突破，阿奎莱亚革命失败，南方共和力量濒临灭绝，天落城冷淡以对，贸易受到阻挠。出访小马利亚的使团受小马贵族势力反对无功而返，共和国毫不妥协的态度引发整个狮鹫大陆君主的敌意，比如近在咫尺的风暴翼王朝，克梅斯凯必须写出解决的方法。"
REP_FAT_history.3.t: "漫云争论"
REP_FAT_history.3.d: "赫兹兰革命与阿奎莱亚革命的相继失败使克梅斯凯不得不反思过往革命所存在的问题，显然，共和派虽然一时声势浩大，但当革命陷入低潮后，许多共和派立马改换门庭又与帝国狼狈为奸，战争过程中缺少令行禁止的中央，各自为战的共和派往往被敌对力量各个击破相继失败，更不用说还有军阀问题——黑石从战争中逃跑，迈耶在共和国失败后拉走了共和国的仅存的空军在豪客兰占山为王，共和党对此完全无力阻止。克梅斯凯意识到，松散的共和俱乐部无法承担革命重任，必须建立强有力的组织。但克梅斯凯最初却打算以个鹫权威统治一切，在漫云城中克梅斯凯召开会议，宣布国民共和党将重新改组，所有党员要求重新入党，必须立爪印向克梅斯凯本人发誓效忠这一政策并没有得到国民共和党大部分成员的支持，曾经与克梅斯凯达成联盟的社会主义者拒绝宣誓效忠，镰爪拒绝重新加入共和党，随后带领支持者北上天际。在克梅斯凯的亲密支持者中也存在异议，阿奎莱亚的韦朗尼便批评这样做毫无意义。\n\n“党员是为革命事业而奋斗，而不是为了某一个鹫。”韦朗尼如此评价。\n\n盟友的批评让克梅斯凯有所冷静，随后爆发的瑰翼叛乱事件则让克梅斯凯彻底清醒。瑰翼曾经是克梅斯凯的坚定追随者，同时也是克梅斯凯的好友，但在入主漫云后，瑰翼对革命事业逐渐心灰意冷。以漫云贫瘠之地如何对抗庞大的狮鹫帝国？瑰翼对弗羽西亚的立宪模式充满了兴趣，希望能与弗羽西亚大公达成合作改革帝国，瑰翼与克梅斯凯进行了几次讨论，双方关系逐渐疏远，在又一次争吵后，瑰翼被克梅斯凯撤销了参谋长职位，瑰翼虽隐而不发，但开始秘密联络政变力量。"
REP_FAT_history.4.t: "瑰翼叛变"
REP_FAT_history.4.d: "993年，瑰翼同漫云本土派达成协议取得了漫云本地部队的支持，他将发动兵变推翻克梅斯凯，迎回漫云大公后裔建立立宪君主国，993年6月，瑰翼发动兵变，炮击漫云大元帅府，克梅斯凯由耀尾带领总统卫队杀出重围逃离漫云城前往翼哈根。在翼哈根，克梅斯凯重新建立大元帅府，发布宣言讨伐瑰翼，绝大部分共和党成员响应号召，共和军也支持克梅斯凯领导，重整旗鼓的克梅斯凯迅速回师漫云城，直到此时他依然发布宣言劝说瑰翼不要继续进行反革命的倒行逆施之举出城投降，但瑰翼心意已决，双方爆发战斗，瑰翼失败后只能向北逃窜，但仍保有相当多军队与共和国对峙，由于担忧帝国力量，共和军无法集中精力打击瑰翼，瑰翼由此在漫云北部建立了自己的独立王国。"
REP_FAT_history.5.t: "克梅斯凯—谢罗夫宣言"
REP_FAT_history.5.d: "对于困境之中的共和国，小马利亚爆发的新革命成为了意外的转机。由于瑰翼在北方的活动，天际的社会主义者也深受其害，新生的嘶大林格勒对狮鹫大陆的革命活动表达了支持，而克梅斯凯则意识到嘶大林式政党是解决共和党顽疾的良药。在996年，嘶大林格勒代表谢罗夫先后访问天际纳维亚与漫云城，在与克梅斯凯会谈后双方发表共同宣言，双方达成了共识：\n\n“……克梅斯凯大元帅以为共产主义，甚至苏维埃制度，事实上均不能引用于狮鹫尼亚。因狮鹫尼亚并无使此项共产主义和苏维埃制度可以成功之情况。此项见解，谢罗夫完全同感。且以为狮鹫尼亚最要最急之问题，乃在共和统一之成功。关于此项大事业，谢罗夫并确告大元帅，共和国事业当得到嘶大林格勒国民最挚热之同情，且可以援助为依赖也……”——《克梅斯凯—谢罗夫宣言》\n\n随后，谢罗夫协调天际纳维亚与共和国共同出兵讨伐瑰翼叛军，在双方合作下瑰翼叛军战败，最终逃离漫云辗转至天落。而镰爪与克梅斯凯达成了和解，镰爪重新回到漫云城，国民共和党进行第二次改革。"
REP_FAT_history.6.t: "改组国民共和党"
REP_FAT_history.6.d: "997年，漫云城正式召开改组会议，国民共和党取消向领袖宣布效忠仪式，制定严格的党内规章与严密的架构，效仿小马利亚式社会主义政党推行民主集中原则。克梅斯凯作为当然之领袖经过全体代表大会选举成为新国民共和党总理，以镰爪为代表的社会主义者重新加入国民共和党。此次改革同时重新诠释了国民共和党所实行的三民主义。\n\n民权—推翻帝国，建立共和\n民主—实行民主，一统狮鹫\n民生—扶助农工，节制资本"
REP_FAT_history.7.t: "黄金时期"
REP_FAT_history.7.d: "共和事业转危为安，为杜绝瑰翼叛乱的再度发生，共和国决定建立漫云军校，培养一批忠诚于革命与共和国的新军官，在嘶大林格勒支持下，克梅斯凯改革国内经济制度，建立国有企业促进工业发展，同时对军队进行了现代化改造，建立装甲部队与现代化空军。与嘶大林格勒的贸易也促进了漫云经济恢复，在社会主义者的帮助下，漫云社会面貌发生了极大的改变，现代化建设如火如荼的展开。随着漫云共和国的力量日益增强，南方的共和力量也重新得到了恢复，受嘶大林格勒影响的社会主义者纷纷加入共和国事业，南方革命网络重新建立。共和事业重新焕发生机，而帝国则还没有完成改革，各路诸侯依然围绕狮鹫海姆勾心斗角，漫云城成为了狮鹫革命中心，许多有志青年纷纷越过帝国封锁线前往共和国。随着社会主义者艾勒斯特当选漫云市长，他开启的改革有效提高了居民的生活水平，社会主义者的奔走宣传收获了民心，共和事业逐渐从上层扩散成为全民支持的事业，工会与农会得到建立，蓬勃发展的工鹫与农鹫运动支撑着共和力量的壮大。"
REP_FAT_history.8.t: "隐忧"
REP_FAT_history.8.d: "虽然一切正在朝着好的方向发展，但共和事业从来不是万事如意。社会主义者在党内不断增多，新入党青年往往先自命为社会主义者而非三民主义者，并认为建立共和不过是革命的第一阶段，随后就将在狮鹫尼亚实现嘶大林格勒式的共产主义，这样的趋势引发了老党员普遍的担忧。\n\n“如是如此，则国民共和党生命只余30年……”——与镰爪对谈后惊讶于镰爪表示30年后即可在狮鹫尼亚实现共产主义的克里格。\n\n在军队中，耀尾的崛起成为了党内保守派的支柱，耀尾在瑰翼叛乱时保卫克梅斯凯，在军事改革中成为了漫云军校校长，他曾经出访嘶大林格勒与小马利亚，认为小马的方式无法解决狮鹫的问题。而社会主义者内部的独立活动也招致批评，许多共和党鹫表示，社会主义者并没有遵循和解的原则，仍然保存着独立组织。主管财政的金羽也受够了工会农会组织的活动，不断有商鹫向他抱怨企业经营的困难，这样的状态下他极难保证税收。翔日也曾向克梅斯凯表示，小马利亚的许多支持者因为共和国同嘶大林格勒的关系疏远了共和国。帝国势力仍然强大，南征尚需时日，国民共和党的团结必须维系，克梅斯凯却年岁已高。\n\n革命尚未成功，同志仍需努力——1007年克梅斯凯元帅新年讲话。"


