FAT_FP.38.t:0"农协暴力案"
FAT_FP.38.d:0"施纳贝尔·翔日漫步在共和国的乡村之间，对于他这样领袖级别的生灵，能有这样的闲暇时光实属难得。克梅斯凯大总统一直说要帮扶农民，所以农民协会就应运而生了，这个组织一直以来都由社会主义者运营，翔日决定自己应该亲眼去看看。\n翔日本来想直接到农协的办公室里面谈一谈，但他发现田沟里有几只狮鹫围着一只狮鹫，看样子好像要打起来，他赶紧跑过去呵止了他们：“停下！不要打架！农协的工作人员呢？快出来管管！”\n被围着的那只狮鹫像看到了救星似的爬起来：“好心的先生！幸亏您及时赶来了，您可一定要主持公道啊！”\n那几只围着他的狮鹫之中有一只看起来明显是带头的：“我就是工作人员。这不是翔日先生吗？没想到您还愿意屈尊来考察我们啊。”\n翔日又气又恼：“你既然是农协的工作人员，为什么还带头打架？这也是你们工作的一部分吗？”\n那狮鹫说：“你可是不知道，现在你身边那装得可怜兮兮的家伙祖上三代都是地主，他们家族的爪上流着多少农奴的血汗？不错，他是把家里的土地吐出来了，但他竟敢发牢骚，还用恶毒的语言攻击革命。这难道不是封建思想的顽疾？对这种冥顽不灵的家伙难道不该进行深入教育？”\n眼见旁边的狮鹫都被这番话煽动起来，翔日咽了咽口水：“封建残余是该教育，但绝不应该用拳头和棍棒。这事能在路边被我遇见，说明这绝不是个例！你们把地主们打一顿，只能换来他们口头的服从和内心的恐惧与憎恨，通过这样的方式建立的秩序，完全是对三民主义的亵渎！他们认识不到自己的错误，只能说明你们的思想工作没有做好。农协应当是生产机关，而不是暴力机关！”\n那工作人员又瞪了地主一眼：“既然叫‘农民协会’，那和乡村有关的事就都应该交给我们办，思想教育和维持秩序也当然该归我们管。翔日阁下，有什么指导意见的话可以用更规范的方式提出来。”\n翔日意识到继续跟他辩论没有任何结果，他默默把那位前地主送回家了。回到办公室，他决定把今天发生的事上书给总统。\n不多时，总统就发来了回信，翔日打开信封，克梅斯凯的意见是："
FAT_FP.38.a:0"必须终止这种暴行，限制其权力。"
FAT_FP.38.b:0"这只是偶然事件，他们能自我纠正。"

FAT_FP.39.t:0"农协抗议"
FAT_FP.39.d:0"在听取了翔日的报告后，克梅斯凯决定要限制农协权力，他可不希望滥用暴力。从此以后，农民协会变成了一个专职生产管理的组织。\n农协会员当然不喜欢这样，他们认为因为少数几个极端分子而剥夺所有鹫的权力是很不合理的，本来他们自己就能把所有事都办好，现在却要跟其他狮鹫合作。这个“其他狮鹫”当然就包括了更多民族主义和谐律主义的狮鹫。他们的理念大多跟自己不同，在处理乡村事务的时候在做法也可能完全不同。看到自己曾经立下的规则被这样更改，农协对此很不高兴。有的狮鹫会三天两头地去跟其他狮鹫起争执，有的狮鹫干脆直接开始消极怠工。这么下去可不行，翔日只能再想办法拨乱反正，挨个村庄去宣讲肯定不现实，于是他决定撰写一篇文章尝试又一次纠正农协的思想。\n文中写到：“工鹫和农民一直以来都是国家的根本，也是革命最基本的底盘。正因如此，作为管理人员的我们才更应当以身作则调和矛盾，光搞党争不干实事的唯一后果就是破坏革命根基，希望底层的工作人员能够意识到这一点，以更加宽容的心态和同志们交流。”\n这篇文章很快播散到了各大乡村，当地的农协也都阅读过了。虽然翔日没有在文中指名道姓地说这是农协的问题，但农协自己肯定意识到这就是为他们而写的。当他们静下心来思考后，发现其他派系的狮鹫着实没有怎么难相处，反倒是自己开始阻挠他们的工作……\n“也许翔日先生是对的，这次是我们犯错误了。”"
FAT_FP.39.a:0"这场小风波总算是结束了"

FAT_FP.40.t:0"地主外逃"
FAT_FP.40.d:0"翔日的报告并没有引起克梅斯凯的重视，见此，农协针对地主的“彻底革命”就更加肆无忌惮。在又“教育”了一批地主之后，剩下的地主意识到自己不能再坐以待毙，他们的土地虽然被再分配了，但他们世代积累的财富仍然足够他们远走高飞。奢侈一点的跑法是把自己家的贵重物品全部打包，或坐飞机或乘船跑到像小马里亚那样的地方；一般点的跑法则是把东西装到棚车里，雇几只健壮的小马拉着他们一家从荒野悄悄溜出国境线去南方的帝国。\n雅默克老爷以前就属于小地主，他主动把土地让了出去，希望能因此不受迫害。但随着农协的权力膨胀，他们一家也成为了需要教育的对象。雅默克不愿再居住在这个革命的国度，他决定从最热门的路线，也就是从共和国东南方偷渡去施塔莓的土地。帝国很愿意看到有生灵从共和国逃过来，这样他们就能大肆宣传“革命的暴政”了。\n这条路线需要经过几片森林，遇到强盗的风险比较高，况且这种行为属于偷渡，所以雇佣小马的费用要高很多。即便如此，也比船票和私人飞机便宜。雅默克一家比较幸运，他们没有遇到强盗，但在离施塔莓10km的边关被拦住了。\n边关的检查官要求雅默克老爷出示手续文件，雅默克点头哈腰地把一个文件袋递了过去，希望自己花大价钱伪造的手续不会出问题……\n检查官拿起文件仔细核对纸上的项目和雅默克的棚车，雅默克感到心脏似乎都要跳出来，他尤其不敢看纸上那鲜红的伪造的印章。好在有惊无险，检查官并未发现有什么问题，他命令道：“开闸！”，这才有几个士兵把边关打开。\n那几只健壮的小马又拉着雅默克一家的车子向施塔莓跑去，雅默克躺在车上的软垫子里拿手帕擦了擦冷汗。他的妻子不禁问他：“共和国一直说要打倒帝国，咱们跑到这真能长久吗？”\n雅默克没有看向她：“他们打不赢的。他们打不赢的……”"
FAT_FP.40.a:0"您就尽情逃跑吧，共和国不在乎"

FAT_FP.41.t:0"土地法争议"
FAT_FP.41.d:0"虽说共和国的确废除了封建制度，也建立了农协管理乡村，但地方与地方之间的管理模式可以说完全不同，在实际操作中毫无规范可言。现在的情况是，绝大部分小地主已经不再造成困扰，但旧时代的少数大地主仍然保持着相当高的影响力，他们拥有完备的私人武装，农协无法与他们对抗。克梅斯凯知道后，决定彻底解决这一问题，必要时刻可以动用强制手段推行新政策。那么现在最大的问题就在于，具体要为这个“新政策”制定什么内容。\n社会主义者提出，嘶大林格勒的成功经验已经表明，土地的完全集体化才能真正保障民生。在顾问的帮助下，集体化已经在某些地区初具成效，将土地置于集体的管理下就能从根源上杜绝土地兼并的问题，按照现在的势头，只要国家出爪铲除剩下的顽固大地主，就能一劳永逸地解决土地问题。\n保守派反对称，嘶大林格勒的集体化模式曾导致粮食大量减产，世界上很多国家都允许农民拥有自己的土地，配合减租减税等一系列补贴制度也能保证农民的生活质量和粮食产量，因此没有必要冒着风险去搞全面集体化。\n克梅斯凯犹豫着，他很清楚两种方案的利弊，地区的集体化工作到现在确实没有出现过什么问题，但嘶大林格勒的前车之鉴提醒着他这一政策的风险。最终，他决定听听实地考察过的翔日关于这个难以抉择的问题的意见。翔日回答："
FAT_FP.41.a:0"集体化的前景不可估量。"
FAT_FP.41.b:0"稳妥一点总不会出错。"
ngxie_zhongli_tt:0 "农会政治倾向改变为§Y中立§!"

FAT_FP.42.t:0"民生主义的内涵"
FAT_FP.42.d:0"三民主义之民生，在多年的努力后终于实现了。如今的土地已经服务于鹫民，旧公国遗留的封建主再也不能把农民拴在土地上奴役；在工会的管理下，工鹫福利与工业建设齐头并进，铸造了革命的钢铁基座；新兴的各类学校扫荡了千年以来普通生灵的愚昧，并以先进的革命思想武装他们的头脑；各级党员以身作则，成功引导了社会风气，共和与自由已经流动到了每一条大街小巷。克梅斯凯满眼欢喜地看着这片土地几年间发生的翻天覆地的变化，决定召开一场会议作为民生主义的总结。\n会议如期在漫云城召开，在以喜悦为基调的这场大会中，就连不同派系的狮鹫们都少见地没有发生争吵。克梅斯凯站在巨幅的三色旗前发表致辞，他热烈地肯定了在各党员和群众的不懈努力下国内迸发的新生机，这对于革命的发展是极其重要的一步。总统的发言得到了一致掌声，而后是个派系的领袖发言，其中艾斯特勒和翔日的发言最值得关注。\n艾斯特勒兴奋地说：“我要尤其感谢克梅斯凯大总统的信任，有了这一点我们的同志们才能放心地推进那些原本看起来‘不太可靠’的办法。无论是来自外部的先进思想，还是我们内部探索出的新办法都取得了骄鹫的成绩，这无不说明了民生主义和社会主义之间高度的重合。毕竟，我们正是在这样的思想指导下才完成了这些惊鹫的壮举。”\n翔日无意否认社会主义在建设民生工程中发挥的重要作用，但在这样的大会上这么邀功还是有点张扬了。他没有直接否认艾斯特勒的说法，而是说：“我们多年以来建设的民生主义，可以说几乎都是基层群众和党员的功劳，最终也是为他们服务的。我时常在想，民生主义的内涵当然可以用一大堆专业术语来描述，但其归根结底，所有为了创造鹫民生活安宁的举动不都可以归于民生主义吗？民生主义应该是一个更宽泛的概念，它属于每一个心中有共和的生灵。”\n克梅斯凯微微一笑，他说出了在他心里，民生主义的最终内涵——\n\n……其实，无论要怎么对民生主义下一个最终的定义，都不会影响夜中坐在新家具上饮茶的共和国最贫困的农民，也不会影响正和家鹫享受热腾腾餐食的最贫困的工鹫。漫云城离他们很远，但民生主义离他们很近，近到他们正躺在它的怀抱之中。不过，既然大总统都已经发话了，那么看一看报纸上刊登的他的想法也没什么不好的。白纸黑字就写在那里，谁都不能更改："
FAT_FP.42.a:0"民生主义其实就是社会主义。"
