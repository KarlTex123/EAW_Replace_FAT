FAT_FP.7.t:"瞬息万变的世界格局"
FAT_FP.7.d:"三十年之间，整个世界的格局发生了翻天覆地的变化，我们不能再用以前的战略目光看待世界，我们现在需要重新审视这个世界。\n马奎斯，狮鹫尼亚，斑马里加，革命愈演愈烈，世界的新格局将会在不久之后到来，而我们将成为它的塑造者。现在，挡在我们伟大理想目前的最大敌人——狮鹫尼亚帝国，已经开始了他的行动，我们也必须尽快进行国际外交，寻找盟友，壮大自己的实力。\n北狮鹫尼亚算不上什么富庶之地，但是为了有一个稳定的后方以及解放他们，现在是时候行动了。"
FAT_FP.7.a:"我们必须这样"
