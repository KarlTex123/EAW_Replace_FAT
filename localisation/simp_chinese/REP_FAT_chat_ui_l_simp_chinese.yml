#办公室内，克梅斯凯眉头紧锁，他的目光一直在墙上那副新狮鹫尼亚的地图上。这时，曜尾推开了办公室的门，敬了一个军礼：“大元帅，新狮鹫尼亚已经爆发了内战。” 似乎是觉察到用词不当，曜尾顿了一下，继续补充：“不，革命爆发了。”克梅斯凯转过身，脸上带着不易察觉的悲伤：’茶羽还在的时候我就忧心忡忡，我写信劝过他要注意高丘这个鹫，新狮鹫尼亚共和国不稳定的来源就是他，如今茶羽被刺杀了，唯一能让他安分守己的枷锁已经不在了。”曜尾看向办公室墙上的新狮鹫尼亚地图，上面画满了作战计划，看起来大元帅已经准备好了他的行动，他说道：大元帅，是否立刻进行对新狮鹫尼亚共和国的革命支援。“得慎重考虑”克梅斯凯站起身来，“新狮鹫尼亚的同胞和同志们需要帮助，但是他的地缘环境非常复杂，嘶大林格勒也肯定会参与其中，你去联系加里波第和星风。让他们来作战会议室集合。”新狮鹫尼亚的局势就如同即将到来的风暴，没人知道它会如何发展，共和国必须在其中发出自己的声音。

