l_simp_chinese:
  EX_Magic_Cannon.1.t: "新武器的测试"
  EX_Magic_Cannon.1.desc: "军械库内，蔚蓝时光与一群军官围站在刚刚下线的一箱魔法步枪旁，随后将它们带往靶场进行测试。\n“咻咻咻！”——独特的魔法激光接连射出，立在不远处的三个靶子应声碎裂。\n\n“威力确实不错……”蔚蓝时光端详着蹄中的魔法步枪。这类依靠魔法水晶驱动的枪械，比传统火药枪支杀伤力更强，但制造成本也比传统枪械更高。更关键的是，它的可靠性实在令马担忧：在连续数十天的极限测试中，一千把魔法步枪超过一半出现了各类损坏与故障；而在暴力运输测试中，故障损毁率甚至升至六成到七成半。这样的表现，显然难以满足共和国的实战需求。\n\n这天，蔚蓝时光在军械库里踱步巡视，目光四下搜寻。忽然，她注意到一堆被防水布遮盖的物件。掀开一看，底下竟整齐排列着一批早已落伍的老式火炮。"
  EX_Magic_Cannon.1.a: "答案呼之欲出"
  EX_Magic_Cannon.2.t: "魔法科技"
  EX_Magic_Cannon.2.desc: "[ROOT.GetLeader]独自坐在办公室内，爪尖缓缓翻动着堆积起来的文件，偶尔在纸页边角批下几个字。午后的阳光斜照进来，在桌面上投下一片安静的光区。\n\n就在这时，一份颜色略浅的文件从纸堆里滑落出来——这是蔚蓝时光送来的那份。他目光扫过上面的内容，眉头微动，随即取笔签下名字，并唤来侍立在门边的卫兵：“这份文件，让鹫加急送去，一刻也不要耽搁。”"
  EX_Magic_Cannon.2.a: "“共和国需要这种装备来弥补火力上的缺陷”"
  EX_Magic_Cannon.3.t: "大获成功"
  EX_Magic_Cannon.3.desc: "在炮兵营的演练场上，一门崭新的火炮静静矗立。蔚蓝时光与克梅斯凯和几名军官站在不远处，注视着炮兵们的每一个动作。\n士兵们熟练地操作着，将一枚155mm炮弹被稳稳送入弹膛，发射药装填完毕。所有人员迅速退至安全位置，唯有火炮手手中的拉火绳缓缓绷紧。\n\n“轰——！”\n\n巨响震彻天地，炮口喷涌出炽热的火光与浓烟。炮弹划破长空，拖着隐约的尾迹，瞬息之间便精准命中作为靶标的一辆废弃卡车。\n\n爆炸声随后传来，火焰与黑烟腾空而起。待硝烟逐渐被风吹散，原地只剩扭曲的车架残骸，一切都已被摧毁殆尽。"
  EX_Magic_Cannon.3.a: "“测试结果：成功”"
  EX_Magic_Cannon: "155mm“粉碎者”魔法榴弹炮"
  EX_Magic_Cannon_tt: "§Y新的武器将被推上研发日程......§!"
