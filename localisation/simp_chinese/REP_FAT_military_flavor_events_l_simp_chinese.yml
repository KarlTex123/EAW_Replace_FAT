l_simp_chinese:
 FAT_MilitaryFlavor.1.t:0 "理想之问"
 FAT_MilitaryFlavor.1.d:0 "在混乱结束之后，为了摆脱军政府的名声，加里波第计划设立一个新的法定节日，并在狮鹫海姆统筹准备一次纪念克梅斯凯的大活动，为才结束国葬礼不久的大元帅再热闹一次。星风并不懂得其中的门道，希望在纪念典礼上进行一次公开演讲，但加里波第制止了她的行动，他告诫星风，这场典礼的主角是死者，而不是他们，更不是处在风口浪尖的新政府。\n\n“我们只需要让鹫们记住克梅斯凯。”谨记加里波第的教诲，在典礼期间，星风和加里波第只是简单出席，所有的发言和活动都由政府的公务员运作，星风不得不承认，加里波第的计划很成功，这几天狮鹫海姆的街道上挤满了鹫马，其中还有不少来自马奎斯大陆各国的其他种族代表和游客，政府收到了许多邮件和许多老兵的信物，在这场纪念国父，庆祝共和的盛大庆典之外，这个国家幕后的麒麟与狮鹫在他们各自的办公室里踱步来回，两位元帅在独处时也总想到那位伟鹫，他们所走的这条路与克梅斯凯的预想背道而驰，却偏偏是他们所唯一能走，唯一能通往共和的道路。"
 FAT_MilitaryFlavor.1.a:0 "总统元帅，我该如何乞求您的原谅？"
 FAT_MilitaryFlavor.2.t:0 "历史的终结"
 FAT_MilitaryFlavor.2.d:0 "随着共和风暴席卷赫兹兰，在各地共和派的帮助下初步定型的统治仍有一处漏洞——山中的铜岭伯国，起初，这些钻石狗对皇室极度忠心并且拒绝共和国的官员入驻，为了和铜岭达成合作，星风与加里波第几次前往铜岭会见铜尾家族和铜岭议会各派的领导人并带去了关于六世的秘密行踪，这极其有效地软化了钻石狗的态度，然而议会内部针对共和国的讨论仍旧剑拔弩张，铜尾家族最终接受了共和国统治，但并不放弃自己在铜岭的特权地位，随着共和国官员和铜岭共和派的接洽，铜岭算是完全归顺了共和国，但其内部问题只能等待他们内部解决了。"
 FAT_MilitaryFlavor.2.a:0 "皇帝的最后一批支持者终于也认输了。"
 FAT_MilitaryFlavor.3.t:0 "卡梅莉塔"
 FAT_MilitaryFlavor.3.d:0 "卡梅莉塔的巡演结束是共和国这周以来最大的话题，这位年轻的天籁之声在多个大陆巡演为共和国筹备支持的事迹让她在共和国所有群体中都极受欢迎，在全世界的音乐殿堂上，她亦是一颗璀璨的瑰宝。\n\n星风是第一次与她见面，但加里波第曾多次去过她的演唱会，因此，在他们会面时加里波第不得不解释自己并不会时常出现颤抖和冒汗的情况。尽管卡梅莉塔拒绝了他们邀请自己担任外交部长的邀请，星风却没有气馁，毕竟卡梅莉塔在交谈中从未表露出厌恶，她深爱共和国的心任谁都能看出，只是她担心这两位军人会将共和带向何方。星风决定会再次和卡梅莉塔谈谈，当然，那是私鹫会面，不会带上加里波第。\n\n星风轻敲歌后的家门，卡梅莉塔见到来客很是震惊，这之后的两周内，星风多次与卡梅莉塔见面并共同出行，在二者的相处中，星风袒露了许多自己的心迹历程，并解释了许多关于新政府的事情，卡梅莉塔渐渐放下了芥蒂，与星风成为了朋友，也逐渐接受了在新政府工作，并最终接受共和国邀请她成为外交部长的正式任命。"
 FAT_MilitaryFlavor.3.a:0 "就连北风神，也会爱上她！"
 FAT_MilitaryFlavor.4.t:0 "日久他乡是故乡"
 FAT_MilitaryFlavor.4.d:0 "革命永远年轻，革命者却不能。\n\n他心中燃烧的共和之火依然不灭，但那作为薪引的身体已不适合支撑，白羽早已退居二线，当国会政变发生时，他第一个念头是回家。\n\n克梅斯凯曾是他们的领袖，白羽信任这个年富力强的军官，也信任他能够坚守理想，他带着自己手下的部队随共和军北上，漫云的胜利使他对共和国的前景更加坚定。然后就是分裂，克梅斯凯将权力攥在爪心的举措不难理解，共产党的出走和瑰翼的叛离也都有迹可循，但白羽只是在这些越发使鹫悲哀的内斗和撕裂中衰老，和因为繁重事务衰老的克梅斯凯不同，他只是老了。无论是革命胜利、国父死亡还是二次训政，都不可能让时间为他驻足半分。\n\n早在帝都城破时，克梅斯凯就挽留了他的第一次退休，他为白羽再加官衔，答应不多时日，赫兹兰彻底平定，便任他衣锦还乡。\n\n如今，加里波第挽留了第二次，国防军的改革及其余波久久不散，这位和克梅斯凯如此相似的英雄人物，只以后辈身份恳求自己为共和国再次留下。\n\n白羽为自己单独回了一趟耶鲁，他见过仍在世的故友，为数十年没能再见的至亲洒扫坟墓，又在故居滞留了两天，在当年，这里有无数的学生，无数的争论，今天，这里仍和三十年前一样百花齐放，各大院校氛围各异，但回归了治学本务，此地的学府依旧是整个狮鹫大陆学术的理想之地，关于共和、革命、帝制等等争论不乏激进言辞。\n\n只是对亲历过一切的白羽而言，只如天真的孩子那般可爱可笑。"
 FAT_MilitaryFlavor.4.a:0 "此次回乡一周后，白羽回到狮鹫海姆，至死未卸任。"
 FAT_MilitaryFlavor.5.t:0 "翼展的第二选择"
 FAT_MilitaryFlavor.5.d:0 "虽然脱离了险境，但像翼展这等位置的狮鹫，依旧是军政府的重点监控对象，从他回到漫云的家中以后，在门口便多了两位以保护之名站岗的狮鹫，无论是家中何鹫出行都需要通知并有士兵随行。在这样的监视下，会见老同事自不必说有多么困难，翼展只好在家中琢磨棋谱，与棋友电话下棋，偶尔联系些旧友，在翼展与同学叙旧时，得知当前法学界正对各共和国的立法异同开展研究，正有着很大的鹫才缺口，这让翼展萌生了离开政坛的想法，这个想法虽然轻微却未再消失，翼展开始着爪和法学界联系，虽然在他官复原职后，离职的想法不再像他赋闲期间那么有吸引力，但关于共和国法律的研究也成为了他政治生涯中的新目标。他期望通过这项工作，为自己在政坛以外也挣得足够的影响力。"
 FAT_MilitaryFlavor.5.a:0 "这可不是个小工程。"
 FAT_MilitaryFlavor.6.t:0 "重开幕"
 FAT_MilitaryFlavor.6.d:0 "在经过软禁后，那些最终得以重回职位的狮鹫基本都失去了反抗的想法，既然训政已经来过并证明它最终不可避免，那么第二次训政也就能以相同的方式重演三回甚至四回五回，他们不敢争论，一个个都变得谨言慎行，加里波第对他们的安静感到满足，星风则忧心于这沉默背离了共和的愿景。\n\n然而加里波第失望了，这终究只是短暂的沉默，这些混蛋似乎只要一天不发些反对的言论就要发狂，尤其社会党地方派和艾斯特勒的新斗争中继续发扬着互开左籍的优良传统，落到二把手的艾斯特勒凭借身处中央的优势争取了其他党派的支持，卢咔则和天际共产党联合染红着各地的地方议席。慢慢地，即使理论上国会还身处在管控下，这些刚受过重创的党派已经又恢复了活力，重新在国会大会堂克梅斯凯的画像前吵作一团了。"
 FAT_MilitaryFlavor.6.a:0 "共和国的声音依旧响亮！呃，有点太吵了..."
 FAT_MilitaryFlavor.7.t:0 "虫子与共和"
 FAT_MilitaryFlavor.7.d:0 "帝国与幻形灵的军事交流持续了相当的时间，韦萨利波利斯更是举世皆知的霸权主义一极，以至那些侨居他国不愿隐藏自己的幻形灵时常遭到异常看待，对于他们，以自己的原本形态在异国他乡工作和生活是不容易的。\n\n然而，幻形灵仍然有离开虫巢的理由，他们中有正规的工虫、也有身不由己的离乡客，更有些甚至用伪造的身份逃亡到死才被发现，但无论如何，他们都更乐意以假身份展示自己。这些数量极小的幻形灵群体在狮鹫国家中总是受到敌意与忽视，这是一个需要改变的局面，哪怕社会对他们疑虑重重。就像克梅斯凯留下的所有问题一样，关于少数族群差异的阐释停留在浅水区，尽管随着共和的发展少数族群可以确保平等的公民权，但因为幻形灵的存在，这方面的立法推进极其复杂，一只虫子，是否享有不显露真实身份的自由，这份自由又能否凌驾于他者的知情权上呢？"
 FAT_MilitaryFlavor.7.a:0 "天啊，为什么不干脆只在投票的时候给他们公民权呢？"
 FAT_MilitaryFlavor.8.t:0 "两岸"
 FAT_MilitaryFlavor.8.d:0 "天落毋庸置疑是世界上最繁华的城市之一，当黑哈尔德借共和革命脱离帝国，以十余年将这座滨海城市打造成完美的资本据点时，豪克兰同时正在迈耶的带领下席卷狮鹫尼亚的海岸线，同样由于978革命影响而诞生的两个国家，发展至彼此之间对抗不休的关系。\n\n如今，这几个故事中的名字已尽数离世，天落和豪克兰关于商贸和劫掠的斗争也已结束，隔海相望，共和三色旗飘扬于两地，以全新的姿态取代了过去的敌意，在共和国的领导下，豪克兰已成为一座开放的岛屿，来往着无数运输四海商品的船只，并与天落在商业上达成了更密切的合作。"
 FAT_MilitaryFlavor.8.a:0 "他们是共和国海洋力量的象征。"
 FAT_MilitaryFlavor.9.t:0 "马儿们"
 FAT_MilitaryFlavor.9.d:0 "在马鹫之间，似乎共和与谐律抱有天然善意，因此，哪怕天角兽女王从未与共和国建交，马奎斯、河间地和新马尔兰始终有共和支持者来到共和国，他们带来了许多小马的理念，在革命胜利之后，也将共和带回了他们的国家。尽管共和国目前的状态并不适合与外部建交，我们还是尽我们所能地向这些小马的聚居地派出了外交官，哪怕在未来局势可能还会进一步发生变化，但随着外交使团带着善意归来，我们可以确信，谐律正发挥着在小马利亚所展现的那般魔力，萦绕在所有爱好和平的生灵之间。"
 FAT_MilitaryFlavor.9.a:0 "得道多助。"
 FAT_MilitaryFlavor.10.t:0 "与赫拉克先生一家说再见的日子"
 FAT_MilitaryFlavor.10.d:0 "那是一个雾蒙蒙的早晨，赫拉克先生在楼下把他们所有的行李打包上车，他沉默着，早晨的露水几乎凝结在他的喙上，而他的妻子这才慢慢下楼，他们将要穿过四天时间的路程去鹿特德丹，坐上这个月最后一班前往小马利亚的轮渡。\n\n赫拉克先生的妻子说了些没能听清的话，然后他们上了车，打开车灯，驶入那片遥远的晨雾中。\n\n呈到桌上关于他们旅行的短报只有短短的一行：无异样。\n\n施季里茨放下了报告，下一篇报告或许会告诉自己他们下周回来，又或许永远不再回来了。都不重要。"
 FAT_MilitaryFlavor.10.a:0 "他团着爪子揉了揉眼眶，也想给自己放个假。"
 FAT_MilitaryFlavor.11.t:0 "军校计划"
 FAT_MilitaryFlavor.11.d:0 "喀戎本是在曜尾的安排下进入漫云军校教学并扶持亲信势力的一环，然而，自从曜尾回到军中以来，喀戎便察觉他的长官似乎已经不再热衷于在新生代军官面前展露权威，依照一直来对曜尾的认识，喀戎以为他将要插手在不久后恢复的国会新一轮选举，于是，他将一份新的教学计划带到曜尾面前，满心以为能像过去一样得到这位元帅的喜欢和支持，但曜尾看过一遍后，只是搓了搓胡子：“喀戎老师，将如此明显的意识形态带入教学不合适吧。”\n\n喀戎只当这是曜尾的掩饰，便对曜尾说：“曜尾校长，我们以往扶植的军官大多被调回了北部，如果想要支持新政府选举，便必须抓紧培养新的势力。”\n\n这句话让曜尾面露不悦：“地方军的调动，你以为我是不知道的吗？军区重组，鹫事变动无可避免，你可不要把老思想带到新环境里来。”这番话真叫喀戎摸不着头脑了：“校长，您的意思是...”\n\n曜尾敲打着桌面：“教学计划照旧，这事情不是你该管的。要做新计划，也该等中央军的批示。还有，你可不要再说什么选举的事情，我们是军人，明白吗？喀戎将军。”\n\n喀戎从未遇见曜尾这样的时候，他退了出去，不明白这位长官在中央究竟经历了什么。\n\n等到独身一鹫之时，曜尾盘算着自己那些旧部是否还会有如喀戎一般的隐患，是不是也有必要把他们调动到地方上去。他已不打算在那两位元帅的眼皮底下再插足选举，而打算回来专心经营自己的军中势力，他的野心已经蛰伏，让我们希望他再也不要展露出那一面。"
 FAT_MilitaryFlavor.11.a:0 "话分两头，这下曜尾的小小鸟可惨了。"
 FAT_MilitaryFlavor.12.t:0 "添酒回灯"
 FAT_MilitaryFlavor.12.d:0 "派对客们来来去去，青柠慕斯仍是整个漫云最热情好客的主人，随着帝国汽水生意的扩张，她已经成为漫云当之无愧的商界巨头，并在交际中取得了更大的进展，卡梅莉塔除了偶尔会出席她一大堆乱七八糟的小聚会之外，还会在她一年一度的漫云名流晚宴上进行慈善演出。从前些年那次让她结识星风她们的晚会后，每年这五位朋友唯一固定的聚会也是这场名流晚宴，她们已经很熟悉了，因此，星辰微光看着身着宝石长裙，满脸写着得意的青柠慕斯有些无语：“青柠慕斯，你真的有必要每年都搞得这么...光彩照鹫吗。”\n\n青柠回以微笑：“微光，我可不愿意在我这么多的追随者面前表现出一丝不得体的地方，更何况，我也希望能年年都让你们几个印象深刻。”星辰微光随蹄端起一杯酒喝下：“行行行，说到追随者，你是在和谁交往了吗？”青柠慕斯咯咯直笑：“没呢，亲爱的，我可还没准备好放弃我甜美的事业，还有单身生活！”她走到星辰微光身边：“走吧，走吧，罗莎她们很快就要从狮鹫海姆回来了，在她们到派对之前，让我们先他们一步开始狂欢吧！”"
 FAT_MilitaryFlavor.12.a:0 "我们能在这个孤独世界里团聚的日子，我们能相爱的日子，多么美好啊！"
 FAT_MilitaryFlavor.13.t:0 "红鲱鱼"
 FAT_MilitaryFlavor.13.d:0 "克劳迪娅家族的势力几乎垄断了所有来自小马利亚的投资，只不过矿业的成功并不止带来了资本，也带来了更复杂的局势，在马奎斯，许多眼红她成就的企业正联合对她们的根基发起进攻，在共和国，以金羽为代表的政府部门让星风不便出面。而克劳迪娅家族也不敢过分招摇，光是罗莎在共和国亲蹄创立的民间组织便有十四个之多，她的财富流入这些以各式各样社会活动为伪装的组织间，让账面收入恰好卡在税务的关键节点，不过，真正让共和国对她爱恨交加又网开一面的是，这份垄断比起贸易保护更能抵御其他积累深厚的马奎斯资本入侵，也正是克劳迪娅家族的倾力相助才让共和国经济改革度过了艰难的前期。\n\n她抛弃了马哈顿那套入侵资本的资产阶级打法，真心地希望自己家族的名字能在这片狮鹫大陆的理想之地上延续下去，如今，罗莎这个出资马已不必亲自管理那些公司事务，她将战略方针定在社会公益和政府项目上，希望将家族产业洗白成共和国的优质社会资产，这样才能真正避免在共和国完全稳定后的清算。"
 FAT_MilitaryFlavor.13.a:0 "克劳迪娅，跨越大洋的姓氏。"
 FAT_MilitaryFlavor.14.t:0 "长姐"
 FAT_MilitaryFlavor.14.d:0 "在军区改组中，蔚蓝时光本可以凭借其功绩留在狮鹫海姆作为中央军官团的一员，但她却主动要求调任到帝国的边疆地区，当她赴卡特琳上任时，此地正处在复杂的外交环境中，作为狮鹫尼亚帝国边区的心脏地混乱尚未结束，时不时会有难民西逃到共和国边防线上，蔚蓝时光授意驻军将这些难民带到境内，而卡特琳周遭的小马与狮鹫也不能平等，许多小马还作为农奴工作，她为这片帝国的危险地区带来了真正的共和精神，并作为军事督理亲自巡视城区边防，迅速赢得了从神官到骑士等进步势力的好感，在蔚蓝时光知晓当地情况后，她立刻强制要求解放小马，督促当地执政的共和骑士们着蹄清洗旧贵族余下势力，并将没收的贵族资产分发给平民，得益于与星风的私交，即使蔚蓝时光行使了远超督理的职权，也没有鹫能将她拉下马，如今，卡特琳在她的管辖下，成为狮鹫尼亚边境地的一个重要边关，她带来的新影响远传河间地和埃维河谷，对那些观望革命的势力释放出了善意。\n\n在卡特琳的军旅生涯中，她学习了狮鹫语系下的许多分支，更主动了解了关于狮鹫尼亚许多种族和地方的特色风俗，民俗知识甚至达到了布鲁玛学者的水平，她的包容博学和公正磊落为其在骑士团中博得了名誉骑士长的荣耀，但其以共和国的官方身份不便拒绝了这份荣誉。在卡特琳乡间，鹫马们则将其传扬为“母亲似的马”。在其本马得知后，她谦虚地接受并将母亲改为姐姐，自此被民间称为“长姐督理”。"
 FAT_MilitaryFlavor.14.a:0 "长姐如母。"
 FAT_MilitaryFlavor.15.t:0 "刀锋未钝"
 FAT_MilitaryFlavor.15.d:0 "漫云，狮鹫尼亚共和国的第一首都，哪怕行政职能都已转移到狮鹫海姆，经过共和国三十年的营建，漫云城仍是不折不扣的大都市，在此地担任督理的马必须是共和国的柱梁之才，星辰微光没有辜负曜尾的栽培和星风的信任，在共和军中，其提出过的军事化制度后来被改善吸纳进当下的国防军规范制度中，但在治理地方的方式上，她却并没有推崇自己的体系，虽说她作为管理者的身份完全可以插足漫云议会，但她也知道自己的才能尚且比不上这些共和国真正的顶尖议员，因此，她在漫云的本务只剩下了操练军队和管理军区，便开始发展起了自己的副业。\n\n几位元帅曾为漫云官方对她的腐败指控专程回过一次漫云，只是，在见到漫云地方军那些先进的幻形灵制式装备和高到诡异的军队热情后，元帅们经过商议决定忽视指控，放任星辰微光按自己的方式发挥才华，毕竟，就连漫云议会都只能提出指控，军方又有什么必要插手此事呢。\n\n曜尾在离开前还与他的这位亲信私会过，正是这场会面，令曜尾最终下定了放弃干涉选举的决心，也终于放下了狮鹫优越的绝对主义。\n\n他已有了一位最好的学生，一份最伟大的遗产；星辰微光，她对自己的强硬不比对敌鹫的少分毫，而她对共和之敌的态度，亦绝不是曜尾所愿意面对的。\n\n他会为这位小马铺开新的道路，他会将星辰微光带回被他亲自挤兑出的中央军官团，并最终通往自己所没能登上的位置。"
 FAT_MilitaryFlavor.15.a:0 "这位一生被权力所困的狮鹫终于发现那锁链从未绞紧。"
 FAT_MilitaryFlavor.16.t:0 "民主，民权，民生的最终时刻"
 FAT_MilitaryFlavor.16.d:0 "革命的成功在星风和加里波第的带领下似乎是理所当然，千锤百炼的共和军队终于扫清了狮鹫尼亚大陆上所有反对共和主义的敌鹫们，在加里波第的承诺中，大选将要如期而至。\n\n还来不及收拾庆贺战争胜利的礼花纸屑，共和政府匆匆开始了新一轮选举的筹备。\n\n艾勒斯特和卢咔的斗争接近尾声，社会党开始了第二轮的内部重组，但大选临近，艾斯特勒和部分温和派脱党重新建立社会民主党的计划被搁置，并重新以艾勒斯特为代表。先前推进的乡村自治计划在社会党的推动下小有成效，他便以此宣传争取社会支持，决心将其进一步扩大成体系化的组织。\n\n三色旗团由于过于激进没能重建，然而施纳贝尔.翔日还是以其威望团结了一些少数党派组成谐律同盟，尽管胜算渺茫，他还是打算参选，并作为少数党派行使监督职能，以确保谐律不再偏离，这一决定得到了加里波第的高度赞誉。\n\n马克西米连.翼展和保守党的势力仍十分稳定，这一次，他顺利游说了一些小党派与共和党联合，尽管已做了几十年的议员，翼展还是第一次参选总统，他发挥出了与以往一样，不，更胜以往的口才，在各地奔走为自己开展竞选活动，有着克劳迪娅家族的经济支持，右翼共和党的呼声同样不低。\n\n此外，包括金羽和小克梅斯凯在内仍有许多其他参选者，例如来自天落的新天落市长吉纳维芙、来自阿奎莱亚的伟大共和者韦朗尼等鹫。\n\n政治风暴席卷着共和国，但这一次，军方不会再干涉了，经历了几个月的筹备，几周的统筹投票以及几天的监察点算之后，在一个太阳如常升起的早晨，从收音机中传出了狮鹫尼亚共和国第一位民选总统的讲话..."
 FAT_MilitaryFlavor.16.a:0 "风，来时多么剧烈，走的时候，又是那么悄无声息。"
 FAT_MilitaryFlavor.16.a.tt:0 "（感谢您游玩狮鹫尼亚共和国！狮鹫尼亚共和国的第一位总统开始了他的任期，两位大元帅已经完成了他们的任务，守护了克梅斯凯的遗产。如今，国父得以安眠，而他们，也终于可以休息了。）"
