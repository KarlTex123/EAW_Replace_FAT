 FAT_fascism_party_long:0 "国民共和党民族革命同志会"
 FAT_ultranationalism_desc: "在与社会主义者达成合作后，一部分军官痛感国民共和党组织松散导致社会主义者几乎渗透到党的方方面面，他们聚集在耀尾身边，成立了一个秘密社团并影响着诸如退役军人协会之类的外围组织。革命同志会渴望通过强权手段与铁血方式壮大共和国，因此，同志会对正统三民主义也提出了自己的补充，即民族主义代替民主主义，他们认为世界各种族已经卷入生存竞争，必须尽快建立统一的狮鹫国家参与世界争霸，尽一切手段扩大狮鹫民族的生存空间。\n§W--------------§!\n§Y§4理论谱系：§!亚历山大·克梅斯凯所倡导的“三民主义”，是狮鹫共和国在其建国与戡乱时期的官方意识形态。与其说这是一套精密的哲学体系，不如说它是一个为了团结一切可以团结的力量、对抗共同敌人而构建的政治大帐篷。\n\n§4意识形态内涵：§!其核心理念被概括为“民主共和、民生福祉、民权保障”，但这三大支柱的具体内涵被刻意保持在一个高度笼统和模糊的状态，以确保其能够被共和国境内各种迥异的政治派别所接受。\n\n§4影响力：§!“三民主义”本质上不是一个指导性的思想纲领，而是一个策略性的政治容器。它的力量不在于其理论的深度与纯粹，而在于其外延的广度与包容。通过保持核心概念的笼统与惜蜘它成功地吸纳了从右翼民族主义者、资产阶级到左翼社会改良主义者在内的广泛同盟。§!\n"





