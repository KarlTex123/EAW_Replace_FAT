 FAT_neutrality_party:0 "中央政治委员会"
 FAT_neutrality_party_long:0 "国民共和党中央政治委员会" 
 FAT_republicanism_desc: "国民共和党包罗万象，数次失败的革命，三十年来狮鹫尼亚大陆的种种政治运动所造成的影响均可在党内显现。中央政治委员会由二十五席组成，每年改选三分之一，持不同政见的成员对革命与共和国的态度各不相同，但都在克梅斯凯的领导下对共和国的各类事务进行讨论决策，其下属各委员会负责指导共和国各机构，贯彻指令协调关系。\n§W--------------§!\n§Y§4理论谱系：§!亚历山大·克梅斯凯所倡导的“三民主义”，是狮鹫共和国在其建国与戡乱时期的官方意识形态。与其说这是一套精密的哲学体系，不如说它是一个为了团结一切可以团结的力量、对抗共同敌人而构建的政治大帐篷。\n\n§4意识形态内涵：§!其核心理念被概括为“民主共和、民生福祉、民权保障”，但这三大支柱的具体内涵被刻意保持在一个高度笼统和模糊的状态，以确保其能够被共和国境内各种迥异的政治派别所接受。\n\n§4影响力：§!“三民主义”本质上不是一个指导性的思想纲领，而是一个策略性的政治容器。它的力量不在于其理论的深度与纯粹，而在于其外延的广度与包容。通过保持核心概念的笼统与惜蜘它成功地吸纳了从右翼民族主义者、资产阶级到左翼社会改良主义者在内的广泛同盟。§!\n" 
 FAT_communism_party:0 "社会改造大同盟"
 FAT_communism_party_long:0 "国民共和党社会改造大同盟"
 FAT_democratic_socialism_desc: "在社会主义者纷纷加入国民共和党后，除镰爪巴枯宁等少数领袖外，大部分社会主义者均处于共和党中下层，他们以最大热情投入革命工作，发动群众对落后的漫云社会发起进攻。新入党的青年狮鹫大部分受此影响，立场更为左倾，他们形成了诸多社会服务团体，积极开展社会运动。艾勒斯特当选为漫云新市长后，他以漫云市团体为核心整合了这些松散的青年组织成立了社会改造大同盟。其成员多半认为社会主义与三民主义是同一回事，强调三民主义的左翼色彩，很少关心社会主义与三民主义的差异。\n§W--------------§!\n§Y§4理论谱系：§!亚历山大·克梅斯凯所倡导的“三民主义”，是狮鹫共和国在其建国与戡乱时期的官方意识形态。与其说这是一套精密的哲学体系，不如说它是一个为了团结一切可以团结的力量、对抗共同敌人而构建的政治大帐篷。\n\n§4意识形态内涵：§!其核心理念被概括为“民主共和、民生福祉、民权保障”，但这三大支柱的具体内涵被刻意保持在一个高度笼统和模糊的状态，以确保其能够被共和国境内各种迥异的政治派别所接受。\n\n§4影响力：§!“三民主义”本质上不是一个指导性的思想纲领，而是一个策略性的政治容器。它的力量不在于其理论的深度与纯粹，而在于其外延的广度与包容。通过保持核心概念的笼统与惜蜘它成功地吸纳了从右翼民族主义者、资产阶级到左翼社会改良主义者在内的广泛同盟。§!\n"
 FAT_democratic_party:0 "橙红三色旗团"
 FAT_democratic_party_long:0 "橙红三色旗团"
 FAT_liberalism_desc: "瑰翼叛乱极大触动了翔日，他没有想过曾经与自己生死与共的革命同志居然会公开背叛革命，共和党颓丧的现状也让他无比担忧，在一些流亡者俱乐部的基础上，翔日成立了橙红三色旗团，通过组织理论学习，讨论会等方式提高党员塑造，强化革命信念。在共和党改组后，三色旗团依然以俱乐部组织的方式留存下来，其成员大多为共和党老党员与不同时期北上漫云的流亡者。三色旗团秉持正统的共和主义观点，强调对三民主义的信仰，赞扬谐律主义，并宣誓忠于革命与共和国。对翔日来说，三色旗团是日益纷杂的共和党最后的底线，当类似瑰翼叛乱的危机再一次出现时，三色旗团能够发挥作用，联络共和党最忠实的成员保卫克梅斯凯与共和国。\n§W--------------§!\n§Y§4理论谱系：§!亚历山大·克梅斯凯所倡导的“三民主义”，是狮鹫共和国在其建国与戡乱时期的官方意识形态。与其说这是一套精密的哲学体系，不如说它是一个为了团结一切可以团结的力量、对抗共同敌人而构建的政治大帐篷。\n\n§4意识形态内涵：§!其核心理念被概括为“民主共和、民生福祉、民权保障”，但这三大支柱的具体内涵被刻意保持在一个高度笼统和模糊的状态，以确保其能够被共和国境内各种迥异的政治派别所接受。\n\n§4影响力：§!“三民主义”本质上不是一个指导性的思想纲领，而是一个策略性的政治容器。它的力量不在于其理论的深度与纯粹，而在于其外延的广度与包容。通过保持核心概念的笼统与惜蜘它成功地吸纳了从右翼民族主义者、资产阶级到左翼社会改良主义者在内的广泛同盟。§!\n"
